<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>self-hosted download</title>
    <!-- md-pages-viewer.js put on the site's own server (spec 8, download).
         The test serves dist/md-pages-viewer.js at this path and blocks every
         other request, so nothing else (CDN, CSS file) can be loaded. -->
    <script src="vendor/md-pages-viewer.js"></script>
  </head>
  <body>
    <md-pages-viewer id="by-tag" url-param="false"></md-pages-viewer>
    <div id="by-new"></div>
    <script>
      const pages = [
        { id: 'a', parentId: null, title: 'ページA', order: 1, md: '# ページA\n\n## 見出しA\n\n本文' },
        { id: 'b', parentId: 'a', title: 'ページB', order: 1, md: '# ページB\n\n## 見出しB\n\n本文' },
      ];
      document.getElementById('by-tag').pages = pages;
      new MdPagesViewer('#by-new', { pages, currentId: 'b', urlParam: false });
    </script>
  </body>
</html>
