# demo/ を GitHub Pages に公開する。
# demo/index.html と demo/new.html は ../dist を読むので、ビルドした dist/ も一緒に置く。
# サイトの入口（/）は、埋め込みのデモ（demo/embed.html）に移る。
name: デモを GitHub Pages に公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: 公開するファイルをまとめる
        run: |
          mkdir _site
          cp -r demo dist _site/
          printf '%s\n' '<!doctype html><html lang="ja"><meta charset="utf-8"><title>md-pages-viewer</title><meta http-equiv="refresh" content="0; url=demo/embed.html"><a href="demo/embed.html">md-pages-viewer のデモ</a></html>' > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
