成的。\n\n## 功能\n\n- 根据页面数据自动生成顶部工具栏（当前位置和搜索框）、侧边栏、页内目录以及指向上一页和下一页的链接\n- 正文既可以传入 Markdown 字符串，也可以传入 md 文件的 URL（S3、服务器存储）\n- 在 Shadow DOM 中渲染，因此与宿主页面的 CSS 互不影响\n- 显示的所有 HTML 都经过 DOMPurify 净化\n\n数据的存储和返回页面列表的 API 由使用方自行准备。只要按[页面数据](?page=doc-data)的格式返回，数据库的种类和表结构不限。\n\n## 适用场景\n\n- 想在业务系统或管理后台中内置操作手册或帮助时\n- 想把手册正文放在数据库或 S3 中，不重新部署应用就能修改时\n- 想在当前界面中直接打开该界面的说明时（用 `currentId` 指定要打开的页面）\n\nVitePress、Docusaurus 等静态网站生成器会从 Markdown 生成一个单独的手册网站。md-pages-viewer 则放在现有应用的界面中，在运行时接收页面数据并显示。\n\n## 本手册的结构\n\n| 页面 | 内容 |\n| --- | --- |\n| [使用方法](?page=doc-usage) | 从加载脚本到页面数据、选项、图片和链接 |\n| [更改外观](?page=doc-look) | CSS 变量、`::part()`、`styles` |\n| [功能](?page=doc-features) | 界面构成，以及缩略图、日语换行、注意与提示框、界面语言 |\n| [安全](?page=doc-security) | 净化与 CSP |\n| [使用示例：门店管理手册](?page=example) | 用于一款虚构的门店管理应用的手册示例 |\n\n## 许可证\n\nMIT License。Copyright (c) 2026 Kota Kagatsume。随附的 marked 和 DOMPurify 的许可证位于 `dist/THIRD_PARTY_LICENSES.txt`。"},{"id":"doc-usage","parentId":null,"order":2,"title":"使用方法","description":"从加载脚本到页面数据、选项、图片和链接"},{"id":"doc-load","parentId":"doc-usage","order":1,"title":"加载","description":"从 CDN 或 npm 加载","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(220%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(220%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2256%22%20width%3D%22240%22%20height%3D%22106%22%20rx%3D%226%22%20fill%3D%22%23f3f4f6%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2264%22%20width%3D%22120%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(220%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2280%22%20width%3D%22170%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2296%22%20width%3D%22140%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(220%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2280%22%20y%3D%22112%22%20width%3D%22110%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%22128%22%20width%3D%2290%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(220%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22144%22%20width%3D%2260%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3C%2Fsvg%3E","md":"# 加载\n\n## 从 CDN 加载\n\n~~~html\n\u003cscript src=\"https://cdn.jsdelivr.net/npm/md-pages-viewer@1/dist/md-pages-viewer.js\">\u003c/script>\n~~~\n\n> [!NOTE]\n> CSS 已包含在这个文件中，因此不需要 \u003ccode>&lt;link&gt;\u003c/code>。文件大小约 151KB（gzip 压缩后约 48KB），包含 Markdown 转换（marked）和净化（DOMPurify）。\n\n在无法连接外部 CDN 的环境中，请将 `md-pages-viewer.js` 放到自己的服务器上再加载。\n\n## 从 npm 安装\n\n在需要构建的项目中，从 npm 安装。\n\n~~~bash\nnpm install md-pages-viewer\n~~~\n\n~~~js\nimport { MdPagesViewer } from 'md-pages-viewer';\n~~~\n\n只要 `import`，就可以使用 `\u003cmd-pages-viewer>` 标签。"},{"id":"doc-place","parentId":"doc-usage","order":2,"title":"放置方式","description":"用标签放置，或用 new 创建","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(260%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(260%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2256%22%20width%3D%22240%22%20height%3D%22106%22%20rx%3D%226%22%20fill%3D%22%23f3f4f6%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2264%22%20width%3D%22120%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(260%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2280%22%20width%3D%22170%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2296%22%20width%3D%22140%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(260%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2280%22%20y%3D%22112%22%20width%3D%22110%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%22128%22%20width%3D%2290%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(260%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22144%22%20width%3D%2260%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3C%2Fsvg%3E","md":"# 放置方式\n\n## 用标签放置\n\n~~~html\n\u003cmd-pages-viewer pages=\"/api/manual/pages\" current-id=\"intro\">\u003c/md-pages-viewer>\n~~~\n\n数组、函数和对象（`texts`）需要在 JS 中设置为元素的属性。\n\n~~~js\nconst viewer = document.querySelector('md-pages-viewer');\nviewer.imageResolver = (path) => `/api/manual/image?path=${encodeURIComponent(path)}`;\n~~~\n\n## 用 new 创建\n\n也可以用 `new` 创建。指定元素中的内容会被替换。\n\n~~~js\nconst viewer = new MdPagesViewer('#manual', {\n  pages: '/api/manual/pages',\n  currentId: 'intro',\n});\n\n// 显示后要更改选项，请通过 element 的属性进行\nviewer.element.currentId = 'faq';\n~~~\n\n## 高度与宽度\n\n如果不指定元素的高度，元素会随正文伸展；滚动时，工具栏停留在窗口顶部，侧边栏和目录停留在工具栏下方。如果指定了高度，侧边栏、正文和目录会在工具栏下方各自滚动。\n\n元素宽度小于 768px 时，侧边栏改为通过工具栏中的按钮在正文上方打开，目录则折叠在正文上方。\n\n> [!TIP]\n> 打开左侧菜单中的“门店”等项目，点击页头中的“帮助”，屏幕右侧会打开一个宽 480px 的帮助面板。可以在那里查看宽度小于 768px 时的布局。"},{"id":"doc-data","parentId":"doc-usage","order":3,"title":"页面数据","description":"页面数组的字段与子页面列表","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(160%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(160%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2262%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2094%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2269%22%20width%3D%2240%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2269%22%20width%3D%2270%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2286%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2293%22%20width%3D%2259%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2293%22%20width%3D%2293%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%22110%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22117%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22117%22%20width%3D%2276%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%22134%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22141%22%20width%3D%2267%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22141%22%20width%3D%2299%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E","md":"# 页面数据\n\n页面以扁平数组传入，用 `parentId` 表示层级。如果向 `pages` 传入 URL，则该 URL 应以 JSON 返回这个数组本身。\n\n## 字段\n\n| 字段 | 类型 | 必需 | 内容 |\n| --- | --- | --- | --- |\n| `id` | string / number | 必需 | 页面的唯一 ID |\n| `parentId` | string / number / null | 必需 | 父页面的 ID。顶层页面为 null |\n| `title` | string | 必需 | 在面包屑导航和侧边栏中显示的名称 |\n| `description` | string | 可选 | 在子页面列表和搜索结果中显示的说明 |\n| `thumbnail` | string | 可选 | 子页面列表以卡片形式显示时，显示在卡片顶部的图片的路径或 URL |\n| `md` | string | 可选 | Markdown 格式的正文 |\n| `src` | string | 可选 | md 文件的 URL |\n| `order` | number | 可选 | 在同一层级中的排列顺序（从小到大）。未指定的页面排在已指定的页面之后，按数组中的顺序排列 |\n\n~~~json\n[\n  { \"id\": \"intro\", \"parentId\": null, \"title\": \"简介\", \"md\": \"# 简介\", \"order\": 1 },\n  { \"id\": \"login\", \"parentId\": \"intro\", \"title\": \"登录方法\", \"src\": \"/storage/manual/login.md\", \"order\": 1 },\n  { \"id\": \"faq\", \"parentId\": null, \"title\": \"FAQ\", \"src\": \"https://xxx.s3.amazonaws.com/manual/faq.md\", \"order\": 2 },\n  { \"id\": \"guide\", \"parentId\": null, \"title\": \"操作指南\", \"order\": 3 },\n  { \"id\": \"guide-start\", \"parentId\": \"guide\", \"title\": \"入门\", \"description\": \"首先要进行的设置流程\", \"md\": \"# 入门\", \"order\": 1 }\n]\n~~~\n\n带 `src` 的页面在首次打开时才获取，并保留到重新加载界面为止。\n\n## 子页面列表\n\n既没有 `md` 也没有 `src` 的页面，会以表格形式列出其直接子页面，代替正文。适合用作像分类那样汇总子页面的父页面。每一行显示子页面的名称、`description`（最多 2 行），以及章数（`md` 中 h2 的数量）或子页面数。也可以通过工具栏中的按钮切换为卡片形式。带 `src` 的页面不会为了列表而获取正文。\n\n> [!TIP]\n> 本手册中的“使用方法”“更改外观”“功能”也是子页面列表页面。打开后点击右上角的“卡片视图”，就会显示带缩略图的卡片。详见\u003ca href=\"?page=doc-thumbnail\">子页面列表与缩略图\u003c/a>。"},{"id":"doc-options","parentId":"doc-usage","order":4,"title":"选项","description":"pages、currentId、baseUrl 等 9 项","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(30%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(30%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2262%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22hsl(30%2070%25%2094%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2269%22%20width%3D%2240%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22hsl(30%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2269%22%20width%3D%2270%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2286%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2293%22%20width%3D%2259%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2293%22%20width%3D%2293%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%22110%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22117%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22117%22%20width%3D%2276%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%22134%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22141%22%20width%3D%2267%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22141%22%20width%3D%2299%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E","md":"# 选项\n\n| 选项 | 标签属性 | 类型 | 内容 |\n| --- | --- | --- | --- |\n| `pages` | `pages`（仅限 URL） | 数组 / URL | 页面数据，或返回页面数据的 URL |\n| `currentId` | `current-id` | string / number | 要显示的页面的 ID。首次显示时优先使用 URL 中的 `?page=`。显示后设置会切换到该页面 |\n| `baseUrl` | `base-url` | string | `md` 页面中相对路径的基准。未指定时为宿主页面的 URL |\n| `imageResolver` | 无 | 函数 | 接收图片路径和页面数据，返回用于显示的 URL 的函数 |\n| `fetch` | 无 | 函数 | 获取页面列表和正文时使用的函数（参数和返回值与浏览器的 `fetch` 相同）。用于向其他源的 API 发送 Cookie 或认证头 |\n| `urlParam` | `url-param` | string / false | 同步到 URL 的查询参数名称（默认为 `page`）。设为 `false` 则不同步 |\n| `styles` | 无 | string | 添加到显示区域内的 CSS（参见[正文的外观](?page=doc-styles)） |\n| `locale` | `locale` | string | 界面文本的语言（默认为 `ja`。参见[界面语言与文本](?page=doc-locale)） |\n| `texts` | 无 | 对象 | 逐条替换界面文本（参见[界面语言与文本](?page=doc-locale)） |\n\n> [!IMPORTANT]\n> 使用 \u003ccode>fetch\u003c/code> 或 \u003ccode>imageResolver\u003c/code> 时，请通过属性（property）而不是标签属性（attribute）设置 \u003ccode>pages\u003c/code>，并且在设置它们之后再设置。"},{"id":"doc-storage","parentId":"doc-usage","order":5,"title":"md 文件的存放位置","description":"存放在 S3 或服务器存储中时需要的设置","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(190%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(190%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2262%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22hsl(190%2070%25%2094%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2269%22%20width%3D%2240%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22hsl(190%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2269%22%20width%3D%2270%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2286%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2293%22%20width%3D%2259%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2293%22%20width%3D%2293%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%22110%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22117%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22117%22%20width%3D%2276%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%22134%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22141%22%20width%3D%2267%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22141%22%20width%3D%2299%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E","md":"# md 文件的存放位置\n\n| 存放位置 | 使用方需要的设置 |\n| --- | --- |\n| S3（公开存储桶） | CORS 设置（允许来自宿主页面源的 GET 请求） |\n| S3（私有存储桶） | 除 CORS 设置外，还需在服务器端签发预签名 URL 并传给 `src`。由于 URL 有有效期，每次返回页面列表时都要重新签发 |\n| 服务器存储 | 提供浏览器可以访问的 URL（如果是 Laravel，可使用 `storage:link` 或带认证的路由） |\n\n> [!NOTE]\n> 以 URL 传入 \u003ccode>pages\u003c/code> 时，如果正文获取失败，会重新获取页面列表，然后再重试获取正文一次。因此即使预签名 URL 已过期，也能继续显示。"},{"id":"doc-links","parentId":"doc-usage","order":6,"title":"图片与链接","description":"相对路径的基准，以及正文中链接的行为","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(300%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(300%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2262%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22hsl(300%2070%25%2094%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2269%22%20width%3D%2240%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22hsl(300%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2269%22%20width%3D%2270%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2286%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2293%22%20width%3D%2259%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2293%22%20width%3D%2293%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%22110%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22117%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22117%22%20width%3D%2276%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%22134%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22141%22%20width%3D%2267%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22141%22%20width%3D%2299%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E","md":"# 图片与链接\n\n## 图片\n\n相对路径的图片，在 `src` 页面中以 md 文件的位置为基准，在 `md` 页面中以 `baseUrl` 为基准。\n\n> [!WARNING]\n> 对于私有 S3，如果以预签名 URL 为基准，签名部分会丢失，图片将无法显示。请通过 \u003ccode>imageResolver\u003c/code> 让图片经由使用方的 API 获取。也可以返回 \u003ccode>blob:\u003c/code> URL。\n\n## 链接\n\n正文中的链接行为如下。\n\n| 写法 | 行为 |\n| --- | --- |\n| `?page=ID`、`?page=ID#标题ID` | 在本库中切换页面 |\n| `#标题ID` | 滚动到本页面中的该标题 |\n| md 文件的相对路径（如 `login.md`） | 如果与某个页面的 `src` 一致，则切换到该页面 |\n| 其他相对路径 | 跳转到以 `src` 或 `baseUrl` 为基准解析出的 URL |\n| 与宿主页面不同源的 URL | 在新标签页中打开 |"},{"id":"doc-url","parentId":"doc-usage","order":7,"title":"同步到 URL","description":"切换页面时的 URL 与历史记录","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(120%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(120%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2264%22%20width%3D%22200%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(120%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2280%22%20width%3D%22230%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2296%22%20width%3D%22180%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(120%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22112%22%20width%3D%22220%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22128%22%20width%3D%22150%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(120%2070%25%2094%25)%22%2F%3E%3C%2Fsvg%3E","md":"# 同步到 URL\n\n切换页面时，宿主页面 URL 中的查询参数 `page` 会变为目标页面的 ID，并添加到历史记录中。浏览器的后退、前进以及链接分享都可以直接使用。其他查询参数保持原样。\n\n如果宿主页面已经在使用 `page`，请用 `urlParam` 更改名称。\n\n> [!TIP]\n> 在同一界面中放置两个查看器，或宿主页面用 URL 的 \u003ccode>#\u003c/code> 切换界面时，请将 \u003ccode>urlParam\u003c/code> 设为 \u003ccode>false\u003c/code>。在本演示中，左侧菜单的“帮助”界面会同步到 URL（地址栏中的 \u003ccode>page=\u003c/code> 会变化），而在其他界面右侧打开的帮助则以 \u003ccode>url-param=\"false\"\u003c/code> 放置。"},{"id":"doc-look","parentId":null,"order":3,"title":"更改外观","description":"用 CSS 变量、::part() 和 styles 更改外观"},{"id":"doc-vars","parentId":"doc-look","order":1,"title":"CSS 变量","description":"更改颜色、字体、宽度等","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(250%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(250%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2256%22%20width%3D%22240%22%20height%3D%22106%22%20rx%3D%226%22%20fill%3D%22%23f3f4f6%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2264%22%20width%3D%22120%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(250%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2280%22%20width%3D%22170%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2296%22%20width%3D%22140%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(250%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2280%22%20y%3D%22112%22%20width%3D%22110%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%22128%22%20width%3D%2290%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(250%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22144%22%20width%3D%2260%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3C%2Fsvg%3E","md":"# CSS 变量\n\n可以用以下 CSS 变量覆盖样式。文字颜色和字体如果不指定，会沿用宿主页面的设置。\n\n| CSS 变量 | 内容 |\n| --- | --- |\n| `--mpv-font-family` | 字体 |\n| `--mpv-font-size` | 正文的字号（默认为 16px） |\n| `--mpv-color-text` | 文字颜色 |\n| `--mpv-color-bg` | 背景色 |\n| `--mpv-color-accent` | 链接和当前页面的强调色 |\n| `--mpv-color-border` | 分隔线的颜色 |\n| `--mpv-sidebar-width` | 侧边栏的宽度 |\n| `--mpv-spacing` | 间距的基准大小 |\n| `--mpv-color-note` 及另外 4 个 | 注意与提示框的颜色（参见[注意与提示框](?page=doc-callout)） |\n\n> [!IMPORTANT]\n> 如果不指定 \u003ccode>--mpv-color-bg\u003c/code>，显示区域是透明的，停留在顶部的工具栏和叠加显示的部件会使用浏览器的默认背景色（如白色）。如果宿主页面的背景不是白色，请指定该变量。\n\n~~~css\nmd-pages-viewer {\n  --mpv-color-accent: #8250df;\n  --mpv-sidebar-width: 300px;\n}\n~~~"},{"id":"doc-parts","parentId":"doc-look","order":2,"title":"各部件的外观（::part()）","description":"在宿主页面的 CSS 中选择部件并更改样式","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(340%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(340%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2262%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22hsl(340%2070%25%2094%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2269%22%20width%3D%2240%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22hsl(340%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2269%22%20width%3D%2270%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2286%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2293%22%20width%3D%2259%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2293%22%20width%3D%2293%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%22110%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22117%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22117%22%20width%3D%2276%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%22134%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22141%22%20width%3D%2267%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22141%22%20width%3D%2299%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E","md":"# 各部件的外观（::part()）\n\n各部件带有以下 part 名称，可以在宿主页面的 CSS 中用 `::part()` 更改其外观。这些样式优先于本库的 CSS。\n\n| part 名称 | 部件 |\n| --- | --- |\n| `toolbar` | 顶部的工具栏 |\n| `sidebar-toggle` | 工具栏左端用于显示或隐藏侧边栏的按钮 |\n| `breadcrumb` | 面包屑导航（当前位置） |\n| `breadcrumb-item` | 面包屑导航中的各个页面。当前页面还带有 `current` |\n| `search` | 包含搜索框和搜索结果的区域 |\n| `search-input` | 搜索框 |\n| `search-results` | 搜索结果的区域 |\n| `search-result` | 每条搜索结果的链接 |\n| `search-mark` | 搜索结果中匹配部分的标记 |\n| `search-empty` | 没有匹配结果或正在搜索（“正在搜索…”）时的提示 |\n| `toc-toggle` | 工具栏右端用于显示或隐藏页内目录的按钮 |\n| `view-toggle` | 工具栏右端用于在表格和卡片之间切换子页面列表的按钮 |\n| `sidebar` | 侧边栏 |\n| `page-link` | 侧边栏中各页面的链接。当前页面还带有 `current` |\n| `toggle` | 侧边栏中展开或折叠子页面的按钮 |\n| `main` | 中间一栏（正文、上一页和下一页） |\n| `content` | 正文区域 |\n| `callout` | 正文中的各个注意与提示框。还带有 `note`、`tip`、`important`、`warning` 或 `caution` |\n| `callout-title` | 注意与提示框的标题 |\n| `target-heading` | 在目录中选择后跳转到的正文标题。仅在其文字和下划线显示为强调色期间带有此名称 |\n| `toc` | 页内目录 |\n| `toc-mobile` | 在窄屏上显示在正文上方的页内目录 |\n| `toc-link` | 页内目录中各标题的链接。还带有 `toc-h2` 或 `toc-h3`，正在阅读的标题还带有 `current` |\n| `child-list-head` | 子页面列表表格的标题行 |\n| `child-list` | 子页面列表 |\n| `child-link` | 子页面列表中的各个页面（表格行或卡片） |\n| `child-thumbnail` | 卡片顶部的子页面图片（`thumbnail`） |\n| `child-title` | 子页面的名称 |\n| `child-description` | 子页面的说明 |\n| `child-meta` | 子页面的章数或子页面数 |\n| `pager` | 正文末尾的上一页和下一页 |\n| `pager-link` | 上一页和下一页的各个链接。上一页还带有 `previous`，下一页还带有 `next` |\n| `status` | 加载中或出错时的提示 |\n| `retry-button` | “重新加载”按钮 |\n\n~~~css\nmd-pages-viewer::part(sidebar) {\n  background: #f6f8fa;\n}\n\nmd-pages-viewer::part(page-link current) {\n  font-weight: 700;\n}\n~~~"},{"id":"doc-styles","parentId":"doc-look","order":3,"title":"正文的外观（styles）","description":"更改正文中标题和表格等的外观","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(10%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(10%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2256%22%20width%3D%22240%22%20height%3D%22106%22%20rx%3D%226%22%20fill%3D%22%23f3f4f6%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2264%22%20width%3D%22120%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(10%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2280%22%20width%3D%22170%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2296%22%20width%3D%22140%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(10%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2280%22%20y%3D%22112%22%20width%3D%22110%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%22128%22%20width%3D%2290%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(10%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22144%22%20width%3D%2260%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3C%2Fsvg%3E","md":"# 正文的外观（styles）\n\n`::part()` 只对部件本身生效，无法选中正文中的标题、表格等。要更改正文的外观，请将 CSS 以字符串形式传给 `styles`。传入的 CSS 只在显示区域内生效，并且无论优先级（specificity）如何，都优先于本库的 CSS。\n\n> [!NOTE]\n> 请通过 part 名称指定元素（类名可能会变化）。\n\n~~~js\nconst viewer = document.querySelector('md-pages-viewer');\nviewer.styles = `\n  [part~=\"content\"] h1 { font-size: 2.2em; }\n  [part~=\"content\"] th { background: #eef2ff; }\n`;\n~~~\n\n也可以像 `new MdPagesViewer('#manual', { pages, styles })` 这样，作为 `new` 的选项传入。即使页面的 CSP 中 style-src 没有 `'unsafe-inline'`，也同样有效。\n\n> [!CAUTION]\n> \u003ccode>styles\u003c/code> 中的 CSS 不经净化直接使用。请不要传入不是自己编写的 CSS，例如用户输入的字符串或数据库中的值（因为这些 CSS 可以隐藏部件、把一个部件伪装成另一个部件，或者用 \u003ccode>url()\u003c/code> 加载外部图片）。"},{"id":"doc-features","parentId":null,"order":4,"title":"功能","description":"界面构成与新增的功能"},{"id":"doc-screen","parentId":"doc-features","order":1,"title":"界面构成","description":"工具栏、搜索、目录、上一页和下一页、展开与收起的动画","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(210%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(210%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2264%22%20width%3D%22200%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(210%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2280%22%20width%3D%22230%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2296%22%20width%3D%22180%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(210%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22112%22%20width%3D%22220%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22128%22%20width%3D%22150%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(210%2070%25%2094%25)%22%2F%3E%3C%2Fsvg%3E","md":"# 界面构成\n\n## 工具栏\n\n顶部的工具栏中依次排列着显示或隐藏侧边栏的按钮（左端）、当前位置（上级页面和当前页面的名称）、搜索框，以及显示或隐藏页内目录的按钮（右端）。在子页面列表页面中，右端的按钮变为在表格和卡片之间切换的按钮。\n\n## 搜索\n\n在搜索框中可以搜索页面名称、`description`、标题和正文。不区分全角与半角、大写与小写；用空格分隔的多个词，会找出同时包含所有词的页面。结果显示在搜索框下方，点击后会跳转到该页面中对应标题的位置。\n\n> [!TIP]\n> 按 \u003ccode>/\u003c/code> 键可以移到搜索框，用 ↑↓ 和 Enter 选择结果。\n\n正文从进入搜索框时开始逐步读取，因此即使页面很多，界面也不会卡住。在全部读取完之前，会根据已读取的页面显示结果，并显示“正在搜索…”。带 `src` 的页面不会为了搜索而获取正文，只搜索页面名称和 `description`。\n\n## 页内目录\n\n页内目录会随着滚动高亮当前正在阅读的标题，h3 只列出正在阅读的那一章中的标题。在目录中选择标题后，会平滑滚动到该标题；滚动过程中，所选标题保持高亮。到达后，该标题的文字和下划线会变为强调色，约 1.5 秒后恢复原样（如果中途自己滚动了页面，则不会出现）。即使正文较短、标题无法滚动到顶端，在目录中选择的标题也会高亮显示。\n\n## 上一页和下一页\n\n正文末尾（在子页面列表页面中为列表下方）会按侧边栏中的顺序显示指向上一页和下一页的链接。\n\n## 展开与收起的动画\n\n显示或隐藏侧边栏和目录、展开或折叠侧边栏中的子页面时，会有简短的动画（在宽屏上，各栏的宽度会变化；在窄屏上，侧边栏会从元素的左边缘滑出。子页面列表的高度会伸缩。点击页面名称展开子页面时也一样）。\n\n> [!NOTE]\n> 对于在操作系统或浏览器中设置了减少动态效果的用户，不显示动画。在目录中选择标题时也会直接跳转，并且不显示标示到达标题的动画。"},{"id":"doc-thumbnail","parentId":"doc-features","order":2,"title":"子页面列表与缩略图","description":"以卡片形式为每个页面显示图片","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(160%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(160%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2264%22%20width%3D%22200%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2280%22%20width%3D%22230%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2296%22%20width%3D%22180%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22112%22%20width%3D%22220%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22128%22%20width%3D%22150%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2094%25)%22%2F%3E%3C%2Fsvg%3E","md":"# 子页面列表与缩略图\n\n在页面数据中写上 `thumbnail` 后，子页面列表以卡片形式显示时，该页面的卡片顶部就会显示图片。\n\n~~~json\n{ \"id\": \"guide-login\", \"parentId\": \"guide\", \"title\": \"登录\", \"md\": \"# 登录\", \"thumbnail\": \"images/login.png\" }\n~~~\n\n## 显示效果\n\n- 图片以横向（16:9）铺满卡片顶部。比例不同的图片会裁去超出的部分，使卡片排列整齐\n- 以表格形式显示时，不显示图片，也不加载图片\n- 没有 `thumbnail` 的页面，以及图片加载失败的页面，显示为不带图片的卡片\n\n> [!TIP]\n> 打开“\u003ca href=\"?page=example\">使用示例：门店管理手册\u003c/a>”中的“操作指南”，点击右上角的“卡片视图”，即可看到带缩略图的卡片。\n\n## 图片的位置\n\n`thumbnail` 按与正文图片相同的规则解析。如果指定了 `imageResolver`，则会经过它处理。相对路径的基准：`src` 页面为 md 文件的位置，其他页面为 `baseUrl`。\n\n> [!NOTE]\n> 图片在卡片接近屏幕可视范围时才加载。像 \u003ccode>javascript:\u003c/code> 这样在正文中也不能使用的 URL，不会被使用。"},{"id":"doc-wrap","parentId":"doc-features","order":3,"title":"日语换行","description":"在文节处为标题和表格换行，以及较宽的表格","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(280%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(280%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2262%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22hsl(280%2070%25%2094%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2269%22%20width%3D%2240%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22hsl(280%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2269%22%20width%3D%2270%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2286%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2293%22%20width%3D%2259%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2293%22%20width%3D%2293%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%22110%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22117%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22117%22%20width%3D%2276%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%22134%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22141%22%20width%3D%2267%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22141%22%20width%3D%2299%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E","md":"# 日语换行\n\n如果宿主页面是日语页面（如 `\u003chtml lang=\"ja\">`），标题、表格单元格、页面列表中的项目等会在文节（日语的词组单位）之间换行，因此像「必須」（必填）、「店舗コード」（门店代码）这样的短词不会从中间断开。正文中的段落仍按通常方式换行。\n\n下面的表格标记为日语（`lang=\"ja\"`），因此在这个中文页面上也会在文节之间换行。\n\n\u003ctable lang=\"ja\">\n\u003cthead>\u003ctr>\u003cth>項目\u003c/th>\u003cth>必須\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>店舗名\u003c/td>\u003ctd>必須\u003c/td>\u003ctd>画面や帳票に出る名前（40文字まで）\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>店舗コード\u003c/td>\u003ctd>必須\u003c/td>\u003ctd>書き出しや連携で店舗を見分ける番号（半角英数字8文字まで）\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>メールアドレス\u003c/td>\u003ctd>任意\u003c/td>\u003ctd>予約の控えを送るときの送り主になります\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\n> [!TIP]\n> 缩小窗口宽度，可以看到此表格中的「必須」和「店舗コード」不会从中间断开。若要在整本手册中查看效果，请从屏幕右上角的语言菜单中选择“日本語”，打开左侧菜单中的“店舗”（门店），然后点击页头中的“ヘルプ”（帮助）。\n\n> [!NOTE]\n> 只有 Chrome 和 Edge 支持在文节之间换行。在 Safari 和 Firefox 中按通常方式换行。\n\n## 较宽的表格\n\n超出宽度的表格，只在表格内部横向滚动，而不是整个正文横向滚动。\n\n| long_identifier_without_spaces_1 | long_identifier_without_spaces_2 | long_identifier_without_spaces_3 | long_identifier_without_spaces_4 |\n| --- | --- | --- | --- |\n| a | b | c | d |"},{"id":"doc-callout","parentId":"doc-features","order":4,"title":"注意与提示框","description":"在引用的第一行写上类型，使其显示为带颜色的框","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(40%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(40%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2264%22%20width%3D%22200%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(40%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2280%22%20width%3D%22230%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2296%22%20width%3D%22180%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(40%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22112%22%20width%3D%22220%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22128%22%20width%3D%22150%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(40%2070%25%2094%25)%22%2F%3E%3C%2Fsvg%3E","md":"# 注意与提示框\n\n在 Markdown 引用（`>`）的第一行写上类型，该引用就会显示为带颜色的框。写法与 GitHub 的 Markdown 相同。\n\n~~~markdown\n> [!WARNING]\n> 即使更改时段长度，已有的预约也会保持不变。\n~~~\n\n> [!WARNING]\n> 即使更改时段长度，已有的预约也会保持不变。\n\n## 类型\n\n| 写法 | 标题 | 适用场合 |\n| --- | --- | --- |\n| `[!NOTE]` | 备注 | 了解后会有帮助的信息 |\n| `[!TIP]` | 提示 | 更轻松的做法 |\n| `[!IMPORTANT]` | 重要 | 必须了解的信息 |\n| `[!WARNING]` | 注意 | 不加注意就会造成麻烦的事项 |\n| `[!CAUTION]` | 警告 | 无法挽回的操作 |\n\n> [!NOTE]\n> 时间以 15 分钟为单位输入。\n\n> [!TIP]\n> 暂时不用的门店可以设为“隐藏”，这样既能保留数据，又能将其从列表中移除。\n\n> [!IMPORTANT]\n> 门店代码在添加后无法更改。\n\n> [!WARNING]\n> 以下情况无法接受预约。\n>\n> \u003cul>\u003cli>当天是临时停业日\u003c/li>\u003cli>已过预约受理的截止时间\u003c/li>\u003c/ul>\n\n> [!CAUTION]\n> 删除的门店无法恢复。该门店的预约和目标也会全部删除。\n\n## 不显示为框的情况\n\n写了未知的类型（如 `[!FOO]`），或者 `[!NOTE]` 不是写在第一行时，按普通引用显示。类型用大写或小写书写均可。\n\n> 普通引用会像这样显示。\n\n## 更改颜色\n\n| CSS 变量 | 类型 | 默认值 |\n| --- | --- | --- |\n| `--mpv-color-note` | 备注 | `#2563eb`（蓝色） |\n| `--mpv-color-tip` | 提示 | `#16a34a`（绿色） |\n| `--mpv-color-important` | 重要 | `#7c3aed`（紫色） |\n| `--mpv-color-warning` | 注意 | `#b45309`（土黄色） |\n| `--mpv-color-caution` | 警告 | `#dc2626`（红色） |\n\n默认颜色在白色背景上易于阅读。如果宿主页面是深色界面，请指定较亮的颜色。\n\n~~~css\n[data-theme='dark'] md-pages-viewer {\n  --mpv-color-note: #60a5fa;\n  --mpv-color-tip: #4ade80;\n  --mpv-color-important: #a78bfa;\n  --mpv-color-warning: #fbbf24;\n  --mpv-color-caution: #f87171;\n}\n~~~\n\n> [!NOTE]\n> 本手册的“深色”主题也是用这些设置切换的。"},{"id":"doc-locale","parentId":"doc-features","order":5,"title":"界面语言与文本","description":"选择按钮、搜索框等文本的语言，并逐条修改","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(100%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(100%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2256%22%20width%3D%22240%22%20height%3D%22106%22%20rx%3D%226%22%20fill%3D%22%23f3f4f6%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2264%22%20width%3D%22120%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(100%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2280%22%20width%3D%22170%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2296%22%20width%3D%22140%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(100%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2280%22%20y%3D%22112%22%20width%3D%22110%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%22128%22%20width%3D%2290%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(100%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22144%22%20width%3D%2260%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3C%2Fsvg%3E","md":"# 界面语言与文本\n\n按钮、搜索框等界面文本的语言可以用 `locale` 选择。内置了日语（`ja`，默认）、英语（`en`）、简体中文（`zh-CN`）、繁体中文（`zh-TW`）和韩语（`ko`）。只需指定 `locale`，按钮等界面文本就会全部切换为该语言。只有在需要修改某些文本时才使用 `texts`。\n\n~~~html\n\u003cmd-pages-viewer pages=\"/api/manual/pages\" locale=\"en\">\u003c/md-pages-viewer>\n~~~\n\n也可以使用 `en-US`、`zh-Hant` 这样的写法。如果指定了未内置的语言，将以日语显示，并在控制台中输出警告。\n\n> [!TIP]\n> 在屏幕右上角的语言菜单（地球图标）中选择语言后，本演示的界面和手册都会切换为该语言。按钮、目录等界面文本通过 \u003ccode>locale\u003c/code> 切换，页面名称和正文则通过换成该语言的页面数据来切换。\n\n## 修改文本\n\n可以用 `texts` 逐条修改文本。只有写出的条目会改变，其他条目保持 `locale` 所选语言的文本。显示数量等内容的文本，需要写成接收该值的函数。\n\n~~~js\nviewer.texts = {\n  search: '搜一搜！',\n  chapters: (n) => `共 ${n} 章`,\n};\n~~~\n\n| 键 | 使用位置 | 简体中文 |\n| --- | --- | --- |\n| `loading`、`failed`、`retry` | 加载中、无法加载时的提示，以及重新加载的按钮 | 加载中… / 无法加载 / 重新加载 |\n| `notFound`、`noPages` | 页面不存在、一个页面都没有时的提示 | 找不到页面 / 没有页面 |\n| `pageList` | 侧边栏供屏幕阅读器朗读的名称 | 页面列表 |\n| `columnPages`、`columnContent` | 侧边栏的标题，以及子页面列表表格的标题行 | 页面 / 内容 |\n| `toc` | 页内目录的标题 | 目录 |\n| `breadcrumb` | 面包屑导航供屏幕阅读器朗读的名称 | 面包屑导航 |\n| `toggle` | 侧边栏中展开或折叠按钮供屏幕阅读器朗读的名称（函数，接收页面名称） | 展开或折叠（页面名称） |\n| `chapters`、`childPages` | 子页面列表中的章数和子页面数（函数，接收数量） | N 章 / N 个页面 |\n| `search`、`searchLabel` | 搜索框中的占位文字，以及供屏幕阅读器朗读的名称 | 搜索 / 搜索页面 |\n| `searching` | 全部读取完之前的搜索结果 | 正在搜索… |\n| `noResults` | 没有匹配时的搜索结果（函数，接收输入的搜索词） | 没有与“（搜索词）”匹配的页面 |\n| `sidebarClose`、`sidebarOpen` | 隐藏和显示侧边栏的按钮 | 隐藏页面列表 / 显示页面列表 |\n| `tocClose`、`tocOpen` | 隐藏和显示目录的按钮 | 隐藏目录 / 显示目录 |\n| `viewCard`、`viewList` | 切换子页面列表显示形式的按钮 | 卡片视图 / 列表视图 |\n| `pager`、`previous`、`next` | 上一页和下一页（供屏幕阅读器朗读的名称，以及按钮上的文字） | 上一页和下一页 / 上一页 / 下一页 |\n| `calloutNote`、`calloutTip`、`calloutImportant`、`calloutWarning`、`calloutCaution` | 注意与提示框的标题 | 备注 / 提示 / 重要 / 注意 / 警告 |\n\n> [!NOTE]\n> 表中没有的键，以及应为函数却写成字符串的文本，不会被使用，并会在控制台中输出警告。\n\n## 切换语言\n\n显示后更改 `locale` 或 `texts`，文本会立即改变，页面和滚动位置保持不变。更改 `texts` 时，请设置一个新的对象。\n\n> [!IMPORTANT]\n> 页面名称和正文不会被翻译。切换语言时，请在设置 \u003ccode>locale\u003c/code> 的同时，把该语言的页面数据传给 \u003ccode>pages\u003c/code>。切换语言的按钮请放在宿主页面的界面中。\n\n~~~js\nconst pages = { ja: pagesJa, en: pagesEn }; // 各语言的页面数据\n\nfunction setLanguage(lang) {\n  document.documentElement.lang = lang;\n  viewer.locale = lang;\n  viewer.pages = pages[lang];\n}\n~~~\n\n如果新数据中也有相同 ID 的页面，切换后会保持打开该页面。本演示也是用这种方法切换语言的。"},{"id":"doc-security","parentId":null,"order":5,"title":"安全","md":"# 安全\n\n## 净化\n\n由 Markdown 转换而来的 HTML，在放入界面之前会用 DOMPurify 进行净化。除了可能导致脚本执行的内容之外，还会移除以下内容。\n\n- `\u003cstyle>`、`\u003cform>`、`\u003cdialog>`、`\u003cslot>` 以及 `popover` 等属性（因为它们会影响宿主页面的界面）\n- 不经过 `imageResolver` 就加载图片的内容（`poster`、`background` 属性，包含 CSS `url()` 的 `style` 属性等）\n\n> [!CAUTION]\n> 通过 \u003ccode>styles\u003c/code> 传入的 CSS 不会被净化（参见\u003ca href=\"?page=doc-styles\">正文的外观\u003c/a>）。\n\n## Content Security Policy\n\n在使用 Content Security Policy 的页面中也能正常工作。\n\n- 即使 `style-src` 中没有 `'unsafe-inline'`，CSS 也能生效\n- 在强制使用 Trusted Types 的页面中，会使用一个名为 `md-pages-viewer` 的策略。如果用 `trusted-types` 指令限定了允许的名称，请添加这个名称\n\n~~~text\nContent-Security-Policy: require-trusted-types-for 'script'; trusted-types md-pages-viewer\n~~~"},{"id":"example","parentId":null,"order":6,"title":"使用示例：门店管理手册","description":"用于一款虚构的门店管理应用的手册示例"},{"id":"welcome","parentId":"example","title":"简介","order":1,"description":"示例门店管理的功能，以及首先要进行的设置","md":"# 简介\n\n示例门店管理是一项集中管理多家门店的信息、员工和预约的服务。本手册介绍各界面的使用方法，以及管理员需要进行的设置。\n\n## 功能\n\n- 管理每家门店的营业时间、地址和联系方式\n- 邀请员工，并分配其负责的门店\n- 接受顾客的预约，并管理更改和取消\n- 接收预约通知和月度报表\n- 将预约和门店信息导出为 CSV\n\n## 界面构成\n\n登录后，左侧显示菜单，右侧显示所选的界面。显示哪些菜单项因角色而异。\n\n| 菜单 | 可以做什么 | 说明页面 |\n| --- | --- | --- |\n| 仪表板 | 查看本月预约数和预约趋势 | [查看仪表板](?page=guide-dashboard) |\n| 门店 | 添加门店，设置营业时间等 | [添加门店](?page=guide-store) |\n| 员工 | 邀请员工，分配负责门店 | [添加员工](?page=guide-staff) |\n| 预约 | 查看预约列表，更改或取消预约 | [管理预约](?page=guide-booking) |\n| 报表 | 查看按月汇总的数据 | [查看报表](?page=guide-report) |\n| 帮助 | 本手册 | — |\n\n屏幕右上角有账户菜单（显示自己姓名首字的圆形图标）。通知设置、更改密码和退出登录都从这里进行。\n\n## 首先要进行的设置\n\n开始使用时，请按以下顺序进行设置。请由拥有所有者或管理员角色的人员操作。\n\n1. [添加门店](?page=guide-store)：添加门店，确定营业时间和预约受理方式\n2. [添加员工](?page=guide-staff)：邀请员工，分配其负责的门店\n3. [通知设置](?page=guide-notice)：选择要接收的通知。通知设置由每个人各自进行\n\n如果想提高安全性，请接着将[两步验证](?page=admin-2fa)设为必须启用。\n\n## 支持的环境\n\n| 类型 | 支持的环境 |\n| --- | --- |\n| 电脑浏览器 | 最新版 Chrome、Edge、Safari、Firefox |\n| 智能手机 | 最新版 iPhone 上的 Safari、Android 上的 Chrome |\n| 应用 | 适用于 iPhone 和 Android 的“示例门店管理”应用（用于接收通知和查看预约） |\n\n在旧版浏览器中，界面可能会显示错乱，或者按钮可能无法点击。\n\n## 遇到问题时\n\n请先查看[常见问题](?page=faq)。想确认设置的值时，[设置项一览](?page=reference)会很方便。\n\n如果问题仍未解决，可以从屏幕右上角账户菜单中的“联系我们”发送咨询。受理时间为工作日 10:00～18:00，我们会在 2 个工作日内回复。","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(232%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%2256%22%20r%3D%229%22%20fill%3D%22hsl(232%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2250%22%20width%3D%22110%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2261%22%20width%3D%2270%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%2284%22%20r%3D%229%22%20fill%3D%22hsl(232%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2278%22%20width%3D%22141%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2289%22%20width%3D%2287%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%22112%22%20r%3D%229%22%20fill%3D%22hsl(232%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22106%22%20width%3D%22122%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22117%22%20width%3D%22104%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%22140%22%20r%3D%229%22%20fill%3D%22hsl(232%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22134%22%20width%3D%22153%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22145%22%20width%3D%2281%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E"},{"id":"guide","parentId":"example","title":"操作指南","order":2,"description":"示例应用的基本用法","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(200%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2244%22%20width%3D%22150%22%20height%3D%2210%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2264%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2290%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22116%22%20width%3D%22120%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%22226%22%20y%3D%22140%22%20width%3D%2260%22%20height%3D%2218%22%20rx%3D%225%22%20fill%3D%22hsl(200%2070%25%2055%25)%22%2F%3E%3C%2Fsvg%3E"},{"id":"guide-login","parentId":"guide","title":"登录","order":1,"description":"如何用电子邮件地址和密码登录，以及无法登录时的处理方法","md":"# 登录\n\n要使用示例门店管理，需要用通过邀请邮件设置的电子邮件地址和密码登录。本页介绍登录步骤，以及无法登录时的处理方法。\n\n## 登录\n\n1. 打开登录界面\n2. 输入电子邮件地址和密码\n3. 点击“登录”\n\n如果组织要求必须使用两步验证，接下来会显示输入验证码的界面。\n\n### 输入验证码\n\n输入通过身份验证器应用或短信收到的 6 位数字。身份验证器应用中的验证码每 30 秒变化一次，请在显示期间输入。\n\n勾选“在此设备上 30 天内不再验证”后，在同一设备和浏览器上 30 天内可以省略验证码。设置方法请参见[两步验证](?page=admin-2fa)。\n\n## 保持登录状态\n\n> [!WARNING]\n> 勾选“保持登录状态”后，30 天内无需再次登录。在共用电脑上请取消勾选。\n\n登录状态按设备和浏览器分别记录。在其他电脑或智能手机上需要重新登录。退出登录后，该设备上的登录状态即被解除。\n\n## 退出登录\n\n在屏幕右上角的账户菜单中点击“退出登录”。\n\n如果电脑丢失等，需要同时解除其他设备上的登录时，请在账户菜单的“已登录的设备”中点击“从所有设备退出登录”。之后在任何设备上使用时，都需要重新登录。\n\n## 忘记密码时\n\n1. 在登录界面点击“忘记密码？”\n2. 输入注册的电子邮件地址，点击“发送”\n3. 打开收到的邮件中的链接（链接的有效期为 1 小时）\n4. 输入两次新密码，点击“保存”\n\n新密码需要符合组织规定的规则。字符数和可用字符请参见[密码规则](?page=admin-password)。\n\n## 无法登录时\n\n| 提示信息 | 处理方法 |\n| --- | --- |\n| 密码错误 | 检查大小写以及全角/半角 |\n| 账户已被锁定 | 等待 30 分钟，或请管理员解除锁定 |\n| 找不到该电子邮件地址 | 向管理员确认注册的电子邮件地址 |\n| 验证码错误 | 检查智能手机的时间是否正确 |\n| 无法从此位置登录 | 连接到公司网络后再登录 |\n| 邀请已过期 | 请管理员重新邀请 |\n\n### 账户被锁定时\n\n连续 5 次输错密码后，该账户将被锁定 30 分钟。30 分钟后会自动解除。如果情况紧急，管理员可以在员工详情界面中解除锁定。\n\n### 收不到邮件时\n\n如果收不到重置密码或邀请的邮件，请检查垃圾邮件文件夹。如果公司邮箱无法接收，请联系邮件管理员进行设置，以便接收来自发件人地址的邮件。","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(232%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2244%22%20width%3D%22150%22%20height%3D%2210%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2264%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2290%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22116%22%20width%3D%22120%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%22226%22%20y%3D%22140%22%20width%3D%2260%22%20height%3D%2218%22%20rx%3D%225%22%20fill%3D%22hsl(232%2070%25%2055%25)%22%2F%3E%3C%2Fsvg%3E"},{"id":"guide-dashboard","parentId":"guide","title":"查看仪表板","order":2,"description":"登录后首先显示的界面中各区域的含义","md":"# 查看仪表板\n\n登录后，首先显示的是仪表板。您负责的门店本月的情况一目了然。\n\n## 界面构成\n\n| 区域 | 位置 | 内容 |\n| --- | --- | --- |\n| 顶部数字 | 最上方 | 本月预约数、较上月、距目标还差 |\n| 图表 | 中间 | 近期预约数的变化趋势 |\n| 今日预约 | 右侧 | 今日预约的列表 |\n| 公告 | 下方 | 运营方发布的公告 |\n\n## 顶部数字\n\n显示本月预约数、较上月的差值和距目标还差的数量。点击数字会进入明细界面。\n\n| 数字 | 含义 |\n| --- | --- |\n| 本月预约数 | 从本月 1 日到今天的预约数。不计入已取消的预约 |\n| 较上月 | 与上月截至同一天的预约数之差。增加时显示为绿色，减少时显示为红色 |\n| 距目标还差 | 本月目标减去本月预约数后的数量。未设定目标时不显示 |\n\n### 设定目标\n\n目标按门店、按月份设定。请在“门店”界面中选择门店，然后在“目标”选项卡中输入每个月的预约数。只有拥有所有者或管理员角色的人员才能设定目标。\n\n## 图表\n\n显示最近 12 个月的变化趋势。将鼠标指针悬停在图表上，会显示该月的数值。\n\n### 更改时间范围\n\n可以在图表右上角的“时间范围”中选择 3 个月、6 个月或 12 个月。\n\n### 筛选门店\n\n如果负责多家门店，可以在图表左上角的“门店”中选择要显示的门店。如果不选择任何门店，则显示您负责的所有门店的合计。\n\n## 今日预约\n\n按时间从早到晚显示今天的预约。点击顾客姓名，会打开该预约的详情。\n\n- 顾客已到店的预约会带有“已到店”标记\n- 已取消的预约以灰色文字显示在列表下方\n- 只显示您负责的门店的预约\n\n## 公告\n\n按从新到旧的顺序显示 5 条运营方发布的公告。未读的公告会带有标记。\n\n维护等重要公告在登录后也会立即显示在屏幕上方。点击“关闭”后，在下一条公告发布之前不会再显示。\n\n## 调整区域的排列\n\n在各区域右上角的“…”中，可以调整区域的排列顺序或隐藏区域。调整后的排列只对您自己生效，不会改变其他人的仪表板。要恢复原样，请点击“…”中的“恢复默认显示”。","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(200%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2244%22%20width%3D%2258%22%20height%3D%2234%22%20rx%3D%225%22%20fill%3D%22hsl(200%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22162%22%20y%3D%2244%22%20width%3D%2258%22%20height%3D%2234%22%20rx%3D%225%22%20fill%3D%22hsl(200%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22228%22%20y%3D%2244%22%20width%3D%2258%22%20height%3D%2234%22%20rx%3D%225%22%20fill%3D%22hsl(200%2070%25%2094%25)%22%2F%3E%3Cpolyline%20points%3D%22100%2C150%20130%2C128%20160%2C136%20190%2C108%20220%2C116%20250%2C92%20282%2C98%22%20fill%3D%22none%22%20stroke%3D%22hsl(200%2070%25%2055%25)%22%20stroke-width%3D%224%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E"},{"id":"guide-store","parentId":"guide","title":"添加门店","order":3,"description":"添加门店，并设置营业时间和地址","md":"# 添加门店\n\n添加门店，并设置营业时间和预约受理方式。只有拥有所有者或管理员角色的人员才能添加门店。\n\n## 添加门店\n\n1. 打开菜单中的“门店”\n2. 点击右上角的“添加”\n3. 填写下列项目，然后点击“保存”\n\n| 项目 | 必填 | 内容 |\n| --- | --- | --- |\n| 门店名称 | 必填 | 在界面和单据中显示的名称（最多 40 个字符） |\n| 门店代码 | 必填 | 在导出和系统对接中用于识别门店的编号（最多 8 个半角字母或数字） |\n| 地址 | 必填 | 输入邮政编码后会自动填写 |\n| 电话号码 | 选填 | 带不带连字符均可 |\n| 电子邮件地址 | 选填 | 作为发送预约确认邮件时的发件人 |\n\n### 关于门店代码\n\n> [!IMPORTANT]\n> 门店代码在添加后无法更改。导出的 CSV 和报表通过门店代码而不是门店名称来识别门店。为了在更改门店名称后仍能与过去的数据对应，请为每家门店设定一个固定的编号。\n\n## 设置营业时间\n\n按星期输入开店和闭店的时间。固定休息日请勾选“休息”。\n\n> [!NOTE]\n> 时间以 15 分钟为单位输入。如果有午休，请点击“添加休息时间”，输入休息的开始和结束时间。休息期间不接受预约。\n\n### 节假日的营业时间\n\n如果只有节假日使用不同的营业时间，请在“节假日”一行中输入。留空则使用当天所在星期的营业时间。\n\n### 跨日营业\n\n对于营业到深夜的门店，请将闭店时间输入为“24:00”或更晚。例如，在次日凌晨 2 点闭店时，输入“26:00”。最晚为“29:00”。\n\n## 添加临时停业日\n\n对于新年假期、装修等原因停业的日子，请在“临时停业日”选项卡中指定日期进行添加。也可以按时间段添加。\n\n已添加的日期在预约页面中将无法选择。已有的预约会以“临时停业日的预约”显示在预约列表上方。系统不会自动联系顾客，请逐一联系。\n\n## 设置预约受理\n\n在“预约受理”选项卡中，设置提前多少天开始接受预约、截止到什么时间、时段长度等。可选值和默认值请参见[设置项一览](?page=reference)。\n\n更改时段长度后，已有的预约保持不变，新接受的预约将使用新的长度。\n\n## 隐藏门店\n\n暂时不用的门店可以设为“隐藏”。隐藏的门店不会再出现在预约页面和仪表板中，但数据会保留。要再次使用时，请在门店列表的“已隐藏的门店”中点击“显示”。\n\n隐藏的门店不计入套餐的门店数。\n\n## 删除门店\n\n> [!CAUTION]\n> 删除的门店无法恢复。如果只是暂时不用，请将其设为“隐藏”。\n\n删除门店后，该门店的预约和目标也会全部删除。如果需要保留，请先通过[导出数据](?page=guide-export)进行导出。\n\n> 添加门店后，接下来请进行[添加员工](?page=guide-staff)。","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2246%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2094%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%2251%22%20width%3D%2250%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2268%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%2273%22%20width%3D%2273%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2290%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%2295%22%20width%3D%2256%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22112%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%22117%22%20width%3D%2279%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22134%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%22139%22%20width%3D%2262%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3C%2Fsvg%3E"},{"id":"guide-staff","parentId":"guide","title":"添加员工","order":4,"description":"邀请员工，并为其分配负责的门店","md":"# 添加员工\n\n邀请员工，并确定其负责的门店和角色。只有拥有所有者或管理员角色的人员才能邀请员工。\n\n## 邀请\n\n在菜单的“员工”中点击“邀请”，然后输入电子邮件地址。员工本人通过邀请邮件中的链接设置密码。\n\n邀请邮件的有效期为 7 天。过期后，请重新邀请。\n\n### 批量邀请\n\n邀请 10 人以上时，请使用“邀请”旁边的“批量邀请”，每行粘贴一个电子邮件地址。所有人会被分配相同的角色和负责门店，之后可以逐一更改。\n\n## 邀请状态\n\n在员工列表中，邀请状态显示如下。\n\n| 状态 | 含义 | 可以进行的操作 |\n| --- | --- | --- |\n| 邀请中 | 已发送邮件，尚未加入 | 撤销邀请、重新发送邮件 |\n| 已过期 | 在 7 天内未加入 | 重新邀请 |\n| 已加入 | 已设置密码，可以登录 | 更改角色和负责门店 |\n| 已停用 | 管理员已停用该员工 | 重新启用 |\n\n> [!TIP]\n> 邀请中和已过期的员工不计入套餐的员工数。\n\n## 分配负责门店\n\n在员工详情界面中选择“负责门店”。可以选择多家门店。\n\n负责门店决定了该员工可以查看的预约和接收通知的范围。不负责的门店的预约，既不会出现在列表中，也不会出现在仪表板上。\n\n## 权限\n\n- 查看者：只能查看数据\n- 编辑者：可以更改门店信息\n- 管理员：还可以添加和删除员工\n\n权限的详细设置请参见[权限设置](?page=admin-roles)。\n\n## 录入排班\n\n在员工详情界面的“排班”中，输入上班的星期和时间。录入后，顾客就可以在预约页面中选择负责员工。\n\n- 排班只能录入在门店营业时间之内\n- 负责多家门店时，需要按门店分别录入\n- 休息日按日期指定并添加\n\n## 停用员工\n\n对于因离职等原因不再使用的员工，请不要删除，而是设为“停用”。停用的员工将无法登录，但其负责过的预约和操作记录中仍会保留其姓名。\n\n停用的员工不计入员工数。要再次使用时，请点击“重新启用”。\n\n## 删除员工\n\n删除的员工无法恢复。其负责过的预约中，负责员工一栏将显示为“已删除的员工”。如果需要保留记录，请使用停用而不是删除。","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(280%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%2256%22%20r%3D%229%22%20fill%3D%22hsl(280%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2250%22%20width%3D%22110%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2261%22%20width%3D%2270%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%2284%22%20r%3D%229%22%20fill%3D%22hsl(280%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2278%22%20width%3D%22141%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2289%22%20width%3D%2287%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%22112%22%20r%3D%229%22%20fill%3D%22hsl(280%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22106%22%20width%3D%22122%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22117%22%20width%3D%22104%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%22140%22%20r%3D%229%22%20fill%3D%22hsl(280%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22134%22%20width%3D%22153%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22145%22%20width%3D%2281%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E"},{"id":"guide-notice","parentId":"guide","title":"通知设置","order":6,"description":"选择通过电子邮件或应用接收的通知","md":"# 通知设置\n\n有新预约或预约被取消时，可以通过电子邮件或应用接收通知。通知设置按员工分别保存，由每个人自行选择。\n\n## 选择要接收的通知\n\n从右上角的账户菜单中打开“通知设置”，勾选想要接收的通知。\n\n| 通知 | 电子邮件 | 应用 |\n| --- | --- | --- |\n| 新预约 | ✓ | ✓ |\n| 预约取消 | ✓ | ✓ |\n| 临时停业日的预约 | ✓ | ✓ |\n| 月度报表 | ✓ | — |\n| 邀请被接受 | ✓ | — |\n\n月度报表会在每月 1 日发送上个月的数据。内容请参见[查看报表](?page=guide-report)。\n\n## 通知对象门店\n\n通知的对象仅限您负责的门店的预约。拥有所有者或管理员角色的人员可以选择“所有门店”。\n\n负责的门店较多时，可以通过“选择门店”缩小接收通知的门店范围。\n\n## 免打扰时段\n\n如果不想在夜间接收通知，请设置“免打扰时段”。这段时间内的通知会在时段结束时一并送达。电子邮件和应用可以分别设置。\n\n## 合并接收\n\n对于预约较多的门店，可以不逐条接收通知，而是每小时合并接收一次。合并后的通知中包含这一小时内的预约和取消列表。\n\n## 开启应用通知\n\n1. 在智能手机上安装“示例门店管理”应用\n2. 在应用中登录\n3. 被询问是否允许通知时，点击“允许”\n4. 在应用的“设置”→“通知”中，选择要接收的通知\n\n如果没有被询问，或者点击了“不允许”，请在智能手机的“设置”应用中开启示例门店管理的通知。\n\n## 收不到通知时\n\n请检查垃圾邮件文件夹。应用通知需要在智能手机的设置中被允许。\n\n- 确认当前是否处于免打扰时段\n- 确认该预约所在的门店是否在通知对象门店中\n- 在账户菜单的“个人资料”中确认电子邮件地址是否正确\n- 确认是否已从应用中退出登录（退出登录后将收不到应用通知）","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%22 :8,"description":"将数据导出为 CSV，在电子表格软件中使用","md":"# 导出数据\n\n可以将预约和门店信息导出为 CSV，在电子表格软件中使用。可以导出的数据因角色和负责门店而异。\n\n## 导出为 CSV\n\n在列表界面中点击右上角的“导出”，会按当前显示的筛选条件下载 CSV。\n\n1. 打开要导出的列表界面\n2. 按时间范围或门店进行筛选\n3. 点击右上角的“导出”\n\n筛选条件会直接作为导出的条件。例如，只导出上个月的预约时，先在预约列表中将时间范围设为上个月，然后再导出。\n\n## 可以导出的数据\n\n| 数据 | 导出的界面 | 可以导出的角色 |\n| --- | --- | --- |\n| 预约 | 预约列表 | 所有角色（仅限负责门店的数据） |\n| 门店 | 门店列表 | 编辑者、管理员、所有者 |\n| 员工 | 员工列表 | 管理员、所有者 |\n| 操作记录 | 操作记录 | 管理员、所有者 |\n\n## 出现乱码时\n\nCSV 以 UTF-8 编码导出。如果在 Excel 中出现乱码，请通过“数据”选项卡中的“从文本/CSV”导入。\n\n如果总是用 Excel 打开，所有者可以在“组织设置”→“数据”中将字符编码改为 Shift_JIS。更改后，组织中所有人导出的文件都将使用 Shift_JIS。\n\n## 可以导出的条数\n\n一次最多可以导出 10 万条。超过时，请分时间段导出。\n\n## 导出记录\n\n每次导出都会以“导出”记录在操作记录中。谁在何时导出了什么，可以在[操作记录](?page=admin-audit)中查看。","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(190%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3 ill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%22139%22%20width%3D%2262%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3C%2Fsvg%3E"},{"id":"admin-roles","parentId":"admin","title":"权限设置","order":1,"description":"决定每个角色可以进行的操作","md":"# 权限设置\n\n每位员工被分配一个角色。角色决定了可以查看的数据和可以进行的操作。\n\n## 角色一览\n\n| 角色 | 查看门店 | 编辑门店 | 管理员工 | 账单 |\n| --- | --- | --- | --- | --- |\n| 查看者 | ✓ | — | — | — |\n| 编辑者 | ✓ | ✓ | — | — |\n| 管理员 | ✓ | ✓ | ✓ | — |\n| 所有者 | ✓ | ✓ | ✓ | ✓ |\n\n## 各角色说明\n\n### 查看者\n\n可以查看负责门店的预约和门店信息，但不能更改或取消预约。适合兼职员工，以及只需要确认数字的人员。\n\n### 编辑者\n\n可以更改和取消负责门店的预约，也可以更改门店信息。适合在门店负责日常接待的人员。\n\n### 管理员\n\n除了编辑者可以进行的操作之外，还可以邀请员工、更改角色、停用员工，以及进行安全设置。适合店长，以及统管多家门店的人员。\n\n### 所有者\n\n可以进行所有操作。只有所有者才能处理账单和更改套餐、进行数据设置以及注销账户。\n\n## 更改角色\n\n在员工详情界面中重新选择“角色”。更改会立即生效。\n\n降低角色后，即使是该员工已经打开的界面，无权进行的操作对应的按钮也将无法点击。不能更改自己的角色。\n\n## 转让所有者\n\n一个组织只有一位所有者。将所有者转让给他人后，原所有者将变为“管理员”。\n\n1. 打开“组织设置”→“所有者”\n2. 选择要成为新所有者的员工\n3. 为确认身份，输入自己的密码，然后点击“转让”\n\n新所有者会收到电子邮件通知。转让后如需恢复，必须由新所有者再次转让回来。\n\n## 与负责门店的关系\n\n角色在负责门店的范围内生效。例如，“编辑者”只能更改自己负责的门店的信息。所有者不受负责门店的限制，可以处理所有门店。\n\n## 更改记录\n\n角色的更改和所有者的转让会记录在[操作记录](?page=admin-audit)中。","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(232%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D 账单相关的操作。\n\n## 更改套餐\n\n在“组织设置”→“套餐”中选择。升级到更高级的套餐会立即生效，降级到较低级的套餐则从下一个账单日起生效。\n\n| 套餐 | 门店数 | 适用场景 |\n| --- | --- | --- |\n| 标准版 | 最多 10 家门店 | 经营一家到几家门店 |\n| 商业版 | 无上限 | 集中管理众多门店 |\n\n降级到较低级的套餐时，如果门店数超过上限，请先将部分门店设为“隐藏”。\n\n## 账单日\n\n按月付费的套餐，以签约日作为每月的账单日。按年付费的套餐，以签约日作为每年的账单日。如果账单日在月末，而某个月没有这一天，则以该月的最后一天作为账单日。\n\n## 下载账单\n\n可以在“账单记录”中以 PDF 格式下载每个月的账单。\n\n账单在账单日的次日开具。开具后，所有者会收到电子邮件通知。\n\n### 账单抬头\n\n账单上显示的公司名称、部门名称和联系人姓名，可以在“组织设置”→“账单”中更改。更改后的抬头从下一张账单开始使用。\n\n## 更改付款方式\n\n可以选择信用卡或账单付款。账单付款仅适用于按年付费的套餐。\n\n- 信用卡：在账单日自动扣款\n- 账单付款：请在账单开具后 30 天内转账\n\n## 付款失败时\n\n如果因信用卡过期等原因付款失败，所有者会收到电子邮件，屏幕上方也会显示提示。请在 14 天内更新付款方式。更新后会立即重新扣款。\n\n超过 14 天后，组织中的所有人都将只能查看。付款完成后即恢复正常。\n\n## 取消订阅\n\n在“组织设置”→“套餐”下方的“取消订阅”中办理。取消后，可以使用到当前计费周期结束，之后按注销账户处理。数据的处理方式请参见[常见问题](?page=faq)。","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(140%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20heigh
