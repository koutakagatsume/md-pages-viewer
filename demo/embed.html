<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>md-pages-viewer 埋め込みのデモ</title>
    <style>
      /* ---- 組み込み先（架空の管理画面）の色 ---- */
      :root {
        --app-bg: #f5f6f8;
        --app-surface: #ffffff;
        --app-text: #1f2328;
        --app-muted: #667085;
        --app-border: #e4e7ec;
        --app-accent: #4f46e5;
        --app-nav-bg: #111827;
        --app-nav-text: #c7cbd4;
        --app-nav-active: #1f2937;
        color-scheme: light;
      }
      :root[data-theme='dark'] {
        --app-bg: #0b0d12;
        --app-surface: #151821;
        --app-text: #e6e8ee;
        --app-muted: #9aa3b2;
        --app-border: #2a2f3a;
        --app-accent: #8b8cf7;
        --app-nav-bg: #0f1117;
        --app-nav-text: #a9b0bd;
        --app-nav-active: #1c2030;
        color-scheme: dark;
      }

      /* ---- md-pages-viewer を組み込み先の見た目に合わせる（CSS 変数と ::part() だけ） ---- */
      md-pages-viewer {
        --mpv-color-text: var(--app-text);
        --mpv-color-bg: var(--app-surface);
        --mpv-color-border: var(--app-border);
        --mpv-color-accent: var(--app-accent);
        --mpv-sidebar-width: 240px;
      }
      .card md-pages-viewer {
        border: 1px solid var(--app-border);
        border-radius: 12px;
      }
      .card md-pages-viewer::part(toolbar) {
        border-radius: 12px 12px 0 0;
      }

      /* ---- 以下は組み込み先の画面 ---- */
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        font-family: system-ui, -apple-system, 'Segoe UI', 'Hiragino Sans', 'Yu Gothic UI', sans-serif;
        font-size: 15px;
        color: var(--app-text);
        background: var(--app-bg);
      }
      button {
        font: inherit;
      }

      .demo-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 20px;
        padding: 8px 16px;
        font-size: 13px;
        color: #e5e7eb;
        background: #374151;
      }
      .demo-bar strong {
        font-weight: 600;
      }
      .demo-group {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .demo-group span {
        color: #9ca3af;
      }
      .demo-group a {
        padding: 3px 10px;
        border-radius: 999px;
        color: #e5e7eb;
        text-decoration: none;
      }
      .demo-group a:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      .demo-group a[aria-current='true'] {
        color: #111827;
        background: #f9fafb;
      }
      .demo-note {
        flex-basis: 100%;
        color: #cbd5e1;
      }

      .app {
        flex: 1;
        min-height: 0;
        display: flex;
      }
      .app-nav {
        flex: none;
        width: 216px;
        padding: 16px 12px;
        color: var(--app-nav-text);
        background: var(--app-nav-bg);
      }
      .app-logo {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 4px 8px 20px;
        font-weight: 700;
        color: #fff;
      }
      .app-logo i {
        width: 26px;
        height: 26px;
        border-radius: 7px;
        background: var(--app-accent);
      }
      .app-nav ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .app-nav li {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border-radius: 8px;
      }
      .app-nav li[aria-current='page'] {
        color: #fff;
        background: var(--app-nav-active);
      }
      .app-nav svg {
        width: 18px;
        height: 18px;
        flex: none;
      }
      .app-body {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .app-header {
        flex: none;
        display: flex;
        align-items: center;
        gap: 12px;
        height: 56px;
        padding: 0 24px;
        border-bottom: 1px solid var(--app-border);
        background: var(--app-surface);
      }
      .app-crumb {
        color: var(--app-muted);
      }
      .app-crumb b {
        color: var(--app-text);
        font-weight: 600;
      }
      .app-header-end {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .app-user {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 13px;
        font-weight: 600;
        color: #fff;
        background: #64748b;
      }
      .help-toggle {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 34px;
        padding: 0 12px;
        border: 1px solid var(--app-border);
        border-radius: 8px;
        color: var(--app-text);
        background: var(--app-surface);
        cursor: pointer;
      }
      .help-toggle[aria-expanded='true'] {
        color: var(--app-accent);
        border-color: color-mix(in srgb, var(--app-accent) 45%, var(--app-border));
        background: color-mix(in srgb, var(--app-accent) 10%, var(--app-surface));
      }
      /* スクロールする要素の上の padding は 0 にする。padding があると、上に残る
         マニュアルのツールバーがその分だけ下で止まり、上に本文が透けて見える */
      .app-main {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 0 24px 24px;
      }
      .page-head {
        padding-top: 24px;
        margin-bottom: 16px;
      }
      .page-head h1 {
        margin: 0 0 4px;
        font-size: 22px;
      }
      .page-head p {
        margin: 0;
        color: var(--app-muted);
      }

      /* 例1：高さ「画面に合わせる」 */
      [data-height='fixed'] .app-main {
        display: flex;
        flex-direction: column;
      }
      [data-height='fixed'] .card {
        flex: 1;
        min-height: 360px;
        display: flex;
        flex-direction: column;
      }
      [data-height='fixed'] .card md-pages-viewer {
        flex: 1;
        min-height: 0;
      }

      /* 例2：店舗の一覧 */
      .stores {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        border: 1px solid var(--app-border);
        border-radius: 12px;
        background: var(--app-surface);
        overflow: hidden;
      }
      .stores th,
      .stores td {
        padding: 12px 16px;
        text-align: left;
        border-bottom: 1px solid var(--app-border);
      }
      .stores th {
        font-size: 13px;
        font-weight: 600;
        color: var(--app-muted);
      }
      .stores tr:last-child td {
        border-bottom: 0;
      }
      .badge {
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 12px;
        color: #047857;
        background: #d1fae5;
      }
      .badge.off {
        color: #6b7280;
        background: #e5e7eb;
      }
      [data-theme='dark'] .badge {
        color: #6ee7b7;
        background: #064e3b;
      }
      [data-theme='dark'] .badge.off {
        color: #9ca3af;
        background: #374151;
      }

      /* 例2：画面の右に重ねるヘルプパネル。ヘッダーの下に出し、開閉は同じボタンで行う */
      .help-panel {
        position: fixed;
        right: 0;
        bottom: 0;
        width: min(480px, 100%);
        display: flex;
        flex-direction: column;
        border-left: 1px solid var(--app-border);
        background: var(--app-surface);
        box-shadow: -8px 0 24px rgba(0, 0, 0, 0.12);
        transform: translateX(100%);
        visibility: hidden;
        transition:
          transform 0.2s ease,
          visibility 0s linear 0.2s;
        z-index: 10;
      }
      .help-panel.open {
        transform: none;
        visibility: visible;
        transition: transform 0.2s ease;
      }
      .help-panel md-pages-viewer {
        flex: 1;
        min-height: 0;
      }

      @media (max-width: 900px) {
        .app-nav {
          display: none;
        }
        .app-main {
          padding: 0 16px 16px;
        }
        .page-head {
          padding-top: 16px;
        }
      }
    </style>
    <!-- npm に公開したものを CDN から読み込む -->
    <script src="https://cdn.jsdelivr.net/npm/md-pages-viewer@1/dist/md-pages-viewer.js"></script>
  </head>
  <body>
    <div class="demo-bar">
      <strong>md-pages-viewer 埋め込みのデモ</strong>
      <div class="demo-group" data-param="demo">
        <a data-value="page">例1：管理画面の1ページ</a>
        <a data-value="panel">例2：画面の右のヘルプパネル</a>
      </div>
      <div class="demo-group" data-param="height" data-only="page">
        <span>高さ</span>
        <a data-value="auto">本文に合わせる</a>
        <a data-value="fixed">画面に合わせる</a>
      </div>
      <div class="demo-group" data-param="theme">
        <span>テーマ</span>
        <a data-value="light">ライト</a>
        <a data-value="dark">ダーク</a>
      </div>
      <p class="demo-note"></p>
    </div>

    <div class="app">
      <nav class="app-nav" aria-label="メニュー">
        <div class="app-logo"><i></i>サンプル店舗管理</div>
        <ul>
          <li data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11l8-7 8 7v9H4z" /></svg>ダッシュボード</li>
          <li data-nav="stores"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9h16l-1-5H5zM5 9v11h14V9M10 20v-6h4v6" /></svg>店舗</li>
          <li data-nav="staff"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5" /><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14.8c2 .7 3.2 2.4 3.6 5.2" /></svg>スタッフ</li>
          <li data-nav="reports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" /></svg>レポート</li>
          <li data-nav="help"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9" /><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17h.01" /></svg>ヘルプ</li>
        </ul>
      </nav>
      <div class="app-body">
        <header class="app-header">
          <div class="app-crumb"></div>
          <div class="app-header-end">
            <button type="button" class="help-toggle" aria-expanded="false" aria-controls="help-panel" hidden>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17h.01" /></svg>
              ヘルプ
            </button>
            <div class="app-user" aria-label="ログイン中のユーザー">山</div>
          </div>
        </header>
        <main class="app-main"></main>
      </div>
    </div>

    <script>
      // ---- マニュアルのページ（実際の組み込みでは、サーバーの API から返す） ----
      const pages = [
        {"id":"welcome","parentId":null,"title":"はじめに","order":1,"description":"サンプル店舗管理でできることと、最初に行う設定","md":"# はじめに\n\nサンプル店舗管理は、複数の店舗の情報・スタッフ・予約をまとめて管理するサービスです。このマニュアルでは、画面の使い方と、管理者が行う設定を説明します。\n\n## できること\n\n- 店舗ごとの営業時間・住所・連絡先の管理\n- スタッフの招待と、担当する店舗の割り当て\n- お客様からの予約の受け付けと、変更・キャンセルの管理\n- 予約の通知と、月次レポートの受け取り\n- 予約や店舗の情報の CSV での書き出し\n\n## 画面の構成\n\nログインすると、左にメニュー、右に選んだ画面が出ます。メニューの項目は、役割によって出るものが異なります。\n\n| メニュー | できること | 説明のページ |\n| --- | --- | --- |\n| ダッシュボード | 今月の件数や予約の推移を見る | [ダッシュボードの見方](?page=guide-dashboard) |\n| 店舗 | 店舗の追加と、営業時間などの設定 | [店舗の登録](?page=guide-store) |\n| スタッフ | スタッフの招待と、担当店舗の割り当て | [スタッフの追加](?page=guide-staff) |\n| 予約 | 予約の一覧と、変更・キャンセル | [予約の管理](?page=guide-booking) |\n| レポート | 月ごとの集計を見る | [レポートの見方](?page=guide-report) |\n| ヘルプ | このマニュアル | － |\n\n画面の右上には、アカウントメニュー（自分の名前の頭文字の丸）があります。通知の設定、パスワードの変更、ログアウトはここから行います。\n\n## 最初に行う設定\n\n使い始めるときは、次の順に設定します。オーナーか管理の役割の人が行ってください。\n\n1. [店舗の登録](?page=guide-store)：店舗を追加し、営業時間と予約の受付を決めます\n2. [スタッフの追加](?page=guide-staff)：スタッフを招待し、担当する店舗を割り当てます\n3. [通知の設定](?page=guide-notice)：受け取る通知を選びます。通知の設定は一人ひとりが行います\n\nセキュリティを高めたい場合は、続けて [2段階認証](?page=admin-2fa) を必須にしてください。\n\n## 対応している環境\n\n| 種類 | 対応しているもの |\n| --- | --- |\n| パソコンのブラウザ | Chrome・Edge・Safari・Firefox の最新版 |\n| スマートフォン | iPhone の Safari、Android の Chrome の最新版 |\n| アプリ | iPhone・Android 向けの「サンプル店舗管理」アプリ（通知の受け取りと予約の確認） |\n\n古いブラウザでは、画面が崩れたり、ボタンが押せなかったりすることがあります。\n\n## 困ったときは\n\nまず [よくある質問](?page=faq) を見てください。設定の値を確かめたいときは [設定項目の一覧](?page=reference) が便利です。\n\n解決しない場合は、画面右上のアカウントメニューから「お問い合わせ」を送れます。受け付けは平日の10時から18時までで、2営業日以内に返事をします。\n"},
        {"id":"guide","parentId":null,"title":"操作ガイド","order":2,"description":"サンプルアプリの基本的な使い方"},
        {"id":"guide-login","parentId":"guide","title":"ログイン","order":1,"description":"メールアドレスとパスワードでログインする方法と、ログインできないときの対処","md":"# ログイン\n\nサンプル店舗管理を使うには、招待メールで設定したメールアドレスとパスワードでログインします。ここでは、ログインの手順と、ログインできないときの対処を説明します。\n\n## ログインする\n\n1. ログイン画面を開く\n2. メールアドレスとパスワードを入力する\n3. 「ログイン」を押す\n\n組織で2段階認証が必須になっている場合は、続けて確認コードを入れる画面が出ます。\n\n### 確認コードを入れる\n\n認証アプリか SMS で受け取った6桁の数字を入れます。認証アプリのコードは30秒ごとに変わるので、表示されているうちに入れてください。\n\n「この端末では30日間確認しない」にチェックを入れると、同じ端末とブラウザからは30日間、確認コードを省略できます。設定の方法は [2段階認証](?page=admin-2fa) を見てください。\n\n## ログインを保持する\n\n「ログインしたままにする」にチェックを入れると、30日間はログインを省略できます。共用のパソコンではチェックを外してください。\n\nログインの保持は、端末とブラウザごとに記録されます。別のパソコンやスマートフォンでは、もう一度ログインが必要です。ログアウトすると、その端末の保持は解除されます。\n\n## ログアウトする\n\n画面右上のアカウントメニューから「ログアウト」を押します。\n\nパソコンをなくした場合など、ほかの端末のログインもまとめて解除したいときは、アカウントメニューの「ログイン中の端末」で「すべての端末からログアウト」を押します。次にどの端末で使うときも、ログインが必要になります。\n\n## パスワードを忘れたとき\n\n1. ログイン画面の「パスワードを忘れた方」を押す\n2. 登録したメールアドレスを入れて「送信」を押す\n3. 届いたメールのリンクを開く（リンクの有効期限は1時間です）\n4. 新しいパスワードを2回入れて「保存」を押す\n\n新しいパスワードには、組織で決めたルールがあります。文字数や使える文字は [パスワードのルール](?page=admin-password) を見てください。\n\n## ログインできないとき\n\n| 表示 | 対処 |\n| --- | --- |\n| パスワードが違います | 大文字・小文字と、全角・半角を確かめる |\n| アカウントがロックされています | 30分待つか、管理者に解除を頼む |\n| メールアドレスが見つかりません | 登録したメールアドレスを管理者に確かめる |\n| 確認コードが違います | スマートフォンの時刻が正しいか確かめる |\n| この場所からはログインできません | 会社のネットワークにつないでからログインする |\n| 招待の有効期限が切れています | 管理者にもう一度招待してもらう |\n\n### アカウントがロックされたとき\n\n5回続けてパスワードを間違えると、そのアカウントを30分ロックします。30分たつと自動で解除されます。急ぐ場合は、管理者がスタッフの詳細画面から解除できます。\n\n### メールが届かないとき\n\nパスワードの再設定や招待のメールが届かない場合は、迷惑メールのフォルダを確かめてください。会社のメールで受け取れない場合は、送り主のアドレスを受け取れるように、メールの管理者に設定を頼んでください。\n"},
        {"id":"guide-dashboard","parentId":"guide","title":"ダッシュボードの見方","order":2,"description":"ログイン後に最初に出る画面の各エリアの意味","md":"# ダッシュボードの見方\n\nログインすると、最初にダッシュボードが表示されます。担当している店舗の今月の様子が、ひと目で分かるようになっています。\n\n## 画面の構成\n\n| エリア | 場所 | 内容 |\n| --- | --- | --- |\n| 上部の数字 | いちばん上 | 今月の件数・先月との差・目標までの残り |\n| グラフ | 中央 | 直近の予約の件数の推移 |\n| 今日の予約 | 右 | 今日の予約の一覧 |\n| お知らせ | 下 | 運営からのお知らせ |\n\n## 上部の数字\n\n今月の件数・先月との差・目標までの残りを表示します。数字を押すと、内訳の画面に移ります。\n\n| 数字 | 意味 |\n| --- | --- |\n| 今月の件数 | 今月1日から今日までの予約の件数。キャンセルされた予約は数えない |\n| 先月との差 | 先月の同じ日までの件数との差。増えていれば緑、減っていれば赤で出る |\n| 目標までの残り | 今月の目標から、今月の件数を引いた数。目標を決めていないときは出ない |\n\n### 目標を決める\n\n目標は、店舗ごと・月ごとに決めます。「店舗」の画面で店舗を選び、「目標」タブで月ごとの件数を入れてください。目標を決められるのは、オーナーと管理の役割の人です。\n\n## グラフ\n\n直近12か月の推移を表示します。グラフの上にカーソルを置くと、その月の値が出ます。\n\n### 期間を変える\n\nグラフ右上の「期間」から、3か月・6か月・12か月を選べます。\n\n### 店舗を絞り込む\n\n複数の店舗を担当している場合は、グラフ左上の「店舗」で、表示する店舗を選べます。何も選ばないと、担当しているすべての店舗の合計を表示します。\n\n## 今日の予約\n\n今日の予約を、時刻の早い順に表示します。お客様の名前を押すと、その予約の詳細が開きます。\n\n- 来店した予約には「来店」の印が付きます\n- キャンセルされた予約は、灰色の文字で一覧の下に出ます\n- 表示されるのは、担当している店舗の予約だけです\n\n## お知らせ\n\n運営からのお知らせを新しい順に5件表示します。未読のものには印が付きます。\n\nメンテナンスなどの重要なお知らせは、ログインした直後に画面の上にも表示されます。「閉じる」を押すと、次のお知らせまでは表示されません。\n\n## 表示を並べ替える\n\n各エリアの右上の「…」から、エリアの並べ替えと非表示ができます。並べ替えた表示は自分だけに使われ、ほかの人のダッシュボードは変わりません。元に戻すときは、「…」の「初期の表示に戻す」を押します。\n"},
        {"id":"guide-store","parentId":"guide","title":"店舗の登録","order":3,"description":"店舗を追加し、営業時間や住所を設定する","md":"# 店舗の登録\n\n店舗を追加し、営業時間や予約の受付を設定します。店舗を追加できるのは、オーナーと管理の役割の人です。\n\n## 店舗を追加する\n\n1. メニューの「店舗」を開く\n2. 右上の「追加」を押す\n3. 下の項目を入力して「保存」を押す\n\n| 項目 | 必須 | 内容 |\n| --- | --- | --- |\n| 店舗名 | 必須 | 画面や帳票に出る名前（40文字まで） |\n| 店舗コード | 必須 | 書き出しや連携で店舗を見分ける番号（半角英数字8文字まで） |\n| 住所 | 必須 | 郵便番号を入れると自動で入ります |\n| 電話番号 | 任意 | ハイフンあり・なしのどちらでも可 |\n| メールアドレス | 任意 | 予約の控えを送るときの送り主になります |\n\n### 店舗コードについて\n\n店舗コードは、登録した後は変えられません。書き出した CSV やレポートでは、店舗名ではなく店舗コードで店舗を見分けます。店舗名を変えても過去のデータとつながるように、店舗ごとに決まった番号を付けてください。\n\n## 営業時間を設定する\n\n曜日ごとに開店・閉店の時刻を入れます。定休日は「休み」にチェックを入れます。\n\n時刻は15分単位で入れます。昼の休憩がある場合は「休憩を入れる」を押し、休憩の始まりと終わりを入れます。休憩の間は予約を受け付けません。\n\n### 祝日の営業時間\n\n祝日だけ別の時間にする場合は、「祝日」の行に入れます。空のままなら、その曜日の時間を使います。\n\n### 日付をまたぐ営業\n\n夜遅くまで営業する店舗では、閉店を「24:00」以降で入れます。たとえば翌日の午前2時に閉める場合は「26:00」と入れます。最大は「29:00」です。\n\n## 臨時休業日を登録する\n\n年末年始や改装などで休む日は、「臨時休業日」タブで日付を指定して登録します。期間で登録することもできます。\n\n登録した日は、予約の画面で選べなくなります。すでに入っている予約は、予約の一覧の上に「臨時休業日の予約」として出ます。お客様への連絡は自動では行わないので、一人ずつ連絡してください。\n\n## 予約の受付を設定する\n\n「予約の受付」タブで、何日前から予約を受けるか、何時まで受けるか、1枠の長さなどを決めます。選べる値と初期値は [設定項目の一覧](?page=reference) を見てください。\n\n1枠の長さを変えると、すでに入っている予約はそのまま残り、新しく受ける予約から新しい長さになります。\n\n## 店舗を非表示にする\n\nしばらく使わない店舗は「非表示」にします。非表示の店舗は、予約の画面やダッシュボードに出なくなりますが、データは残ります。もう一度使うときは、店舗の一覧の「非表示の店舗」から「表示する」を押します。\n\n非表示の店舗は、プランの店舗の数に数えません。\n\n## 店舗を削除する\n\n削除した店舗は元に戻せません。しばらく使わないだけなら「非表示」にしてください。\n\n店舗を削除すると、その店舗の予約と目標もすべて削除されます。残しておきたい場合は、先に [データの書き出し](?page=guide-export) で書き出してください。\n\n> 店舗を追加したら、次は [スタッフの追加](?page=guide-staff) を行います。\n"},
        {"id":"guide-staff","parentId":"guide","title":"スタッフの追加","order":4,"description":"スタッフを招待し、担当する店舗を割り当てる","md":"# スタッフの追加\n\nスタッフを招待し、担当する店舗と役割を決めます。スタッフを招待できるのは、オーナーと管理の役割の人です。\n\n## 招待する\n\nメニューの「スタッフ」で「招待」を押し、メールアドレスを入力します。招待メールのリンクから、スタッフ自身がパスワードを設定します。\n\n招待メールの有効期限は7日間です。期限が切れたら、もう一度招待してください。\n\n### まとめて招待する\n\n10人以上を招待する場合は、「招待」の横の「まとめて招待」から、メールアドレスを1行に1件ずつ貼り付けます。役割と担当店舗は、全員に同じものが付きます。後から一人ずつ変えられます。\n\n## 招待の状態\n\nスタッフの一覧では、招待の状態が次のように出ます。\n\n| 状態 | 意味 | できること |\n| --- | --- | --- |\n| 招待中 | メールを送り、まだ参加していない | 招待の取り消し・メールの再送 |\n| 期限切れ | 7日間のうちに参加しなかった | もう一度招待 |\n| 参加済み | パスワードを設定してログインできる | 役割と担当店舗の変更 |\n| 利用停止 | 管理者が利用を止めた | 利用の再開 |\n\n招待中と期限切れのスタッフは、プランのスタッフの数に数えません。\n\n## 担当店舗を割り当てる\n\nスタッフの詳細画面で「担当店舗」を選びます。複数の店舗を選べます。\n\n担当店舗は、そのスタッフが見られる予約と、受け取る通知の範囲になります。担当していない店舗の予約は、一覧にもダッシュボードにも出ません。\n\n## 権限\n\n- 閲覧のみ：データを見るだけ\n- 編集：店舗の情報を変更できる\n- 管理：スタッフの追加・削除もできる\n\n権限の細かい設定は [権限の設定](?page=admin-roles) を見てください。\n\n## 勤務の予定を入れる\n\nスタッフの詳細画面の「勤務の予定」で、勤務する曜日と時間を入れます。入れておくと、予約の画面でお客様が担当者を選べるようになります。\n\n- 勤務の予定は、店舗の営業時間の中だけで入れられます\n- 複数の店舗を担当している場合は、店舗ごとに入れます\n- 休みの日は、日付を指定して登録します\n\n## 利用を停止する\n\n退職などで使わなくなったスタッフは、削除せずに「利用を停止」にします。停止したスタッフはログインできなくなりますが、担当した予約や操作の記録には名前が残ります。\n\n停止したスタッフは、スタッフの数に数えません。もう一度使うときは、「利用を再開」を押します。\n\n## スタッフを削除する\n\n削除したスタッフは元に戻せません。担当した予約の担当者の欄は「削除されたスタッフ」になります。記録を残したい場合は、削除ではなく利用の停止を使ってください。\n"},
        {"id":"guide-notice","parentId":"guide","title":"通知の設定","order":6,"description":"メールやアプリで受け取る通知を選ぶ","md":"# 通知の設定\n\n予約が入ったときやキャンセルされたときに、メールやアプリで知らせを受け取れます。通知の設定はスタッフごとに別々で、一人ひとりが自分で選びます。\n\n## 受け取る通知を選ぶ\n\n右上のアカウントメニューから「通知の設定」を開き、受け取りたい通知にチェックを入れます。\n\n| 通知 | メール | アプリ |\n| --- | --- | --- |\n| 新しい予約 | ○ | ○ |\n| 予約のキャンセル | ○ | ○ |\n| 臨時休業日の予約 | ○ | ○ |\n| 月次レポート | ○ | － |\n| 招待の受け入れ | ○ | － |\n\n月次レポートは、毎月1日に前の月の分が届きます。内容は [レポートの見方](?page=guide-report) を見てください。\n\n## 通知の対象の店舗\n\n通知の対象は、担当している店舗の予約だけです。オーナーと管理の役割の人は、「すべての店舗」を選べます。\n\n担当店舗が多い場合は、「店舗を選ぶ」で、通知を受け取る店舗を絞り込めます。\n\n## 受け取らない時間帯\n\n夜間に通知を受け取りたくない場合は、「受け取らない時間帯」を入れます。その間の通知は、時間帯が終わったときにまとめて届きます。メールとアプリで別々に決められます。\n\n## まとめて受け取る\n\n予約が多い店舗では、通知を1件ずつではなく、1時間ごとにまとめて受け取れます。まとめた通知には、その1時間の予約とキャンセルの一覧が入ります。\n\n## アプリの通知を有効にする\n\n1. スマートフォンに「サンプル店舗管理」アプリを入れる\n2. アプリでログインする\n3. 通知の許可を求められたら「許可」を押す\n4. アプリの「設定」→「通知」で、受け取る通知を選ぶ\n\n許可を求められなかった場合や、「許可しない」を押した場合は、スマートフォンの設定アプリで、サンプル店舗管理の通知をオンにしてください。\n\n## 通知が届かないとき\n\n迷惑メールのフォルダを確かめてください。アプリの通知は、スマホの設定で許可されている必要があります。\n\n- 受け取らない時間帯に入っていないか確かめる\n- 通知の対象の店舗に、その予約の店舗が入っているか確かめる\n- メールアドレスが正しいか、アカウントメニューの「プロフィール」で確かめる\n- アプリからログアウトしていないか確かめる（ログアウトするとアプリの通知は届きません）\n"},
        {"id":"guide-export","parentId":"guide","title":"データの書き出し","order":8,"description":"CSV でデータを書き出して、表計算ソフトで使う","md":"# データの書き出し\n\n予約や店舗の情報を CSV で書き出して、表計算ソフトで使えます。書き出せるデータは、役割と担当店舗によって異なります。\n\n## CSV で書き出す\n\n一覧の画面で右上の「書き出し」を押すと、表示中の条件で CSV をダウンロードします。\n\n1. 書き出したい一覧の画面を開く\n2. 期間や店舗で絞り込む\n3. 右上の「書き出し」を押す\n\n絞り込んだ条件は、そのまま書き出しの条件になります。たとえば、先月の予約だけを書き出す場合は、予約の一覧で期間を先月にしてから書き出します。\n\n## 書き出せるデータ\n\n| データ | 書き出す画面 | 書き出せる役割 |\n| --- | --- | --- |\n| 予約 | 予約の一覧 | すべての役割（担当店舗の分だけ） |\n| 店舗 | 店舗の一覧 | 編集・管理・オーナー |\n| スタッフ | スタッフの一覧 | 管理・オーナー |\n| 操作の記録 | 操作の記録 | 管理・オーナー |\n\n## 文字化けするとき\n\nCSV は UTF-8 で書き出します。Excel で文字化けする場合は、「データ」タブの「テキストまたは CSV から」で読み込んでください。\n\nいつも Excel で開く場合は、オーナーが「組織の設定」→「データ」で、文字コードを Shift_JIS に変えられます。変えると、組織の全員の書き出しが Shift_JIS になります。\n\n## 書き出せる件数\n\n一度に書き出せるのは10万件までです。それより多い場合は、期間を分けて書き出してください。\n\n## 書き出しの記録\n\n書き出しを行うと、操作の記録に「書き出し」として残ります。誰がいつ何を書き出したかは、[操作の記録](?page=admin-audit) で確かめられます。\n"},

        {"id":"admin-roles","parentId":"admin","title":"権限の設定","order":1,"description":"役割ごとにできる操作を決める","md":"# 権限の設定\n\nスタッフには、役割を1つずつ付けます。役割によって、見られるデータとできる操作が決まります。\n\n## 役割の一覧\n\n| 役割 | 店舗の閲覧 | 店舗の編集 | スタッフの管理 | 請求 |\n| --- | --- | --- | --- | --- |\n| 閲覧のみ | ○ | － | － | － |\n| 編集 | ○ | ○ | － | － |\n| 管理 | ○ | ○ | ○ | － |\n| オーナー | ○ | ○ | ○ | ○ |\n\n## 役割ごとの説明\n\n### 閲覧のみ\n\n担当店舗の予約と店舗の情報を見られます。予約の変更やキャンセルはできません。アルバイトのスタッフや、数字を確かめるだけの人に向いています。\n\n### 編集\n\n担当店舗の予約の変更・キャンセルと、店舗の情報の変更ができます。店舗で日々の受付をする人に向いています。\n\n### 管理\n\n編集でできることに加えて、スタッフの招待・役割の変更・利用の停止と、セキュリティの設定ができます。店長や、複数の店舗をまとめる人に向いています。\n\n### オーナー\n\nすべての操作ができます。請求とプランの変更、データの設定、退会ができるのはオーナーだけです。\n\n## 役割を変える\n\nスタッフの詳細画面で「役割」を選び直します。変更はすぐに反映されます。\n\n役割を下げると、そのスタッフが開いている画面のうち、できなくなった操作のボタンは押せなくなります。自分自身の役割は変えられません。\n\n## オーナーを移す\n\nオーナーは組織に1人だけです。別の人に移すと、元のオーナーは「管理」になります。\n\n1. 「組織の設定」→「オーナー」を開く\n2. 新しいオーナーにするスタッフを選ぶ\n3. 確認のため、自分のパスワードを入れて「移す」を押す\n\n新しいオーナーにはメールで知らせが届きます。移した後に元に戻すには、新しいオーナーに移し直してもらう必要があります。\n\n## 担当店舗との関係\n\n役割は、担当店舗の中で使われます。たとえば「編集」の人は、担当している店舗の情報だけを変えられます。オーナーは、担当店舗にかかわらず、すべての店舗を扱えます。\n\n## 変更の記録\n\n役割の変更とオーナーの移動は、[操作の記録](?page=admin-audit) に残ります。\n"},
        {"id":"admin-billing","parentId":"admin","title":"請求とお支払い","order":2,"description":"プランの変更、請求書のダウンロード、支払い方法の変更","md":"# 請求とお支払い\n\nプランの変更、請求書のダウンロード、支払い方法の変更を行います。請求に関わる操作ができるのは、オーナーだけです。\n\n## プランを変える\n\n「組織の設定」→「プラン」で選びます。上位のプランへの変更はすぐに、下位のプランへの変更は次の請求日から反映されます。\n\n| プラン | 店舗の数 | 向いている使い方 |\n| --- | --- | --- |\n| スタンダード | 10店舗まで | 1〜数店舗を運営している |\n| ビジネス | 上限なし | 多くの店舗をまとめて管理したい |\n\n下位のプランに変えるときに店舗の数が上限を超えている場合は、先に店舗を「非表示」にしてください。\n\n## 請求日\n\n月額プランは、契約した日を毎月の請求日とします。年額プランは、契約した日を毎年の請求日とします。請求日が月末で、その月にその日がない場合は、月の最後の日を請求日とします。\n\n## 請求書をダウンロードする\n\n「請求履歴」から、月ごとの請求書を PDF でダウンロードできます。\n\n請求書は、請求日の翌日に発行します。発行するとオーナーにメールで知らせが届きます。\n\n### 請求書の宛名\n\n請求書に出す会社名・部署名・担当者名は、「組織の設定」→「請求」で変えられます。変えた宛名は、次の請求書から使われます。\n\n## 支払い方法を変える\n\nクレジットカードと請求書払いから選べます。請求書払いは年額プランだけで使えます。\n\n- クレジットカード：請求日に自動で支払います\n- 請求書払い：請求書の発行から30日以内に振り込んでください\n\n## 支払いに失敗したとき\n\nクレジットカードの期限切れなどで支払いに失敗すると、オーナーにメールが届き、画面の上にお知らせが出ます。14日以内に支払い方法を更新してください。更新すると、すぐにもう一度支払いを行います。\n\n14日を過ぎると、組織の全員が閲覧しかできなくなります。支払いが済むと、元に戻ります。\n\n## 解約する\n\n「組織の設定」→「プラン」の下にある「解約」から手続きします。解約すると、その請求期間の終わりまで使え、その後に退会と同じ扱いになります。データの扱いは [よくある質問](?page=faq) を見てください。\n"},

        {"id":"admin-2fa","parentId":"admin-security","title":"2段階認証","order":1,"description":"ログインのときに、パスワードに加えて確認コードを求める","md":"# 2段階認証\n\n2段階認証を使うと、ログインのときに、パスワードに加えて確認コードを求めます。パスワードが漏れても、確認コードがなければログインできません。\n\n## 有効にする\n\n1. 「組織の設定」→「セキュリティ」を開く\n2. 「2段階認証を必須にする」をオンにする\n\n次にログインしたときから、全員に確認コードの入力を求めます。\n\nオンにできるのは、オーナーと管理の役割の人です。オンにする前に、スタッフに知らせておくと、ログインのときに戸惑わずに済みます。\n\n## 確認コードを受け取る方法\n\n- 認証アプリ（おすすめ）\n- SMS\n\n認証アプリは、電波のない場所でもコードを確かめられます。SMS は、電話番号を登録するだけで使えますが、電波の状態によって届くのが遅れることがあります。\n\n## 認証アプリを設定する\n\n1. スマートフォンに認証アプリを入れる\n2. サンプル店舗管理にログインすると、設定の画面に QR コードが出る\n3. 認証アプリで QR コードを読み取る\n4. 認証アプリに出た6桁の数字を入れて「確認」を押す\n\n## SMS を設定する\n\n1. 設定の画面で「SMS で受け取る」を選ぶ\n2. 電話番号を入れて「送信」を押す\n3. 届いた6桁の数字を入れて「確認」を押す\n\n## バックアップコード\n\n設定が終わると、10個のバックアップコードが出ます。スマートフォンが使えないときに、確認コードの代わりに1回ずつ使えます。印刷するか、安全な場所に保存してください。\n\nバックアップコードは、アカウントメニューの「セキュリティ」から作り直せます。作り直すと、前のコードは使えなくなります。\n\n## スマホをなくしたとき\n\n管理者がそのスタッフの2段階認証をいったん解除し、設定し直してもらいます。\n\nバックアップコードがあれば、自分でログインして、新しいスマートフォンで設定し直せます。\n\n## 機種変更するとき\n\n古いスマートフォンが使えるうちに、アカウントメニューの「セキュリティ」で「認証アプリを変える」を押し、新しいスマートフォンで QR コードを読み取ってください。\n"},
        {"id":"admin-password","parentId":"admin-security","title":"パスワードのルール","order":2,"description":"文字数や使える文字、変更の間隔を決める","md":"# パスワードのルール\n\n組織のスタッフが使うパスワードのルールを決めます。ルールを決められるのは、オーナーと管理の役割の人です。\n\n## 決められること\n\n| 項目 | 選べる値 | 初期値 |\n| --- | --- | --- |\n| 最低の文字数 | 8〜32文字 | 10文字 |\n| 記号を必須にする | する・しない | しない |\n| 変更を求める間隔 | なし・90日・180日 | なし |\n\n## 使える文字\n\nパスワードには、英大文字・英小文字・数字・記号を使えます。全角の文字と空白は使えません。\n\n「記号を必須にする」をオンにすると、次の記号のうち1つ以上を含める必要があります。\n\n~~~text\n! # $ % & ( ) * + - . / : ; = ? @ [ ] ^ _ { | } ~\n~~~\n\n## 変更を求める間隔\n\n「変更を求める間隔」を90日か180日にすると、前にパスワードを変えた日からその日数がたったときに、ログインの後でパスワードの変更を求めます。変えるまでは、ほかの画面に進めません。\n\n最近は、定期的な変更を求めず、長く推測されにくいパスワードを使うほうが安全と考えられています。特に理由がなければ「なし」のままにしてください。\n\n## ロックの条件\n\n5回続けて間違えると、30分ロックします。\n\n~~~text\n例：A1b2C3d4e5（10文字・英大文字・英小文字・数字）\n~~~\n\n## ルールを変えたとき\n\nルールを厳しくしても、今のパスワードはそのまま使えます。新しいルールは、次にパスワードを変えるときから使われます。\n\nすぐに全員に新しいルールのパスワードにしてほしい場合は、「組織の設定」→「セキュリティ」で「全員にパスワードの変更を求める」を押します。次にログインしたときに、変更を求めます。\n"},
        {"id":"admin-audit","parentId":"admin","title":"操作の記録","order":4,"description":"誰がいつ何を変更したかを確かめる","md":"# 操作の記録\n\n誰がいつ何を変更したかを確かめられます。操作の記録を見られるのは、オーナーと管理の役割の人です。\n\n## 記録を見る\n\n「組織の設定」→「操作の記録」で、直近90日の操作を新しい順に表示します。\n\n## 記録される操作\n\n- ログイン・ログアウト\n- 店舗とスタッフの追加・変更・削除\n- 権限とプランの変更\n\nほかに、次の操作も記録されます。\n\n| 操作 | 記録の例 |\n| --- | --- |\n| データの書き出し | 予約を書き出した（2,340件） |\n| セキュリティの設定 | 2段階認証を必須にした |\n| ログインの失敗 | パスワードの誤りでロックした |\n| オーナーの移動 | オーナーを移した |\n\n予約の受け付けや変更は、操作の記録ではなく、各予約の「履歴」に残ります。\n\n## 記録の項目\n\n| 項目 | 内容 |\n| --- | --- |\n| 日時 | 操作した日時（秒まで） |\n| 操作した人 | スタッフの名前とメールアドレス |\n| 操作 | 操作の種類 |\n| 対象 | 操作した店舗・スタッフなど |\n| 場所 | 操作した IP アドレス |\n\n記録の行を押すと、変更の前と後の値が出ます。\n\n## 絞り込む\n\nスタッフ・操作の種類・期間で絞り込めます。結果は [データの書き出し](?page=guide-export) と同じ手順で CSV にできます。\n\n## 保存する期間\n\n操作の記録は90日間保存し、それより古いものは毎月1日に削除します。長く残しておきたい場合は、月に一度、書き出しておいてください。\n"},
        {"id":"reference","parentId":null,"title":"設定項目の一覧","description":"画面ごとの設定項目と、選べる値・初期値の一覧","md":"# 設定項目の一覧\n\nサンプル店舗管理で変えられる設定を、画面ごとにまとめた一覧です。手順は操作ガイドの各ページで説明しています。ここでは、項目の意味と選べる値、初期値を確かめるときに使ってください。\n\n設定を変えられる人は、役割によって異なります。役割ごとにできる操作は [権限の設定](?page=admin-roles) を見てください。\n\n## 店舗の設定\n\nメニューの「店舗」で店舗を選び、「設定」タブを開くと変えられます。店舗ごとに別々の値を持ちます。\n\n### 基本情報\n\n| 項目 | 内容 | 入力の決まり |\n| --- | --- | --- |\n| 店舗名 | 画面や帳票、予約の画面に出る名前 | 40文字まで |\n| 店舗コード | 書き出しや外部との連携で店舗を見分ける番号 | 半角英数字8文字まで。登録した後は変えられない |\n| 住所 | 予約の画面の地図と案内に出る | 郵便番号を入れると自動で入る |\n| 電話番号 | 予約の画面に出る | ハイフンあり・なしのどちらでも可 |\n| メールアドレス | 予約の控えを送るときの送り主 | 1件だけ |\n| 店舗の紹介 | 予約の画面で店舗名の下に出る文章 | 400文字まで |\n\n店舗名を変えても、それまでに書き出した CSV や帳票の店舗名は変わりません。過去の帳票と見比べるときは、店舗コードを使ってください。\n\n### 営業時間\n\n曜日ごとに、開店と閉店の時刻を15分単位で入れます。昼の休憩がある場合は「休憩を入れる」を押し、休憩の始まりと終わりを入れます。休憩の間は予約を受け付けません。\n\n- 閉店の時刻は、開店の時刻より後にします。日付をまたぐ営業は、閉店を「24:00」以降（最大「29:00」）で入れます\n- 定休日は「休み」にチェックを入れます\n- 祝日だけ別の時間にする場合は、「祝日」の行に入れます。空のままなら、その曜日の時間を使います\n\n### 臨時休業日\n\n年末年始や改装などで休む日を、日付を指定して登録します。期間で登録することもできます。登録した日は予約の画面で選べなくなり、すでに入っている予約は「臨時休業日の予約」として一覧の上に出ます。お客様への連絡は自動では行わないので、一覧から一人ずつ連絡してください。\n\n臨時休業日は、1年先まで登録できます。過ぎた日は、自動で一覧から消えます。\n\n### 予約の受付\n\n| 項目 | 選べる値 | 初期値 |\n| --- | --- | --- |\n| 受付の開始 | 1〜180日前から | 60日前から |\n| 受付の締め切り | 当日〜7日前まで（時刻も指定） | 前日の18:00まで |\n| 1枠の長さ | 15分・30分・60分 | 30分 |\n| 1枠で受ける数 | 1〜20件 | 1件 |\n| キャンセルの期限 | 予約の0〜72時間前まで | 24時間前まで |\n\n1枠で受ける数を2件以上にすると、同じ時間に複数のお客様の予約が入ります。スタッフの人数に合わせて決めてください。\n\nキャンセルの期限を過ぎると、お客様は予約の画面からキャンセルできなくなり、電話で連絡するよう案内が出ます。\n\n## スタッフの設定\n\nメニューの「スタッフ」でスタッフを選ぶと、詳細画面で変えられます。自分の情報の一部は、本人がアカウントメニューから変えることもできます。\n\n### 基本情報\n\n| 項目 | 内容 | 本人が変えられるか |\n| --- | --- | --- |\n| 名前 | 画面や予約の担当者の欄に出る名前 | 変えられる |\n| メールアドレス | ログインと通知に使う | 変えられる（確認のメールが届く） |\n| 役割 | 閲覧のみ・編集・管理・オーナー | 変えられない |\n| 担当店舗 | 予約や通知の対象になる店舗 | 変えられない |\n\n### 招待\n\n招待メールの有効期限は7日間です。期限が切れた招待は、一覧に「期限切れ」と出ます。もう一度招待すると、新しいリンクのメールが届きます。\n\n招待したままのスタッフは、スタッフの数に数えません。プランのスタッフの数の上限に近いときは、使わない招待を取り消してください。\n\n### 勤務の予定\n\nスタッフごとに、勤務する曜日と時間を入れられます。入れておくと、予約の画面でお客様が担当者を選べるようになります。\n\n- 勤務の予定は、店舗の営業時間の中だけで入れられます\n- 複数の店舗を担当している場合は、店舗ごとに入れます\n- 休みの日は、臨時休業日と同じように日付で登録します\n\n### 利用の停止\n\n退職などで使わなくなったスタッフは、削除せずに「利用を停止」にできます。停止したスタッフはログインできなくなりますが、担当した予約や操作の記録には名前が残ります。停止したスタッフは、スタッフの数に数えません。\n\n## 通知の設定\n\n右上のアカウントメニューの「通知の設定」で、自分が受け取る通知を選びます。通知の設定はスタッフごとに別々で、ほかの人の設定は変えられません。\n\n### 受け取る通知\n\n| 通知 | メール | アプリ | 初期値 |\n| --- | --- | --- | --- |\n| 新しい予約 | ○ | ○ | 受け取る |\n| 予約のキャンセル | ○ | ○ | 受け取る |\n| 臨時休業日の予約 | ○ | ○ | 受け取る |\n| 月次レポート | ○ | － | 受け取る |\n| 招待の受け入れ | ○ | － | 受け取らない |\n\n通知の対象は、担当している店舗の予約だけです。オーナーと管理の役割の人は、「すべての店舗」を選べます。\n\n### 受け取らない時間帯\n\n夜間に通知を受け取りたくない場合は、「受け取らない時間帯」を入れます。その間の通知は、時間帯が終わったときにまとめて届きます。メールとアプリで別々に決められます。\n\n### まとめて受け取る\n\n予約が多い店舗では、通知を1件ずつではなく、1時間ごとにまとめて受け取れます。まとめた通知には、その1時間の予約とキャンセルの一覧が入ります。\n\n## 請求の設定\n\n「組織の設定」→「請求」で変えられます。変えられるのはオーナーだけです。\n\n### プラン\n\n| プラン | 店舗の数 | 支払いの単位 |\n| --- | --- | --- |\n| スタンダード | 10店舗まで | 月額・年額 |\n| ビジネス | 上限なし | 月額・年額 |\n\n上位のプランへの変更はすぐに、下位のプランへの変更は次の請求日から反映されます。下位のプランに変えるときに店舗の数が上限を超えている場合は、先に店舗を「非表示」にしてください。\n\n### 請求書の宛名\n\n請求書に出す会社名・部署名・担当者名を入れます。変えた宛名は、次の請求書から使われます。すでに発行した請求書の宛名は変わりません。\n\n### 支払い方法\n\n- クレジットカード：月額・年額のどちらでも使えます\n- 請求書払い：年額プランだけで使えます。請求書の発行から30日以内に振り込んでください\n\n## セキュリティの設定\n\n「組織の設定」→「セキュリティ」で変えられます。変えられるのは、オーナーと管理の役割の人です。\n\n### 2段階認証\n\n| 項目 | 選べる値 | 初期値 |\n| --- | --- | --- |\n| 2段階認証を必須にする | する・しない | しない |\n| 確認コードの受け取り方 | 認証アプリ・SMS | 本人が選ぶ |\n\n必須にすると、次にログインしたときから全員に確認コードの入力を求めます。手順は [2段階認証](?page=admin-2fa) を見てください。\n\n### パスワード\n\n| 項目 | 選べる値 | 初期値 |\n| --- | --- | --- |\n| 最低の文字数 | 8〜32文字 | 10文字 |\n| 記号を必須にする | する・しない | しない |\n| 変更を求める間隔 | なし・90日・180日 | なし |\n\nルールを厳しくしても、今のパスワードはそのまま使えます。新しいルールは、次にパスワードを変えるときから使われます。\n\n### ログインの制限\n\n5回続けてパスワードを間違えると、そのアカウントを30分ロックします。ロックは、管理者がスタッフの詳細画面から解除することもできます。\n\nログインできる場所を会社のネットワークだけにしたい場合は、「ログインを許可する IP アドレス」に入れます。入れていないときは、どこからでもログインできます。\n\n## データの設定\n\n「組織の設定」→「データ」で変えられます。変えられるのはオーナーだけです。\n\n### 書き出しの形式\n\n| 項目 | 選べる値 | 初期値 |\n| --- | --- | --- |\n| 文字コード | UTF-8・Shift_JIS | UTF-8 |\n| 日付の書き方 | 2026/04/01・2026-04-01 | 2026/04/01 |\n| 見出しの行 | 入れる・入れない | 入れる |\n\n一度に書き出せるのは10万件までです。手順は [データの書き出し](?page=guide-export) を見てください。\n\n### 保存する期間\n\n| データ | 保存する期間 |\n| --- | --- |\n| 予約 | 予約の日から3年 |\n| 操作の記録 | 90日 |\n| 月次レポート | 2年 |\n\n保存する期間を過ぎたデータは、毎月1日に削除します。残しておきたいデータは、その前に書き出してください。\n\n### 退会\n\n退会から30日後に、組織のすべてのデータを削除します。30日以内であれば、オーナーがログインすると元に戻せます。\n\n## 用語\n\n### 枠\n\n予約を受け付ける時間の単位です。長さは「1枠の長さ」で決めます。\n\n### 担当店舗\n\nスタッフが予約や通知の対象にする店舗です。\n\n### 組織\n\nサンプル店舗管理を契約している単位です。店舗とスタッフは、すべて1つの組織に属します。\n","order":4},
        {"id":"faq","parentId":null,"title":"よくある質問","order":5,"description":"よく寄せられる質問と回答","md":"# よくある質問\n\n## ログインとアカウント\n\n### パスワードを忘れました\n\nログイン画面の「パスワードを忘れた方」から再設定できます。手順は [ログイン](?page=guide-login) を見てください。\n\n### 2段階認証のコードが届きません\n\nSMS で受け取る場合は、電話番号が正しいか確かめてください。認証アプリを使うと、電波のない場所でもコードを確かめられます（[2段階認証](?page=admin-2fa)）。\n\n### メールアドレスを変えたい\n\nアカウントメニューの「プロフィール」で変えられます。新しいアドレスに確認のメールが届き、リンクを開くと変更が終わります。\n\n## 店舗\n\n### 店舗の数に上限はありますか\n\nプランによって異なります。スタンダードは10店舗まで、ビジネスは上限なしです。\n\n### 店舗を別の組織に移せますか\n\nできません。移す先の組織で店舗を登録し直し、[データの書き出し](?page=guide-export) で書き出した内容を取り込んでください。\n\n### 店舗コードを間違えて登録しました\n\n店舗コードは、登録した後は変えられません。予約が入る前なら、店舗を削除して登録し直してください。\n\n## 予約\n\n### お客様から電話で予約を受けました\n\n予約の一覧の「追加」から入れられます。詳しくは [予約の管理](?page=guide-booking) を見てください。\n\n### 同じ時間に2件の予約を受けたい\n\n店舗の「予約の受付」で、「1枠で受ける数」を2件以上にします。\n\n### 予約の画面に臨時休業日が出ません\n\n臨時休業日を登録した店舗と、予約の画面の店舗が同じか確かめてください。登録は店舗ごとです。\n\n## スタッフ\n\n### スタッフが招待メールを受け取れません\n\n迷惑メールのフォルダを確かめてください。見つからない場合は、招待を取り消してから、もう一度招待してください。\n\n### 辞めたスタッフはどうすればいいですか\n\n削除せずに「利用を停止」にすると、担当した予約の記録に名前が残ります（[スタッフの追加](?page=guide-staff)）。\n\n## 請求と契約\n\n### 年の途中でプランを変えられますか\n\n変えられます。上位のプランへはすぐに、下位のプランへは次の請求日から変わります（[請求とお支払い](?page=admin-billing)）。\n\n### 退会するとデータはどうなりますか\n\n退会から30日後にすべてのデータを削除します。30日以内であれば、オーナーがログインすると元に戻せます。\n\n## データ\n\n### 書き出した CSV が文字化けします\n\nExcel で開く場合は、「データ」タブの「テキストまたは CSV から」で読み込んでください。いつも Excel で使う場合は、文字コードを Shift_JIS に変えられます。\n\n### 古い予約はいつまで見られますか\n\n予約の日から3年間です。それより古いものは削除されます（[設定項目の一覧](?page=reference)）。\n"},
        {"id":"guide-booking","parentId":"guide","title":"予約の管理","description":"予約の一覧の見方と、受け付け・変更・キャンセル","md":"# 予約の管理\n\nお客様からの予約は、メニューの「予約」でまとめて扱います。予約の画面から入った予約も、電話で受けて入れた予約も、同じ一覧に並びます。\n\n## 予約の一覧\n\n予約の一覧には、担当している店舗の予約が、日付と時刻の順に並びます。\n\n| 列 | 内容 |\n| --- | --- |\n| 日時 | 予約の日付と開始の時刻 |\n| お客様 | お客様の名前。押すと予約の詳細が開く |\n| 店舗 | 予約を受けた店舗 |\n| 担当者 | お客様が選んだスタッフ。選んでいない場合は空 |\n| 状態 | 予約済み・来店・キャンセル・無断キャンセル |\n| 受付の経路 | 予約の画面・電話・その他 |\n\n### 表示を切り替える\n\n一覧の上で、「日」「週」「月」を選べます。「日」では時間ごとの表、「週」と「月」ではカレンダーの形で表示します。\n\n複数の店舗を担当している場合は、「店舗」で表示する店舗を選べます。\n\n### 絞り込む\n\n状態・担当者・受付の経路で絞り込めます。たとえば「状態：キャンセル」で絞り込むと、キャンセルされた予約だけが並びます。\n\n## 予約を受ける\n\nお客様が予約の画面から予約すると、自動で一覧に入ります。新しい予約の通知を受け取る設定にしていれば、メールやアプリで知らせが届きます（[通知の設定](?page=guide-notice)）。\n\n### 電話で受けた予約を入れる\n\n1. 予約の一覧の右上の「追加」を押す\n2. 店舗・日時・お客様の名前と電話番号を入れる\n3. 担当者を選ぶ場合は「担当者」で選ぶ\n4. 「保存」を押す\n\n受付の経路は「電話」になります。お客様のメールアドレスを入れると、予約の控えがお客様に届きます。\n\n### 同じ時間に重なったとき\n\n1つの枠で受けられる数を超える予約は入れられません。どうしても受ける場合は、店舗の「予約の受付」で「1枠で受ける数」を増やすか、別の時間を案内してください。\n\n## 予約を変更する\n\n予約の詳細で「変更」を押し、日時や担当者を選び直して「保存」を押します。お客様のメールアドレスがある場合は、変更の知らせがお客様に届きます。\n\n変更の前と後の内容は、予約の詳細の「履歴」に残ります。\n\n## 予約をキャンセルする\n\n### お客様がキャンセルしたとき\n\nお客様は、キャンセルの期限までなら、予約の画面から自分でキャンセルできます。期限を過ぎた後に電話でキャンセルの連絡を受けた場合は、予約の詳細で「キャンセル」を押してください。\n\n### 店舗の都合でキャンセルするとき\n\n予約の詳細で「キャンセル」を押し、理由で「店舗の都合」を選びます。お客様への連絡は自動では行わないので、電話などで連絡してください。\n\n## 来店しなかったとき\n\n予約の時刻を過ぎてもお客様が来なかった場合は、予約の詳細で「無断キャンセル」を押します。無断キャンセルは、月次レポートで別に数えます。\n\n同じお客様の無断キャンセルが続く場合は、お客様の詳細に「メモ」を残しておくと、次の予約のときにほかのスタッフも気づけます。\n\n## 臨時休業日の予約\n\n臨時休業日を登録した日にすでに予約がある場合は、一覧の上に「臨時休業日の予約」として出ます。一件ずつお客様に連絡し、日時を変更するかキャンセルしてください。すべて片付くと、表示は消えます。\n\n## 予約を印刷する\n\n「日」の表示で右上の「印刷」を押すと、その日の予約の一覧を印刷できます。受付に置いておく場合に使ってください。印刷には、お客様の名前と電話番号が入ります。取り扱いに注意してください。\n\n## よくあるつまずき\n\n| 困っていること | 確かめること |\n| --- | --- |\n| 予約が一覧に出ない | 担当店舗に、その予約の店舗が入っているか |\n| 予約を変更できない | 役割が「閲覧のみ」になっていないか |\n| お客様に変更の知らせが届かない | お客様のメールアドレスが入っているか |\n| 予約の画面で日が選べない | 臨時休業日や受付の締め切りに当たっていないか |\n","order":5},
        {"id":"guide-report","parentId":"guide","title":"レポートの見方","description":"月ごとの集計の項目と、店舗ごとの比べ方","md":"# レポートの見方\n\nメニューの「レポート」では、予約を月ごとに集計した結果を見られます。毎月1日には、前の月の分が月次レポートとしてメールでも届きます。\n\n## 月次レポートとは\n\n月次レポートは、前の月の予約の件数やキャンセルの割合を、店舗ごとにまとめたものです。毎月1日の朝に、月次レポートを受け取る設定にしている人へメールで届きます。\n\nメールには主な数字だけが入っています。詳しい内訳は、メールのリンクからレポートの画面を開いて確かめてください。\n\n## レポートの項目\n\n| 項目 | 意味 |\n| --- | --- |\n| 予約の件数 | その月に予約の日が入っている予約の数（キャンセルを除く） |\n| 新しいお客様 | その月に初めて予約したお客様の数 |\n| キャンセル | キャンセルされた予約の数 |\n| キャンセルの割合 | キャンセルを、キャンセルを含む予約の全体で割った割合 |\n| 無断キャンセル | 来店しなかった予約の数 |\n| 予約の画面からの割合 | 予約の画面から入った予約の割合（電話などを除く） |\n| 埋まった枠の割合 | 受け付けた枠のうち、予約が入った枠の割合 |\n\n### 埋まった枠の割合\n\n営業時間と1枠の長さから、その月に受けられた枠の数を出し、そのうち予約が入った枠の割合を出します。臨時休業日と休憩の時間は、受けられた枠に数えません。\n\n## 店舗ごとに比べる\n\nレポートの画面で「店舗ごと」を選ぶと、店舗を横に並べた表になります。列の見出しを押すと、その項目で並べ替えられます。\n\n担当している店舗だけが並びます。オーナーは、すべての店舗を比べられます。\n\n## 期間を指定して作る\n\n「期間」で始まりと終わりの月を選ぶと、その期間の合計と月ごとの推移を表示します。最大で24か月分です。\n\n## レポートを書き出す\n\nレポートの画面の右上の「書き出し」から、PDF か CSV で書き出せます。PDF は会議の資料に、CSV は表計算ソフトでの集計に向いています。\n\n## 数字が合わないとき\n\n- 予約の一覧と件数が合わない場合は、キャンセルと無断キャンセルを含めているか確かめてください。レポートの「予約の件数」には含めません\n- 月の途中で営業時間を変えた場合、埋まった枠の割合は、日ごとのその時点の営業時間で計算します\n- 予約の日を別の月に変更した予約は、変更した後の月で数えます\n","order":7},
        {"id":"releases","parentId":null,"title":"更新履歴","description":"サンプル店舗管理の主な変更","md":"# 更新履歴\n\nサンプル店舗管理の主な変更を、新しい順に並べています。\n\n## 2026年10月\n\n### 追加\n\n- 予約の一覧に「受付の経路」の列を追加しました\n- 月次レポートに「埋まった枠の割合」を追加しました\n\n### 変更\n\n- 予約の画面で、空いている枠を見つけやすくしました\n\n## 2026年9月\n\n### 追加\n\n- 通知を1時間ごとにまとめて受け取れるようにしました\n- スタッフをまとめて招待できるようにしました（10人以上）\n\n### 直したこと\n\n- 日付をまたぐ営業時間で、閉店後の枠が予約の画面に出ることがあったのを直しました\n\n## 2026年8月\n\n### 追加\n\n- 書き出しの文字コードを Shift_JIS にできるようにしました\n- ダッシュボードのエリアを並べ替えられるようにしました\n\n### 変更\n\n- パスワードの最低の文字数の初期値を、8文字から10文字にしました\n\n## 2026年7月\n\n### 追加\n\n- 2段階認証のバックアップコードを作り直せるようにしました\n- 操作の記録に「場所（IP アドレス）」を追加しました\n\n### 直したこと\n\n- 祝日の営業時間が、振替休日に使われなかったのを直しました\n\n## 2026年6月\n\n### 追加\n\n- 臨時休業日を期間で登録できるようにしました\n- レポートを PDF で書き出せるようにしました\n\n## 2026年5月\n\n### 追加\n\n- スタッフの利用を停止できるようにしました。停止したスタッフはスタッフの数に数えません\n\n### 変更\n\n- 招待メールの有効期限を、3日間から7日間にしました\n\n## 2026年4月\n\n### 追加\n\n- 勤務の予定を入れると、お客様が予約の画面で担当者を選べるようにしました\n- ログインを許可する IP アドレスを決められるようにしました\n\n## 2026年3月\n\n### 追加\n\n- 店舗を非表示にできるようにしました。非表示の店舗はプランの店舗の数に数えません\n- 予約の一覧を印刷できるようにしました\n\n### 直したこと\n\n- 書き出した CSV の日付が、まれに1日ずれていたのを直しました\n\n## 2026年2月\n\n### 追加\n\n- iPhone・Android 向けのアプリを公開しました。予約の確認と通知の受け取りができます\n\n## 2026年1月\n\n### 追加\n\n- サンプル店舗管理の提供を始めました\n","order":6}
      ];

      // ---- デモの切り替え（?demo=・?height=・テーマ） ----
      const params = new URLSearchParams(location.search);
      const demo = params.get('demo') === 'panel' ? 'panel' : 'page';
      const height = params.get('height') === 'fixed' ? 'fixed' : 'auto';
      let theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      const root = document.documentElement;
      root.dataset.demo = demo;
      root.dataset.height = demo === 'page' ? height : 'auto';

      const NOTES = {
        page: {
          auto: '高さを指定せずに置いた例。管理画面の本文エリアと一緒にスクロールし、マニュアルのツールバーはスクロールしても上に残ります。',
          fixed: '高さを画面に合わせた例。ツールバーの下で、ページ一覧・本文・目次がそれぞれの中でスクロールします。',
        },
        panel: '画面の右にヘルプを重ねる例。ヘッダーの「ヘルプ」で開閉し、今の画面（店舗）の説明を最初に開きます。幅が狭いので、ページ一覧はボタンで開く形になります。',
      };
      const showDemoState = () => {
        for (const group of document.querySelectorAll('.demo-group')) {
          if (group.dataset.only && group.dataset.only !== demo) {
            group.hidden = true;
            continue;
          }
          const name = group.dataset.param;
          const current = { demo, height, theme }[name];
          for (const link of group.querySelectorAll('a')) {
            link.setAttribute('aria-current', String(link.dataset.value === current));
            if (name === 'theme') {
              link.href = '#';
              link.onclick = (event) => {
                event.preventDefault();
                theme = link.dataset.value;
                root.dataset.theme = theme;
                showDemoState();
              };
            } else {
              const next = new URLSearchParams({ demo, height, [name]: link.dataset.value });
              if (next.get('demo') === 'panel') next.delete('height');
              link.href = `?${next}`;
            }
          }
        }
        document.querySelector('.demo-note').textContent = demo === 'page' ? NOTES.page[height] : NOTES.panel;
      };
      root.dataset.theme = theme;
      showDemoState();

      // ---- 組み込み先の画面 ----
      const main = document.querySelector('.app-main');
      const crumb = document.querySelector('.app-crumb');
      const viewer = document.createElement('md-pages-viewer');

      if (demo === 'page') {
        // 例1：メニューの「ヘルプ」の画面に、マニュアルをそのまま置く
        document.querySelector('[data-nav="help"]').setAttribute('aria-current', 'page');
        crumb.innerHTML = 'サンプル店舗管理 / <b>ヘルプ</b>';
        main.innerHTML = '<div class="page-head"><h1>ヘルプ</h1><p>操作方法と設定の説明です。</p></div><div class="card"></div>';
        main.querySelector('.card').append(viewer);
        viewer.pages = pages;
      } else {
        // 例2：店舗の画面。ヘルプは右に重ねて出し、URL は書き換えない（url-param="false"）
        document.querySelector('[data-nav="stores"]').setAttribute('aria-current', 'page');
        crumb.innerHTML = 'サンプル店舗管理 / <b>店舗</b>';
        const rows = [
          ['渋谷店', '東京都渋谷区', '10:00〜21:00', true],
          ['新宿店', '東京都新宿区', '10:00〜22:00', true],
          ['横浜店', '神奈川県横浜市', '11:00〜20:00', true],
          ['大宮店', '埼玉県さいたま市', '10:00〜20:00', false],
          ['千葉店', '千葉県千葉市', '10:00〜21:00', true],
        ];
        main.innerHTML =
          '<div class="page-head"><h1>店舗</h1><p>登録している店舗の一覧です。</p></div>' +
          '<table class="stores"><thead><tr><th>店舗名</th><th>住所</th><th>営業時間</th><th>状態</th></tr></thead><tbody>' +
          rows.map(([name, address, hours, open]) => `<tr><td>${name}</td><td>${address}</td><td>${hours}</td><td><span class="badge${open ? '' : ' off'}">${open ? '公開中' : '非公開'}</span></td></tr>`).join('') +
          '</tbody></table>';

        const toggle = document.querySelector('.help-toggle');
        const panel = document.createElement('aside');
        panel.className = 'help-panel';
        panel.id = 'help-panel';
        panel.setAttribute('aria-label', 'ヘルプ');
        panel.inert = true;
        viewer.setAttribute('url-param', 'false');
        viewer.currentId = 'guide-store';
        viewer.pages = pages;
        panel.append(viewer);
        document.body.append(panel);
        // パネルはヘッダーの下に出し、開閉のボタンが隠れないようにする
        const placePanel = () => (panel.style.top = `${document.querySelector('.app-header').getBoundingClientRect().bottom}px`);
        placePanel();
        addEventListener('resize', placePanel);
        const setOpen = (open) => {
          panel.classList.toggle('open', open);
          panel.inert = !open;
          toggle.setAttribute('aria-expanded', String(open));
        };
        toggle.hidden = false;
        toggle.addEventListener('click', () => setOpen(!panel.classList.contains('open')));
        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape' && panel.classList.contains('open') && !event.defaultPrevented) setOpen(false);
        });
      }
    </script>
