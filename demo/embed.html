<!doctype html>
<html lang="ja" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>md-pages-viewer のデモ</title>
    <style>
      /* ---- 組み込み先（架空の管理画面）の色 ---- */
      :root {
        --app-bg: #f5f6f8;
        --app-surface: #ffffff;
        --app-text: #1f2328;
        --app-muted: #667085;
        --app-border: #e4e7ec;
        --app-accent: #4f46e5;
        --app-nav-bg: #111827;
        --app-nav-text: #c7cbd4;
        --app-nav-active: #1f2937;
        color-scheme: light;
      }
      :root[data-theme='dark'] {
        --app-bg: #0b0d12;
        --app-surface: #151821;
        --app-text: #e6e8ee;
        --app-muted: #9aa3b2;
        --app-border: #2a2f3a;
        --app-accent: #8b8cf7;
        --app-nav-bg: #0f1117;
        --app-nav-text: #a9b0bd;
        --app-nav-active: #1c2030;
        color-scheme: dark;
      }

      /* ---- md-pages-viewer を組み込み先の見た目に合わせる（CSS 変数と ::part() だけ） ---- */
      md-pages-viewer {
        --mpv-color-text: var(--app-text);
        --mpv-color-bg: var(--app-surface);
        --mpv-color-border: var(--app-border);
        --mpv-color-accent: var(--app-accent);
        --mpv-sidebar-width: 240px;
      }
      .card md-pages-viewer {
        border: 1px solid var(--app-border);
        border-radius: 12px;
      }
      .card md-pages-viewer::part(toolbar) {
        border-radius: 12px 12px 0 0;
      }

      /* ---- 以下は組み込み先の画面 ---- */
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        font-family: system-ui, -apple-system, 'Segoe UI', 'Hiragino Sans', 'Yu Gothic UI', sans-serif;
        font-size: 15px;
        color: var(--app-text);
        background: var(--app-bg);
      }
      button {
        font: inherit;
      }

      .demo-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 20px;
        padding: 8px 16px;
        font-size: 13px;
        color: #e5e7eb;
        background: #374151;
      }
      .demo-bar strong {
        font-weight: 600;
      }
      .demo-group {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .demo-group span {
        color: #9ca3af;
      }
      .demo-group a {
        padding: 3px 10px;
        border-radius: 999px;
        color: #e5e7eb;
        text-decoration: none;
      }
      .demo-group a:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      .demo-group a[aria-current='true'] {
        color: #111827;
        background: #f9fafb;
      }
      .demo-note {
        flex-basis: 100%;
        color: #cbd5e1;
      }

      .app {
        flex: 1;
        min-height: 0;
        display: flex;
      }
      .app-nav {
        flex: none;
        width: 216px;
        padding: 16px 12px;
        color: var(--app-nav-text);
        background: var(--app-nav-bg);
      }
      .app-logo {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 4px 8px 20px;
        font-weight: 700;
        color: #fff;
      }
      .app-logo i {
        width: 26px;
        height: 26px;
        border-radius: 7px;
        background: var(--app-accent);
      }
      .app-nav ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .app-nav li {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border-radius: 8px;
      }
      .app-nav li[aria-current='page'] {
        color: #fff;
        background: var(--app-nav-active);
      }
      .app-nav svg {
        width: 18px;
        height: 18px;
        flex: none;
      }
      .app-body {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .app-header {
        flex: none;
        display: flex;
        align-items: center;
        gap: 12px;
        height: 56px;
        padding: 0 24px;
        border-bottom: 1px solid var(--app-border);
        background: var(--app-surface);
      }
      .app-crumb {
        color: var(--app-muted);
      }
      .app-crumb b {
        color: var(--app-text);
        font-weight: 600;
      }
      .app-header-end {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .app-user {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 13px;
        font-weight: 600;
        color: #fff;
        background: #64748b;
      }
      .help-toggle {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 34px;
        padding: 0 12px;
        border: 1px solid var(--app-border);
        border-radius: 8px;
        color: var(--app-text);
        background: var(--app-surface);
        cursor: pointer;
      }
      .help-toggle[aria-expanded='true'] {
        color: var(--app-accent);
        border-color: color-mix(in srgb, var(--app-accent) 45%, var(--app-border));
        background: color-mix(in srgb, var(--app-accent) 10%, var(--app-surface));
      }
      /* スクロールする要素の上の padding は 0 にする。padding があると、上に残る
         マニュアルのツールバーがその分だけ下で止まり、上に本文が透けて見える */
      .app-main {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 0 24px 24px;
      }
      .page-head {
        padding-top: 24px;
        margin-bottom: 16px;
      }
      .page-head h1 {
        margin: 0 0 4px;
        font-size: 22px;
      }
      .page-head p {
        margin: 0;
        color: var(--app-muted);
      }

      /* 例1：高さ「画面に合わせる」 */
      [data-height='fixed'] .app-main {
        display: flex;
        flex-direction: column;
      }
      [data-height='fixed'] .card {
        flex: 1;
        min-height: 360px;
        display: flex;
        flex-direction: column;
      }
      [data-height='fixed'] .card md-pages-viewer {
        flex: 1;
        min-height: 0;
      }

      /* 例2：店舗の一覧 */
      .stores {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        border: 1px solid var(--app-border);
        border-radius: 12px;
        background: var(--app-surface);
        overflow: hidden;
      }
      .stores th,
      .stores td {
        padding: 12px 16px;
        text-align: left;
        border-bottom: 1px solid var(--app-border);
      }
      .stores th {
        font-size: 13px;
        font-weight: 600;
        color: var(--app-muted);
      }
      .stores tr:last-child td {
        border-bottom: 0;
      }
      .badge {
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 12px;
        color: #047857;
        background: #d1fae5;
      }
      .badge.off {
        color: #6b7280;
        background: #e5e7eb;
      }
      [data-theme='dark'] .badge {
        color: #6ee7b7;
        background: #064e3b;
      }
      [data-theme='dark'] .badge.off {
        color: #9ca3af;
        background: #374151;
      }

      /* 例2：画面の右に重ねるヘルプパネル。ヘッダーの下に出し、開閉は同じボタンで行う。
         開くときは右端から幅を広げ、閉じるときは右端へ幅を縮める。中のマニュアルは動かさずに
         見える幅だけを変えるので、画面の外から滑り込んでくるようには見えない */
      .help-panel {
        --help-width: min(480px, 100vw);
        position: fixed;
        right: 0;
        bottom: 0;
        width: 0;
        display: flex;
        justify-content: flex-end;
        overflow: hidden;
        border-left: 1px solid var(--app-border);
        background: var(--app-surface);
        box-shadow: -8px 0 24px rgba(0, 0, 0, 0.12);
        visibility: hidden;
        transition:
          width 0.2s ease,
          visibility 0s linear 0.2s;
        z-index: 10;
      }
      .help-panel.open {
        width: var(--help-width);
        visibility: visible;
        transition: width 0.2s ease;
      }
      .help-panel md-pages-viewer {
        flex: none;
        width: calc(var(--help-width) - 1px);
      }
      @media (prefers-reduced-motion: reduce) {
        .help-panel,
        .help-panel.open {
          transition: none;
        }
      }

      @media (max-width: 900px) {
        .app-nav {
          display: none;
        }
        .app-main {
          padding: 0 16px 16px;
        }
        .page-head {
          padding-top: 16px;
        }
      }
    
      /* ---- 画面の切り替え・ダッシュボードの数字など ---- */
      .app-nav li { padding: 0; }
      .app-nav li a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: inherit; text-decoration: none; }
      .app-nav li:not([aria-current='page']) a:hover { background: var(--app-nav-active); }
      .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
      .stat { padding: 16px; border: 1px solid var(--app-border); border-radius: 12px; background: var(--app-surface); }
      .stat span { display: block; font-size: 13px; color: var(--app-muted); }
      .stat b { display: block; margin-top: 4px; font-size: 26px; }
      .stat small { color: var(--app-muted); }
      .section-title { margin: 20px 0 10px; font-size: 15px; }
      md-pages-viewer { --mpv-sidebar-width: 250px; }
      [data-theme='dark'] md-pages-viewer {
        --mpv-color-note: #60a5fa;
        --mpv-color-tip: #4ade80;
        --mpv-color-important: #a78bfa;
        --mpv-color-warning: #fbbf24;
        --mpv-color-caution: #f87171;
      }
    </style>
    <!-- md-pages-viewer を読み込む -->
    <script src="https://cdn.jsdelivr.net/npm/md-pages-viewer@1/dist/md-pages-viewer.js"></script>
  </head>
  <body>
    <div class="demo-bar">
      <strong data-t="barTitle">md-pages-viewer のデモ</strong>
      <div class="demo-group" data-param="height" data-only="help"><span data-t="height">高さ</span><a data-value="auto" data-t="heightAuto">本文に合わせる</a><a data-value="fixed" data-t="heightFixed">画面に合わせる</a></div>
      <div class="demo-group" data-param="theme"><span data-t="theme">テーマ</span><a data-value="light" data-t="light">ライト</a><a data-value="dark" data-t="dark">ダーク</a></div>
      <div class="demo-group" data-param="lang"><span data-t="language">言語</span><a data-value="ja" lang="ja">日本語</a><a data-value="en" lang="en">English</a></div>
      <p class="demo-note"></p>
    </div>
    <div class="app">
      <nav class="app-nav" data-t-label="menuLabel" aria-label="メニュー">
        <div class="app-logo"><i></i><span data-t="appName">サンプル店舗管理</span></div>
        <ul>
          <li data-nav="dashboard"><a data-screen="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11l8-7 8 7v9H4z" /></svg><span data-menu="dashboard">ダッシュボード</span></a></li>
          <li data-nav="stores"><a data-screen="stores"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9h16l-1-5H5zM5 9v11h14V9M10 20v-6h4v6" /></svg><span data-menu="stores">店舗</span></a></li>
          <li data-nav="staff"><a data-screen="staff"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5" /><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14.8c2 .7 3.2 2.4 3.6 5.2" /></svg><span data-menu="staff">スタッフ</span></a></li>
          <li data-nav="reports"><a data-screen="reports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" /></svg><span data-menu="reports">レポート</span></a></li>
          <li data-nav="help"><a data-screen="help"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9" /><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17h.01" /></svg><span data-menu="help">ヘルプ</span></a></li>
        </ul>
      </nav>
      <div class="app-body">
        <header class="app-header">
          <div class="app-crumb"></div>
          <div class="app-header-end">
            <button type="button" class="help-toggle" aria-expanded="false" aria-controls="help-panel" hidden>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17h.01" /></svg>
              <span data-menu="help">ヘルプ</span>
            </button>
            <div class="app-user" data-t="userInitial" data-t-label="userLabel" aria-label="ログイン中のユーザー">山</div>
          </div>
        </header>
        <main class="app-main"></main>
      </div>
    </div>
    <script>
      // ---- マニュアルのページ：md-pages-viewer の使い方＋使用例（店舗管理のマニュアル）。日本語と英語 ----
      const PAGES = { ja: [{"id":"doc-intro","parentId":null,"order":1,"title":"はじめに","md":"# md-pages-viewer\n\n階層のある Markdown 文書をブラウザで表示するライブラリです。`\u003cscript>` を1行読み込むだけで、サーバー側の言語を問わず組み込めます。業務アプリや管理画面の中に、操作マニュアルやヘルプを置く使い方を想定しています。\n\n> [!NOTE]\n> このマニュアル自体も md-pages-viewer で表示しています。左のページ一覧・上の検索欄・右の目次・本文の最後の前後のページは、どれもページのデータから自動で作られたものです。\n\n## できること\n\n- ページのデータから、上のツールバー（今の場所・検索欄）・サイドバー・ページ内目次・前後のページへのリンクを自動で作ります\n- 本文は Markdown 文字列でも、md ファイルの URL（S3、サーバーのストレージ）でも渡せます\n- 表示は Shadow DOM の中に作るので、組み込み先の CSS と互いに影響しません\n- 表示する HTML はすべて DOMPurify でサニタイズします\n\nデータの保存やページ一覧を返す API は、利用側で用意します。[ページのデータ](?page=doc-data)の形で返せば、DB の種類やテーブル構造は問いません。\n\n## どんなときに使うか\n\n- 業務アプリや管理画面に、操作マニュアルやヘルプを組み込みたいとき\n- マニュアルの本文を DB や S3 に置き、アプリを再デプロイせずに書き換えたいとき\n- 開いている画面の説明を、その画面からすぐ開きたいとき（`currentId` で開くページを指定します）\n\nVitePress や Docusaurus のような静的サイトジェネレーターは、Markdown からマニュアル用の別のサイトを作ります。md-pages-viewer は、今あるアプリの画面の中に置き、ページのデータを実行時に受け取って表示します。\n\n## このマニュアルの読み方\n\n| ページ | 内容 |\n| --- | --- |\n| [使い方](?page=doc-usage) | 読み込みから、ページのデータ・オプション・画像とリンクまで |\n| [見た目の変更](?page=doc-look) | CSS 変数・`::part()`・`styles` |\n| [機能](?page=doc-features) | 画面の構成と、サムネイル・日本語の折り返し・注意とヒントの囲み・画面の言語 |\n| [セキュリティ](?page=doc-security) | サニタイズと CSP |\n| [使用例：店舗管理のマニュアル](?page=example) | 架空の店舗管理アプリのマニュアルに使った例 |\n\n## ライセンス\n\nMIT License。Copyright (c) 2026 Kota Kagatsume。同梱している marked と DOMPurify のライセンスは `dist/THIRD_PARTY_LICENSES.txt` にあります。"},{"id":"doc-usage","parentId":null,"order":2,"title":"使い方","description":"読み込みから、ページのデータ・オプション・画像とリンクまで"},{"id":"doc-load","parentId":"doc-usage","order":1,"title":"読み込み","description":"CDN または npm から読み込む","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(220%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(220%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2256%22%20width%3D%22240%22%20height%3D%22106%22%20rx%3D%226%22%20fill%3D%22%23f3f4f6%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2264%22%20width%3D%22120%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(220%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2280%22%20width%3D%22170%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2296%22%20width%3D%22140%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(220%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2280%22%20y%3D%22112%22%20width%3D%22110%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%22128%22%20width%3D%2290%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(220%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22144%22%20width%3D%2260%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3C%2Fsvg%3E","md":"# 読み込み\n\n## CDN から読み込む\n\n~~~html\n\u003cscript src=\"https://cdn.jsdelivr.net/npm/md-pages-viewer@1/dist/md-pages-viewer.js\">\u003c/script>\n~~~\n\n> [!NOTE]\n> CSS はこのファイルに含まれているので、\u003ccode>&lt;link&gt;\u003c/code> は要りません。ファイルの大きさは約149KB（gzip で約47KB）で、Markdown の変換（marked）とサニタイズ（DOMPurify）を含みます。\n\n外部の CDN に接続できない環境では、`md-pages-viewer.js` を自分のサーバーに置いて読み込みます。\n\n## npm からインストールする\n\nビルドするプロジェクトでは npm からインストールします。\n\n~~~bash\nnpm install md-pages-viewer\n~~~\n\n~~~js\nimport { MdPagesViewer } from 'md-pages-viewer';\n~~~\n\n`import` するだけで `\u003cmd-pages-viewer>` タグも使えるようになります。"},{"id":"doc-place","parentId":"doc-usage","order":2,"title":"置き方","description":"タグで置く・new で作る","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(260%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(260%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2256%22%20width%3D%22240%22%20height%3D%22106%22%20rx%3D%226%22%20fill%3D%22%23f3f4f6%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2264%22%20width%3D%22120%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(260%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2280%22%20width%3D%22170%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2296%22%20width%3D%22140%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(260%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2280%22%20y%3D%22112%22%20width%3D%22110%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%22128%22%20width%3D%2290%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(260%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22144%22%20width%3D%2260%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3C%2Fsvg%3E","md":"# 置き方\n\n## タグで置く\n\n~~~html\n\u003cmd-pages-viewer pages=\"/api/manual/pages\" current-id=\"intro\">\u003c/md-pages-viewer>\n~~~\n\n配列・関数・オブジェクト（`texts`）は、JS で要素のプロパティに設定します。\n\n~~~js\nconst viewer = document.querySelector('md-pages-viewer');\nviewer.imageResolver = (path) => `/api/manual/image?path=${encodeURIComponent(path)}`;\n~~~\n\n## new で作る\n\n`new` でも作れます。指定した要素の中身が置き換わります。\n\n~~~js\nconst viewer = new MdPagesViewer('#manual', {\n  pages: '/api/manual/pages',\n  currentId: 'intro',\n});\n\n// 表示後のオプションの変更は element のプロパティで\nviewer.element.currentId = 'faq';\n~~~\n\n## 高さと幅\n\n要素の高さを指定しなければ本文に合わせて伸び、スクロールしてもツールバーは画面の上に、サイドバーと目次はその下に残ります。高さを指定すると、ツールバーの下で、サイドバー・本文・目次がそれぞれの中でスクロールします。\n\n要素の幅が 768px 未満になると、サイドバーはツールバーのボタンで本文の上に開く形になり、目次は本文の上に折りたたまれます。\n\n> [!TIP]\n> 左のメニューの「店舗」などを開き、ヘッダーの「ヘルプ」を押すと、画面の右に幅480pxのヘルプが開きます。768px 未満のときの形は、そこで確かめられます。"},{"id":"doc-data","parentId":"doc-usage","order":3,"title":"ページのデータ","description":"ページの配列の項目と、子ページ一覧","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(160%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(160%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2262%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2094%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2269%22%20width%3D%2240%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2269%22%20width%3D%2270%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2286%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2293%22%20width%3D%2259%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2293%22%20width%3D%2293%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%22110%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22117%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22117%22%20width%3D%2276%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%22134%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22141%22%20width%3D%2267%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22141%22%20width%3D%2299%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E","md":"# ページのデータ\n\nページはフラットな配列で渡し、`parentId` で階層を表します。`pages` に URL を渡す場合は、この配列そのものを JSON で返します。\n\n## 項目\n\n| 項目 | 型 | 必須 | 内容 |\n| --- | --- | --- | --- |\n| `id` | string / number | 必須 | ページの一意な ID |\n| `parentId` | string / number / null | 必須 | 親ページの ID。最上位は null |\n| `title` | string | 必須 | パンくず・サイドバーに表示する名前 |\n| `description` | string | 任意 | 子ページ一覧と検索の結果に出す説明文 |\n| `thumbnail` | string | 任意 | 子ページ一覧をカードの形にしたとき、カードの上に出す画像のパスまたは URL |\n| `md` | string | 任意 | 本文の Markdown |\n| `src` | string | 任意 | md ファイルの URL |\n| `order` | number | 任意 | 同じ階層内の並び順（小さい順）。未指定のページは指定したページの後に配列の順で並ぶ |\n\n~~~json\n[\n  { \"id\": \"intro\", \"parentId\": null, \"title\": \"はじめに\", \"md\": \"# はじめに\", \"order\": 1 },\n  { \"id\": \"login\", \"parentId\": \"intro\", \"title\": \"ログイン方法\", \"src\": \"/storage/manual/login.md\", \"order\": 1 },\n  { \"id\": \"faq\", \"parentId\": null, \"title\": \"FAQ\", \"src\": \"https://xxx.s3.amazonaws.com/manual/faq.md\", \"order\": 2 },\n  { \"id\": \"guide\", \"parentId\": null, \"title\": \"操作ガイド\", \"order\": 3 },\n  { \"id\": \"guide-start\", \"parentId\": \"guide\", \"title\": \"始め方\", \"description\": \"最初に行う設定の流れ\", \"md\": \"# 始め方\", \"order\": 1 }\n]\n~~~\n\n`src` のページは開いたときに初めて取得し、画面を再読み込みするまで保持します。\n\n## 子ページ一覧\n\n`md` も `src` もないページは、本文の代わりに、直下の子ページの一覧を表の形で並べます。カテゴリのように子ページをまとめる親ページに使えます。各行には子ページの名前、`description`（2行まで）、章の数（`md` の h2 の数）または子ページの数が出ます。ツールバーのボタンでカードの形にも切り替えられます。`src` のページは一覧のために本文を取得しません。\n\n> [!TIP]\n> このマニュアルの「使い方」「見た目の変更」「機能」も子ページ一覧のページです。開いて右上の「カード表示」を押すと、サムネイル付きのカードになります。詳しくは \u003ca href=\"?page=doc-thumbnail\">子ページ一覧とサムネイル\u003c/a>。"},{"id":"doc-options","parentId":"doc-usage","order":4,"title":"オプション","description":"pages・currentId・baseUrl など9つ","thumbnai src` のページでは md ファイルの場所を、`md` のページでは `baseUrl` を基準にします。\n\n> [!WARNING]\n> 非公開の S3 では、署名付き URL を基準にすると署名の部分が外れて表示できません。\u003ccode>imageResolver\u003c/code> で利用側の API を経由させてください。\u003ccode>blob:\u003c/code> の URL を返すこともできます。\n\n## リンク\n\n本文のリンクは次のように動きます。\n\n| 書き方 | 動き |\n| --- | --- |\n| `?page=ID`、`?page=ID#見出しID` | このライブラリの中でページを切り替える |\n| `#見出しID` | このページの見出しへスクロールする |\n| md ファイルの相対パス（`login.md` など） | `src` と一致すれば、そのページに切り替える |\n| そのほかの相対パス | `src` または `baseUrl` を基準に解決した URL へ移動する |\n| 組み込み先とオリジンが異なる URL | 新しいタブで開く |"},{"id":"doc-url","parentId":"doc-usage","order":7,"title":"URL への反映","description":"ページを切り替えたときの URL と履歴","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(120%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(120%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2264%22%20width%3D%22200%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(120%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2280%22%20width%3D%22230%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2296%22%20width%3D%22180%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(120%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22112%22%20width%3D%22220%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22128%22%20width%3D%22150%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(120%2070%25%2094%25)%22%2F%3E%3C%2Fsvg%3E","md":"# URL への反映\n\nページを切り替えると、組み込み先の URL のクエリ `page` が切り替え先の ID になり、履歴に追加されます。ブラウザの戻る・進むとリンクの共有がそのまま使えます。ほかのクエリは書かれたまま残ります。\n\n組み込み先が `page` を使っている場合は `urlParam` で名前を変えてください。\n\n> [!TIP]\n> 同じ画面に2つ置く場合や、組み込み先が URL の \u003ccode>#\u003c/code> で画面を切り替えている場合は、\u003ccode>urlParam\u003c/code> を \u003ccode>false\u003c/code> にしてください。このデモでは、左のメニューの「ヘルプ」の画面は URL に反映し（アドレス欄の \u003ccode>page=\u003c/code> が変わります）、ほかの画面の右に開くヘルプは \u003ccode>url-param=\"false\"\u003c/code> で置いています。"},{"id":"doc-look","parentId":null,"order":3,"title":"見た目の変更","description":"CSS 変数・::part()・styles で見た目を変える"},{"id":"doc-vars","parentId":"doc-look","order":1,"title":"CSS 変数","description":"色・フォント・幅などを変える","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(250%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(250%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2256%22%20width%3D%22240%22%20height%3D%22106%22%20rx%3D%226%22%20fill%3D%22%23f3f4f6%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2264%22%20width%3D%22120%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(250%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2280%22%20width%3D%22170%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2296%22%20width%3D%22140%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(250%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2280%22%20y%3D%22112%22%20width%3D%22110%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%22128%22%20width%3D%2290%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(250%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22144%22%20width%3D%2260%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3C%2Fsvg%3E","md":"# CSS 変数\n\n次の CSS 変数で上書きできます。文字色とフォントは、指定しなければ組み込み先の設定を引き継ぎます。\n\n| CSS 変数 | 内容 |\n| --- | --- |\n| `--mpv-font-family` | フォント |\n| `--mpv-font-size` | 本文の文字の大きさ（初期値 16px） |\n| `--mpv-color-text` | 文字色 |\n| `--mpv-color-bg` | 背景色 |\n| `--mpv-color-accent` | リンクと現在のページの強調色 |\n| `--mpv-color-border` | 区切り線の色 |\n| `--mpv-sidebar-width` | サイドバーの幅 |\n| `--mpv-spacing` | 余白の基準の大きさ |\n| `--mpv-color-note` ほか4つ | 注意・ヒントの囲みの色（[注意・ヒントの囲み](?page=doc-callout)を参照） |\n\n> [!IMPORTANT]\n> \u003ccode>--mpv-color-bg\u003c/code> を指定しないと、表示領域は透明で、上に残るツールバーや重ねて出す部品はブラウザの既定の背景色（白など）になります。組み込み先の背景が白以外なら指定してください。\n\n~~~css\nmd-pages-viewer {\n  --mpv-color-accent: #8250df;\n  --mpv-sidebar-width: 300px;\n}\n~~~"},{"id":"doc-parts","parentId":"doc-look","order":2,"title":"部品ごとの見た目（::part()）","description":"組み込み先の CSS から部品を選んで変える","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(340%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(340%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2262%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22hsl(340%2070%25%2094%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2269%22%20width%3D%2240%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22hsl(340%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2269%22%20width%3D%2270%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2286%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2293%22%20width%3D%2259%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2293%22%20width%3D%2293%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%22110%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22117%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22117%22%20width%3D%2276%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%22134%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22141%22%20width%3D%2267%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22141%22%20width%3D%2299%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E","md":"# 部品ごとの見た目（::part()）\n\n部品には次の part 名が付いていて、組み込み先の CSS から `::part()` で見た目を変えられます。本ライブラリの CSS より優先されます。\n\n| part 名 | 部品 |\n| --- | --- |\n| `toolbar` | 上のツールバー |\n| `sidebar-toggle` | ツールバーの左端の、サイドバーを開閉するボタン |\n| `breadcrumb` | パンくず（今の場所） |\n| `breadcrumb-item` | パンくずの各ページ。現在のページには `current` も付きます |\n| `search` | 検索欄と結果を囲む場所 |\n| `search-input` | 検索欄 |\n| `search-results` | 検索の結果の場所 |\n| `search-result` | 検索の各結果のリンク |\n| `search-mark` | 検索の結果の、一致した部分の印 |\n| `search-empty` | 一致がないとき・検索中（「検索しています…」）の表示 |\n| `toc-toggle` | ツールバーの右端の、ページ内目次を開閉するボタン |\n| `view-toggle` | ツールバーの右端の、子ページ一覧の表とカードを切り替えるボタン |\n| `sidebar` | サイドバー |\n| `page-link` | サイドバーの各ページのリンク。現在のページには `current` も付きます |\n| `toggle` | サイドバーの子ページの開閉ボタン |\n| `main` | 中央の列（本文・前後のページ） |\n| `content` | 本文の場所 |\n| `toc` | ページ内目次 |\n| `toc-mobile` | 狭い表示幅で本文の上に出すページ内目次 |\n| `toc-link` | ページ内目次の各見出しのリンク。`toc-h2`・`toc-h3`、読んでいる見出しには `current` も付きます |\n| `child-list-head` | 子ページ一覧の表の見出しの行 |\n| `child-list` | 子ページ一覧 |\n| `child-link` | 子ページ一覧の各ページ（表の行・カード） |\n| `child-thumbnail` | カードの上の子ページの画像（`thumbnail`） |\n| `child-title` | 子ページの名前 |\n| `child-description` | 子ページの説明文 |\n| `child-meta` | 子ページの章の数・子ページの数 |\n| `pager` | 本文の最後の前後のページ |\n| `pager-link` | 前後のページの各リンク。前は `previous`、次は `next` も付きます |\n| `status` | 読み込み中・エラーの表示 |\n| `retry-button` | 再読み込みボタン |\n\n~~~css\nmd-pages-viewer::part(sidebar) {\n  background: #f6f8fa;\n}\n\nmd-pages-viewer::part(page-link current) {\n  font-weight: 700;\n}\n~~~"},{"id":"doc-styles","parentId":"doc-look","order":3,"title":"本文の見た目（styles）","description":"本文の見出しや表の見た目を変える","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(10%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(10%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2256%22%20width%3D%22240%22%20height%3D%22106%22%20rx%3D%226%22%20fill%3D%22%23f3f4f6%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2264%22%20width%3D%22120%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(10%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2280%22%20width%3D%22170%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2296%22%20width%3D%22140%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(10%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2280%22%20y%3D%22112%22%20width%3D%22110%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%22128%22%20width%3D%2290%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(10%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22144%22%20width%3D%2260%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3C%2Fsvg%3E","md":"# 本文の見た目（styles）\n\n`::part()` は部品そのものにだけ効き、本文の見出しや表などは選べません。本文の見た目は、`styles` に CSS を文字列で渡して変えます。渡した CSS は表示領域の中にだけ効き、詳細度によらず本ライブラリの CSS より優先されます。\n\n> [!NOTE]\n> 要素は part 名から指定してください（クラス名は変わることがあります）。\n\n~~~js\nconst viewer = document.querySelector('md-pages-viewer');\nviewer.styles = `\n  [part~=\"content\"] h1 { font-size: 2.2em; }\n  [part~=\"content\"] th { background: #eef2ff; }\n`;\n~~~\n\n`new MdPagesViewer('#manual', { pages, styles })` のように、`new` のオプションでも渡せます。style-src に `'unsafe-inline'` がない CSP のページでも効きます。\n\n> [!CAUTION]\n> \u003ccode>styles\u003c/code> の CSS はサニタイズせずにそのまま使います。利用者が入力した文字列や DB の値など、自分で書いていない CSS は渡さないでください（部品を隠したり、別の部品に見せたり、\u003ccode>url()\u003c/code> で外部の画像を読み込んだりできるため）。"},{"id":"doc-features","parentId":null,"order":4,"title":"機能","description":"画面の構成と、追加した機能"},{"id":"doc-screen","parentId":"doc-features","order":1,"title":"画面の構成","description":"ツールバー・検索・目次・前後のページ・開閉の動き","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(210%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(210%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2264%22%20width%3D%22200%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(210%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2280%22%20width%3D%22230%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2296%22%20width%3D%22180%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(210%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22112%22%20width%3D%22220%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22128%22%20width%3D%22150%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(210%2070%25%2094%25)%22%2F%3E%3C%2Fsvg%3E","md":"# 画面の構成\n\n## ツールバー\n\n上のツールバーに、サイドバーを開閉するボタン（左端）、今の場所（上の階層と今のページの名前）、検索欄、ページ内目次を開閉するボタン（右端）が並びます。子ページ一覧のページでは、右端が表とカードの切り替えボタンになります。\n\n## 検索\n\n検索欄では、ページ名・`description`・見出し・本文を探せます。全角・半角、大文字・小文字は区別せず、空白で区切った語はすべてを含むものが出ます。結果は検索欄の下に出て、押すとそのページの見出しの位置へ移動します。\n\n> [!TIP]\n> \u003ccode>/\u003c/code> キーで検索欄に移り、↑↓ と Enter で結果を選べます。\n\n本文は検索欄に入ったときから少しずつ読むので、ページが多くても画面は止まりません。読み終えるまでは読んだページの分から結果を出し、「検索しています…」と表示します。`src` のページは、検索のために本文を取得せず、ページ名と `description` だけが対象です。\n\n## ページ内目次\n\nページ内目次は、読んでいる見出しをスクロールに合わせて強調し、h3 は読んでいる章の分だけを並べます。目次で選んだ見出しは、本文が短くて上端まで来られないときも強調されます。\n\n## 前後のページ\n\n本文の最後（子ページ一覧のページでは一覧の下）に、サイドバーの順で前と次のページへのリンクが出ます。\n\n## 開閉の動き\n\nサイドバーと目次の開閉、サイドバーの子ページの開閉には短い動きが付きます（広い表示幅では列の幅が変わり、狭い表示幅ではサイドバーが要素の左端から滑り出ます。子ページの並びは高さが伸び縮みします）。\n\n> [!NOTE]\n> OS やブラウザで動きを減らす設定にしている利用者には、動きを付けません。"},{"id":"doc-thumbnail","parentId":"doc-features","order":2,"title":"子ページ一覧とサムネイル","description":"カードの形で、ページごとの画像を出す","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(160%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(160%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2264%22%20width%3D%22200%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2280%22%20width%3D%22230%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2296%22%20width%3D%22180%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22112%22%20width%3D%22220%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22128%22%20width%3D%22150%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2094%25)%22%2F%3E%3C%2Fsvg%3E","md":"# 子ページ一覧とサムネイル\n\nページのデータに `thumbnail` を書くと、子ページ一覧をカードの形にしたとき、そのページのカードの上に画像が出ます。\n\n~~~json\n{ \"id\": \"guide-login\", \"parentId\": \"guide\", \"title\": \"ログイン\", \"md\": \"# ログイン\", \"thumbnail\": \"images/login.png\" }\n~~~\n\n## 見え方\n\n- カードの上端いっぱいに、横長（16:9）で出ます。比率の違う画像は、はみ出た分を切って並びをそろえます\n- 表の形では画像を出さず、読み込みもしません\n- `thumbnail` のないページや、読み込めなかった画像のページは、画像なしのカードになります\n\n> [!TIP]\n> 「\u003ca href=\"?page=example\">使用例：店舗管理のマニュアル\u003c/a>」の「操作ガイド」を開き、右上の「カード表示」を押すと、サムネイル付きのカードを見られます。\n\n## 画像の場所\n\n`thumbnail` は本文の画像と同じ規則で解決します。`imageResolver` を指定していればそれを通します。相対パスの基準は、`src` のページなら md ファイルの場所、それ以外は `baseUrl` です。\n\n> [!NOTE]\n> 画像は、カードが画面に近づいたときに読み込みます。\u003ccode>javascript:\u003c/code> のように、本文でも使えない URL は使いません。"},{"id":"doc-wrap","parentId":"doc-features","order":3,"title":"日本語の折り返し","description":"見出しや表を文節で折り返す・幅の広い表","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(280%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(280%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2262%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22hsl(280%2070%25%2094%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2269%22%20width%3D%2240%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22hsl(280%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2269%22%20width%3D%2270%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2286%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2293%22%20width%3D%2259%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2293%22%20width%3D%2293%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%22110%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22117%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22117%22%20width%3D%2276%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%22134%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22141%22%20width%3D%2267%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22141%22%20width%3D%2299%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E","md":"# 日本語の折り返し\n\n組み込み先のページが日本語（`\u003chtml lang=\"ja\">` など）なら、見出し・表のセル・ページ一覧の項目などを文節の切れ目で折り返し、「必須」「店舗コード」のような短い言葉を途中で折りません。本文の段落は通常の折り返しのままです。\n\n| 項目 | 必須 | 内容 |\n| --- | --- | --- |\n| 店舗名 | 必須 | 画面や帳票に出る名前（40文字まで） |\n| 店舗コード | 必須 | 書き出しや連携で店舗を見分ける番号（半角英数字8文字まで） |\n| メールアドレス | 任意 | 予約の控えを送るときの送り主になります |\n\n> [!TIP]\n> 左のメニューの「店舗」を開き、ヘッダーの「ヘルプ」で開く「店舗の登録」の表で、狭い幅でも「必須」「店舗コード」が途中で折れないことを確かめられます。\n\n> [!NOTE]\n> 文節での折り返しは Chrome と Edge だけです。Safari と Firefox では通常の折り返しになります。\n\n## 幅の広い表\n\n幅に収まらない表は、本文全体ではなく表の中だけが横にスクロールします。\n\n| long_identifier_without_spaces_1 | long_identifier_without_spaces_2 | long_identifier_without_spaces_3 | long_identifier_without_spaces_4 |\n| --- | --- | --- | --- |\n| a | b | c | d |"},{"id":"doc-callout","parentId":"doc-features","order":4,"title":"注意・ヒントの囲み","description":"引用の1行目に種類を書いて、色付きの枠にする","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(40%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(40%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2264%22%20width%3D%22200%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(40%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2280%22%20width%3D%22230%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2296%22%20width%3D%22180%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(40%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22112%22%20width%3D%22220%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22128%22%20width%3D%22150%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(40%2070%25%2094%25)%22%2F%3E%3C%2Fsvg%3E","md":"# 注意・ヒントの囲み\n\nMarkdown の引用（`>`）の1行目に種類を書くと、その引用が色付きの枠になります。書き方は GitHub の Markdown と同じです。\n\n~~~markdown\n> [!WARNING]\n> 1枠の長さを変えても、すでに入っている予約はそのまま残ります。\n~~~\n\n> [!WARNING]\n> 1枠の長さを変えても、すでに入っている予約はそのまま残ります。\n\n## 種類\n\n| 書き方 | 見出し | 使いどころ |\n| --- | --- | --- |\n| `[!NOTE]` | 補足 | 知っておくと役に立つこと |\n| `[!TIP]` | ヒント | もっと楽にできるやり方 |\n| `[!IMPORTANT]` | 重要 | 必ず知っておいてほしいこと |\n| `[!WARNING]` | 注意 | 気をつけないと困ること |\n| `[!CAUTION]` | 警告 | 取り返しのつかないこと |\n\n> [!NOTE]\n> 時刻は15分単位で入れます。\n\n> [!TIP]\n> しばらく使わない店舗は「非表示」にすると、データを残したまま一覧から外せます。\n\n> [!IMPORTANT]\n> 店舗コードは、登録した後は変えられません。\n\n> [!WARNING]\n> 次の場合は、予約を受け付けられません。\n>\n> \u003cul>\u003cli>臨時休業日に当たっている\u003c/li>\u003cli>受付の締め切りを過ぎている\u003c/li>\u003c/ul>\n\n> [!CAUTION]\n> 削除した店舗は元に戻せません。その店舗の予約と目標もすべて削除されます。\n\n## 枠にならない場合\n\n知らない種類を書いた場合（`[!FOO]` など）と、`[!NOTE]` を1行目以外に書いた場合は、ふつうの引用のまま表示します。種類は大文字・小文字のどちらで書いても同じです。\n\n> ふつうの引用は、このように表示されます。\n\n## 色を変える\n\n| CSS 変数 | 種類 | 初期値 |\n| --- | --- | --- |\n| `--mpv-color-note` | 補足 | `#2563eb`（青） |\n| `--mpv-color-tip` | ヒント | `#16a34a`（緑） |\n| `--mpv-color-important` | 重要 | `#7c3aed`（紫） |\n| `--mpv-color-warning` | 注意 | `#b45309`（黄土） |\n| `--mpv-color-caution` | 警告 | `#dc2626`（赤） |\n\n初期値は白い背景で読みやすい色です。組み込み先の画面がダークのときは、明るめの色を指定してください。\n\n~~~css\n[data-theme='dark'] md-pages-viewer {\n  --mpv-color-note: #60a5fa;\n  --mpv-color-tip: #4ade80;\n  --mpv-color-important: #a78bfa;\n  --mpv-color-warning: #fbbf24;\n  --mpv-color-caution: #f87171;\n}\n~~~\n\n> [!NOTE]\n> このマニュアルの「ダーク」も、この指定で切り替えています。"},{"id":"doc-locale","parentId":"doc-features","order":5,"title":"画面の言語と文言","description":"ボタンや検索欄の文言の言語を選び、1つずつ変える","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(100%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(100%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2256%22%20width%3D%22240%22%20height%3D%22106%22%20rx%3D%226%22%20fill%3D%22%23f3f4f6%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2264%22%20width%3D%22120%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(100%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2280%22%20width%3D%22170%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2296%22%20width%3D%22140%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(100%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2280%22%20y%3D%22112%22%20width%3D%22110%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%22128%22%20width%3D%2290%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(100%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22144%22%20width%3D%2260%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3C%2Fsvg%3E","md":"# 画面の言語と文言\n\nボタンや検索欄などの文言の言語は、`locale` で選べます。日本語（`ja`、初期値）・英語（`en`）・中国語の簡体字（`zh-CN`）・繁体字（`zh-TW`）・韓国語（`ko`）が入っています。\n\n~~~html\n\u003cmd-pages-viewer pages=\"/api/manual/pages\" locale=\"en\">\u003c/md-pages-viewer>\n~~~\n\n`en-US` や `zh-Hant` のような書き方でも選べます。入っていない言語を指定すると、日本語で表示してコンソールに警告を出します。\n\n> [!TIP]\n> 上のバーの「English」を押すと、このデモの画面とマニュアルが英語に切り替わります。ボタンや目次などの文言は \u003ccode>locale\u003c/code> で、ページの名前と本文は英語のページのデータに差し替えて変えています。\n\n## 文言を変える\n\n文言は `texts` で1つずつ変えられます。書いたものだけが変わり、ほかは `locale` の言語のままです。数などを出す文言は、それを受け取る関数で書きます。\n\n~~~js\nviewer.texts = {\n  search: '検索する！',\n  chapters: (n) => `全${n}章`,\n};\n~~~\n\n| キー | 使う場所 | 日本語の文言 |\n| --- | --- | --- |\n| `loading`・`failed`・`retry` | 読み込み中・読み込めなかったときの表示と、再読み込みのボタン | 読み込み中…・読み込めませんでした・再読み込み |\n| `notFound`・`noPages` | 存在しないページ・ページが1つもないときの表示 | ページが見つかりません・ページがありません |\n| `pageList` | サイドバーの読み上げ用の名前 | ページ一覧 |\n| `columnPages`・`columnContent` | サイドバーの見出し、子ページ一覧の表の見出しの行 | ページ・内容 |\n| `toc` | ページ内目次の見出し | 目次 |\n| `breadcrumb` | パンくずの読み上げ用の名前 | パンくずリスト |\n| `toggle` | サイドバーの開閉ボタンの読み上げ用の名前（関数。ページ名を受け取る） | （ページ名） 開閉 |\n| `chapters`・`childPages` | 子ページ一覧の章の数・子ページの数（関数。数を受け取る） | N章・Nページ |\n| `search`・`searchLabel` | 検索欄の薄い文字と、読み上げ用の名前 | 検索・ページを検索 |\n| `searching` | 読み終えるまでの検索結果 | 検索しています… |\n| `noResults` | 一致がないときの検索結果（関数。入力した語を受け取る） | 「（語）」に一致するページはありません |\n| `sidebarClose`・`sidebarOpen` | サイドバーを閉じる・開くボタン | ページ一覧を閉じる・ページ一覧を開く |\n| `tocClose`・`tocOpen` | 目次を閉じる・開くボタン | 目次を閉じる・目次を開く |\n| `viewCard`・`viewList` | 子ページ一覧の形を切り替えるボタン | カード表示・一覧表示 |\n| `pager`・`previous`・`next` | 前後のページ（読み上げ用の名前と、前・次の文字） | 前後のページ・前へ・次へ |\n| `calloutNote`・`calloutTip`・`calloutImportant`・`calloutWarning`・`calloutCaution` | 注意・ヒントの囲みの見出し | 補足・ヒント・重要・注意・警告 |\n\n> [!NOTE]\n> 表にないキーや、関数のはずの文言に文字列を書いたものは、コンソールに警告を出して使いません。\n\n## 言語を切り替える\n\n表示した後に `locale` や `texts` を変えると、ページとスクロール位置はそのままで、文言がすぐ変わります。`texts` を変えるときは、新しいオブジェクトを設定してください。\n\n> [!IMPORTANT]\n> ページの名前と本文は訳しません。言語を切り替えるときは、\u003ccode>locale\u003c/code> と一緒に、その言語のページのデータを \u003ccode>pages\u003c/code> に渡してください。言語を切り替えるボタンは、組み込み先の画面に置きます。\n\n~~~js\nconst pages = { ja: pagesJa, en: pagesEn }; // 言語ごとのページのデータ\n\nfunction setLanguage(lang) {\n  document.documentElement.lang = lang;\n  viewer.locale = lang;\n  viewer.pages = pages[lang];\n}\n~~~\n\n同じ ID のページが新しいデータにもあれば、そのページを開いたまま切り替わります。このデモも、この方法で切り替えています。"},{"id":"doc-security","parentId":null,"order":5,"title":"セキュリティ","md":"# セキュリティ\n\n## サニタイズ\n\nMarkdown を変換した HTML は、画面に入れる前に DOMPurify でサニタイズします。スクリプトの実行につながるものに加えて、次のものも除去します。\n\n- `\u003cstyle>`、`\u003cform>`、`\u003cdialog>`、`\u003cslot>`、`popover` などの属性（組み込み先の画面に影響するため）\n- `imageResolver` を通らずに画像を読み込むもの（`poster`・`background` 属性、CSS の `url()` を含む `style` 属性など）\n\n> [!CAUTION]\n> \u003ccode>styles\u003c/code> で渡す CSS はサニタイズしません（\u003ca href=\"?page=doc-styles\">本文の見た目\u003c/a>を参照）。\n\n## Content Security Policy\n\nContent Security Policy を使うページでも動きます。\n\n- `style-src` に `'unsafe-inline'` がなくても CSS は効きます\n- Trusted Types を強制するページでは、`md-pages-viewer` という名前のポリシーを1つ使います。`trusted-types` ディレクティブで許可する名前を限定している場合は、この名前を追加してください\n\n~~~text\nContent-Security-Policy: require-trusted-types-for 'script'; trusted-types md-pages-viewer\n~~~"},{"id":"example","parentId":null,"order":6,"title":"使用例：店舗管理のマニュアル","description":"架空の店舗管理アプリのマニュアルに使った例"},{"id":"welcome","parentId":"example","title":"はじめに","order":1,"description":"サンプル店舗管理でできることと、最初に行う設定","md":"# はじめに\n\nサンプル店舗管理は、複数の店舗の情報・スタッフ・予約をまとめて管理するサービスです。このマニュアルでは、画面の使い方と、管理者が行う設定を説明します。\n\n## できること\n\n- 店舗ごとの営業時間・住所・連絡先の管理\n- スタッフの招待と、担当する店舗の割り当て\n- お客様からの予約の受け付けと、変更・キャンセルの管理\n- 予約の通知と、月次レポートの受け取り\n- 予約や店舗の情報の CSV での書き出し\n\n## 画面の構成\n\nログインすると、左にメニュー、右に選んだ画面が出ます。メニューの項目は、役割によって出るものが異なります。\n\n| メニュー | できること | 説明のページ |\n| --- | --- | --- |\n| ダッシュボード | 今月の件数や予約の推移を見る | [ダッシュボードの見方](?page=guide-dashboard) |\n| 店舗 | 店舗の追加と、営業時間などの設定 | [店舗の登録](?page=guide-store) |\n| スタッフ | スタッフの招待と、担当店舗の割り当て | [スタッフの追加](?page=guide-staff) |\n| 予約 | 予約の一覧と、変更・キャンセル | [予約の管理](?page=guide-booking) |\n| レポート | 月ごとの集計を見る | [レポートの見方](?page=guide-report) |\n| ヘルプ | このマニュアル | － |\n\n画面の右上には、アカウントメニュー（自分の名前の頭文字の丸）があります。通知の設定、パスワードの変更、ログアウトはここから行います。\n\n## 最初に行う設定\n\n使い始めるときは、次の順に設定します。オーナーか管理の役割の人が行ってください。\n\n1. [店舗の登録](?page=guide-store)：店舗を追加し、営業時間と予約の受付を決めます\n2. [スタッフの追加](?page=guide-staff)：スタッフを招待し、担当する店舗を割り当てます\n3. [通知の設定](?page=guide-notice)：受け取る通知を選びます。通知の設定は一人ひとりが行います\n\nセキュリティを高めたい場合は、続けて [2段階認証](?page=admin-2fa) を必須にしてください。\n\n## 対応している環境\n\n| 種類 | 対応しているもの |\n| --- | --- |\n| パソコンのブラウザ | Chrome・Edge・Safari・Firefox の最新版 |\n| スマートフォン | iPhone の Safari、Android の Chrome の最新版 |\n| アプリ | iPhone・Android 向けの「サンプル店舗管理」アプリ（通知の受け取りと予約の確認） |\n\n古いブラウザでは、画面が崩れたり、ボタンが押せなかったりすることがあります。\n\n## 困ったときは\n\nまず [よくある質問](?page=faq) を見てください。設定の値を確かめたいときは [設定項目の一覧](?page=reference) が便利です。\n\n解決しない場合は、画面右上のアカウントメニューから「お問い合わせ」を送れます。受け付けは平日の10時から18時までで、2営業日以内に返事をします。\n","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(232%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5 2%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(200%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2244%22%20width%3D%22150%22%20height%3D%2210%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2264%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2290%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22116%22%20width%3D%22120%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%22226%22%20y%3D%22140%22%20width%3D%2260%22%20height%3D%2218%22%20rx%3D%225%22%20fill%3D%22hsl(200%2070%25%2055%25)%22%2F%3E%3C%2Fsvg%3E"},{"id":"guide-login","parentId":"guide","title":"ログイン","order":1,"description":"メールアドレスとパスワードでログインする方法と、ログインできないときの対処","md":"# ログイン\n\nサンプル店舗管理を使うには、招待メールで設定したメールアドレスとパスワードでログインします。ここでは、ログインの手順と、ログインできないときの対処を説明します。\n\n## ログインする\n\n1. ログイン画面を開く\n2. メールアドレスとパスワードを入力する\n3. 「ログイン」を押す\n\n組織で2段階認証が必須になっている場合は、続けて確認コードを入れる画面が出ます。\n\n### 確認コードを入れる\n\n認証アプリか SMS で受け取った6桁の数字を入れます。認証アプリのコードは30秒ごとに変わるので、表示されているうちに入れてください。\n\n「この端末では30日間確認しない」にチェックを入れると、同じ端末とブラウザからは30日間、確認コードを省略できます。設定の方法は [2段階認証](?page=admin-2fa) を見てください。\n\n## ログインを保持する\n\n> [!WARNING]\n> 「ログインしたままにする」にチェックを入れると、30日間はログインを省略できます。共用のパソコンではチェックを外してください。\n\nログインの保持は、端末とブラウザごとに記録されます。別のパソコンやスマートフォンでは、もう一度ログインが必要です。ログアウトすると、その端末の保持は解除されます。\n\n## ログアウトする\n\n画面右上のアカウントメニューから「ログアウト」を押します。\n\nパソコンをなくした場合など、ほかの端末のログインもまとめて解除したいときは、アカウントメニューの「ログイン中の端末」で「すべての端末からログアウト」を押します。次にどの端末で使うときも、ログインが必要になります。\n\n## パスワードを忘れたとき\n\n1. ログイン画面の「パスワードを忘れた方」を押す\n2. 登録したメールアドレスを入れて「送信」を押す\n3. 届いたメールのリンクを開く（リンクの有効期限は1時間です）\n4. 新しいパスワードを2回入れて「保存」を押す\n\n新しいパスワードには、組織で決めたルールがあります。文字数や使える文字は [パスワードのルール](?page=admin-password) を見てください。\n\n## ログインできないとき\n\n| 表示 | 対処 |\n| --- | --- |\n| パスワードが違います | 大文字・小文字と、全角・半角を確かめる |\n| アカウントがロックされています | 30分待つか、管理者に解除を頼む |\n| メールアドレスが見つかりません | 登録したメールアドレスを管理者に確かめる |\n| 確認コードが違います | スマートフォンの時刻が正しいか確かめる |\n| この場所からはログインできません | 会社のネットワークにつないでからログインする |\n| 招待の有効期限が切れています | 管理者にもう一度招待してもらう |\n\n### アカウントがロックされたとき\n\n5回続けてパスワードを間違えると、そのアカウントを30分ロックします。30分たつと自動で解除されます。急ぐ場合は、管理者がスタッフの詳細画面から解除できます。\n\n### メールが届かないとき\n\nパスワードの再設定や招待のメールが届かない場合は、迷惑メールのフォルダを確かめてください。会社のメールで受け取れない場合は、送り主のアドレスを受け取れるように、メールの管理者に設定を頼んでください。\n","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(232%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2244%22%20width%3D%22150%22%20height%3D%2210%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2264%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2290%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22116%22%20width%3D%22120%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%22226%22%20y%3D%22140%22%20width%3D%2260%22%20height%3D%2218%22%20rx%3D%225%22%20fill%3D%22hsl(232%2070%25%2055%25)%22%2F%3E%3C%2Fsvg%3E"},{"id":"guide-dashboard","parentId":"guide","title":"ダッシュボードの見方","order":2,"description":"ログイン後に最初に出る画面の各エリアの意味","md":"# ダッシュボードの見方\n\nログインすると、最初にダッシュボードが表示されます。担当している店舗の今月の様子が、ひと目で分かるようになっています。\n\n## 画面の構成\n\n| エリア | 場所 | 内容 |\n| --- | --- | --- |\n| 上部の数字 | いちばん上 | 今月の件数・先月との差・目標までの残り |\n| グラフ | 中央 | 直近の予約の件数の推移 |\n| 今日の予約 | 右 | 今日の予約の一覧 |\n| お知らせ | 下 | 運営からのお知らせ |\n\n## 上部の数字\n\n今月の件数・先月との差・目標までの残りを表示します。数字を押すと、内訳の画面に移ります。\n\n| 数字 | 意味 |\n| --- | --- |\n| 今月の件数 | 今月1日から今日までの予約の件数。キャンセルされた予約は数えない |\n| 先月との差 | 先月の同じ日までの件数との差。増えていれば緑、減っていれば赤で出る |\n| 目標までの残り | 今月の目標から、今月の件数を引いた数。目標を決めていないときは出ない |\n\n### 目標を決める\n\n目標は、店舗ごと・月ごとに決めます。「店舗」の画面で店舗を選び、「目標」タブで月ごとの件数を入れてください。目標を決められるのは、オーナーと管理の役割の人です。\n\n## グラフ\n\n直近12か月の推移を表示します。グラフの上にカーソルを置くと、その月の値が出ます。\n\n### 期間を変える\n\nグラフ右上の「期間」から、3か月・6か月・12か月を選べます。\n\n### 店舗を絞り込む\n\n複数の店舗を担当している場合は、グラフ左上の「店舗」で、表示する店舗を選べます。何も選ばないと、担当しているすべての店舗の合計を表示します。\n\n## 今日の予約\n\n今日の予約を、時刻の早い順に表示します。お客様の名前を押すと、その予約の詳細が開きます。\n\n- 来店した予約には「来店」の印が付きます\n- キャンセルされた予約は、灰色の文字で一覧の下に出ます\n- 表示されるのは、担当している店舗の予約だけです\n\n## お知らせ\n\n運営からのお知らせを新しい順に5件表示します。未読のものには印が付きます。\n\nメンテナンスなどの重要なお知らせは、ログインした直後に画面の上にも表示されます。「閉じる」を押すと、次のお知らせまでは表示されません。\n\n## 表示を並べ替える\n\n各エリアの右上の「…」から、エリアの並べ替えと非表示ができます。並べ替えた表示は自分だけに使われ、ほかの人のダッシュボードは変わりません。元に戻すときは、「…」の「初期の表示に戻す」を押します。\n","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(200%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2244%22%20width%3D%2258%22%20height%3D%2234%22%20rx%3D%225%22%20fill%3D%22hsl(200%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22162%22%20y%3D%2244%22%20width%3D%2258%22%20height%3D%2234%22%20rx%3D%225%22%20fill%3D%22hsl(200%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22228%22%20y%3D%2244%22%20width%3D%2258%22%20height%3D%2234%22%20rx%3D%225%22%20fill%3D%22hsl(200%2070%25%2094%25)%22%2F%3E%3Cpolyline%20points%3D%22100%2C150%20130%2C128%20160%2C136%20190%2C108%20220%2C116%20250%2C92%20282%2C98%22%20fill%3D%22none%22%20stroke%3D%22hsl(200%2070%25%2055%25)%22%20stroke-width%3D%224%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E"},{"id":"guide-store","parentId":"guide","title":"店舗の登録","order":3,"description":"店舗を追加し、営業時間や住所を設定する","md":"# 店舗の登録\n\n店舗を追加し、営業時間や予約の受付を設定します。店舗を追加できるのは、オーナーと管理の役割の人です。\n\n## 店舗を追加する\n\n1. メニューの「店舗」を開く\n2. 右上の「追加」を押す\n3. 下の項目を入力して「保存」を押す\n\n| 項目 | 必須 | 内容 |\n| --- | --- | --- |\n| 店舗名 | 必須 | 画面や帳票に出る名前（40文字まで） |\n| 店舗コード | 必須 | 書き出しや連携で店舗を見分ける番号（半角英数字8文字まで） |\n| 住所 | 必須 | 郵便番号を入れると自動で入ります |\n| 電話番号 | 任意 | ハイフンあり・なしのどちらでも可 |\n| メールアドレス | 任意 | 予約の控えを送るときの送り主になります |\n\n### 店舗コードについて\n\n> [!IMPORTANT]\n> 店舗コードは、登録した後は変えられません。書き出した CSV やレポートでは、店舗名ではなく店舗コードで店舗を見分けます。店舗名を変えても過去のデータとつながるように、店舗ごとに決まった番号を付けてください。\n\n## 営業時間を設定する\n\n曜日ごとに開店・閉店の時刻を入れます。定休日は「休み」にチェックを入れます。\n\n> [!NOTE]\n> 時刻は15分単位で入れます。昼の休憩がある場合は「休憩を入れる」を押し、休憩の始まりと終わりを入れます。休憩の間は予約を受け付けません。\n\n### 祝日の営業時間\n\n祝日だけ別の時間にする場合は、「祝日」の行に入れます。空のままなら、その曜日の時間を使います。\n\n### 日付をまたぐ営業\n\n夜遅くまで営業する店舗では、閉店を「24:00」以降で入れます。たとえば翌日の午前2時に閉める場合は「26:00」と入れます。最大は「29:00」です。\n\n## 臨時休業日を登録する\n\n年末年始や改装などで休む日は、「臨時休業日」タブで日付を指定して登録します。期間で登録することもできます。\n\n登録した日は、予約の画面で選べなくなります。すでに入っている予約は、予約の一覧の上に「臨時休業日の予約」として出ます。お客様への連絡は自動では行わないので、一人ずつ連絡してください。\n\n## 予約の受付を設定する\n\n「予約の受付」タブで、何日前から予約を受けるか、何時まで受けるか、1枠の長さなどを決めます。選べる値と初期値は [設定項目の一覧](?page=reference) を見てください。\n\n1枠の長さを変えると、すでに入っている予約はそのまま残り、新しく受ける予約から新しい長さになります。\n\n## 店舗を非表示にする\n\nしばらく使わない店舗は「非表示」にします。非表示の店舗は、予約の画面やダッシュボードに出なくなりますが、データは残ります。もう一度使うときは、店舗の一覧の「非表示の店舗」から「表示する」を押します。\n\n非表示の店舗は、プランの店舗の数に数えません。\n\n## 店舗を削除する\n\n> [!CAUTION]\n> 削除した店舗は元に戻せません。しばらく使わないだけなら「非表示」にしてください。\n\n店舗を削除すると、その店舗の予約と目標もすべて削除されます。残しておきたい場合は、先に [データの書き出し](?page=guide-export) で書き出してください。\n\n> 店舗を追加したら、次は [スタッフの追加](?page=guide-staff) を行います。\n","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2246%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2094%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%2251%22%20width%3D%2250%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2268%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%2273%22%20width%3D%2273%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2290%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%2295%22%20width%3D%2256%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22112%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%22117%22%20width%3D%2279%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22134%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%22139%22%20width%3D%2262%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3C%2Fsvg%3E"},{"id":"guide-staff","parentId":"guide","title":"スタッフの追加","order":4,"description":"スタッフを招待し、担当する店舗を割り当てる","md":"# スタッフの追加\n\nスタッフを招待し、担当する店舗と役割を決めます。スタッフを招待できるのは、オーナーと管理の役割の人です。\n\n## 招待する\n\nメニューの「スタッフ」で「招待」を押し、メールアドレスを入力します。招待メールのリンクから、スタッフ自身がパスワードを設定します。\n\n招待メールの有効期限は7日間です。期限が切れたら、もう一度招待してください。\n\n### まとめて招待する\n\n10人以上を招待する場合は、「招待」の横の「まとめて招待」から、メールアドレスを1行に1件ずつ貼り付けます。役割と担当店舗は、全員に同じものが付きます。後から一人ずつ変えられます。\n\n## 招待の状態\n\nスタッフの一覧では、招待の状態が次のように出ます。\n\n| 状態 | 意味 | できること |\n| --- | --- | --- |\n| 招待中 | メールを送り、まだ参加していない | 招待の取り消し・メールの再送 |\n| 期限切れ | 7日間のうちに参加しなかった | もう一度招待 |\n| 参加済み | パスワードを設定してログインできる | 役割と担当店舗の変更 |\n| 利用停止 | 管理者が利用を止めた | 利用の再開 |\n\n> [!TIP]\n> 招待中と期限切れのスタッフは、プランのスタッフの数に数えません。\n\n## 担当店舗を割り当てる\n\nスタッフの詳細画面で「担当店舗」を選びます。複数の店舗を選べます。\n\n担当店舗は、そのスタッフが見られる予約と、受け取る通知の範囲になります。担当していない店舗の予約は、一覧にもダッシュボードにも出ません。\n\n## 権限\n\n- 閲覧のみ：データを見るだけ\n- 編集：店舗の情報を変更できる\n- 管理：スタッフの追加・削除もできる\n\n権限の細かい設定は [権限の設定](?page=admin-roles) を見てください。\n\n## 勤務の予定を入れる\n\nスタッフの詳細画面の「勤務の予定」で、勤務する曜日と時間を入れます。入れておくと、予約の画面でお客様が担当者を選べるようになります。\n\n- 勤務の予定は、店舗の営業時間の中だけで入れられます\n- 複数の店舗を担当している場合は、店舗ごとに入れます\n- 休みの日は、日付を指定して登録します\n\n## 利用を停止する\n\n退職などで使わなくなったスタッフは、削除せずに「利用を停止」にします。停止したスタッフはログインできなくなりますが、担当した予約や操作の記録には名前が残ります。\n\n停止したスタッフは、スタッフの数に数えません。もう一度使うときは、「利用を再開」を押します。\n\n## スタッフを削除する\n\n削除したスタッフは元に戻せません。担当した予約の担当者の欄は「削除されたスタッフ」になります。記録を残したい場合は、削除ではなく利用の停止を使ってください。\n","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(280%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%2256%22%20r%3D%229%22%20fill%3D%22hsl(280%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2250%22%20width%3D%22110%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2261%22%20width%3D%2270%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%2284%22%20r%3D%229%22%20fill%3D%22hsl(280%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2278%22%20width%3D%22141%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2289%22%20width%3D%2287%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%22112%22%20r%3D%229%22%20fill%3D%22hsl(280%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22106%22%20width%3D%22122%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22117%22%20width%3D%22104%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%22140%22%20r%3D%229%22%20fill%3D%22hsl(280%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22134%22%20width%3D%22153%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22145%22%20width%3D%2281%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E"},{"id":"guide-notice","parentId":"guide","title":"通知の設定","order":6,"description":"メールやアプリで受け取る通知を選ぶ","md":"# 通知の設定\n\n予約が入ったときやキャンセルされたときに、メールやアプリで知らせを受け取れます。通知の設定はスタッフごとに別々で、一人ひとりが自分で選びます。\n\n## 受け取る通知を選ぶ\n\n右上のアカウントメニューから「通知の設定」を開き、受け取りたい通知にチェックを入れます。\n\n| 通知 | メール | アプリ |\n| --- | --- | --- |\n| 新しい予約 | ○ | ○ |\n| 予約のキャンセル | ○ | ○ |\n| 臨時休業日の予約 | ○ | ○ |\n| 月次レポート | ○ | － |\n| 招待の受け入れ | ○ | － |\n\n月次レポートは、毎月1日に前の月の分が届きます。内容は [レポートの見方](?page=guide-report) を見てください。\n\n## 通知の対象の店舗\n\n通知の対象は、担当している店舗の予約だけです。オーナーと管理の役割の人は、「すべての店舗」を選べます。\n\n担当店舗が多い場合は、「店舗を選ぶ」で、通知を受け取る店舗を絞り込めます。\n\n## 受け取らない時間帯\n\n夜間に通知を受け取りたくない場合は、「受け取らない時間帯」を入れます。その間の通知は、時間帯が終わったときにまとめて届きます。メールとアプリで別々に決められます。\n\n## まとめて受け取る\n\n予約が多い店舗では、通知を1件ずつではなく、1時間ごとにまとめて受け取れます。まとめた通知には、その1時間の予約とキャンセルの一覧が入ります。\n\n## アプリの通知を有効にする\n\n1. スマートフォンに「サンプル店舗管理」アプリを入れる\n2. アプリでログインする\n3. 通知の許可を求められたら「許可」を押す\n4. アプリの「設定」→「通知」で、受け取る通知を選ぶ\n\n許可を求められなかった場合や、「許可しない」を押した場合は、スマートフォンの設定アプリで、サンプル店舗管理の通知をオンにしてください。\n\n## 通知が届かないとき\n\n迷惑メールのフォルダを確かめてください。アプリの通知は、スマホの設定で許可されている必要があります。\n\n- 受け取らない時間帯に入っていないか確かめる\n- 通知の対象の店舗に、その予約の店舗が入っているか確かめる\n- メールアドレスが正しいか、アカウントメニューの「プロフィール」で確かめる\n- アプリからログアウトしていないか確かめる（ログアウトするとアプリの通知は届きません）\n","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(40%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2244%22%20width%3D%22190%22%20height%3D%2234%22%20rx%3D%226%22%20fill%3D%22hsl(40%2070%25%2094%25)%22%2F%3E%3Ccircle%20cx%3D%22114%22%20cy%3D%2261%22%20r%3D%228%22%20fill%3D%22hsl(40%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%22130%22%20y%3D%2256%22%20width%3D%22120%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2286%22%20width%3D%22190%22%20height%3D%2234%22%20rx%3D%226%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22114%22%20cy%3D%22103%22%20r%3D%228%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22130%22%20y%3D%2298%22%20width%3D%22100%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22128%22%20width%3D%22190%22%20height%3D%2230%22%20rx%3D%226%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E"},{"id":"guide-export","parentId":"guide","title":"データの書き出し","order":8,"description":"CSV でデータを書き出して、表計算ソフトで使う","md":"# データの書き出し\n\n予約や店舗の情報を CSV で書き出して、表計算ソフトで使えます。書き出せるデータは、役割と担当店舗によって異なります。\n\n## CSV で書き出す\n\n一覧の画面で右上の「書き出し」を押すと、表示中の条件で CSV をダウンロードします。\n\n1. 書き出したい一覧の画面を開く\n2. 期間や店舗で絞り込む\n3. 右上の「書き出し」を押す\n\n絞り込んだ条件は、そのまま書き出しの条件になります。たとえば、先月の予約だけを書き出す場合は、予約の一覧で期間を先月にしてから書き出します。\n\n## 書き出せるデータ\n\n| データ | 書き出す画面 | 書き出せる役割 |\n| --- | --- | --- |\n| 予約 | 予約の一覧 | すべての役割（担当店舗の分だけ） |\n| 店舗 | 店舗の一覧 | 編集・管理・オーナー |\n| スタッフ | スタッフの一覧 | 管理・オーナー |\n| 操作の記録 | 操作の記録 | 管理・オーナー |\n\n## 文字化けするとき\n\nCSV は UTF-8 で書き出します。Excel で文字化けする場合は、「データ」タブの「テキストまたは CSV から」で読み込んでください。\n\nいつも Excel で開く場合は、オーナーが「組織の設定」→「データ」で、文字コードを Shift_JIS に変えられます。変えると、組織の全員の書き出しが Shift_JIS になります。\n\n## 書き出せる件数\n\n一度に書き出せるのは10万件までです。それより多い場合は、期間を分けて書き出してください。\n\n## 書き出しの記録\n\n書き出しを行うと、操作の記録に「書き出し」として残ります。誰がいつ何を書き出したかは、[操作の記録](?page=admin-audit) で確かめられます。\n","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%221 22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%2295%22%20width%3D%2256%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22112%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%22117%22%20width%3D%2279%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22134%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%22139%22%20width%3D%2262%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3C%2Fsvg%3E"},{"id":"admin-roles","parentId":"admin","title":"権限の設定","order":1,"description":"役割ごとにできる操作を決める","md":"# 権限の設定\n\nスタッフには、役割を1つずつ付けます。役割によって、見られるデータとできる操作が決まります。\n\n## 役割の一覧\n\n| 役割 | 店舗の閲覧 | 店舗の編集 | スタッフの管理 | 請求 |\n| --- | --- | --- | --- | --- |\n| 閲覧のみ | ○ | － | － | － |\n| 編集 | ○ | ○ | － | － |\n| 管理 | ○ | ○ | ○ | － |\n| オーナー | ○ | ○ | ○ | ○ |\n\n## 役割ごとの説明\n\n### 閲覧のみ\n\n担当店舗の予約と店舗の情報を見られます。予約の変更やキャンセルはできません。アルバイトのスタッフや、数字を確かめるだけの人に向いています。\n\n### 編集\n\n担当店舗の予約の変更・キャンセルと、店舗の情報の変更ができます。店舗で日々の受付をする人に向いています。\n\n### 管理\n\n編集でできることに加えて、スタッフの招待・役割の変更・利用の停止と、セキュリティの設定ができます。店長や、複数の店舗をまとめる人に向いています。\n\n### オーナー\n\nすべての操作ができます。請求とプランの変更、データの設定、退会ができるのはオーナーだけです。\n\n## 役割を変える\n\nスタッフの詳細画面で「役割」を選び直します。変更はすぐに反映されます。\n\n役割を下げると、そのスタッフが開いている画面のうち、できなくなった操作のボタンは押せなくなります。自分自身の役割は変えられません。\n\n## オーナーを移す\n\nオーナーは組織に1人だけです。別の人に移すと、元のオーナーは「管理」になります。\n\n1. 「組織の設定」→「オーナー」を開く\n2. 新しいオーナーにするスタッフを選ぶ\n3. 確認のため、自分のパスワードを入れて「移す」を押す\n\n新しいオーナーにはメールで知らせが届きます。移した後に元に戻すには、新しいオーナーに移し直してもらう必要があります。\n\n## 担当店舗との関係\n\n役割は、担当店舗の中で使われます。たとえば「編集」の人は、担当している店舗の情報だけを変えられます。オーナーは、担当店舗にかかわらず、すべての店舗を扱えます。\n\n## 変更の記録\n\n役割の変更とオーナーの移動は、[操作の記録](?page=admin-audit) に残ります。\n","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000 3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22112%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%22117%22%20width%3D%2279%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22134%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%22139%22%20width%3D%2262%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3C%2Fsvg%3E"},{"id":"admin-billing","parentId":"admin","title":"請求とお支払い","order":2,"description":"プランの変更、請求書のダウンロード、支払い方法の変更","md":"# 請求とお支払い\n\nプランの変更、請求書のダウンロード、支払い方法の変更を行います。請求に関わる操作ができるのは、オーナーだけです。\n\n## プランを変える\n\n「組織の設定」→「プラン」で選びます。上位のプランへの変更はすぐに、下位のプランへの変更は次の請求日から反映されます。\n\n| プラン | 店舗の数 | 向いている使い方 |\n| --- | --- | --- |\n| スタンダード | 10店舗まで | 1〜数店舗を運営している |\n| ビジネス | 上限なし | 多くの店舗をまとめて管理したい |\n\n下位のプランに変えるときに店舗の数が上限を超えている場合は、先に店舗を「非表示」にしてください。\n\n## 請求日\n\n月額プランは、契約した日を毎月の請求日とします。年額プランは、契約した日を毎年の請求日とします。請求日が月末で、その月にその日がない場合は、月の最後の日を請求日とします。\n\n## 請求書をダウンロードする\n\n「請求履歴」から、月ごとの請求書を PDF でダウンロードできます。\n\n請求書は、請求日の翌日に発行します。発行するとオーナーにメールで知らせが届きます。\n\n### 請求書の宛名\n\n請求書に出す会社名・部署名・担当者名は、「組織の設定」→「請求」で変えられます。変えた宛名は、次の請求書から使われます。\n\n## 支払い方法を変える\n\nクレジットカードと請求書払いから選べます。請求書払いは年額プランだけで使えます。\n\n- クレジットカード：請求日に自動で支払います\n- 請求書払い：請求書の発行から30日以内に振り込んでください\n\n## 支払いに失敗したとき\n\nクレジットカードの期限切れなどで支払いに失敗すると、オーナーにメールが届き、画面の上にお知らせが出ます。14日以内に支払い方法を更新してください。更新すると、すぐにもう一度支払いを行います。\n\n14日を過ぎると、組織の全員が閲覧しかできなくなります。支払いが済むと、元に戻ります。\n\n## 解約する\n\n「組織の設定」→「プラン」の下にある「解約」から手続きします。解約すると、その請求期間の終わりまで使え、その後に退会と同じ扱いになります。データの扱いは [よくある質問](?page=faq) を見てください。\n","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%
