\n## 連結\n\n內文中的連結會這樣運作。\n\n| 寫法 | 行為 |\n| --- | --- |\n| `?page=ID`、`?page=ID#標題ID` | 在本函式庫中切換頁面 |\n| `#標題ID` | 捲動到本頁的該標題 |\n| md 檔案的相對路徑（例如 `login.md`） | 若與某個頁面的 `src` 相符，就切換到該頁面 |\n| 其他相對路徑 | 前往以 `src` 或 `baseUrl` 為基準解析出的 URL |\n| 與宿主頁面來源不同的 URL | 在新分頁中開啟 |"},{"id":"doc-url","parentId":"doc-usage","order":7,"title":"反映到 URL","description":"切換頁面時的 URL 與瀏覽紀錄","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(120%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(120%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2264%22%20width%3D%22200%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(120%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2280%22%20width%3D%22230%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2296%22%20width%3D%22180%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(120%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22112%22%20width%3D%22220%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22128%22%20width%3D%22150%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(120%2070%25%2094%25)%22%2F%3E%3C%2Fsvg%3E","md":"# 反映到 URL\n\n切換頁面時，宿主頁面 URL 中的查詢參數 `page` 會變成切換後頁面的 ID，並加入瀏覽紀錄。瀏覽器的返回與前進，以及分享連結，都能直接使用。其他查詢參數會維持原樣。\n\n若宿主頁面已經使用 `page`，請用 `urlParam` 變更名稱。\n\n> [!TIP]\n> 在同一個畫面放置 2 個檢視器，或宿主頁面以 URL 的 \u003ccode>#\u003c/code> 切換畫面時，請把 \u003ccode>urlParam\u003c/code> 設為 \u003ccode>false\u003c/code>。在這個示範中，左側選單的「說明」畫面會反映到 URL（網址列中的 \u003ccode>page=\u003c/code> 會改變），其他畫面右側開啟的說明，則是以 \u003ccode>url-param=\"false\"\u003c/code> 放置。"},{"id":"doc-look","parentId":null,"order":3,"title":"變更外觀","description":"用 CSS 變數、::part() 與 styles 變更外觀"},{"id":"doc-vars","parentId":"doc-look","order":1,"title":"CSS 變數","description":"變更顏色、字型、寬度等","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(250%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(250%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2256%22%20width%3D%22240%22%20height%3D%22106%22%20rx%3D%226%22%20fill%3D%22%23f3f4f6%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2264%22%20width%3D%22120%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(250%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2280%22%20width%3D%22170%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2296%22%20width%3D%22140%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(250%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2280%22%20y%3D%22112%22%20width%3D%22110%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%22128%22%20width%3D%2290%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(250%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22144%22%20width%3D%2260%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3C%2Fsvg%3E","md":"# CSS 變數\n\n可以用下列 CSS 變數覆寫。文字顏色與字型若未指定，會沿用宿主頁面的設定。\n\n| CSS 變數 | 內容 |\n| --- | --- |\n| `--mpv-font-family` | 字型 |\n| `--mpv-font-size` | 內文的文字大小（預設值 16px） |\n| `--mpv-color-text` | 文字顏色 |\n| `--mpv-color-bg` | 背景色 |\n| `--mpv-color-accent` | 連結與目前頁面的強調色 |\n| `--mpv-color-border` | 分隔線的顏色 |\n| `--mpv-sidebar-width` | 側邊欄的寬度 |\n| `--mpv-spacing` | 間距的基準大小 |\n| `--mpv-color-note` 及其他 4 個 | 注意與提示框的顏色（請參閱[注意與提示框](?page=doc-callout)） |\n\n> [!IMPORTANT]\n> 若不指定 \u003ccode>--mpv-color-bg\u003c/code>，檢視器會是透明的，留在上方的工具列與疊加顯示的部件，則會使用瀏覽器預設的背景色（例如白色）。宿主頁面的背景不是白色時，請指定此變數。\n\n~~~css\nmd-pages-viewer {\n  --mpv-color-accent: #8250df;\n  --mpv-sidebar-width: 300px;\n}\n~~~"},{"id":"doc-parts","parentId":"doc-look","order":2,"title":"各部件的外觀（::part()）","description":"從宿主頁面的 CSS 選取部件並變更外觀","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(340%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(340%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2262%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22hsl(340%2070%25%2094%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2269%22%20width%3D%2240%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22hsl(340%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2269%22%20width%3D%2270%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2286%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2293%22%20width%3D%2259%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2293%22%20width%3D%2293%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%22110%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22117%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22117%22%20width%3D%2276%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%22134%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22141%22%20width%3D%2267%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22141%22%20width%3D%2299%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E","md":"# 各部件的外觀（::part()）\n\n各部件都有下列 part 名稱，可以從宿主頁面的 CSS 以 `::part()` 變更外觀。其優先順序高於本函式庫的 CSS。\n\n| part 名稱 | 部件 |\n| --- | --- |\n| `toolbar` | 上方的工具列 |\n| `sidebar-toggle` | 工具列左端用來顯示或隱藏側邊欄的按鈕 |\n| `breadcrumb` | 導覽路徑（目前位置） |\n| `breadcrumb-item` | 導覽路徑中的各個頁面。目前頁面還會加上 `current` |\n| `search` | 包住搜尋框與搜尋結果的區域 |\n| `search-input` | 搜尋框 |\n| `search-results` | 搜尋結果的區域 |\n| `search-result` | 每一筆搜尋結果的連結 |\n| `search-mark` | 搜尋結果中相符部分的標示 |\n| `search-empty` | 沒有相符結果時，以及搜尋中（「搜尋中…」）的顯示 |\n| `toc-toggle` | 工具列右端用來顯示或隱藏頁內目錄的按鈕 |\n| `view-toggle` | 工具列右端用來切換子頁面清單表格與卡片的按鈕 |\n| `sidebar` | 側邊欄 |\n| `page-link` | 側邊欄中各頁面的連結。目前頁面還會加上 `current` |\n| `toggle` | 側邊欄中展開或收合子頁面的按鈕 |\n| `main` | 中間的欄（內文、上一頁與下一頁） |\n| `content` | 內文的區域 |\n| `callout` | 內文中的各個注意與提示框。還會加上 `note`、`tip`、`important`、`warning` 或 `caution` |\n| `callout-title` | 注意與提示框的標題 |\n| `target-heading` | 從目錄選取後移到的內文標題。只在文字與底線變成強調色的期間加上 |\n| `toc` | 頁內目錄 |\n| `toc-mobile` | 顯示寬度較窄時，顯示在內文上方的頁內目錄 |\n| `toc-link` | 頁內目錄中各標題的連結。還會加上 `toc-h2` 或 `toc-h3`，正在閱讀的標題還會加上 `current` |\n| `child-list-head` | 子頁面清單表格的標題列 |\n| `child-list` | 子頁面清單 |\n| `child-link` | 子頁面清單中的各頁面（表格的列、卡片） |\n| `child-thumbnail` | 卡片上方的子頁面圖片（`thumbnail`） |\n| `child-title` | 子頁面的名稱 |\n| `child-description` | 子頁面的說明文字 |\n| `child-meta` | 子頁面的章數、子頁面數 |\n| `pager` | 內文最後的上一頁與下一頁 |\n| `pager-link` | 上一頁與下一頁的各個連結。上一頁還會加上 `previous`，下一頁還會加上 `next` |\n| `status` | 載入中與錯誤的顯示 |\n| `retry-button` | 重新載入按鈕 |\n\n~~~css\nmd-pages-viewer::part(sidebar) {\n  background: #f6f8fa;\n}\n\nmd-pages-viewer::part(page-link current) {\n  font-weight: 700;\n}\n~~~"},{"id":"doc-styles","parentId":"doc-look","order":3,"title":"內文的外觀（styles）","description":"變更內文中標題與表格的外觀","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(10%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(10%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2256%22%20width%3D%22240%22%20height%3D%22106%22%20rx%3D%226%22%20fill%3D%22%23f3f4f6%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2264%22%20width%3D%22120%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(10%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2280%22%20width%3D%22170%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2296%22%20width%3D%22140%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(10%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2280%22%20y%3D%22112%22%20width%3D%22110%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%22128%22%20width%3D%2290%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(10%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22144%22%20width%3D%2260%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3C%2Fsvg%3E","md":"# 內文的外觀（styles）\n\n`::part()` 只對部件本身有效，無法選取內文中的標題或表格等。要變更內文的外觀，請以字串將 CSS 傳給 `styles`。傳入的 CSS 只在檢視器內部生效，而且不論權重（specificity）高低，都會優先於本函式庫的 CSS。\n\n> [!NOTE]\n> 請以 part 名稱指定元素（class 名稱可能會變更）。\n\n~~~js\nconst viewer = document.querySelector('md-pages-viewer');\nviewer.styles = `\n  [part~=\"content\"] h1 { font-size: 2.2em; }\n  [part~=\"content\"] th { background: #eef2ff; }\n`;\n~~~\n\n也可以像 `new MdPagesViewer('#manual', { pages, styles })` 這樣，以 `new` 的選項傳入。即使是 style-src 中沒有 `'unsafe-inline'` 的 CSP 頁面也有效。\n\n> [!CAUTION]\n> \u003ccode>styles\u003c/code> 的 CSS 不經清理就直接使用。請不要傳入使用者輸入的字串、資料庫中的值等不是自己撰寫的 CSS（因為這類 CSS 可能隱藏部件、把部件偽裝成其他部件，或以 \u003ccode>url()\u003c/code> 載入外部圖片）。"},{"id":"doc-features","parentId":null,"order":4,"title":"功能","description":"畫面構成，以及新增的功能"},{"id":"doc-screen","parentId":"doc-features","order":1,"title":"畫面構成","description":"工具列、搜尋、目錄、上一頁與下一頁，以及展開與收合的動態效果","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(210%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(210%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2264%22%20width%3D%22200%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(210%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2280%22%20width%3D%22230%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2296%22%20width%3D%22180%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(210%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22112%22%20width%3D%22220%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22128%22%20width%3D%22150%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(210%2070%25%2094%25)%22%2F%3E%3C%2Fsvg%3E","md":"# 畫面構成\n\n## 工具列\n\n上方的工具列依序排列著顯示或隱藏側邊欄的按鈕（左端）、目前位置（上層頁面與目前頁面的名稱）、搜尋框，以及顯示或隱藏頁內目錄的按鈕（右端）。在子頁面清單的頁面中，右端會變成切換表格與卡片的按鈕。\n\n## 搜尋\n\n搜尋框可以搜尋頁面名稱、`description`、標題與內文。不區分全形與半形、大寫與小寫；以空格分隔的多個詞，會找出包含所有詞的頁面。結果會顯示在搜尋框下方，點選後會移到該頁面中該標題的位置。\n\n> [!TIP]\n> 按 \u003ccode>/\u003c/code> 鍵可以移到搜尋框，再用 ↑↓ 與 Enter 選擇結果。\n\n內文會從進入搜尋框時開始逐步讀取，因此即使頁面很多，畫面也不會卡住。在全部讀完之前，會先從已讀取的頁面中顯示結果，並顯示「搜尋中…」。`src` 的頁面不會為了搜尋而取得內文，只會搜尋頁面名稱與 `description`。\n\n## 頁內目錄\n\n頁內目錄會隨著捲動強調正在閱讀的標題，h3 則只列出正在閱讀的章節中的項目。在目錄中選取標題後，會平順地捲動到該標題。移動的過程中，選取的標題會持續保持強調。抵達後，該標題的文字與底線會變成強調色，約 1.5 秒後恢復原狀（若途中自行捲動則不會加上）。在目錄中選取的標題，即使內文太短而無法捲到頂端，也會被強調。\n\n## 上一頁與下一頁\n\n在內文的最後（子頁面清單的頁面則是在清單下方），會依側邊欄的順序顯示前往上一頁與下一頁的連結。\n\n## 展開與收合的動態效果\n\n側邊欄與目錄的顯示和隱藏，以及側邊欄中子頁面的展開和收合，都有短暫的動態效果（顯示寬度較寬時欄寬會改變，較窄時側邊欄會從元素左端滑出。子頁面的清單會伸縮高度。按下頁面名稱而展開子頁面時也一樣）。\n\n> [!NOTE]\n> 對於在作業系統或瀏覽器中設定減少動態效果的使用者，不會加上動態效果。在目錄中選取標題時也會立即移過去，也不會加上標示抵達標題的動態效果。"},{"id":"doc-thumbnail","parentId":"doc-features","order":2,"title":"子頁面清單與縮圖","description":"以卡片顯示時，為每個頁面顯示圖片","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(160%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(160%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2264%22%20width%3D%22200%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2280%22%20width%3D%22230%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2296%22%20width%3D%22180%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22112%22%20width%3D%22220%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22128%22%20width%3D%22150%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2094%25)%22%2F%3E%3C%2Fsvg%3E","md":"# 子頁面清單與縮圖\n\n在頁面資料中寫上 `thumbnail`，子頁面清單以卡片顯示時，該頁面的卡片上方就會出現圖片。\n\n~~~json\n{ \"id\": \"guide-login\", \"parentId\": \"guide\", \"title\": \"登入\", \"md\": \"# 登入\", \"thumbnail\": \"images/login.png\" }\n~~~\n\n## 顯示方式\n\n- 以橫向（16:9）佔滿卡片的上緣。比例不同的圖片，會裁掉超出的部分，讓排列保持整齊\n- 以表格顯示時不會顯示圖片，也不會載入\n- 沒有 `thumbnail` 的頁面，或圖片無法載入的頁面，會顯示為沒有圖片的卡片\n\n> [!TIP]\n> 開啟「\u003ca href=\"?page=example\">使用範例：店鋪管理手冊\u003c/a>」中的「操作指南」，按下右上角的「卡片檢視」，就能看到附有縮圖的卡片。\n\n## 圖片的位置\n\n`thumbnail` 的解析規則與內文中的圖片相同。若有指定 `imageResolver`，會經過它處理。相對路徑的基準，在 `src` 的頁面中為 md 檔案的位置，其他頁面則為 `baseUrl`。\n\n> [!NOTE]\n> 圖片會在卡片接近畫面時才載入。像 \u003ccode>javascript:\u003c/code> 這類在內文中也不能使用的 URL，不會被使用。"},{"id":"doc-wrap","parentId":"doc-features","order":3,"title":"日文的換行","description":"標題與表格在詞組的分界處換行，以及寬表格","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(280%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(280%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2262%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22hsl(280%2070%25%2094%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2269%22%20width%3D%2240%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22hsl(280%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2269%22%20width%3D%2270%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2286%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2293%22%20width%3D%2259%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2293%22%20width%3D%2293%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%22110%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22117%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22117%22%20width%3D%2276%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%22134%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22141%22%20width%3D%2267%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22141%22%20width%3D%2299%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E","md":"# 日文的換行\n\n若宿主頁面是日文（例如 `\u003chtml lang=\"ja\">`），標題、表格的儲存格、頁面清單的項目等，會在詞組的分界處換行，像「必須」（必填）、「店舗コード」（店鋪代碼）這類短詞，不會從中間斷開。內文的段落則照一般方式換行。\n\n下面的表格標示為日文（`lang=\"ja\"`），因此在這個中文頁面上，也會在詞組的分界處換行。\n\n\u003ctable lang=\"ja\">\n\u003cthead>\u003ctr>\u003cth>項目\u003c/th>\u003cth>必須\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>店舗名\u003c/td>\u003ctd>必須\u003c/td>\u003ctd>画面や帳票に出る名前（40文字まで）\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>店舗コード\u003c/td>\u003ctd>必須\u003c/td>\u003ctd>書き出しや連携で店舗を見分ける番号（半角英数字8文字まで）\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>メールアドレス\u003c/td>\u003ctd>任意\u003c/td>\u003ctd>予約の控えを送るときの送り主になります\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\n> [!TIP]\n> 縮小視窗的寬度，就能看到這個表格中的「必須」與「店舗コード」不會斷開。若要在整份手冊中查看，請從畫面右上角的語言選單選擇「日本語」，開啟左側選單的「店舗」（店鋪），再按下頁首的「ヘルプ」（說明）。\n\n> [!NOTE]\n> 只有 Chrome 與 Edge 支援在詞組的分界處換行。Safari 與 Firefox 會照一般方式換行。\n\n## 寬表格\n\n超出寬度的表格，不是整個內文，而是只有表格內部可以左右捲動。\n\n| long_identifier_without_spaces_1 | long_identifier_without_spaces_2 | long_identifier_without_spaces_3 | long_identifier_without_spaces_4 |\n| --- | --- | --- | --- |\n| a | b | c | d |"},{"id":"doc-callout","parentId":"doc-features","order":4,"title":"注意與提示框","description":"在引用區塊的第 1 行寫上種類，變成有顏色的框","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(40%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(40%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2264%22%20width%3D%22200%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(40%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2280%22%20width%3D%22230%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2296%22%20width%3D%22180%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(40%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22112%22%20width%3D%22220%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22128%22%20width%3D%22150%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(40%2070%25%2094%25)%22%2F%3E%3C%2Fsvg%3E","md":"# 注意與提示框\n\n在 Markdown 引用區塊（`>`）的第 1 行寫上種類，該引用區塊就會變成有顏色的框。寫法與 GitHub 的 Markdown 相同。\n\n~~~markdown\n> [!WARNING]\n> 即使變更時段長度，已經成立的預約也會維持原樣。\n~~~\n\n> [!WARNING]\n> 即使變更時段長度，已經成立的預約也會維持原樣。\n\n## 種類\n\n| 寫法 | 標題 | 使用時機 |\n| --- | --- | --- |\n| `[!NOTE]` | 備註 | 知道了會有幫助的事 |\n| `[!TIP]` | 提示 | 更輕鬆的做法 |\n| `[!IMPORTANT]` | 重要 | 一定要知道的事 |\n| `[!WARNING]` | 注意 | 不留意就會造成困擾的事 |\n| `[!CAUTION]` | 警告 | 無法挽回的事 |\n\n> [!NOTE]\n> 時間以 15 分鐘為單位輸入。\n\n> [!TIP]\n> 暫時不使用的店鋪設為「隱藏」，就能保留資料並從清單中移除。\n\n> [!IMPORTANT]\n> 店鋪代碼在登錄後就無法變更。\n\n> [!WARNING]\n> 下列情況無法受理預約。\n>\n> \u003cul>\u003cli>遇到臨時店休日\u003c/li>\u003cli>已超過預約截止時間\u003c/li>\u003c/ul>\n\n> [!CAUTION]\n> 刪除的店鋪無法復原。該店鋪的預約與目標也會全部刪除。\n\n## 不會變成框的情況\n\n寫了不認識的種類（例如 `[!FOO]`），或把 `[!NOTE]` 寫在第 1 行以外的地方時，會照一般的引用區塊顯示。種類用大寫或小寫書寫都一樣。\n\n> 一般的引用區塊會像這樣顯示。\n\n## 變更顏色\n\n| CSS 變數 | 種類 | 預設值 |\n| --- | --- | --- |\n| `--mpv-color-note` | 備註 | `#2563eb`（藍） |\n| `--mpv-color-tip` | 提示 | `#16a34a`（綠） |\n| `--mpv-color-important` | 重要 | `#7c3aed`（紫） |\n| `--mpv-color-warning` | 注意 | `#b45309`（土黃） |\n| `--mpv-color-caution` | 警告 | `#dc2626`（紅） |\n\n預設值是在白色背景上容易閱讀的顏色。宿主畫面為深色時，請指定較亮的顏色。\n\n~~~css\n[data-theme='dark'] md-pages-viewer {\n  --mpv-color-note: #60a5fa;\n  --mpv-color-tip: #4ade80;\n  --mpv-color-important: #a78bfa;\n  --mpv-color-warning: #fbbf24;\n  --mpv-color-caution: #f87171;\n}\n~~~\n\n> [!NOTE]\n> 本手冊的「深色」也是用這個設定切換的。"},{"id":"doc-locale","parentId":"doc-features","order":5,"title":"畫面的語言與文字","description":"選擇按鈕與搜尋框等文字的語言，並逐一變更","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(100%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(100%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2256%22%20width%3D%22240%22%20height%3D%22106%22%20rx%3D%226%22%20fill%3D%22%23f3f4f6%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2264%22%20width%3D%22120%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(100%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2280%22%20width%3D%22170%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2296%22%20width%3D%22140%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(100%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2280%22%20y%3D%22112%22%20width%3D%22110%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%22128%22%20width%3D%2290%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(100%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22144%22%20width%3D%2260%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3C%2Fsvg%3E","md":"# 畫面的語言與文字\n\n按鈕、搜尋框等文字的語言，可以用 `locale` 選擇。內建日本語（`ja`，預設值）、English（`en`）、简体中文（`zh-CN`）、繁體中文（`zh-TW`）與 한국어（`ko`）。只要指定 `locale`，按鈕等文字就會全部換成該語言的文字。`texts` 只在有想變更的文字時使用。\n\n~~~html\n\u003cmd-pages-viewer pages=\"/api/manual/pages\" locale=\"en\">\u003c/md-pages-viewer>\n~~~\n\n也可以用 `en-US`、`zh-Hant` 這類寫法選擇。指定未內建的語言時，會以日文顯示，並在主控台輸出警告。\n\n> [!TIP]\n> 在畫面右上角的語言選單（地球圖示）選擇語言，這個示範的畫面與手冊就會切換成該語言。按鈕、目錄等文字是透過 \u003ccode>locale\u003c/code> 切換，頁面的名稱與內文則是換成該語言的頁面資料。\n\n## 變更文字\n\n文字可以用 `texts` 逐一變更。只有寫出的項目會改變，其餘維持 `locale` 語言的文字。會顯示數字等內容的文字，要寫成接收該值的函式。\n\n~~~js\nviewer.texts = {\n  search: '開始搜尋！',\n  chapters: (n) => `共 ${n} 章`,\n};\n~~~\n\n| 鍵 | 使用位置 | 繁體中文 |\n| --- | --- | --- |\n| `loading`、`failed`、`retry` | 載入中、無法載入時的顯示，以及重新載入的按鈕 | 載入中…／無法載入／重新載入 |\n| `notFound`、`noPages` | 頁面不存在、一個頁面都沒有時的顯示 | 找不到頁面／沒有頁面 |\n| `pageList` | 側邊欄供螢幕閱讀器使用的名稱 | 頁面清單 |\n| `columnPages`、`columnContent` | 側邊欄的標題、子頁面清單表格的標題列 | 頁面／內容 |\n| `toc` | 頁內目錄的標題 | 目錄 |\n| `breadcrumb` | 導覽路徑供螢幕閱讀器使用的名稱 | 導覽路徑 |\n| `toggle` | 側邊欄中展開或收合按鈕供螢幕閱讀器使用的名稱（函式，接收頁面名稱） | 展開或收合（頁面名稱） |\n| `chapters`、`childPages` | 子頁面清單的章數、子頁面數（函式，接收數字） | N 章／N 個頁面 |\n| `search`、`searchLabel` | 搜尋框的提示文字，以及供螢幕閱讀器使用的名稱 | 搜尋／搜尋頁面 |\n| `searching` | 全部讀完之前的搜尋結果 | 搜尋中… |\n| `noResults` | 沒有相符結果時的搜尋結果（函式，接收輸入的詞） | 沒有符合「（詞）」的頁面 |\n| `sidebarClose`、`sidebarOpen` | 隱藏、顯示側邊欄的按鈕 | 隱藏頁面清單／顯示頁面清單 |\n| `tocClose`、`tocOpen` | 隱藏、顯示目錄的按鈕 | 隱藏目錄／顯示目錄 |\n| `viewCard`、`viewList` | 切換子頁面清單形式的按鈕 | 卡片檢視／清單檢視 |\n| `pager`、`previous`、`next` | 上一頁與下一頁（供螢幕閱讀器使用的名稱，以及上一頁、下一頁的文字） | 上一頁與下一頁／上一頁／下一頁 |\n| `calloutNote`、`calloutTip`、`calloutImportant`、`calloutWarning`、`calloutCaution` | 注意與提示框的標題 | 備註／提示／重要／注意／警告 |\n\n> [!NOTE]\n> 表格中沒有的鍵，或是應寫成函式卻寫成字串的文字，會在主控台輸出警告，且不會被使用。\n\n## 切換語言\n\n顯示後變更 `locale` 或 `texts` 時，頁面與捲動位置會維持不變，文字則會立即改變。變更 `texts` 時，請設定一個新的物件。\n\n> [!IMPORTANT]\n> 頁面的名稱與內文不會被翻譯。切換語言時，請在設定 \u003ccode>locale\u003c/code> 的同時，把該語言的頁面資料傳給 \u003ccode>pages\u003c/code>。切換語言的按鈕，請放在宿主頁面的畫面上。\n\n~~~js\nconst pages = { ja: pagesJa, en: pagesEn }; // 各語言的頁面資料\n\nfunction setLanguage(lang) {\n  document.documentElement.lang = lang;\n  viewer.locale = lang;\n  viewer.pages = pages[lang];\n}\n~~~\n\n若新的資料中也有相同 ID 的頁面，切換後會維持開啟該頁面。這個示範也是用這個方法切換語言。"},{"id":"doc-security","parentId":null,"order":5,"title":"安全性","md":"# 安全性\n\n## 清理\n\n由 Markdown 轉換而成的 HTML，在放入畫面之前會先經過 DOMPurify 清理。除了可能導致執行指令碼的內容之外，也會移除下列內容。\n\n- `\u003cstyle>`、`\u003cform>`、`\u003cdialog>`、`\u003cslot>`、`popover` 等屬性（因為會影響宿主頁面的畫面）\n- 不經過 `imageResolver` 就載入圖片的內容（`poster`、`background` 屬性，以及含有 CSS `url()` 的 `style` 屬性等）\n\n> [!CAUTION]\n> 以 \u003ccode>styles\u003c/code> 傳入的 CSS 不會經過清理（請參閱\u003ca href=\"?page=doc-styles\">內文的外觀\u003c/a>）。\n\n## Content Security Policy\n\n在使用 Content Security Policy 的頁面中也能運作。\n\n- 即使 `style-src` 中沒有 `'unsafe-inline'`，CSS 也能生效\n- 在強制使用 Trusted Types 的頁面中，會使用 1 個名為 `md-pages-viewer` 的原則（policy）。若以 `trusted-types` 指令限定允許的名稱，請加入這個名稱\n\n~~~text\nContent-Security-Policy: require-trusted-types-for 'script'; trusted-types md-pages-viewer\n~~~"},{"id":"example","parentId":null,"order":6,"title":"使用範例：店鋪管理手冊","description":"用於虛構店鋪管理應用程式手冊的範例"},{"id":"welcome","parentId":"example","title":"簡介","order":1,"description":"範例店鋪管理能做什麼，以及一開始要做的設定","md":"# 簡介\n\n範例店鋪管理是一項集中管理多家店鋪的資訊、員工與預約的服務。本手冊說明畫面的使用方式，以及管理員要進行的設定。\n\n## 功能\n\n- 管理各店鋪的營業時間、地址與聯絡方式\n- 邀請員工，並指派負責的店鋪\n- 受理顧客的預約，並管理變更與取消\n- 接收預約通知與月報\n- 以 CSV 匯出預約與店鋪的資訊\n\n## 畫面構成\n\n登入後，左側會顯示選單，右側則顯示所選的畫面。顯示的選單項目會依角色而不同。\n\n| 選單 | 可以做的事 | 說明頁面 |\n| --- | --- | --- |\n| 儀表板 | 查看本月預約數與預約的趨勢 | [認識儀表板](?page=guide-dashboard) |\n| 店鋪 | 新增店鋪，並設定營業時間等 | [登錄店鋪](?page=guide-store) |\n| 員工 | 邀請員工，並指派負責店鋪 | [新增員工](?page=guide-staff) |\n| 預約 | 預約清單，以及變更與取消 | [管理預約](?page=guide-booking) |\n| 報表 | 查看每月的統計 | [解讀報表](?page=guide-report) |\n| 說明 | 本手冊 | － |\n\n畫面右上角有帳戶選單（顯示您姓名第一個字的圓形圖示）。通知設定、變更密碼與登出，都從這裡進行。\n\n## 一開始要做的設定\n\n開始使用時，請依下列順序設定。請由具有擁有者或管理員角色的人進行。\n\n1. [登錄店鋪](?page=guide-store)：新增店鋪，並決定營業時間與預約的受理方式\n2. [新增員工](?page=guide-staff)：邀請員工，並指派負責的店鋪\n3. [通知設定](?page=guide-notice)：選擇要接收的通知。通知設定由每個人各自進行\n\n若想提高安全性，請接著將[兩步驟驗證](?page=admin-2fa)設為必要。\n\n## 支援的環境\n\n| 種類 | 支援項目 |\n| --- | --- |\n| 電腦的瀏覽器 | 最新版的 Chrome、Edge、Safari、Firefox |\n| 智慧型手機 | 最新版的 iPhone Safari、Android Chrome |\n| 應用程式 | iPhone 與 Android 版的「範例店鋪管理」應用程式（接收通知與確認預約） |\n\n在舊版的瀏覽器中，畫面可能會跑版，或按鈕無法點選。\n\n## 遇到問題時\n\n請先查看[常見問題](?page=faq)。想確認設定的值時，[設定項目一覽](?page=reference)很方便。\n\n若仍無法解決，可以從畫面右上角的帳戶選單送出「聯絡我們」。受理時間為平日 10 點至 18 點，我們會在 2 個工作天內回覆。","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(232%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%2256%22%20r%3D%229%22%20fill%3D%22hsl(232%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2250%22%20width%3D%22110%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2261%22%20width%3D%2270%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%2284%22%20r%3D%229%22%20fill%3D%22hsl(232%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2278%22%20width%3D%22141%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2289%22%20width%3D%2287%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%22112%22%20r%3D%229%22%20fill%3D%22hsl(232%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22106%22%20width%3D%22122%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22117%22%20width%3D%22104%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%22140%22%20r%3D%229%22%20fill%3D%22hsl(232%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22134%22%20width%3D%22153%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22145%22%20width%3D%2281%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E"},{"id":"guide","parentId":"example","title":"操作指南","order":2,"description":"範例應用程式的基本用法","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(200%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2244%22%20width%3D%22150%22%20height%3D%2210%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2264%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2290%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22116%22%20width%3D%22120%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%22226%22%20y%3D%22140%22%20width%3D%2260%22%20height%3D%2218%22%20rx%3D%225%22%20fill%3D%22hsl(200%2070%25%2055%25)%22%2F%3E%3C%2Fsvg%3E"},{"id":"guide-login","parentId":"guide","title":"登入","order":1,"description":"如何以電子郵件地址與密碼登入，以及無法登入時的處理方式","md":"# 登入\n\n使用範例店鋪管理時，請以透過邀請郵件設定的電子郵件地址與密碼登入。這裡說明登入的步驟，以及無法登入時的處理方式。\n\n## 登入\n\n1. 開啟登入畫面\n2. 輸入電子郵件地址與密碼\n3. 按下「登入」\n\n若組織要求使用兩步驟驗證，接著會出現輸入驗證碼的畫面。\n\n### 輸入驗證碼\n\n輸入透過驗證應用程式或簡訊收到的 6 位數字。驗證應用程式的驗證碼每 30 秒會變更一次，請在顯示期間輸入。\n\n勾選「在此裝置上 30 天內不再詢問」後，從同一部裝置與瀏覽器登入時，30 天內可以省略驗證碼。設定方式請參閱[兩步驟驗證](?page=admin-2fa)。\n\n## 保持登入\n\n> [!WARNING]\n> 勾選「保持登入」後，30 天內就不必再登入。在共用的電腦上，請取消勾選。\n\n保持登入的狀態，會依裝置與瀏覽器分別記錄。在其他電腦或智慧型手機上，需要重新登入。登出後，該裝置的保持登入狀態就會解除。\n\n## 登出\n\n在畫面右上角的帳戶選單中按下「登出」。\n\n在遺失電腦等情況下，若想一併解除其他裝置的登入，請在帳戶選單的「已登入的裝置」中按下「登出所有裝置」。之後不論在哪一部裝置上使用，都需要重新登入。\n\n## 忘記密碼時\n\n1. 在登入畫面按下「忘記密碼？」\n2. 輸入已登錄的電子郵件地址，按下「傳送」\n3. 開啟收到的郵件中的連結（連結的有效期限為 1 小時）\n4. 輸入 2 次新密碼，按下「儲存」\n\n新密碼須符合組織訂定的規則。字元數與可用的字元，請參閱[密碼規則](?page=admin-password)。\n\n## 無法登入時\n\n| 訊息 | 處理方式 |\n| --- | --- |\n| 密碼錯誤 | 確認大小寫，以及全形與半形 |\n| 帳戶已鎖定 | 等待 30 分鐘，或請管理員解除 |\n| 找不到電子郵件地址 | 向管理員確認已登錄的電子郵件地址 |\n| 驗證碼錯誤 | 確認智慧型手機的時間是否正確 |\n| 無法從此位置登入 | 連上公司的網路後再登入 |\n| 邀請已過期 | 請管理員重新邀請 |\n\n### 帳戶遭鎖定時\n\n連續輸入錯誤密碼 5 次，該帳戶會被鎖定 30 分鐘。30 分鐘後會自動解除。若情況緊急，管理員可以從員工的詳細資料畫面解除。\n\n### 收不到郵件時\n\n收不到重設密碼或邀請的郵件時，請確認垃圾郵件資料夾。若公司的信箱無法收到，請聯絡郵件管理員，設定為可以接收寄件者的地址。","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(232%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2244%22%20width%3D%22150%22%20height%3D%2210%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2264%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2290%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22116%22%20width%3D%22120%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%22226%22%20y%3D%22140%22%20width%3D%2260%22%20height%3D%2218%22%20rx%3D%225%22%20fill%3D%22hsl(232%2070%25%2055%25)%22%2F%3E%3C%2Fsvg%3E"},{"id":"guide-dashboard","parentId":"guide","title":"認識儀表板","order":2,"description":"登入後第一個畫面中各區塊的意義","md":"# 認識儀表板\n\n登入後，首先會顯示儀表板。您負責的店鋪本月的概況，一目了然。\n\n## 畫面構成\n\n| 區塊 | 位置 | 內容 |\n| --- | --- | --- |\n| 上方的數字 | 最上方 | 本月預約數、與上月相比、距離目標還差 |\n| 圖表 | 中央 | 近期預約數的趨勢 |\n| 今日預約 | 右側 | 今天的預約清單 |\n| 公告 | 下方 | 營運團隊的公告 |\n\n## 上方的數字\n\n顯示本月預約數、與上月相比、距離目標還差。點選數字，會移到明細的畫面。\n\n| 數字 | 意義 |\n| --- | --- |\n| 本月預約數 | 從本月 1 日到今天的預約數。不計入已取消的預約 |\n| 與上月相比 | 與上個月同一天為止的預約數之差。增加時以綠色顯示，減少時以紅色顯示 |\n| 距離目標還差 | 本月的目標減去本月預約數的數字。未設定目標時不顯示 |\n\n### 設定目標\n\n目標依店鋪、依月份設定。請在「店鋪」畫面選擇店鋪，在「目標」分頁中輸入每月的預約數。可以設定目標的，是具有擁有者或管理員角色的人。\n\n## 圖表\n\n顯示最近 12 個月的趨勢。將游標移到圖表上，會顯示該月的數值。\n\n### 變更期間\n\n可以從圖表右上角的「期間」選擇 3 個月、6 個月或 12 個月。\n\n### 篩選店鋪\n\n負責多家店鋪時，可以用圖表左上角的「店鋪」選擇要顯示的店鋪。若都不選，會顯示您負責的所有店鋪的合計。\n\n## 今日預約\n\n依時間先後顯示今天的預約。點選顧客的姓名，會開啟該預約的詳細資料。\n\n- 顧客已到店的預約，會加上「已到店」的標示\n- 已取消的預約，會以灰色文字顯示在清單下方\n- 只會顯示您負責的店鋪的預約\n\n## 公告\n\n依新到舊顯示營運團隊的 5 則公告。未讀的公告會加上標示。\n\n維護等重要公告，也會在登入後立即顯示在畫面上方。按下「關閉」後，在下一則公告發布之前不會再顯示。\n\n## 調整顯示順序\n\n可以從各區塊右上角的「…」調整區塊的順序，或隱藏區塊。調整後的顯示只套用在自己身上，其他人的儀表板不會改變。要還原時，請按下「…」中的「還原為預設顯示」。","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(200%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2244%22%20width%3D%2258%22%20height%3D%2234%22%20rx%3D%225%22%20fill%3D%22hsl(200%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22162%22%20y%3D%2244%22%20width%3D%2258%22%20height%3D%2234%22%20rx%3D%225%22%20fill%3D%22hsl(200%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22228%22%20y%3D%2244%22%20width%3D%2258%22%20height%3D%2234%22%20rx%3D%225%22%20fill%3D%22hsl(200%2070%25%2094%25)%22%2F%3E%3Cpolyline%20points%3D%22100%2C150%20130%2C128%20160%2C136%20190%2C108%20220%2C116%20250%2C92%20282%2C98%22%20fill%3D%22none%22%20stroke%3D%22hsl(200%2070%25%2055%25)%22%20stroke-width%3D%224%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E"},{"id":"guide-store","parentId":"guide","title":"登錄店鋪","order":3,"description":"新增店鋪，並設定營業時間與地址","md":"# 登錄店鋪\n\n新增店鋪，並設定營業時間與預約的受理方式。可以新增店鋪的，是具有擁有者或管理員角色的人。\n\n## 新增店鋪\n\n1. 開啟選單的「店鋪」\n2. 按下右上角的「新增」\n3. 輸入下列項目，按下「儲存」\n\n| 項目 | 必填 | 內容 |\n| --- | --- | --- |\n| 店鋪名稱 | 必填 | 顯示在畫面與單據上的名稱（最多 40 個字） |\n| 店鋪代碼 | 必填 | 在匯出或系統串接時用來識別店鋪的代碼（最多 8 個半形英數字） |\n| 地址 | 必填 | 輸入郵遞區號後會自動填入 |\n| 電話號碼 | 選填 | 有無連字號皆可 |\n| 電子郵件地址 | 選填 | 寄送預約確認信時的寄件者 |\n\n### 關於店鋪代碼\n\n> [!IMPORTANT]\n> 店鋪代碼在登錄後就無法變更。匯出的 CSV 與報表，是以店鋪代碼而非店鋪名稱來識別店鋪。為了在變更店鋪名稱後，仍能與過去的資料對應，請為每家店鋪設定固定的代碼。\n\n## 設定營業時間\n\n依星期輸入開店與打烊的時間。公休日請勾選「公休」。\n\n> [!NOTE]\n> 時間以 15 分鐘為單位輸入。若有午休，請按下「新增休息時間」，輸入休息的開始與結束時間。休息時間內不受理預約。\n\n### 國定假日的營業時間\n\n若只有國定假日要使用不同的時間，請輸入在「國定假日」這一列。若保持空白，則使用該星期的時間。\n\n### 跨日營業\n\n營業到深夜的店鋪，打烊時間請輸入「24:00」以後的時間。例如隔天凌晨 2 點打烊時，請輸入「26:00」。最晚為「29:00」。\n\n## 登錄臨時店休日\n\n因年節期間或裝修等而休息的日子，請在「臨時店休日」分頁中指定日期登錄。也可以登錄一段期間。\n\n登錄的日子，在預約畫面中將無法選擇。已經成立的預約，會以「臨時店休日的預約」顯示在預約清單上方。系統不會自動通知顧客，請逐一聯絡。\n\n## 設定預約受理\n\n在「預約受理」分頁中，決定從幾天前開始受理預約、受理到何時、時段長度等。可選的值與預設值，請參閱[設定項目一覽](?page=reference)。\n\n變更時段長度後，已經成立的預約會維持原樣，從新受理的預約開始使用新的長度。\n\n## 隱藏店鋪\n\n暫時不使用的店鋪，請設為「隱藏」。隱藏的店鋪不會再出現在預約畫面與儀表板上，但資料會保留。要再次使用時，請在店鋪清單的「已隱藏的店鋪」中按下「顯示」。\n\n隱藏的店鋪不計入方案的店鋪數。\n\n## 刪除店鋪\n\n> [!CAUTION]\n> 刪除的店鋪無法復原。若只是暫時不使用，請設為「隱藏」。\n\n刪除店鋪後，該店鋪的預約與目標也會全部刪除。若想保留，請先以[匯出資料](?page=guide-export)的方式匯出。\n\n> 新增店鋪後，接著請進行[新增員工](?page=guide-staff)。","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2246%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2094%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%2251%22%20width%3D%2250%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2268%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%2273%22%20width%3D%2273%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2290%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%2295%22%20width%3D%2256%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22112%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%22117%22%20width%3D%2279%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22134%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%22139%22%20width%3D%2262%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3C%2Fsvg%3E"},{"id":"guide-staff","parentId":"guide","title":"新增員工","order":4,"description":"邀請員工，並指派負責的店鋪","md":"# 新增員工\n\n邀請員工，並決定負責的店鋪與角色。可以邀請員工的，是具有擁有者或管理員角色的人。\n\n## 邀請\n\n在選單的「員工」中按下「邀請」，輸入電子郵件地址。員工會從邀請郵件中的連結，自行設定密碼。\n\n邀請郵件的有效期限為 7 天。過期後，請重新邀請。\n\n### 批次邀請\n\n要邀請 10 人以上時，請從「邀請」旁的「批次邀請」，每行貼上 1 個電子郵件地址。所有人都會被指派相同的角色與負責店鋪。之後可以逐一變更。\n\n## 邀請狀態\n\n在員工清單中，邀請狀態會如下顯示。\n\n| 狀態 | 意義 | 可以做的事 |\n| --- | --- | --- |\n| 邀請中 | 已寄出郵件，尚未加入 | 取消邀請、重新寄送郵件 |\n| 已過期 | 未在 7 天內加入 | 重新邀請 |\n| 已加入 | 已設定密碼，可以登入 | 變更角色與負責店鋪 |\n| 已停用 | 管理員已停用 | 重新啟用 |\n\n> [!TIP]\n> 邀請中與已過期的員工，不計入方案的員工數。\n\n## 指派負責店鋪\n\n在員工的詳細資料畫面中選擇「負責店鋪」。可以選擇多家店鋪。\n\n負責店鋪決定了該員工可以查看的預約，以及接收通知的範圍。非負責店鋪的預約，既不會出現在清單中，也不會出現在儀表板上。\n\n## 權限\n\n- 僅限檢視：只能查看資料\n- 編輯者：可以變更店鋪的資訊\n- 管理員：還可以新增與刪除員工\n\n權限的詳細設定，請參閱[權限設定](?page=admin-roles)。\n\n## 輸入班表\n\n在員工詳細資料畫面的「班表」中，輸入上班的星期與時間。輸入後，顧客就能在預約畫面中選擇負責人員。\n\n- 班表只能在店鋪的營業時間內輸入\n- 負責多家店鋪時，請依店鋪分別輸入\n- 休假日請指定日期登錄\n\n## 停用\n\n因離職等原因不再使用的員工，請不要刪除，而是設為「停用」。停用的員工將無法登入，但在負責過的預約與操作紀錄中，仍會保留姓名。\n\n停用的員工不計入員工數。要再次使用時，請按下「重新啟用」。\n\n## 刪除員工\n\n刪除的員工無法復原。其負責過的預約中，負責人員的欄位會變成「已刪除的員工」。若想保留紀錄，請使用停用，而不是刪除。","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(280%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%2256%22%20r%3D%229%22%20fill%3D%22hsl(280%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2250%22%20width%3D%22110%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2261%22%20width%3D%2270%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%2284%22%20r%3D%229%22%20fill%3D%22hsl(280%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2278%22%20width%3D%22141%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2289%22%20width%3D%2287%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%22112%22%20r%3D%229%22%20fill%3D%22hsl(280%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22106%22%20width%3D%22122%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22117%22%20width%3D%22104%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%22140%22%20r%3D%229%22%20fill%3D%22hsl(280%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22134%22%20width%3D%22153%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22145%22%20width%3D%2281%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E"},{"id":"guide-notice","parentId":"guide","title":"通知設定","order":6,"description":"選擇透過電子郵件或應用程式接收的通知","md":"# 通知設定\n\n有新預約或預約被取消時，可以透過電子郵件或應用程式收到通知。通知設定是每位員工各自獨立的，由每個人自行選擇。\n\n## 選擇要接收的通知\n\n從右上角的帳戶選單開啟「通知設定」，勾選想接收的通知。\n\n| 通知 | 電子郵件 | 應用程式 |\n| --- | --- | --- |\n| 新預約 | ✓ | ✓ |\n| 預約取消 | ✓ | ✓ |\n| 臨時店休日的預約 | ✓ | ✓ |\n| 月報 | ✓ | － |\n| 邀請已接受 | ✓ | － |\n\n月報會在每月 1 日寄送上個月的內容。內容請參閱[解讀報表](?page=guide-report)。\n\n## 通知的對象店鋪\n\n通知的對象，只限您負責的店鋪的預約。具有擁有者或管理員角色的人，可以選擇「所有店鋪」。\n\n負責的店鋪很多時，可以用「選擇店鋪」篩選要接收通知的店鋪。\n\n## 勿擾時段\n\n若不想在夜間收到通知，請設定「勿擾時段」。這段期間的通知，會在時段結束時一併送達。電子郵件與應用程式可以分別設定。\n\n## 彙整接收\n\n預約很多的店鋪，可以不逐筆接收通知，而改為每小時彙整接收一次。彙整的通知中，會列出這 1 小時內的預約與取消。\n\n## 啟用應用程式的通知\n\n1. 在智慧型手機上安裝「範例店鋪管理」應用程式\n2. 在應用程式中登入\n3. 被詢問是否允許通知時，按下「允許」\n4. 在應用程式的「設定」→「通知」中，選擇要接收的通知\n\n若沒有被詢問，或按了「不允許」，請在智慧型手機的「設定」應用程式中，開啟範例店鋪管理的通知。\n\n## 收不到通知時\n\n請確認垃圾郵件資料夾。應用程式的通知，必須在手機的設定中允許。\n\n- 確認目前是否在勿擾時段內\n- 確認該預約的店鋪，是否在通知的對象店鋪中\n- 在帳戶選單的「個人資料」中，確認電子郵件地址是否正確\n- 確認是否已從應用程式登出（登出後就收不到應用程式的通知）","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(40%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2244%22%20width%3D%22190%22%20height%3D%2234%22%20rx%3D%226%22%20fill%3D%22hsl(40%2070%25%2094%25)%22%2F%3E%3Ccircle%20cx%3D%22114%22%20cy%3D%2261%22%20r%3D%228%22%20fill%3D%22hsl(40%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%22130%22%20y%3D%2256%22%20width%3D%22120%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2286%22%20width%3D%22190%22%20height%3D%2234%22%20rx%3D%226%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22114%22%20cy%3D%22103%22%20r%3D%228%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22130%22%20y%3D%2298%22%20width%3D%22100%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22128%22%20width%3D%22190%22%20height%3D%2230%22%20rx%3D%226%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E"},{"id":"guide-export","parentId":"guide","title":"匯出資料","order":8,"description":"將資料匯出為 CSV，在試算表軟體中使用","md":"# 匯出資料\n\n可以將預約與店鋪的資訊匯出為 CSV，在試算表軟體中使用。可以匯出的資料，依角色與負責店鋪而不同。\n\n## 匯出為 CSV\n\n在清單畫面中按下右上角的「匯出」，就會以目前顯示的條件下載 CSV。\n\n1. 開啟要匯出的清單畫面\n2. 依期間或店鋪篩選\n3. 按下右上角的「匯出」\n\n篩選的條件，會直接成為匯出的條件。例如只想匯出上個月的預約時，請先在預約清單中將期間設為上個月，再進行匯出。\n\n## 可以匯出的資料\n\n| 資料 | 匯出的畫面 | 可以匯出的角色 |\n| --- | --- | --- |\n| 預約 | 預約清單 | 所有角色（僅限負責店鋪的部分） |\n| 店鋪 | 店鋪清單 | 編輯者、管理員、擁有者 |\n| 員工 | 員工清單 | 管理員、擁有者 |\n| 操作紀錄 | 操作紀錄 | 管理員、擁有者 |\n\n## 出現亂碼時\n\nCSV 以 UTF-8 匯出。若在 Excel 中出現亂碼，請用「資料」索引標籤的「從文字/CSV」匯入。\n\n若總是用 Excel 開啟，擁有者可以在「組織設定」→「資料」中，將字元編碼改為 Shift_JIS。變更後，組織內所有人的匯出都會變成 Shift_JIS。\n\n## 可以匯出的筆數\n\n一次最多可以匯出 10 萬筆。超過時，請分成幾段期間匯出。\n\n## 匯出紀錄\n\n進行匯出後，會在操作紀錄中留下「匯出」的紀錄。誰在何時匯出了什麼，可以在[操作紀錄](?page=admin-audit)中確認。","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%2 22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%2295%22%20width%3D%2256%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22112%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%22117%22%20width%3D%2279%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22134%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%22139%22%20width%3D%2262%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3C%2Fsvg%3E"},{"id":"admin-roles","parentId":"admin","title":"權限設定","order":1,"description":"決定每個角色可以執行的操作","md":"# 權限設定\n\n每位員工會被指派 1 個角色。角色決定了可以查看的資料與可以執行的操作。\n\n## 角色一覽\n\n| 角色 | 檢視店鋪 | 編輯店鋪 | 管理員工 | 帳單 |\n| --- | --- | --- | --- | --- |\n| 僅限檢視 | ✓ | － | － | － |\n| 編輯者 | ✓ | ✓ | － | － |\n| 管理員 | ✓ | ✓ | ✓ | － |\n| 擁有者 | ✓ | ✓ | ✓ | ✓ |\n\n## 各角色的說明\n\n### 僅限檢視\n\n可以查看負責店鋪的預約與店鋪的資訊。無法變更或取消預約。適合兼職員工，或只需要確認數字的人。\n\n### 編輯者\n\n可以變更、取消負責店鋪的預約，以及變更店鋪的資訊。適合在店鋪負責日常接待的人。\n\n### 管理員\n\n除了編輯者可以做的事之外，還可以邀請員工、變更角色、停用員工，以及進行安全性設定。適合店長，或統籌多家店鋪的人。\n\n### 擁有者\n\n可以執行所有操作。只有擁有者可以處理帳單與方案的變更、資料設定，以及關閉帳戶。\n\n## 變更角色\n\n在員工的詳細資料畫面中，重新選擇「角色」。變更會立即生效。\n\n降低角色後，即使是該員工已開啟的畫面，不能再執行的操作按鈕也會無法點選。無法變更自己的角色。\n\n## 移轉擁有者\n\n一個組織只有 1 位擁有者。移轉給其他人後，原本的擁有者會變成「管理員」。\n\n1. 開啟「組織設定」→「擁有者」\n2. 選擇要成為新擁有者的員工\n3. 為了確認，輸入自己的密碼並按下「移轉」\n\n新擁有者會收到郵件通知。移轉後若要復原，必須請新擁有者再移轉回來。\n\n## 與負責店鋪的關係\n\n角色是在負責店鋪的範圍內使用。例如「編輯者」只能變更自己負責的店鋪的資訊。擁有者則不論負責店鋪為何，都可以處理所有店鋪。\n\n## 變更紀錄\n\n角色的變更與擁有者的移轉，會留在[操作紀錄](?page=admin-audit)中。","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214% %2279%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22134%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%22139%22%20width%3D%2262%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3C%2Fsvg%3E"},{"id":"admin-billing","parentId":"admin","title":"帳單與付款","order":2,"description":"變更方案、下載請款單、變更付款方式","md":"# 帳單與付款\n\n變更方案、下載請款單、變更付款方式。只有擁有者可以執行與帳單相關的操作。\n\n## 變更方案\n\n在「組織設定」→「方案」中選擇。變更為較高的方案會立即生效，變更為較低的方案則從下一個請款日起生效。\n\n| 方案 | 店鋪數 | 適合的使用方式 |\n| --- | --- | --- |\n| 標準版 | 最多 10 家店鋪 | 經營 1 家到數家店鋪 |\n| 商務版 | 無上限 | 想集中管理多家店鋪 |\n\n變更為較低的方案時，若店鋪數超過上限，請先將部分店鋪設為「隱藏」。\n\n## 請款日\n\n月繳方案以簽約日作為每月的請款日。年繳方案以簽約日作為每年的請款日。若請款日在月底，而某個月沒有這一天，則以該月的最後一天作為請款日。\n\n## 下載請款單\n\n可以從「帳單紀錄」以 PDF 下載每月的請款單。\n\n請款單會在請款日的隔天開立。開立後，擁有者會收到郵件通知。\n\n### 請款單抬頭\n\n請款單上的公司名稱、部門名稱與聯絡人姓名，可以在「組織設定」→「帳單」中變更。變更後的抬頭，會從下一張請款單開始使用。\n\n## 變更付款方式\n\n可以選擇信用卡或請款單付款。請款單付款只適用於年繳方案。\n\n- 信用卡：於請款日自動扣款\n- 請款單付款：請在請款單開立後 30 天內匯款\n\n## 付款失敗時\n\n因信用卡過期等原因付款失敗時，擁有者會收到郵件，畫面上方也會顯示通知。請在 14 天內更新付款方式。更新後，會立即重新付款。\n\n超過 14 天後，組織內所有人都只能檢視。付款完成後就會恢復。\n\n## 取消訂閱\n\n從「組織設定」→「方案」下方的「取消訂閱」辦理。取消訂閱後，可以使用到該計費期間結束，之後會視同關閉帳戶。資料的處理方式，請參閱[常見問題](?page=faq)。","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D %20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E"},{"id":"admin-2fa","parentId":"admin-security","title":"兩步驟驗證","order":1,"description":"登入時，除了密碼之外還要求輸入驗證碼","md":"# 兩步驟驗證\n\n使用兩步驟驗證後，登入時除了密碼之外，還會要求輸入驗證碼。即使密碼外洩，沒有驗證碼也無法登入。\n\n## 啟用\n\n1. 開啟「組織設定」→「安全性」\n2. 開啟「要求兩步驟驗證」\n\n從下次登入起，會要求所有人輸入驗證碼。\n\n可以開啟此設定的，是具有擁有者或管理員角色的人。開啟前先通知員工，他們登入時就不會不知所措。\n\n## 接收驗證碼的方式\n\n- 驗證應用程式（建議）\n- 簡訊（SMS）\n\n驗證應用程式在沒有訊號的地方，也能確認驗證碼。簡訊只要登錄電話號碼就能使用，但可能會因訊號狀況而延遲送達。\n\n## 設定驗證應用程式\n\n1. 在智慧型手機上安裝驗證應用程式\n2. 登入範例店鋪管理後，設定畫面會顯示 QR 碼\n3. 用驗證應用程式掃描 QR 碼\n4. 輸入驗證應用程式上顯示的 6 位數字，按下「驗證」\n\n## 設定簡訊\n\n1. 在設定畫面選擇「透過簡訊接收」\n2. 輸入電話號碼，按下「傳送」\n3. 輸入收到的 6 位數字，按下「驗證」\n\n## 備用碼\n\n設定完成後，會顯示 10 組備用碼。無法使用智慧型手機時，每組備用碼可以代替驗證碼使用 1 次。請列印下來，或保存在安全的地方。\n\n備用碼可以從帳戶選單的「安全性」重新產生。重新產生後，之前的備用碼就無法使用。\n\n## 手機遺失時\n\n請管理員先暫時解除該員工的兩步驟驗證，再重新設定。\n\n如果有備用碼，可以自行登入，並在新的智慧型手機上重新設定。\n\n## 更換手機時\n\n請趁舊的智慧型手機還能使用時，在帳戶選單的「安全性」中按下「更換驗證應用程式」，再用新的智慧型手機掃描 QR 碼。","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(260%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2244%22%20width%3D%22150%22%20height%3D%2210%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2264%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2290%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22116%22%20width%3D%22120%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%22226%22%20y%3D%22140%22%20width%3D%2260%22%20height%3D%2218%22%20rx%3D%225%22%20fill%3D%22hsl(260%2070%25%2055%25)%22%2F%3E%3C%2Fsvg%3E"},{"id":"admin-password","parentId":"admin-security","title":"密碼規則","order":2,"description":"決定字元數、可用的字元與變更的間隔","md":"# 密碼規則\n\n決定組織內員工使用的密碼規則。可以決定規則的，是具有擁有者或管理員角色的人。\n\n## 可以設定的項目\n\n| 項目 | 可選的值 | 預設值 |\n| --- | --- | --- |\n| 最少字元數 | 8～32 個字元 | 10 個字元 |\n| 必須包含符號 | 是、否 | 否 |\n| 要求變更的間隔 | 無、90 天、180 天 | 無 |\n\n## 可以使用的字元\n\n密碼可以使用英文大寫字母、英文小寫字母、數字與符號。不能使用全形字元與空格。\n\n開啟「必須包含符號」後，密碼必須包含下列符號中的至少 1 個。\n\n~~~text\n! # $ % & ( ) * + - . / : ; = ? @ [ ] ^ _ { | } ~\n~~~\n\n## 要求變更的間隔\n\n將「要求變更的間隔」設為 90 天或 180 天後，從上次變更密碼的日期起經過該天數時，會在登入後要求變更密碼。變更之前，無法前往其他畫面。\n\n近年來一般認為，與其要求定期變更，使用較長且不易被猜到的密碼更安全。若沒有特別的理由，請維持「無」。\n\n## 鎖定的條件\n\n連續輸入錯誤 5 次，會鎖定 30 分鐘。\n\n~~~text\n範例：A1b2C3d4e5（10 個字元，包含英文大寫、英文小寫與數字）\n~~~\n\n## 變更規則時\n\n即使將規則變得更嚴格，目前的密碼仍可繼續使用。新的規則會從下次變更密碼時開始套用。\n\n若希望所有人立即改用符合新規則的密碼，請在「組織設定」→「安全性」中按下「要求所有人變更密碼」。下次登入時，就會要求變更。","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(100%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2244%22%20width%3D%22150%22%20height%3D%2210%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2264%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2290%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22116%22%20width%3D%22120%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%22226%22%20y%3D%22140%22%20width%3D%2260%22%20height%3D%2218%22%20rx%3D%225%22%20fill%3D%22hsl(100%2070%25%2055%25)%22%2F%3E%3C%2Fsvg%3E"},{"id":"admin-audit","parentId":"admin","title":"操作紀錄","order":4,"description":"確認誰在何時變更了什麼","md":"# 操作紀錄\n\n可以確認誰在何時變更了什麼。可以查看操作紀錄的，是具有擁有者或管理員角色的人。\n\n## 查看紀錄\n\n在「組織設定」→「操作紀錄」中，會依新到舊顯示最近 90 天的操作。\n\n## 記錄的操作\n\n- 登入、登出\n- 店鋪與員工的新增、變更、刪除\n- 權限與方案的變更\n\n此外，下列操作也會被記錄。\n\n| 操作 | 紀錄範例 |\n| --- | --- |\n| 匯出資料 | 匯出了預約（2,340 筆） |\n| 安全性設定 | 已要求兩步驟驗證 |\n| 登入失敗 | 因密碼錯誤而鎖定 |\n| 移轉擁有者 | 已移轉擁有者 |\n\n預約的受理與變更，不會留在操作紀錄中，而是留在各預約的「歷史紀錄」中。\n\n## 紀錄的項目\n\n| 項目 | 內容 |\n| --- | --- |\n| 日期時間 | 操作的日期時間（精確到秒） |\n| 操作者 | 員工的姓名與電子郵件地址 |\n| 操作 | 操作的種類 |\n| 對象 | 操作的店鋪、員工等 |\n| 位置 | 操作時的 IP 位址 |\n\n點選紀錄的列，會顯示變更前與變更後的值。\n\n## 篩選\n\n可以依員工、操作的種類與期間篩選。結果可以用與[匯出資料](?page=guide-export)相同的步驟匯出為 CSV。\n\n## 保存期間\n\n操作紀錄保存 90 天，比這更舊的紀錄會在每月 1 日刪除。若想長期保留，請每月匯出一次。","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(210%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%2256%22%20r%3D%229%22%20fill%3D%22hsl(210%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2250%22%20width%3D%22110%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2261%22%20width%3D%2270%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%2284%22%20r%3D%229%22%20fill%3D%22hsl(210%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2278%22%20width%3D%22141%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2289%22%20width%3D%2287%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%22112%22%20r%3D%229%22%20fill%3D%22hsl(210%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22106%22%20width%3D%22122%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22117%22%20width%3D%22104%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%22140%22%20r%3D%229%22%20fill%3D%22hsl(210%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22134%22%20width%3D%22153%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22145%22%20width%3D%2281%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E"},{"id":"reference","parentId":"example","title":"設定項目一覽","description":"各畫面的設定項目，以及可選的值與預設值","md":"# 設定項目一覽\n\n這份清單依畫面彙整了範例店鋪管理中可以變更的設定。操作步驟在操作指南的各頁面中說明；這裡請用來確認項目的意義、可選的值與預設值。\n\n可以變更設定的人，依角色而不同。各角色可以執行的操作，請參閱[權限設定](?page=admin-roles)。\n\n## 店鋪設定\n\n在選單的「店鋪」中選擇店鋪，開啟「設定」分頁即可變更。每家店鋪各自擁有不同的值。\n\n### 基本資訊\n\n| 項目 | 內容 | 輸入規則 |\n| --- | --- | --- |\n| 店鋪名稱 | 顯示在畫面、單據與預約畫面上的名稱 | 最多 40 個字 |\n| 店鋪代碼 | 在匯出或與外部系統串接時，用來識別店鋪的代碼 | 最多 8 個半形英數字。登錄後無法變更 |\n| 地址 | 顯示在預約畫面的地圖與交通指引中 | 輸入郵遞區號後會自動填入 |\n| 電話號碼 | 顯示在預約畫面中 | 有無連字號皆可 |\n| 電子郵件地址 | 寄送預約確認信時的寄件者 | 只能設定 1 個 |\n| 店鋪介紹 | 在預約畫面中，顯示於店鋪名稱下方的文字 | 最多 400 個字 |\n\n變更店鋪名稱後，之前匯出的 CSV 與單據上的店鋪名稱不會改變。與過去的單據比對時，請使用店鋪代碼。\n\n### 營業時間\n\n依星期，以 15 分鐘為單位輸入開店與打烊的時間。若有午休，請按下「新增休息時間」，輸入休息的開始與結束時間。休息時間內不受理預約。\n\n- 打烊時間必須晚於開店時間。跨日營業時，打烊時間請輸入「24:00」以後（最晚為「29:00」）\n- 公休日請勾選「公休」\n- 若只有國定假日要使用不同的時間，請輸入在「國定假日」這一列。若保持空白，則使用該星期的時間\n\n### 臨時店休日\n\n因年節期間或裝修等而休息的日子，請指定日期登錄。也可以登錄一段期間。登錄的日子在預約畫面中將無法選擇，已經成立的預約，會以「臨時店休日的預約」顯示在清單上方。系統不會自動通知顧客，請從清單逐一聯絡。\n\n臨時店休日最多可以登錄到 1 年後。已經過去的日子，會自動從清單中消失。\n\n### 預約受理\n\n| 項目 | 可選的值 | 預設值 |\n| --- | --- | --- |\n| 開放預約 | 1～180 天前開始 | 60 天前開始 |\n| 預約截止 | 當天～7 天前為止（也可指定時間） | 前一天 18:00 為止 |\n| 時段長度 | 15 分鐘、30 分鐘、60 分鐘 | 30 分鐘 |\n| 每個時段可預約數 | 1～20 筆 | 1 筆 |\n| 取消期限 | 預約前 0～72 小時為止 | 24 小時前為止 |\n\n將每個時段可預約數設為 2 筆以上後，同一時間可以有多位顧客預約。請配合員工的人數決定。\n\n超過取消期限後，顧客將無法在預約畫面中取消，畫面上會引導顧客以電話聯絡。\n\n## 員工設定\n\n在選單的「員工」中選擇員工，即可在詳細資料畫面中變更。自己的部分資訊，本人也可以從帳戶選單變更。\n\n### 基本資訊\n\n| 項目 | 內容 | 本人能否變更 |\n| --- | --- | --- |\n| 姓名 | 顯示在畫面與預約負責人員欄位中的名稱 | 可以 |\n| 電子郵件地址 | 用於登入與通知 | 可以（會收到確認郵件） |\n| 角色 | 僅限檢視、編輯者、管理員、擁有者 | 不可以 |\n| 負責店鋪 | 作為預約與通知對象的店鋪 | 不可以 |\n\n### 邀請\n\n邀請郵件的有效期限為 7 天。過期的邀請，會在清單中顯示為「已過期」。重新邀請後，會收到附有新連結的郵件。\n\n已邀請但尚未加入的員工，不計入員工數。接近方案的員工數上限時，請取消不需要的邀請。\n\n### 班表\n\n可以為每位員工輸入上班的星期與時間。輸入後，顧客就能在預約畫面中選擇負責人員。\n\n- 班表只能在店鋪的營業時間內輸入\n- 負責多家店鋪時，請依店鋪分別輸入\n- 休假日與臨時店休日一樣，以日期登錄\n\n### 停用\n\n因離職等原因不再使用的員工，可以不刪除，而是設為「停用」。停用的員工將無法登入，但在負責過的預約與操作紀錄中，仍會保留姓名。停用的員工不計入員工數。\n\n## 通知設定\n\n在右上角帳戶選單的「通知設定」中，選擇自己要接收的通知。通知設定是每位員工各自獨立的，無法變更其他人的設定。\n\n### 接收的通知\n\n| 通知 | 電子郵件 | 應用程式 | 預設值 |\n| --- | --- | --- | --- |\n| 新預約 | ✓ | ✓ | 接收 |\n| 預約取消 | ✓ | ✓ | 接收 |\n| 臨時店休日的預約 | ✓ | ✓ | 接收 |\n| 月報 | ✓ | － | 接收 |\n| 邀請已接受 | ✓ | － | 不接收 |\n\n通知的對象，只限您負責的店鋪的預約。具有擁有者或管理員角色的人，可以選擇「所有店鋪」。\n\n### 勿擾時段\n\n若不想在夜間收到通知，請設定「勿擾時段」。這段期間的通知，會在時段結束時一併送達。電子郵件與應用程式可以分別設定。\n\n### 彙整接收\n\n預約很多的店鋪，可以不逐筆接收通知，而改為每小時彙整接收一次。彙整的通知中，會列出這 1 小時內的預約與取消。\n\n## 帳單設定\n\n可以在「組織設定」→「帳單」中變更。只有擁有者可以變更。\n\n### 方案\n\n| 方案 | 店鋪數 | 付款週期 |\n| --- | --- | --- |\n| 標準版 | 最多 10 家店鋪 | 月繳、年繳 |\n| 商務版 | 無上限 | 月繳、年繳 |\n\n變更為較高的方案會立即生效，變更為較低的方案則從下一個請款日起生效。變更為較低的方案時，若店鋪數超過上限，請先將部分店鋪設為「隱藏」。\n\n### 請款單抬頭\n\n輸入請款單上的公司名稱、部門名稱與聯絡人姓名。變更後的抬頭，會從下一張請款單開始使用。已開立的請款單，抬頭不會改變。\n\n### 付款方式\n\n- 信用卡：月繳、年繳皆可使用\n- 請款單付款：只適用於年繳方案。請在請款單開立後 30 天內匯款\n\n## 安全性設定\n\n可以在「組織設定」→「安全性」中變更。可以變更的，是具有擁有者或管理員角色的人。\n\n### 兩步驟驗證\n\n| 項目 | 可選的值 | 預設值 |\n| --- | --- | --- |\n| 要求兩步驟驗證 | 是、否 | 否 |\n| 驗證碼的接收方式 | 驗證應用程式、簡訊 | 由本人選擇 |\n\n設為必要後，從下次登入起，會要求所有人輸入驗證碼。操作步驟請參閱[兩步驟驗證](?page=admin-2fa)。\n\n### 密碼\n\n| 項目 | 可選的值 | 預設值 |\n| --- | --- | --- |\n| 最少字元數 | 8～32 個字元 | 10 個字元 |\n| 必須包含符號 | 是、否 | 否 |\n| 要求變更的間隔 | 無、90 天、180 天 | 無 |\n\n即使將規則變得更嚴格，目前的密碼仍可繼續使用。新的規則會從下次變更密碼時開始套用。\n\n### 登入限制\n\n連續輸入錯誤密碼 5 次，該帳戶會被鎖定 30 分鐘。管理員也可以從員工的詳細資料畫面解除鎖定。\n\n若想只允許從公司的網路登入，請在「允許登入的 IP 位址」中輸入。未輸入時，可以從任何地方登入。\n\n## 資料設定\n\n可以在「組織設定」→「資料」中變更。只有擁有者可以變更。\n\n### 匯出格式\n\n| 項目 | 可選的值 | 預設值 |\n| --- | --- | --- |\n| 字元編碼 | UTF-8、Shift_JIS | UTF-8 |\n| 日期格式 | 2026/04/01、2026-04-01 | 2026/04/01 |\n| 標題列 | 包含、不包含 | 包含 |\n\n一次最多可以匯出 10 萬筆。操作步驟請參閱[匯出資料](?page=guide-export)。\n\n### 保存期間\n\n| 資料 | 保存期間 |\n| --- | --- |\n| 預約 | 自預約日起 3 年 |\n| 操作紀錄 | 90 天 |\n| 月報 | 2 年 |\n\n超過保存期間的資料，會在每月 1 日刪除。想保留的資料，請在那之前匯出。\n\n### 關閉帳戶\n\n關閉帳戶 30 天後，會刪除組織的所有資料。在 30 天內，擁有者登入即可復原。\n\n## 用語\n\n### 時段\n\n受理預約的時間單位。長度由「時段長度」決定。\n\n### 負責店鋪\n\n員工作為預約與通知對象的店鋪。\n\n### 組織\n\n簽約使用範例店鋪管理的單位。店鋪與員工全都屬於 1 個組織。","order":4,"thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2246%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2094%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%2251%22%20width%3D%2250%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2268%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%2273%22%20width%3D%2273%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2290%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%2295%22%20width%3D%2256%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22112%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%22117%22%20width%3D%2279%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22134%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%22139%22%20width%3D%2262%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3C%2Fsvg%3E"},{"id":"faq","parentId":"example","title":"常見問題","order":5,"description":"常被問到的問題與解答","md":"# 常見問題\n\n## 登入與帳戶\n\n### 我忘記密碼了\n\n可以從登入畫面的「忘記密碼？」重設。操作步驟請參閱[登入](?page=guide-login)。\n\n### 收不到兩步驟驗證的驗證碼\n\n以簡訊接收時，請確認電話號碼是否正確。使用驗證應用程式，在沒有訊號的地方也能確認驗證碼（[兩步驟驗證](?page=admin-2fa)）。\n\n### 我想變更電子郵件地址\n\n可以在帳戶選單的「個人資料」中變更。新的地址會收到確認郵件，開啟其中的連結即完成變更。\n\n## 店鋪\n\n### 店鋪數量有上限嗎？\n\n依方案而不同。標準版最多 10 家店鋪，商務版沒有上限。\n\n### 可以把店鋪移到其他組織嗎？\n\n不行。請在要移入的組織中重新登錄店鋪，再匯入以[匯出資料](?page=guide-export)匯出的內容。\n\n### 店鋪代碼登錄錯了\n\n店鋪代碼在登錄後就無法變更。若還沒有任何預約，請刪除店鋪後重新登錄。\n\n## 預約\n\n### 顧客以電話預約\n\n可以從預約清單的「新增」輸入。詳情請參閱[管理預約](?page=guide-booking)。\n\n### 想在同一時間受理 2 筆預約\n\n在店鋪的「預約受理」中，將「每個時段可預約數」設為 2 筆以上。\n\n### 預約畫面中沒有出現臨時店休日\n\n請確認登錄臨時店休日的店鋪，與預約畫面的店鋪是否相同。臨時店休日是依店鋪分別登錄的。\n\n## 員工\n\n### 員工收不到邀請郵件\n\n請確認垃圾郵件資料夾。若找不到，請先取消邀請，再重新邀請。\n\n### 離職的員工該怎麼處理？\n\n不要刪除，而是設為「停用」，這樣在負責過的預約紀錄中就會保留姓名（[新增員工](?page=guide-staff)）。\n\n## 帳單與合約\n\n### 可以在年度中途變更方案嗎？\n\n可以。變更為較高的方案會立即生效，變更為較低的方案則從下一個請款日起生效（[帳單與付款](?page=admin-billing)）。\n\n### 關閉帳戶後，資料會怎麼樣？\n\n關閉帳戶 30 天後，會刪除所有資料。在 30 天內，擁有者登入即可復原。\n\n## 資料\n\n### 匯出的 CSV 出現亂碼\n\n用 Excel 開啟時，請用「資料」索引標籤的「從文字/CSV」匯入。若總是使用 Excel，可以將字元編碼改為 Shift_JIS。\n\n### 舊的預約可以查看到什麼時候？\n\n自預約日起 3 年。比這更舊的預約會被刪除（[設定項目一覽](?page=reference)）。","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(40%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2244%22%20width%3D%22190%22%20height%3D%2234%22%20rx%3D%226%22%20fill%3D%22hsl(40%2070%25%2094%25)%22%2F%3E%3Ccircle%20cx%3D%22114%22%20cy%3D%2261%22%20r%3D%228%22%20fill%3D%22hsl(40%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%22130%22%20y%3D%2256%22%20width%3D%22120%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2286%22%20width%3D%22190%22%20height%3D%2234%22%20rx%3D%226%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22114%22%20cy%3D%22103%22%20r%3D%228%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22130%22%20y%3D%2298%22%20width%3D%22100%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22128%22%20width%3D%22190%22%20height%3D%2230%22%20rx%3D%226%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E"},{"id":"guide-booking","parentId":"guide","title":"管理預約","description":"如何看預約清單，以及受理、變更與取消預約","md":"# 管理預約\n\n顧客的預約，統一在選單的「預約」中處理。從預約畫面進來的預約，與以電話受理後輸入的預約，都會列在同一份清單中。\n\n## 預約清單\n\n預約清單中，會依日期與時間的順序，列出您負責的店鋪的預約。\n\n| 欄位 | 內容 |\n| --- | --- |\n| 日期時間 | 預約的日期與開始時間 |\n| 顧客 | 顧客的姓名。點選後會開啟預約的詳細資料 |\n| 店鋪 | 受理預約的店鋪 |\n| 負責人員 | 顧客選擇的員工。未選擇時為空白 |\n| 狀態 | 已預約、已到店、已取消、無故未到 |\n| 預約管道 | 預約畫面、電話、其他 |\n\n### 切換顯示\n\n可以在清單上方選擇「日」、「週」、「月」。「日」會以每小時的表格顯示，「週」與「月」則以行事曆的形式顯示。\n\n負責多家店鋪時，可以用「店鋪」選擇要顯示的店鋪。\n\n### 篩選\n\n可以依狀態、負責人員與預約管道篩選。例如以「狀態：已取消」篩選，就只會列出已取消的預約。\n\n## 受理預約\n\n顧客從預約畫面預約後，預約會自動加入清單。若設定為接收新預約的通知，就會透過電子郵件或應用程式收到通知（[通知設定](?page=guide-notice)）。\n\n### 輸入以電話受理的預約\n\n1. 按下預約清單右上角的「新增」\n2. 輸入店鋪、日期時間，以及顧客的姓名與電話號碼\n3. 要指定負責人員時，在「負責人員」中選擇\n4. 按下「儲存」\n\n預約管道會是「電話」。輸入顧客的電子郵件地址後，顧客會收到預約確認信。\n\n### 同一時間重疊時\n\n> [!WARNING]\n> 無法輸入超過 1 個時段可受理數量的預約。若一定要受理，請在店鋪的「預約受理」中增加「每個時段可預約數」，或建議顧客改約其他時間。\n\n## 變更預約\n\n在預約的詳細資料中按下「變更」，重新選擇日期時間或負責人員，再按下「儲存」。若有顧客的電子郵件地址，顧客會收到變更的通知。\n\n變更前與變更後的內容，會留在預約詳細資料的「歷史紀錄」中。\n\n## 取消預約\n\n### 顧客取消時\n\n在取消期限之前，顧客可以自行從預約畫面取消。超過期限後才以電話聯絡取消時，請在預約的詳細資料中按下「取消」。\n\n### 因店家因素取消時\n\n在預約的詳細資料中按下「取消」，原因選擇「店家因素」。系統不會自動通知顧客，請以電話等方式聯絡。\n\n## 顧客未到店時\n\n超過預約時間後顧客仍未到店時，請在預約的詳細資料中按下「無故未到」。無故未到會在月報中另外計算。\n\n同一位顧客持續無故未到時，在顧客的詳細資料中留下「備忘」，下次預約時其他員工也能注意到。\n\n## 臨時店休日的預約\n\n登錄為臨時店休日的日子已經有預約時，會以「臨時店休日的預約」顯示在清單上方。請逐一聯絡顧客，變更日期時間或取消。全部處理完畢後，這項顯示就會消失。\n\n## 列印預約\n\n在「日」的顯示中按下右上角的「列印」，就能列印當天的預約清單。可以在要放在櫃台備查時使用。列印內容包含顧客的姓名與電話號碼，請小心處理。\n\n## 常見的疑難排解\n\n| 遇到的問題 | 要確認的事 |\n| --- | --- |\n| 預約沒有出現在清單中 | 該預約的店鋪是否在負責店鋪中 |\n| 無法變更預約 | 角色是否為「僅限檢視」 |\n| 顧客沒有收到變更的通知 | 是否已輸入顧客的電子郵件地址 |\n| 預約畫面中無法選擇日期 | 是否遇到臨時店休日，或已超過預約截止時間 |","order":5,"thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(20%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22% 主要的數字。詳細的明細，請從郵件中的連結開啟報表畫面確認。\n\n## 報表的項目\n\n| 項目 | 意義 |\n| --- | --- |\n| 預約數 | 預約日期在該月的預約數（不含取消） |\n| 新顧客 | 該月第一次預約的顧客數 |\n| 取消數 | 被取消的預約數 |\n| 取消率 | 取消數除以包含取消在內的全部預約數所得的比例 |\n| 無故未到 | 顧客未到店的預約數 |\n| 預約畫面比例 | 從預約畫面進來的預約所占的比例（不含電話等） |\n| 時段預約率 | 可受理的時段中，有預約的時段所占的比例 |\n\n### 時段預約率\n\n由營業時間與時段長度算出該月可受理的時段數，再算出其中有預約的時段所占的比例。臨時店休日與休息時間，不計入可受理的時段。\n\n## 比較各店鋪\n\n在報表畫面中選擇「依店鋪」，會變成將各店鋪並排的表格。點選欄位的標題，就能依該項目排序。\n\n只會列出您負責的店鋪。擁有者可以比較所有店鋪。\n\n## 指定期間產生報表\n\n在「期間」中選擇開始與結束的月份，會顯示該期間的合計與每月的趨勢。最多 24 個月。\n\n## 匯出報表\n\n可以從報表畫面右上角的「匯出」，以 PDF 或 CSV 匯出。PDF 適合作為會議資料，CSV 適合在試算表軟體中統計。\n\n## 數字對不上時\n\n- 與預約清單的數量對不上時，請確認清單是否包含取消與無故未到。報表的「預約數」不包含這些預約\n- 若在月中變更營業時間，時段預約率會以每天當時的營業時間計算\n- 將預約日期改到其他月份的預約，會計入變更後的月份","order":7,"thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(330%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%
