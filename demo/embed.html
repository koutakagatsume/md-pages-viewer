%2289%22%20width%3D%2287%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%22112%22%20r%3D%229%22%20fill%3D%22hsl(0%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22106%22%20width%3D%22122%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22117%22%20width%3D%22104%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%22140%22%20r%3D%229%22%20fill%3D%22hsl(0%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22134%22%20width%3D%22153%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22145%22%20width%3D%2281%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E"},{"id":"admin-2fa","parentId":"admin-security","title":"2단계 인증","order":1,"description":"로그인할 때 비밀번호와 함께 인증 코드 요구하기","md":"# 2단계 인증\n\n2단계 인증을 사용하면 로그인할 때 비밀번호와 함께 인증 코드를 요구합니다. 비밀번호가 유출되어도 인증 코드가 없으면 로그인할 수 없습니다.\n\n## 사용 설정하기\n\n1. ‘조직 설정’ → ‘보안’을 엽니다\n2. ‘2단계 인증 필수’를 켭니다\n\n다음에 로그인할 때부터 모든 사용자에게 인증 코드 입력을 요구합니다.\n\n이 설정은 소유자와 관리자 역할인 사용자만 켤 수 있습니다. 켜기 전에 직원들에게 미리 알려 두면 로그인할 때 당황하지 않습니다.\n\n## 인증 코드를 받는 방법\n\n- 인증 앱(권장)\n- SMS\n\n인증 앱은 신호가 없는 곳에서도 코드를 확인할 수 있습니다. SMS는 전화번호만 등록하면 사용할 수 있지만, 신호 상태에 따라 늦게 도착할 수 있습니다.\n\n## 인증 앱 설정하기\n\n1. 스마트폰에 인증 앱을 설치합니다\n2. 샘플 매장 관리에 로그인하면 설정 화면에 QR 코드가 표시됩니다\n3. 인증 앱으로 QR 코드를 스캔합니다\n4. 인증 앱에 표시된 6자리 숫자를 입력하고 ‘확인’을 누릅니다\n\n## SMS 설정하기\n\n1. 설정 화면에서 ‘SMS로 받기’를 선택합니다\n2. 전화번호를 입력하고 ‘보내기’를 누릅니다\n3. 받은 6자리 숫자를 입력하고 ‘확인’을 누릅니다\n\n## 백업 코드\n\n설정이 끝나면 백업 코드 10개가 표시됩니다. 스마트폰을 사용할 수 없을 때 인증 코드 대신 사용할 수 있으며, 각 코드는 한 번만 쓸 수 있습니다. 인쇄하거나 안전한 곳에 보관하세요.\n\n백업 코드는 계정 메뉴의 ‘보안’에서 다시 만들 수 있습니다. 다시 만들면 이전 코드는 사용할 수 없게 됩니다.\n\n## 스마트폰을 잃어버렸을 때\n\n관리자에게 해당 직원의 2단계 인증을 일시적으로 해제해 달라고 요청한 후 다시 설정합니다.\n\n백업 코드가 있으면 직접 로그인해 새 스마트폰에서 다시 설정할 수 있습니다.\n\n## 기기를 변경할 때\n\n이전 스마트폰을 아직 사용할 수 있을 때 계정 메뉴의 ‘보안’에서 ‘인증 앱 변경’을 누르고, 새 스마트폰으로 QR 코드를 스캔하세요.","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(260%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2244%22%20width%3D%22150%22%20height%3D%2210%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2264%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2290%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22116%22%20width%3D%22120%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%22226%22%20y%3D%22140%22%20width%3D%2260%22%20height%3D%2218%22%20rx%3D%225%22%20fill%3D%22hsl(260%2070%25%2055%25)%22%2F%3E%3C%2Fsvg%3E"},{"id":"admin-password","parentId":"admin-security","title":"비밀번호 규칙","order":2,"description":"길이, 사용할 수 있는 문자, 변경 주기 정하기","md":"# 비밀번호 규칙\n\n조직의 직원이 사용하는 비밀번호의 규칙을 정합니다. 규칙은 소유자와 관리자 역할인 사용자만 정할 수 있습니다.\n\n## 정할 수 있는 항목\n\n| 항목 | 선택할 수 있는 값 | 기본값 |\n| --- | --- | --- |\n| 최소 글자 수 | 8~32자 | 10자 |\n| 기호 필수 | 예, 아니요 | 아니요 |\n| 변경 요구 주기 | 없음, 90일, 180일 | 없음 |\n\n## 사용할 수 있는 문자\n\n비밀번호에는 영문 대문자, 영문 소문자, 숫자, 기호를 사용할 수 있습니다. 전각 문자와 공백은 사용할 수 없습니다.\n\n‘기호 필수’를 켜면 다음 기호 중 하나 이상을 포함해야 합니다.\n\n~~~text\n! # $ % & ( ) * + - . / : ; = ? @ [ ] ^ _ { | } ~\n~~~\n\n## 변경 요구 주기\n\n‘변경 요구 주기’를 90일이나 180일로 설정하면 마지막으로 비밀번호를 바꾼 날부터 그 일수가 지났을 때 로그인 후 비밀번호 변경을 요구합니다. 바꿀 때까지는 다른 화면으로 이동할 수 없습니다.\n\n최근에는 정기적인 변경을 요구하기보다 길고 추측하기 어려운 비밀번호를 사용하는 편이 더 안전하다고 여겨집니다. 특별한 이유가 없다면 ‘없음’으로 두세요.\n\n## 잠금 조건\n\n5회 연속으로 잘못 입력하면 30분 동안 잠깁니다.\n\n~~~text\n예: A1b2C3d4e5(10자, 영문 대문자, 영문 소문자, 숫자)\n~~~\n\n## 규칙을 바꿨을 때\n\n규칙을 더 엄격하게 바꿔도 지금의 비밀번호는 그대로 사용할 수 있습니다. 새 규칙은 다음에 비밀번호를 바꿀 때부터 적용됩니다.\n\n모든 사용자가 바로 새 규칙에 맞는 비밀번호로 바꾸게 하려면 ‘조직 설정’ → ‘보안’에서 ‘모든 사용자에게 비밀번호 변경 요구’를 누릅니다. 다음에 로그인할 때 변경을 요구합니다.","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(100%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2244%22%20width%3D%22150%22%20height%3D%2210%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2264%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2290%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22116%22%20width%3D%22120%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%22226%22%20y%3D%22140%22%20width%3D%2260%22%20height%3D%2218%22%20rx%3D%225%22%20fill%3D%22hsl(100%2070%25%2055%25)%22%2F%3E%3C%2Fsvg%3E"},{"id":"admin-audit","parentId":"admin","title":"작업 기록","order":4,"description":"누가 언제 무엇을 변경했는지 확인하기","md":"# 작업 기록\n\n누가 언제 무엇을 변경했는지 확인할 수 있습니다. 작업 기록은 소유자와 관리자 역할인 사용자만 볼 수 있습니다.\n\n## 기록 보기\n\n‘조직 설정’ → ‘작업 기록’에서 최근 90일 동안의 작업을 최신순으로 표시합니다.\n\n## 기록되는 작업\n\n- 로그인, 로그아웃\n- 매장과 직원의 추가, 변경, 삭제\n- 권한과 플랜 변경\n\n그 밖에 다음 작업도 기록됩니다.\n\n| 작업 | 기록 예 |\n| --- | --- |\n| 데이터 내보내기 | 예약을 내보냄(2,340건) |\n| 보안 설정 | 2단계 인증을 필수로 설정함 |\n| 로그인 실패 | 비밀번호 오류로 잠김 |\n| 소유자 이전 | 소유자를 이전함 |\n\n예약 접수와 변경은 작업 기록이 아니라 각 예약의 ‘이력’에 남습니다.\n\n## 기록 항목\n\n| 항목 | 내용 |\n| --- | --- |\n| 일시 | 작업한 일시(초 단위까지) |\n| 작업자 | 직원의 이름과 이메일 주소 |\n| 작업 | 작업의 종류 |\n| 대상 | 작업한 매장, 직원 등 |\n| 위치 | 작업한 IP 주소 |\n\n기록 행을 누르면 변경 전과 후의 값이 표시됩니다.\n\n## 필터링하기\n\n직원, 작업 종류, 기간으로 필터링할 수 있습니다. 결과는 [데이터 내보내기](?page=guide-export)와 같은 절차로 CSV로 만들 수 있습니다.\n\n## 보관 기간\n\n작업 기록은 90일 동안 보관하며, 그보다 오래된 기록은 매월 1일에 삭제합니다. 오래 남겨 두고 싶다면 한 달에 한 번 내보내 두세요.","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(210%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%2256%22%20r%3D%229%22%20fill%3D%22hsl(210%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2250%22%20width%3D%22110%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2261%22%20width%3D%2270%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%2284%22%20r%3D%229%22%20fill%3D%22hsl(210%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2278%22%20width%3D%22141%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2289%22%20width%3D%2287%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%22112%22%20r%3D%229%22%20fill%3D%22hsl(210%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22106%22%20width%3D%22122%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22117%22%20width%3D%22104%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%22140%22%20r%3D%229%22%20fill%3D%22hsl(210%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22134%22%20width%3D%22153%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22145%22%20width%3D%2281%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E"},{"id":"reference","parentId":"example","title":"설정 항목 목록","description":"화면별 설정 항목과 선택할 수 있는 값, 기본값 목록","md":"# 설정 항목 목록\n\n샘플 매장 관리에서 바꿀 수 있는 설정을 화면별로 정리한 목록입니다. 절차는 사용 가이드의 각 페이지에서 설명합니다. 이 페이지는 항목의 의미와 선택할 수 있는 값, 기본값을 확인할 때 사용하세요.\n\n설정을 바꿀 수 있는 사람은 역할에 따라 다릅니다. 역할별로 할 수 있는 작업은 [권한 설정](?page=admin-roles)을 참고하세요.\n\n## 매장 설정\n\n메뉴의 ‘매장’에서 매장을 선택하고 ‘설정’ 탭을 열면 바꿀 수 있습니다. 매장마다 각각 다른 값을 가집니다.\n\n### 기본 정보\n\n| 항목 | 내용 | 입력 규칙 |\n| --- | --- | --- |\n| 매장명 | 화면과 출력물, 예약 화면에 표시되는 이름 | 40자까지 |\n| 매장 코드 | 내보내기와 외부 연동에서 매장을 구별하는 번호 | 반각 영숫자 8자까지. 등록한 후에는 바꿀 수 없음 |\n| 주소 | 예약 화면의 지도와 오시는 길 안내에 표시됨 | 우편번호를 입력하면 자동으로 입력됨 |\n| 전화번호 | 예약 화면에 표시됨 | 하이픈은 있어도 없어도 됨 |\n| 이메일 주소 | 예약 확인 메일을 보낼 때의 발신 주소 | 1개만 |\n| 매장 소개 | 예약 화면에서 매장명 아래에 표시되는 글 | 400자까지 |\n\n매장명을 바꿔도 그전에 내보낸 CSV나 출력물의 매장명은 바뀌지 않습니다. 과거 출력물과 비교할 때는 매장 코드를 사용하세요.\n\n### 영업시간\n\n요일별로 개점 시각과 폐점 시각을 15분 단위로 입력합니다. 점심 휴게 시간이 있는 경우에는 ‘휴게 시간 추가’를 누르고 휴게 시간의 시작과 끝을 입력합니다. 휴게 시간에는 예약을 받지 않습니다.\n\n- 폐점 시각은 개점 시각보다 뒤여야 합니다. 자정을 넘기는 영업은 폐점 시각을 ‘24:00’ 이후(최대 ‘29:00’)로 입력합니다\n- 정기 휴무일에는 ‘휴무’를 선택합니다\n- 공휴일에만 다른 시간으로 영업하는 경우에는 ‘공휴일’ 행에 입력합니다. 비워 두면 해당 요일의 시간을 사용합니다\n\n### 임시 휴업일\n\n연말연시나 리모델링 등으로 쉬는 날을 날짜를 지정해 등록합니다. 기간으로 등록할 수도 있습니다. 등록한 날은 예약 화면에서 선택할 수 없게 되며, 이미 들어와 있는 예약은 ‘임시 휴업일 예약’으로 목록 위에 표시됩니다. 고객에게 자동으로 연락하지 않으므로 목록에서 한 명씩 연락하세요.\n\n임시 휴업일은 1년 후까지 등록할 수 있습니다. 지난 날짜는 자동으로 목록에서 사라집니다.\n\n### 예약 접수\n\n| 항목 | 선택할 수 있는 값 | 기본값 |\n| --- | --- | --- |\n| 접수 시작 | 1~180일 전부터 | 60일 전부터 |\n| 접수 마감 | 당일~7일 전까지(시각도 지정) | 전날 18:00까지 |\n| 슬롯 길이 | 15분, 30분, 60분 | 30분 |\n| 슬롯당 예약 수 | 1~20건 | 1건 |\n| 취소 기한 | 예약 0~72시간 전까지 | 24시간 전까지 |\n\n슬롯당 예약 수를 2건 이상으로 하면 같은 시간에 여러 고객의 예약을 받을 수 있습니다. 직원 수에 맞춰 정하세요.\n\n취소 기한이 지나면 고객은 예약 화면에서 취소할 수 없게 되며, 전화로 연락하라는 안내가 표시됩니다.\n\n## 직원 설정\n\n메뉴의 ‘직원’에서 직원을 선택하면 상세 화면에서 바꿀 수 있습니다. 자신의 정보 중 일부는 본인이 계정 메뉴에서 바꿀 수도 있습니다.\n\n### 기본 정보\n\n| 항목 | 내용 | 본인 변경 |\n| --- | --- | --- |\n| 이름 | 화면과 예약의 담당자 칸에 표시되는 이름 | 가능 |\n| 이메일 주소 | 로그인과 알림에 사용 | 가능(확인 이메일이 발송됨) |\n| 역할 | 보기 전용, 편집자, 관리자, 소유자 | 불가 |\n| 담당 매장 | 예약과 알림의 대상이 되는 매장 | 불가 |\n\n### 초대\n\n초대 이메일의 유효 기간은 7일입니다. 기한이 지난 초대는 목록에 ‘기한 만료’로 표시됩니다. 다시 초대하면 새 링크가 담긴 이메일이 발송됩니다.\n\n초대만 하고 아직 참여하지 않은 직원은 직원 수에 포함되지 않습니다. 플랜의 직원 수 상한에 가까울 때는 사용하지 않는 초대를 취소하세요.\n\n### 근무 일정\n\n직원마다 근무하는 요일과 시간을 입력할 수 있습니다. 입력해 두면 예약 화면에서 고객이 담당자를 선택할 수 있게 됩니다.\n\n- 근무 일정은 매장의 영업시간 안에서만 입력할 수 있습니다\n- 여러 매장을 담당하는 경우에는 매장별로 입력합니다\n- 쉬는 날은 임시 휴업일과 마찬가지로 날짜로 등록합니다\n\n### 이용 정지\n\n퇴사 등으로 더 이상 사용하지 않는 직원은 삭제하지 않고 ‘이용 정지’로 설정할 수 있습니다. 정지된 직원은 로그인할 수 없게 되지만, 담당한 예약과 작업 기록에는 이름이 남습니다. 정지된 직원은 직원 수에 포함되지 않습니다.\n\n## 알림 설정\n\n오른쪽 위의 계정 메뉴에 있는 ‘알림 설정’에서 내가 받을 알림을 선택합니다. 알림 설정은 직원마다 따로 있으며, 다른 사람의 설정은 바꿀 수 없습니다.\n\n### 받을 알림\n\n| 알림 | 이메일 | 앱 | 기본값 |\n| --- | --- | --- | --- |\n| 새 예약 | ○ | ○ | 받음 |\n| 예약 취소 | ○ | ○ | 받음 |\n| 임시 휴업일 예약 | ○ | ○ | 받음 |\n| 월간 보고서 | ○ | – | 받음 |\n| 초대 수락 | ○ | – | 받지 않음 |\n\n알림 대상은 담당하는 매장의 예약뿐입니다. 소유자와 관리자 역할인 사용자는 ‘모든 매장’을 선택할 수 있습니다.\n\n### 방해 금지 시간대\n\n밤에 알림을 받고 싶지 않다면 ‘방해 금지 시간대’를 설정합니다. 그동안의 알림은 시간대가 끝났을 때 한꺼번에 도착합니다. 이메일과 앱을 따로 정할 수 있습니다.\n\n### 모아서 받기\n\n예약이 많은 매장에서는 알림을 한 건씩이 아니라 1시간마다 모아서 받을 수 있습니다. 모은 알림에는 그 1시간 동안의 예약과 취소 목록이 들어 있습니다.\n\n## 청구 설정\n\n‘조직 설정’ → ‘청구’에서 바꿀 수 있습니다. 소유자만 바꿀 수 있습니다.\n\n### 플랜\n\n| 플랜 | 매장 수 | 결제 단위 |\n| --- | --- | --- |\n| 스탠다드 | 10개 매장까지 | 월간, 연간 |\n| 비즈니스 | 제한 없음 | 월간, 연간 |\n\n상위 플랜으로의 변경은 바로, 하위 플랜으로의 변경은 다음 청구일부터 반영됩니다. 하위 플랜으로 바꿀 때 매장 수가 상한을 넘는 경우에는 먼저 매장을 ‘숨기기’로 설정하세요.\n\n### 청구서 수신인\n\n청구서에 표시할 회사명, 부서명, 담당자명을 입력합니다. 바꾼 수신인은 다음 청구서부터 사용됩니다. 이미 발행된 청구서의 수신인은 바뀌지 않습니다.\n\n### 결제 수단\n\n- 신용카드: 월간과 연간 모두 사용할 수 있습니다\n- 청구서 결제: 연간 플랜에서만 사용할 수 있습니다. 청구서 발행일로부터 30일 이내에 계좌 이체하세요\n\n## 보안 설정\n\n‘조직 설정’ → ‘보안’에서 바꿀 수 있습니다. 소유자와 관리자 역할인 사용자만 바꿀 수 있습니다.\n\n### 2단계 인증\n\n| 항목 | 선택할 수 있는 값 | 기본값 |\n| --- | --- | --- |\n| 2단계 인증 필수 | 예, 아니요 | 아니요 |\n| 인증 코드 받는 방법 | 인증 앱, SMS | 본인이 선택 |\n\n필수로 설정하면 다음에 로그인할 때부터 모든 사용자에게 인증 코드 입력을 요구합니다. 절차는 [2단계 인증](?page=admin-2fa)을 참고하세요.\n\n### 비밀번호\n\n| 항목 | 선택할 수 있는 값 | 기본값 |\n| --- | --- | --- |\n| 최소 글자 수 | 8~32자 | 10자 |\n| 기호 필수 | 예, 아니요 | 아니요 |\n| 변경 요구 주기 | 없음, 90일, 180일 | 없음 |\n\n규칙을 더 엄격하게 바꿔도 지금의 비밀번호는 그대로 사용할 수 있습니다. 새 규칙은 다음에 비밀번호를 바꿀 때부터 적용됩니다.\n\n### 로그인 제한\n\n비밀번호를 5회 연속으로 잘못 입력하면 그 계정을 30분 동안 잠급니다. 잠금은 관리자가 직원 상세 화면에서 해제할 수도 있습니다.\n\n회사 네트워크에서만 로그인할 수 있게 하려면 ‘로그인 허용 IP 주소’에 입력합니다. 입력하지 않으면 어디서든 로그인할 수 있습니다.\n\n## 데이터 설정\n\n‘조직 설정’ → ‘데이터’에서 바꿀 수 있습니다. 소유자만 바꿀 수 있습니다.\n\n### 내보내기 형식\n\n| 항목 | 선택할 수 있는 값 | 기본값 |\n| --- | --- | --- |\n| 문자 코드 | UTF-8, Shift_JIS | UTF-8 |\n| 날짜 형식 | 2026/04/01, 2026-04-01 | 2026/04/01 |\n| 머리글 행 | 포함, 포함하지 않음 | 포함 |\n\n한 번에 내보낼 수 있는 것은 10만 건까지입니다. 절차는 [데이터 내보내기](?page=guide-export)를 참고하세요.\n\n### 보관 기간\n\n| 데이터 | 보관 기간 |\n| --- | --- |\n| 예약 | 예약일로부터 3년 |\n| 작업 기록 | 90일 |\n| 월간 보고서 | 2년 |\n\n보관 기간이 지난 데이터는 매월 1일에 삭제합니다. 남겨 두고 싶은 데이터는 그 전에 내보내세요.\n\n### 탈퇴\n\n탈퇴하고 30일이 지나면 조직의 모든 데이터를 삭제합니다. 30일 이내라면 소유자가 로그인해 복원할 수 있습니다.\n\n## 용어\n\n### 슬롯\n\n예약을 받는 시간 단위입니다. 길이는 ‘슬롯 길이’로 정합니다.\n\n### 담당 매장\n\n직원이 예약과 알림의 대상으로 삼는 매장입니다.\n\n### 조직\n\n샘플 매장 관리를 계약하는 단위입니다. 매장과 직원은 모두 하나의 조직에 속합니다.","order":4,"thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2246%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2094%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%2251%22%20width%3D%2250%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2268%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%2273%22%20width%3D%2273%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2290%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%2295%22%20width%3D%2256%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22112%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%22117%22%20width%3D%2279%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22134%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%22139%22%20width%3D%2262%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3C%2Fsvg%3E"},{"id":"faq","parentId":"example","title":"자주 묻는 질문","order":5,"description":"자주 받는 질문과 답변","md":"# 자주 묻는 질문\n\n## 로그인과 계정\n\n### 비밀번호를 잊어버렸습니다\n\n로그인 화면의 ‘비밀번호를 잊으셨나요?’에서 재설정할 수 있습니다. 절차는 [로그인](?page=guide-login)을 참고하세요.\n\n### 2단계 인증 코드가 오지 않습니다\n\nSMS로 받는 경우에는 전화번호가 올바른지 확인하세요. 인증 앱을 사용하면 신호가 없는 곳에서도 코드를 확인할 수 있습니다([2단계 인증](?page=admin-2fa)).\n\n### 이메일 주소를 바꾸고 싶습니다\n\n계정 메뉴의 ‘프로필’에서 바꿀 수 있습니다. 새 주소로 확인 이메일이 발송되며, 링크를 열면 변경이 완료됩니다.\n\n## 매장\n\n### 매장 수에 제한이 있나요?\n\n플랜에 따라 다릅니다. 스탠다드는 10개 매장까지이고, 비즈니스는 제한이 없습니다.\n\n### 매장을 다른 조직으로 옮길 수 있나요?\n\n옮길 수 없습니다. 옮길 조직에서 매장을 다시 등록하고, [데이터 내보내기](?page=guide-export)로 내보낸 내용을 가져오세요.\n\n### 매장 코드를 잘못 등록했습니다\n\n매장 코드는 등록한 후에는 바꿀 수 없습니다. 예약이 들어오기 전이라면 매장을 삭제하고 다시 등록하세요.\n\n## 예약\n\n### 고객에게 전화로 예약을 받았습니다\n\n예약 목록의 ‘추가’에서 입력할 수 있습니다. 자세한 내용은 [예약 관리](?page=guide-booking)를 참고하세요.\n\n### 같은 시간에 예약을 2건 받고 싶습니다\n\n매장의 ‘예약 접수’에서 ‘슬롯당 예약 수’를 2건 이상으로 설정합니다.\n\n### 예약 화면에 임시 휴업일이 반영되지 않습니다\n\n임시 휴업일을 등록한 매장과 예약 화면의 매장이 같은지 확인하세요. 임시 휴업일은 매장별로 등록합니다.\n\n## 직원\n\n### 직원이 초대 이메일을 받지 못합니다\n\n스팸 메일함을 확인하세요. 찾을 수 없다면 초대를 취소한 후 다시 초대하세요.\n\n### 퇴사한 직원은 어떻게 하면 되나요?\n\n삭제하지 말고 ‘이용 정지’로 설정하면 담당한 예약의 기록에 이름이 남습니다([직원 추가](?page=guide-staff)).\n\n## 청구와 계약\n\n### 연도 중간에 플랜을 바꿀 수 있나요?\n\n바꿀 수 있습니다. 상위 플랜으로는 바로, 하위 플랜으로는 다음 청구일부터 바뀝니다([청구 및 결제](?page=admin-billing)).\n\n### 탈퇴하면 데이터는 어떻게 되나요?\n\n탈퇴하고 30일이 지나면 모든 데이터를 삭제합니다. 30일 이내라면 소유자가 로그인해 복원할 수 있습니다.\n\n## 데이터\n\n### 내보낸 CSV의 글자가 깨집니다\n\nExcel에서 여는 경우에는 ‘데이터’ 탭의 ‘텍스트/CSV에서’로 불러오세요. 항상 Excel에서 사용하는 경우에는 문자 코드를 Shift_JIS로 바꿀 수 있습니다.\n\n### 오래된 예약은 언제까지 볼 수 있나요?\n\n예약일로부터 3년 동안입니다. 그보다 오래된 예약은 삭제됩니다([설정 항목 목록](?page=reference)).","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(40%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2244%22%20width%3D%22190%22%20height%3D%2234%22%20rx%3D%226%22%20fill%3D%22hsl(40%2070%25%2094%25)%22%2F%3E%3Ccircle%20cx%3D%22114%22%20cy%3D%2261%22%20r%3D%228%22%20fill%3D%22hsl(40%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%22130%22%20y%3D%2256%22%20width%3D%22120%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2286%22%20width%3D%22190%22%20height%3D%2234%22%20rx%3D%226%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22114%22%20cy%3D%22103%22%20r%3D%228%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22130%22%20y%3D%2298%22%20width%3D%22100%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22128%22%20width%3D%22190%22%20height%3D%2230%22%20rx%3D%226%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E"},{"id":"guide-booking","parentId":"guide","title":"예약 관리","description":"예약 목록 보는 방법과 접수, 변경, 취소","md":"# 예약 관리\n\n고객의 예약은 메뉴의 ‘예약’에서 한꺼번에 다룹니다. 예약 화면으로 들어온 예약도, 전화로 받아 입력한 예약도 같은 목록에 표시됩니다.\n\n## 예약 목록\n\n예약 목록에는 담당하는 매장의 예약이 날짜와 시각 순서로 표시됩니다.\n\n| 열 | 내용 |\n| --- | --- |\n| 일시 | 예약 날짜와 시작 시각 |\n| 고객 | 고객 이름. 누르면 예약 상세 정보가 열립니다 |\n| 매장 | 예약을 받은 매장 |\n| 담당자 | 고객이 선택한 직원. 선택하지 않은 경우에는 비어 있습니다 |\n| 상태 | 예약됨, 방문, 취소, 노쇼 |\n| 접수 경로 | 예약 화면, 전화, 기타 |\n\n### 보기 전환하기\n\n목록 위쪽에서 ‘일’, ‘주’, ‘월’을 선택할 수 있습니다. ‘일’에서는 시간대별 표로, ‘주’와 ‘월’에서는 달력 형태로 표시합니다.\n\n여러 매장을 담당하는 경우에는 ‘매장’에서 표시할 매장을 선택할 수 있습니다.\n\n### 필터링하기\n\n상태, 담당자, 접수 경로로 필터링할 수 있습니다. 예를 들어 ‘상태: 취소’로 필터링하면 취소된 예약만 표시됩니다.\n\n## 예약 받기\n\n고객이 예약 화면에서 예약하면 자동으로 목록에 들어옵니다. 새 예약 알림을 받도록 설정해 두었다면 이메일이나 앱으로 알림이 옵니다([알림 설정](?page=guide-notice)).\n\n### 전화로 받은 예약 입력하기\n\n1. 예약 목록 오른쪽 위의 ‘추가’를 누릅니다\n2. 매장, 일시, 고객 이름과 전화번호를 입력합니다\n3. 담당자를 지정하는 경우에는 ‘담당자’에서 선택합니다\n4. ‘저장’을 누릅니다\n\n접수 경로는 ‘전화’가 됩니다. 고객의 이메일 주소를 입력하면 고객에게 예약 확인 메일이 발송됩니다.\n\n### 같은 시간에 겹칠 때\n\n> [!WARNING]\n> 한 슬롯에서 받을 수 있는 수를 넘는 예약은 입력할 수 없습니다. 꼭 받아야 한다면 매장의 ‘예약 접수’에서 ‘슬롯당 예약 수’를 늘리거나 고객에게 다른 시간을 안내하세요.\n\n## 예약 변경하기\n\n예약 상세 정보에서 ‘변경’을 누르고, 일시나 담당자를 다시 선택한 후 ‘저장’을 누릅니다. 고객의 이메일 주소가 있으면 변경 알림이 고객에게 발송됩니다.\n\n변경 전과 후의 내용은 예약 상세 정보의 ‘이력’에 남습니다.\n\n## 예약 취소하기\n\n### 고객이 취소한 경우\n\n고객은 취소 기한까지는 예약 화면에서 직접 취소할 수 있습니다. 기한이 지난 후 전화로 취소 연락을 받은 경우에는 예약 상세 정보에서 ‘취소’를 누르세요.\n\n### 매장 사정으로 취소하는 경우\n\n예약 상세 정보에서 ‘취소’를 누르고 사유로 ‘매장 사정’을 선택합니다. 고객에게 자동으로 연락하지 않으므로 전화 등으로 연락하세요.\n\n## 고객이 방문하지 않았을 때\n\n예약 시각이 지나도 고객이 오지 않은 경우에는 예약 상세 정보에서 ‘노쇼’를 누릅니다. 노쇼는 월간 보고서에서 따로 집계합니다.\n\n같은 고객의 노쇼가 계속되는 경우에는 고객 상세 정보에 ‘메모’를 남겨 두면 다음 예약 때 다른 직원도 알아차릴 수 있습니다.\n\n## 임시 휴업일 예약\n\n임시 휴업일로 등록한 날에 이미 예약이 있는 경우에는 목록 위에 ‘임시 휴업일 예약’으로 표시됩니다. 한 건씩 고객에게 연락해 일시를 변경하거나 취소하세요. 모두 처리하면 표시가 사라집니다.\n\n## 예약 인쇄하기\n\n‘일’ 보기에서 오른쪽 위의 ‘인쇄’를 누르면 그날의 예약 목록을 인쇄할 수 있습니다. 접수처에 놓아둘 때 사용하세요. 인쇄물에는 고객의 이름과 전화번호가 들어가므로 취급에 주의하세요.\n\n## 자주 겪는 문제\n\n| 문제 | 확인할 내용 |\n| --- | --- |\n| 예약이 목록에 표시되지 않음 | 담당 매장에 그 예약의 매장이 포함되어 있는지 |\n| 예약을 변경할 수 없음 | 역할이 ‘보기 전용’으로 되어 있지 않은지 |\n| 고객에게 변경 알림이 가지 않음 | 고객의 이메일 주소가 입력되어 있는지 |\n| 예약 화면에서 날짜를 선택할 수 없음 | 임시 휴업일이나 접수 마감에 해당하지 않는지 |","order":5,"thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(20%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2246%22%20width%3D%2228%22%20height%3D%2224%22%20rx%3D%224%22%20fill%3D%22hsl(20%2070%25%2094%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22128%22%20y%3D%2246%22%20width%3D%2228%22%20height%3D%2224%22%20rx%3D%224%22%20fill%3D%22hsl(20%2070%25%2055%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22160%22%20y%3D%2246%22%20width%3D%2228%22%20height%3D%2224%2 20rx%3D%224%22%20fill%3D%22hsl(20%2070%25%2094%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22224%22%20y%3D%22102%22%20width%3D%2228%22%20height%3D%2224%22%20rx%3D%224%22%20fill%3D%22hsl(20%2070%25%2055%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22256%22%20y%3D%22102%22%20width%3D%2228%22%20height%3D%2224%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22130%22%20width%3D%2228%22%20height%3D%2224%22%20rx%3D%224%22%20fill%3D%22hsl(20%2070%25%2094%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22128%22%20y%3D%22130%22%20width%3D%2228%22%20height%3D%2224%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22160%22%20y%3D%22130%22%20width%3D%2228%22%20height%3D%2224%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22192%22%20y%3D%22130%22%20width%3D%2228%22%20height%3D%2224%22%20rx%3D%224%22%20fill%3D%22hsl(20%2070%25%2055%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22224%22%20y%3D%22130%22%20width%3D%2228%22%20height%3D%2224%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22256%22%20y%3D%22130%22%20width%3D%2228%22%20height%3D%2224%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E"},{"id":"guide-report","parentId":"guide","title":"보고서 보기","description":"월별 집계 항목과 매장별 비교 방법","md":"# 보고서 보기\n\n메뉴의 ‘보고서’에서는 예약을 월별로 집계한 결과를 볼 수 있습니다. 매월 1일에는 지난달 분이 월간 보고서로 이메일로도 도착합니다.\n\n## 월간 보고서란\n\n월간 보고서는 지난달의 예약 건수와 취소율 등을 매장별로 정리한 것입니다. 매월 1일 아침에 월간 보고서를 받도록 설정한 사람에게 이메일로 도착합니다.\n\n이메일에는 주요 숫자만 들어 있습니다. 자세한 내역은 이메일의 링크에서 보고서 화면을 열어 확인하세요.\n\n## 보고서 항목\n\n| 항목 | 의미 |\n| --- | --- |\n| 예약 건수 | 그달에 예약일이 있는 예약의 수(취소 제외) |\n| 신규 고객 | 그달에 처음 예약한 고객의 수 |\n| 취소 | 취소된 예약의 수 |\n| 취소율 | 취소 건수를, 취소를 포함한 전체 예약 수로 나눈 비율 |\n| 노쇼 | 고객이 방문하지 않은 예약의 수 |\n| 예약 화면 경유 비율 | 예약 화면으로 들어온 예약의 비율(전화 등 제외) |\n| 예약된 슬롯 비율 | 받을 수 있었던 슬롯 중 예약이 들어온 슬롯의 비율 |\n\n### 예약된 슬롯 비율\n\n영업시간과 슬롯 길이로 그달에 받을 수 있었던 슬롯 수를 구하고, 그중 예약이 들어온 슬롯의 비율을 계산합니다. 임시 휴업일과 휴게 시간은 받을 수 있었던 슬롯에 포함하지 않습니다.\n\n## 매장별로 비교하기\n\n보고서 화면에서 ‘매장별’을 선택하면 매장을 가로로 나란히 놓은 표가 됩니다. 열 제목을 누르면 그 항목으로 정렬할 수 있습니다.\n\n담당하는 매장만 표시됩니다. 소유자는 모든 매장을 비교할 수 있습니다.\n\n## 기간을 지정해 만들기\n\n‘기간’에서 시작 월과 종료 월을 선택하면 그 기간의 합계와 월별 추이를 표시합니다. 최대 24개월까지입니다.\n\n## 보고서 내보내기\n\n보고서 화면 오른쪽 위의 ‘내보내기’에서 PDF나 CSV로 내보낼 수 있습니다. PDF는 회의 자료에, CSV는 스프레드시트 프로그램에서 집계할 때 적합합니다.\n\n## 숫자가 맞지 않을 때\n\n- 예약 목록과 건수가 맞지 않는 경우에는 목록에 취소와 노쇼가 포함되어 있는지 확인하세요. 보고서의 ‘예약 건수’에는 포함하지 않습니다\n- 월 중간에 영업시간을 바꾼 경우, 예약된 슬롯 비율은 날마다 그 시점의 영업시간으로 계산합니다\n- 예약일을 다른 달로 변경한 예약은 변경한 후의 달에 포함합니다","order":7,"thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(330%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2244%22%20width%3D%2258%22%20height%3D%2234%       // ---- 今の画面・高さ・テーマ・言語（URL の ?screen= ?height= ?theme= ?lang=。最初はヘルプ・ライト・日本語） ----
      const SCREENS = ['dashboard', 'stores', 'staff', 'reports', 'help'];
      const params = new URLSearchParams(location.search);
      const screen = SCREENS.includes(params.get('screen')) ? params.get('screen') : 'help';
      const height = params.get('height') === 'fixed' ? 'fixed' : 'auto';
      let theme = params.get('theme') === 'dark' ? 'dark' : 'light';
      let lang = Object.keys(PAGES).includes(params.get('lang')) ? params.get('lang') : 'ja';
      const root = document.documentElement;
      root.dataset.height = screen === 'help' ? height : 'auto';
      root.dataset.theme = theme;

      const urlFor = (changes) => {
        const next = new URLSearchParams({ screen, theme, lang, ...(screen === 'help' ? { height } : {}), ...changes });
        if (next.get('screen') !== 'help') next.delete('height');
        return '?' + next;
      };
      // テーマはその場で切り替える（言語はヘッダーの右上で切り替える）
      const inPlace = { theme: (value) => { theme = value; root.dataset.theme = theme; } };
      const showState = () => {
        for (const group of document.querySelectorAll('.demo-group')) {
          group.hidden = Boolean(group.dataset.only) && group.dataset.only !== screen;
          const name = group.dataset.param;
          for (const link of group.querySelectorAll('a')) {
            link.setAttribute('aria-current', String(link.dataset.value === { height, theme }[name]));
            if (inPlace[name]) {
              link.href = '#';
              link.onclick = (event) => {
                event.preventDefault();
                inPlace[name](link.dataset.value);
                showState();
              };
            } else {
              link.href = urlFor({ [name]: link.dataset.value });
            }
          }
        }
        // メニューで画面を移っても、テーマと言語はそのまま
        for (const link of document.querySelectorAll('.app-nav a')) link.href = urlFor({ screen: link.dataset.screen, height: 'auto' });
      };

      // ---- 組み込み先の画面 ----
      const main = document.querySelector('.app-main');
      const crumb = document.querySelector('.app-crumb');
      document.querySelector('[data-nav="' + screen + '"]').setAttribute('aria-current', 'page');
      const head = (h1, p) => '<div class="page-head"><h1>' + h1 + '</h1><p>' + p + '</p></div>';
      const table = (heads, rows) => '<table class="stores"><thead><tr>' + heads.map((x) => '<th>' + x + '</th>').join('') + '</tr></thead><tbody>' + rows.map((r) => '<tr>' + r.map((x) => '<td>' + x + '</td>').join('') + '</tr>').join('') + '</tbody></table>';
      const badge = (on, [yes, no]) => '<span class="badge' + (on ? '' : ' off') + '">' + (on ? yes : no) + '</span>';
      const withBadges = (s) => s.rows.map((row) => row.map((cell) => (typeof cell === 'boolean' ? badge(cell, s.badge) : cell)));
      const SCREEN_HTML = {
        dashboard: (t) =>
          head(t.menu.dashboard, t.dashboard.lead) +
          '<div class="stats">' + t.dashboard.stats.map(([label, value, unit]) => '<div class="stat"><span>' + label + '</span><b>' + value + '</b>' + (unit ? '<small>' + unit + '</small>' : '') + '</div>').join('') + '</div>' +
          '<h2 class="section-title">' + t.dashboard.today + '</h2>' +
          table(t.dashboard.heads, t.dashboard.rows),
        stores: (t) => head(t.menu.stores, t.stores.lead) + table(t.stores.heads, withBadges(t.stores)),
        staff: (t) => head(t.menu.staff, t.staff.lead) + table(t.staff.heads, withBadges(t.staff)),
        reports: (t) => head(t.menu.reports, t.reports.lead) + table(t.reports.heads, t.reports.rows),
      };
      // それぞれの画面で、ヘルプを開いたときに最初に出すページ
      const HELP_FOR = { dashboard: 'guide-dashboard', stores: 'guide-store', staff: 'guide-staff', reports: 'guide-report' };

      // ---- 言語の切り替え（ヘッダーの右上。言語の名前はその言語で書く） ----
      const LANG_NAME = {"ja":"日本語","en":"English","zh-CN":"简体中文","zh-TW":"繁體中文","ko":"한국어"};
      const langToggle = document.querySelector('.lang-toggle');
      const langMenu = document.getElementById('lang-menu');
      const langItems = [...langMenu.querySelectorAll('[data-lang]')];
      const setMenuOpen = (open) => {
        langMenu.hidden = !open;
        langToggle.setAttribute('aria-expanded', String(open));
        if (open) langItems.find((item) => item.dataset.lang === lang).focus();
      };
      langToggle.addEventListener('click', () => setMenuOpen(langMenu.hidden));
      for (const item of langItems) {
        item.addEventListener('click', () => {
          setMenuOpen(false);
          langToggle.focus();
          setLanguage(item.dataset.lang);
          showState();
        });
      }
      langMenu.addEventListener('keydown', (event) => {
        const at = langItems.indexOf(document.activeElement);
        if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
          event.preventDefault();
          langItems[(at + (event.key === 'ArrowDown' ? 1 : langItems.length - 1)) % langItems.length].focus();
        } else if (event.key === 'Escape') {
          event.preventDefault();
          setMenuOpen(false);
          langToggle.focus();
        } else if (event.key === 'Tab') {
          setMenuOpen(false);
        }
      });
      document.addEventListener('click', (event) => {
        if (!langMenu.hidden && !event.target.closest('.lang-switch')) setMenuOpen(false);
      });

      /** 枠の文言を今の言語にする（デモのバー・メニュー・ヘッダー・画面の中身） */
      const showFrame = () => {
        const t = FRAME[lang];
        root.lang = lang;
        langToggle.querySelector('.lang-current').textContent = LANG_NAME[lang];
        langToggle.setAttribute('aria-label', t.language + ': ' + LANG_NAME[lang]);
        for (const item of langItems) item.setAttribute('aria-checked', String(item.dataset.lang === lang));
        document.title = t.title;
        for (const el of document.querySelectorAll('[data-t]')) el.textContent = t[el.dataset.t];
        for (const el of document.querySelectorAll('[data-t-label]')) el.setAttribute('aria-label', t[el.dataset.tLabel]);
        for (const el of document.querySelectorAll('[data-menu]')) el.textContent = t.menu[el.dataset.menu];
        crumb.innerHTML = t.appName + ' / <b>' + t.menu[screen] + '</b>';

        if (screen === 'help') {
          main.querySelector('.page-head').outerHTML = head(t.menu.help, t.helpLead);
        } else {
          main.innerHTML = SCREEN_HTML[screen](t);
          document.getElementById('help-panel').setAttribute('aria-label', t.menu.help);
        }
      };

      const viewer = document.createElement('md-pages-viewer');
      viewer.styles = styles;
      viewer.locale = lang;
      if (screen === 'help') {
        // 管理画面の1ページにマニュアルを置く（URL の ?page= に今のページが入る）
        main.innerHTML = '<div class="page-head"></div><div class="card"></div>';
        main.querySelector('.card').append(viewer);
        viewer.pages = PAGES[lang];
      } else {
        // 画面の右にヘルプを重ねる（URL は書き換えない）
        const toggle = document.querySelector('.help-toggle');
        const panel = document.createElement('aside');
        panel.className = 'help-panel';
        panel.id = 'help-panel';
        panel.inert = true;
        viewer.setAttribute('url-param', 'false');
        viewer.currentId = HELP_FOR[screen];
        viewer.pages = PAGES[lang];
        panel.append(viewer);
        document.body.append(panel);
        const placePanel = () => (panel.style.top = document.querySelector('.app-header').getBoundingClientRect().bottom + 'px');
        placePanel();
        addEventListener('resize', placePanel);
        const setOpen = (open) => {
          panel.classList.toggle('open', open);
          panel.inert = !open;
          toggle.setAttribute('aria-expanded', String(open));
        };
        toggle.hidden = false;
        toggle.addEventListener('click', () => setOpen(!panel.classList.contains('open')));
        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape' && panel.classList.contains('open') && !event.defaultPrevented) setOpen(false);
        });
      }

      /** 言語を切り替える：枠の文言と、md-pages-viewer の locale とページのデータ（開いているページはそのまま） */
      function setLanguage(value) {
        if (value === lang) return;
        lang = value;
        showFrame();
        viewer.locale = lang;
        viewer.pages = PAGES[lang];
      }
      showFrame();
      showState();

    </script>
  </body>
</html>
