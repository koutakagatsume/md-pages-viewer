%22%20y%3D%2251%22%20width%3D%2250%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22hsl(0%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2268%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%2273%22%20width%3D%2273%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2290%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%2295%22%20width%3D%2256%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22112%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%22117%22%20width%3D%2279%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22134%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%22139%22%20width%3D%2262%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3C%2Fsvg%3E"},{"id":"admin-roles","parentId":"admin","title":"権限の設定","order":1,"description":"役割ごとにできる操作を決める","md":"# 権限の設定\n\nスタッフには、役割を1つずつ付けます。役割によって、見られるデータとできる操作が決まります。\n\n## 役割の一覧\n\n| 役割 | 店舗の閲覧 | 店舗の編集 | スタッフの管理 | 請求 |\n| --- | --- | --- | --- | --- |\n| 閲覧のみ | ○ | － | － | － |\n| 編集 | ○ | ○ | － | － |\n| 管理 | ○ | ○ | ○ | － |\n| オーナー | ○ | ○ | ○ | ○ |\n\n## 役割ごとの説明\n\n### 閲覧のみ\n\n担当店舗の予約と店舗の情報を見られます。予約の変更やキャンセルはできません。アルバイトのスタッフや、数字を確かめるだけの人に向いています。\n\n### 編集\n\n担当店舗の予約の変更・キャンセルと、店舗の情報の変更ができます。店舗で日々の受付をする人に向いています。\n\n### 管理\n\n編集でできることに加えて、スタッフの招待・役割の変更・利用の停止と、セキュリティの設定ができます。店長や、複数の店舗をまとめる人に向いています。\n\n### オーナー\n\nすべての操作ができます。請求とプランの変更、データの設定、退会ができるのはオーナーだけです。\n\n## 役割を変える\n\nスタッフの詳細画面で「役割」を選び直します。変更はすぐに反映されます。\n\n役割を下げると、そのスタッフが開いている画面のうち、できなくなった操作のボタンは押せなくなります。自分自身の役割は変えられません。\n\n## オーナーを移す\n\nオーナーは組織に1人だけです。別の人に移すと、元のオーナーは「管理」になります。\n\n1. 「組織の設定」→「オーナー」を開く\n2. 新しいオーナーにするスタッフを選ぶ\n3. 確認のため、自分のパスワードを入れて「移す」を押す\n\n新しいオーナーにはメールで知らせが届きます。移した後に元に戻すには、新しいオーナーに移し直してもらう必要があります。\n\n## 担当店舗との関係\n\n役割は、担当店舗の中で使われます。たとえば「編集」の人は、担当している店舗の情報だけを変えられます。オーナーは、担当店舗にかかわらず、すべての店舗を扱えます。\n\n## 変更の記録\n\n役割の変更とオーナーの移動は、[操作の記録](?page=admin-audit) に残ります。\n","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(232%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2246%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22hsl(232%2070%25%2094%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%2251%22%20width%3D%2250%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22hsl(232%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2268%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%2273%22%20width%3D%2273%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2290%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%2295%22%20width%3D%2256%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22112%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%22117%22%20width%3D%2279%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22134%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%22139%22%20width%3D%2262%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3C%2Fsvg%3E"},{"id":"admin-billing","parentId":"admin","title":"請求とお支払い","order":2,"description":"プランの変更、請求書のダウンロード、支払い方法の変更","md":"# 請求とお支払い\n\nプランの変更、請求書のダウンロード、支払い方法の変更を行います。請求に関わる操作ができるのは、オーナーだけです。\n\n## プランを変える\n\n「組織の設定」→「プラン」で選びます。上位のプランへの変更はすぐに、下位のプランへの変更は次の請求日から反映されます。\n\n| プラン | 店舗の数 | 向いている使い方 |\n| --- | --- | --- |\n| スタンダード | 10店舗まで | 1〜数店舗を運営している |\n| ビジネス | 上限なし | 多くの店舗をまとめて管理したい |\n\n下位のプランに変えるときに店舗の数が上限を超えている場合は、先に店舗を「非表示」にしてください。\n\n## 請求日\n\n月額プランは、契約した日を毎月の請求日とします。年額プランは、契約した日を毎年の請求日とします。請求日が月末で、その月にその日がない場合は、月の最後の日を請求日とします。\n\n## 請求書をダウンロードする\n\n「請求履歴」から、月ごとの請求書を PDF でダウンロードできます。\n\n請求書は、請求日の翌日に発行します。発行するとオーナーにメールで知らせが届きます。\n\n### 請求書の宛名\n\n請求書に出す会社名・部署名・担当者名は、「組織の設定」→「請求」で変えられます。変えた宛名は、次の請求書から使われます。\n\n## 支払い方法を変える\n\nクレジットカードと請求書払いから選べます。請求書払いは年額プランだけで使えます。\n\n- クレジットカード：請求日に自動で支払います\n- 請求書払い：請求書の発行から30日以内に振り込んでください\n\n## 支払いに失敗したとき\n\nクレジットカードの期限切れなどで支払いに失敗すると、オーナーにメールが届き、画面の上にお知らせが出ます。14日以内に支払い方法を更新してください。更新すると、すぐにもう一度支払いを行います。\n\n14日を過ぎると、組織の全員が閲覧しかできなくなります。支払いが済むと、元に戻ります。\n\n## 解約する\n\n「組織の設定」→「プラン」の下にある「解約」から手続きします。解約すると、その請求期間の終わりまで使え、その後に退会と同じ扱いになります。データの扱いは [よくある質問](?page=faq) を見てください。\n","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(140%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2244%22%20width%3D%22150%22%20height%3D%2210%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2264%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2290%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22116%22%20width%3D%22120%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%22226%22%20y%3D%22140%22%20width%3D%2260%22%20height%3D%2218%22%20rx%3D%225%22%20fill%3D%22hsl(140%2070%25%2055%25)%22%2F%3E%3C%2Fsvg%3E"},{"id":"admin-security","parentId":"admin","title":"セキュリティ","order":3,"description":"ログインの安全性を高める設定","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(0%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%2256%22%20r%3D%229%22%20fill%3D%22hsl(0%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2250%22%20width%3D%22110%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2261%22%20width%3D%2270%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%2284%22%20r%3D%229%22%20fill%3D%22hsl(0%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2278%22%20width%3D%22141%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2289%22%20width%3D%2287%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%22112%22%20r%3D%229%22%20fill%3D%22hsl(0%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22106%22%20width%3D%22122%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22117%22%20width%3D%22104%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%22140%22%20r%3D%229%22%20fill%3D%22hsl(0%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22134%22%20width%3D%22153%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22145%22%20width%3D%2281%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E"},{"id":"admin-2fa","parentId":"admin-security","title":"2段階認証","order":1,"description":"ログインのときに、パスワードに加えて確認コードを求める","md":"# 2段階認証\n\n2段階認証を使うと、ログインのときに、パスワードに加えて確認コードを求めます。パスワードが漏れても、確認コードがなければログインできません。\n\n## 有効にする\n\n1. 「組織の設定」→「セキュリティ」を開く\n2. 「2段階認証を必須にする」をオンにする\n\n次にログインしたときから、全員に確認コードの入力を求めます。\n\nオンにできるのは、オーナーと管理の役割の人です。オンにする前に、スタッフに知らせておくと、ログインのときに戸惑わずに済みます。\n\n## 確認コードを受け取る方法\n\n- 認証アプリ（おすすめ）\n- SMS\n\n認証アプリは、電波のない場所でもコードを確かめられます。SMS は、電話番号を登録するだけで使えますが、電波の状態によって届くのが遅れることがあります。\n\n## 認証アプリを設定する\n\n1. スマートフォンに認証アプリを入れる\n2. サンプル店舗管理にログインすると、設定の画面に QR コードが出る\n3. 認証アプリで QR コードを読み取る\n4. 認証アプリに出た6桁の数字を入れて「確認」を押す\n\n## SMS を設定する\n\n1. 設定の画面で「SMS で受け取る」を選ぶ\n2. 電話番号を入れて「送信」を押す\n3. 届いた6桁の数字を入れて「確認」を押す\n\n## バックアップコード\n\n設定が終わると、10個のバックアップコードが出ます。スマートフォンが使えないときに、確認コードの代わりに1回ずつ使えます。印刷するか、安全な場所に保存してください。\n\nバックアップコードは、アカウントメニューの「セキュリティ」から作り直せます。作り直すと、前のコードは使えなくなります。\n\n## スマホをなくしたとき\n\n管理者がそのスタッフの2段階認証をいったん解除し、設定し直してもらいます。\n\nバックアップコードがあれば、自分でログインして、新しいスマートフォンで設定し直せます。\n\n## 機種変更するとき\n\n古いスマートフォンが使えるうちに、アカウントメニューの「セキュリティ」で「認証アプリを変える」を押し、新しいスマートフォンで QR コードを読み取ってください。\n","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(260%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2244%22%20width%3D%22150%22%20height%3D%2210%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2264%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2290%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22116%22%20width%3D%22120%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%22226%22%20y%3D%22140%22%20width%3D%2260%22%20height%3D%2218%22%20rx%3D%225%22%20fill%3D%22hsl(260%2070%25%2055%25)%22%2F%3E%3C%2Fsvg%3E"},{"id":"admin-password","parentId":"admin-security","title":"パスワードのルール","order":2,"description":"文字数や使える文字、変更の間隔を決める","md":"# パスワードのルール\n\n組織のスタッフが使うパスワードのルールを決めます。ルールを決められるのは、オーナーと管理の役割の人です。\n\n## 決められること\n\n| 項目 | 選べる値 | 初期値 |\n| --- | --- | --- |\n| 最低の文字数 | 8〜32文字 | 10文字 |\n| 記号を必須にする | する・しない | しない |\n| 変更を求める間隔 | なし・90日・180日 | なし |\n\n## 使える文字\n\nパスワードには、英大文字・英小文字・数字・記号を使えます。全角の文字と空白は使えません。\n\n「記号を必須にする」をオンにすると、次の記号のうち1つ以上を含める必要があります。\n\n~~~text\n! # $ % & ( ) * + - . / : ; = ? @ [ ] ^ _ { | } ~\n~~~\n\n## 変更を求める間隔\n\n「変更を求める間隔」を90日か180日にすると、前にパスワードを変えた日からその日数がたったときに、ログインの後でパスワードの変更を求めます。変えるまでは、ほかの画面に進めません。\n\n最近は、定期的な変更を求めず、長く推測されにくいパスワードを使うほうが安全と考えられています。特に理由がなければ「なし」のままにしてください。\n\n## ロックの条件\n\n5回続けて間違えると、30分ロックします。\n\n~~~text\n例：A1b2C3d4e5（10文字・英大文字・英小文字・数字）\n~~~\n\n## ルールを変えたとき\n\nルールを厳しくしても、今のパスワードはそのまま使えます。新しいルールは、次にパスワードを変えるときから使われます。\n\nすぐに全員に新しいルールのパスワードにしてほしい場合は、「組織の設定」→「セキュリティ」で「全員にパスワードの変更を求める」を押します。次にログインしたときに、変更を求めます。\n","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(100%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2244%22%20width%3D%22150%22%20height%3D%2210%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2264%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2290%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22116%22%20width%3D%22120%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%22226%22%20y%3D%22140%22%20width%3D%2260%22%20height%3D%2218%22%20rx%3D%225%22%20fill%3D%22hsl(100%2070%25%2055%25)%22%2F%3E%3C%2Fsvg%3E"},{"id":"admin-audit","parentId":"admin","title":"操作の記録","order":4,"description":"誰がいつ何を変更したかを確かめる","md":"# 操作の記録\n\n誰がいつ何を変更したかを確かめられます。操作の記録を見られるのは、オーナーと管理の役割の人です。\n\n## 記録を見る\n\n「組織の設定」→「操作の記録」で、直近90日の操作を新しい順に表示します。\n\n## 記録される操作\n\n- ログイン・ログアウト\n- 店舗とスタッフの追加・変更・削除\n- 権限とプランの変更\n\nほかに、次の操作も記録されます。\n\n| 操作 | 記録の例 |\n| --- | --- |\n| データの書き出し | 予約を書き出した（2,340件） |\n| セキュリティの設定 | 2段階認証を必須にした |\n| ログインの失敗 | パスワードの誤りでロックした |\n| オーナーの移動 | オーナーを移した |\n\n予約の受け付けや変更は、操作の記録ではなく、各予約の「履歴」に残ります。\n\n## 記録の項目\n\n| 項目 | 内容 |\n| --- | --- |\n| 日時 | 操作した日時（秒まで） |\n| 操作した人 | スタッフの名前とメールアドレス |\n| 操作 | 操作の種類 |\n| 対象 | 操作した店舗・スタッフなど |\n| 場所 | 操作した IP アドレス |\n\n記録の行を押すと、変更の前と後の値が出ます。\n\n## 絞り込む\n\nスタッフ・操作の種類・期間で絞り込めます。結果は [データの書き出し](?page=guide-export) と同じ手順で CSV にできます。\n\n## 保存する期間\n\n操作の記録は90日間保存し、それより古いものは毎月1日に削除します。長く残しておきたい場合は、月に一度、書き出しておいてください。\n","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(210%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%2256%22%20r%3D%229%22%20fill%3D%22hsl(210%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2250%22%20width%3D%22110%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2261%22%20width%3D%2270%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%2284%22%20r%3D%229%22%20fill%3D%22hsl(210%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2278%22%20width%3D%22141%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2289%22%20width%3D%2287%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%22112%22%20r%3D%229%22%20fill%3D%22hsl(210%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22106%22%20width%3D%22122%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22117%22%20width%3D%22104%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%22140%22%20r%3D%229%22%20fill%3D%22hsl(210%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22134%22%20width%3D%22153%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22145%22%20width%3D%2281%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E"},{"id":"reference","parentId":"example","title":"設定項目の一覧","description":"画面ごとの設定項目と、選べる値・初期値の一覧","md":"# 設定項目の一覧\n\nサンプル店舗管理で変えられる設定を、画面ごとにまとめた一覧です。手順は操作ガイドの各ページで説明しています。ここでは、項目の意味と選べる値、初期値を確かめるときに使ってください。\n\n設定を変えられる人は、役割によって異なります。役割ごとにできる操作は [権限の設定](?page=admin-roles) を見てください。\n\n## 店舗の設定\n\nメニューの「店舗」で店舗を選び、「設定」タブを開くと変えられます。店舗ごとに別々の値を持ちます。\n\n### 基本情報\n\n| 項目 | 内容 | 入力の決まり |\n| --- | --- | --- |\n| 店舗名 | 画面や帳票、予約の画面に出る名前 | 40文字まで |\n| 店舗コード | 書き出しや外部との連携で店舗を見分ける番号 | 半角英数字8文字まで。登録した後は変えられない |\n| 住所 | 予約の画面の地図と案内に出る | 郵便番号を入れると自動で入る |\n| 電話番号 | 予約の画面に出る | ハイフンあり・なしのどちらでも可 |\n| メールアドレス | 予約の控えを送るときの送り主 | 1件だけ |\n| 店舗の紹介 | 予約の画面で店舗名の下に出る文章 | 400文字まで |\n\n店舗名を変えても、それまでに書き出した CSV や帳票の店舗名は変わりません。過去の帳票と見比べるときは、店舗コードを使ってください。\n\n### 営業時間\n\n曜日ごとに、開店と閉店の時刻を15分単位で入れます。昼の休憩がある場合は「休憩を入れる」を押し、休憩の始まりと終わりを入れます。休憩の間は予約を受け付けません。\n\n- 閉店の時刻は、開店の時刻より後にします。日付をまたぐ営業は、閉店を「24:00」以降（最大「29:00」）で入れます\n- 定休日は「休み」にチェックを入れます\n- 祝日だけ別の時間にする場合は、「祝日」の行に入れます。空のままなら、その曜日の時間を使います\n\n### 臨時休業日\n\n年末年始や改装などで休む日を、日付を指定して登録します。期間で登録することもできます。登録した日は予約の画面で選べなくなり、すでに入っている予約は「臨時休業日の予約」として一覧の上に出ます。お客様への連絡は自動では行わないので、一覧から一人ずつ連絡してください。\n\n臨時休業日は、1年先まで登録できます。過ぎた日は、自動で一覧から消えます。\n\n### 予約の受付\n\n| 項目 | 選べる値 | 初期値 |\n| --- | --- | --- |\n| 受付の開始 | 1〜180日前から | 60日前から |\n| 受付の締め切り | 当日〜7日前まで（時刻も指定） | 前日の18:00まで |\n| 1枠の長さ | 15分・30分・60分 | 30分 |\n| 1枠で受ける数 | 1〜20件 | 1件 |\n| キャンセルの期限 | 予約の0〜72時間前まで | 24時間前まで |\n\n1枠で受ける数を2件以上にすると、同じ時間に複数のお客様の予約が入ります。スタッフの人数に合わせて決めてください。\n\nキャンセルの期限を過ぎると、お客様は予約の画面からキャンセルできなくなり、電話で連絡するよう案内が出ます。\n\n## スタッフの設定\n\nメニューの「スタッフ」でスタッフを選ぶと、詳細画面で変えられます。自分の情報の一部は、本人がアカウントメニューから変えることもできます。\n\n### 基本情報\n\n| 項目 | 内容 | 本人が変えられるか |\n| --- | --- | --- |\n| 名前 | 画面や予約の担当者の欄に出る名前 | 変えられる |\n| メールアドレス | ログインと通知に使う | 変えられる（確認のメールが届く） |\n| 役割 | 閲覧のみ・編集・管理・オーナー | 変えられない |\n| 担当店舗 | 予約や通知の対象になる店舗 | 変えられない |\n\n### 招待\n\n招待メールの有効期限は7日間です。期限が切れた招待は、一覧に「期限切れ」と出ます。もう一度招待すると、新しいリンクのメールが届きます。\n\n招待したままのスタッフは、スタッフの数に数えません。プランのスタッフの数の上限に近いときは、使わない招待を取り消してください。\n\n### 勤務の予定\n\nスタッフごとに、勤務する曜日と時間を入れられます。入れておくと、予約の画面でお客様が担当者を選べるようになります。\n\n- 勤務の予定は、店舗の営業時間の中だけで入れられます\n- 複数の店舗を担当している場合は、店舗ごとに入れます\n- 休みの日は、臨時休業日と同じように日付で登録します\n\n### 利用の停止\n\n退職などで使わなくなったスタッフは、削除せずに「利用を停止」にできます。停止したスタッフはログインできなくなりますが、担当した予約や操作の記録には名前が残ります。停止したスタッフは、スタッフの数に数えません。\n\n## 通知の設定\n\n右上のアカウントメニューの「通知の設定」で、自分が受け取る通知を選びます。通知の設定はスタッフごとに別々で、ほかの人の設定は変えられません。\n\n### 受け取る通知\n\n| 通知 | メール | アプリ | 初期値 |\n| --- | --- | --- | --- |\n| 新しい予約 | ○ | ○ | 受け取る |\n| 予約のキャンセル | ○ | ○ | 受け取る |\n| 臨時休業日の予約 | ○ | ○ | 受け取る |\n| 月次レポート | ○ | － | 受け取る |\n| 招待の受け入れ | ○ | － | 受け取らない |\n\n通知の対象は、担当している店舗の予約だけです。オーナーと管理の役割の人は、「すべての店舗」を選べます。\n\n### 受け取らない時間帯\n\n夜間に通知を受け取りたくない場合は、「受け取らない時間帯」を入れます。その間の通知は、時間帯が終わったときにまとめて届きます。メールとアプリで別々に決められます。\n\n### まとめて受け取る\n\n予約が多い店舗では、通知を1件ずつではなく、1時間ごとにまとめて受け取れます。まとめた通知には、その1時間の予約とキャンセルの一覧が入ります。\n\n## 請求の設定\n\n「組織の設定」→「請求」で変えられます。変えられるのはオーナーだけです。\n\n### プラン\n\n| プラン | 店舗の数 | 支払いの単位 |\n| --- | --- | --- |\n| スタンダード | 10店舗まで | 月額・年額 |\n| ビジネス | 上限なし | 月額・年額 |\n\n上位のプランへの変更はすぐに、下位のプランへの変更は次の請求日から反映されます。下位のプランに変えるときに店舗の数が上限を超えている場合は、先に店舗を「非表示」にしてください。\n\n### 請求書の宛名\n\n請求書に出す会社名・部署名・担当者名を入れます。変えた宛名は、次の請求書から使われます。すでに発行した請求書の宛名は変わりません。\n\n### 支払い方法\n\n- クレジットカード：月額・年額のどちらでも使えます\n- 請求書払い：年額プランだけで使えます。請求書の発行から30日以内に振り込んでください\n\n## セキュリティの設定\n\n「組織の設定」→「セキュリティ」で変えられます。変えられるのは、オーナーと管理の役割の人です。\n\n### 2段階認証\n\n| 項目 | 選べる値 | 初期値 |\n| --- | --- | --- |\n| 2段階認証を必須にする | する・しない | しない |\n| 確認コードの受け取り方 | 認証アプリ・SMS | 本人が選ぶ |\n\n必須にすると、次にログインしたときから全員に確認コードの入力を求めます。手順は [2段階認証](?page=admin-2fa) を見てください。\n\n### パスワード\n\n| 項目 | 選べる値 | 初期値 |\n| --- | --- | --- |\n| 最低の文字数 | 8〜32文字 | 10文字 |\n| 記号を必須にする | する・しない | しない |\n| 変更を求める間隔 | なし・90日・180日 | なし |\n\nルールを厳しくしても、今のパスワードはそのまま使えます。新しいルールは、次にパスワードを変えるときから使われます。\n\n### ログインの制限\n\n5回続けてパスワードを間違えると、そのアカウントを30分ロックします。ロックは、管理者がスタッフの詳細画面から解除することもできます。\n\nログインできる場所を会社のネットワークだけにしたい場合は、「ログインを許可する IP アドレス」に入れます。入れていないときは、どこからでもログインできます。\n\n## データの設定\n\n「組織の設定」→「データ」で変えられます。変えられるのはオーナーだけです。\n\n### 書き出しの形式\n\n| 項目 | 選べる値 | 初期値 |\n| --- | --- | --- |\n| 文字コード | UTF-8・Shift_JIS | UTF-8 |\n| 日付の書き方 | 2026/04/01・2026-04-01 | 2026/04/01 |\n| 見出しの行 | 入れる・入れない | 入れる |\n\n一度に書き出せるのは10万件までです。手順は [データの書き出し](?page=guide-export) を見てください。\n\n### 保存する期間\n\n| データ | 保存する期間 |\n| --- | --- |\n| 予約 | 予約の日から3年 |\n| 操作の記録 | 90日 |\n| 月次レポート | 2年 |\n\n保存する期間を過ぎたデータは、毎月1日に削除します。残しておきたいデータは、その前に書き出してください。\n\n### 退会\n\n退会から30日後に、組織のすべてのデータを削除します。30日以内であれば、オーナーがログインすると元に戻せます。\n\n## 用語\n\n### 枠\n\n予約を受け付ける時間の単位です。長さは「1枠の長さ」で決めます。\n\n### 担当店舗\n\nスタッフが予約や通知の対象にする店舗です。\n\n### 組織\n\nサンプル店舗管理を契約している単位です。店舗とスタッフは、すべて1つの組織に属します。\n","order":4,"thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2246%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2094%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%2251%22%20width%3D%2250%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2268%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%2273%22%20width%3D%2273%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2290%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%2295%22%20width%3D%2256%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22112%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%22117%22%20width%3D%2279%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22134%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%22139%22%20width%3D%2262%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3C%2Fsvg%3E"},{"id":"faq","parentId":"example","title":"よくある質問","order":5,"description":"よく寄せられる質問と回答","md":"# よくある質問\n\n## ログインとアカウント\n\n### パスワードを忘れました\n\nログイン画面の「パスワードを忘れた方」から再設定できます。手順は [ログイン](?page=guide-login) を見てください。\n\n### 2段階認証のコードが届きません\n\nSMS で受け取る場合は、電話番号が正しいか確かめてください。認証アプリを使うと、電波のない場所でもコードを確かめられます（[2段階認証](?page=admin-2fa)）。\n\n### メールアドレスを変えたい\n\nアカウントメニューの「プロフィール」で変えられます。新しいアドレスに確認のメールが届き、リンクを開くと変更が終わります。\n\n## 店舗\n\n### 店舗の数に上限はありますか\n\nプランによって異なります。スタンダードは10店舗まで、ビジネスは上限なしです。\n\n### 店舗を別の組織に移せますか\n\nできません。移す先の組織で店舗を登録し直し、[データの書き出し](?page=guide-export) で書き出した内容を取り込んでください。\n\n### 店舗コードを間違えて登録しました\n\n店舗コードは、登録した後は変えられません。予約が入る前なら、店舗を削除して登録し直してください。\n\n## 予約\n\n### お客様から電話で予約を受けました\n\n予約の一覧の「追加」から入れられます。詳しくは [予約の管理](?page=guide-booking) を見てください。\n\n### 同じ時間に2件の予約を受けたい\n\n店舗の「予約の受付」で、「1枠で受ける数」を2件以上にします。\n\n### 予約の画面に臨時休業日が出ません\n\n臨時休業日を登録した店舗と、予約の画面の店舗が同じか確かめてください。登録は店舗ごとです。\n\n## スタッフ\n\n### スタッフが招待メールを受け取れません\n\n迷惑メールのフォルダを確かめてください。見つからない場合は、招待を取り消してから、もう一度招待してください。\n\n### 辞めたスタッフはどうすればいいですか\n\n削除せずに「利用を停止」にすると、担当した予約の記録に名前が残ります（[スタッフの追加](?page=guide-staff)）。\n\n## 請求と契約\n\n### 年の途中でプランを変えられますか\n\n変えられます。上位のプランへはすぐに、下位のプランへは次の請求日から変わります（[請求とお支払い](?page=admin-billing)）。\n\n### 退会するとデータはどうなりますか\n\n退会から30日後にすべてのデータを削除します。30日以内であれば、オーナーがログインすると元に戻せます。\n\n## データ\n\n### 書き出した CSV が文字化けします\n\nExcel で開く場合は、「データ」タブの「テキストまたは CSV から」で読み込んでください。いつも Excel で使う場合は、文字コードを Shift_JIS に変えられます。\n\n### 古い予約はいつまで見られますか\n\n予約の日から3年間です。それより古いものは削除されます（[設定項目の一覧](?page=reference)）。\n","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(40%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2244%22%20width%3D%22190%22%20height%3D%2234%22%20rx%3D%226%22%20fill%3D%22hsl(40%2070%25%2094%25)%22%2F%3E%3Ccircle%20cx%3D%22114%22%20cy%3D%2261%22%20r%3D%228%22%20fill%3D%22hsl(40%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%22130%22%20y%3D%2256%22%20width%3D%22120%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2286%22%20width%3D%22190%22%20height%3D%2234%22%20rx%3D%226%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22114%22%20cy%3D%22103%22%20r%3D%228%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22130%22%20y%3D%2298%22%20width%3D%22100%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22128%22%20width%3D%22190%22%20height%3D%2230%22%20rx%3D%226%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E"},{"id":"guide-booking","parentId":"guide","title":"予約の管理","description":"予約の一覧の見方と、受け付け・変更・キャンセル","md":"# 予約の管理\n\nお客様からの予約は、メニューの「予約」でまとめて扱います。予約の画面から入った予約も、電話で受けて入れた予約も、同じ一覧に並びます。\n\n## 予約の一覧\n\n予約の一覧には、担当している店舗の予約が、日付と時刻の順に並びます。\n\n| 列 | 内容 |\n| --- | --- |\n| 日時 | 予約の日付と開始の時刻 |\n| お客様 | お客様の名前。押すと予約の詳細が開く |\n| 店舗 | 予約を受けた店舗 |\n| 担当者 | お客様が選んだスタッフ。選んでいない場合は空 |\n| 状態 | 予約済み・来店・キャンセル・無断キャンセル |\n| 受付の経路 | 予約の画面・電話・その他 |\n\n### 表示を切り替える\n\n一覧の上で、「日」「週」「月」を選べます。「日」では時間ごとの表、「週」と「月」ではカレンダーの形で表示します。\n\n複数の店舗を担当している場合は、「店舗」で表示する店舗を選べます。\n\n### 絞り込む\n\n状態・担当者・受付の経路で絞り込めます。たとえば「状態：キャンセル」で絞り込むと、キャンセルされた予約だけが並びます。\n\n## 予約を受ける\n\nお客様が予約の画面から予約すると、自動で一覧に入ります。新しい予約の通知を受け取る設定にしていれば、メールやアプリで知らせが届きます（[通知の設定](?page=guide-notice)）。\n\n### 電話で受けた予約を入れる\n\n1. 予約の一覧の右上の「追加」を押す\n2. 店舗・日時・お客様の名前と電話番号を入れる\n3. 担当者を選ぶ場合は「担当者」で選ぶ\n4. 「保存」を押す\n\n受付の経路は「電話」になります。お客様のメールアドレスを入れると、予約の控えがお客様に届きます。\n\n### 同じ時間に重なったとき\n\n> [!WARNING]\n> 1つの枠で受けられる数を超える予約は入れられません。どうしても受ける場合は、店舗の「予約の受付」で「1枠で受ける数」を増やすか、別の時間を案内してください。\n\n## 予約を変更する\n\n予約の詳細で「変更」を押し、日時や担当者を選び直して「保存」を押します。お客様のメールアドレスがある場合は、変更の知らせがお客様に届きます。\n\n変更の前と後の内容は、予約の詳細の「履歴」に残ります。\n\n## 予約をキャンセルする\n\n### お客様がキャンセルしたとき\n\nお客様は、キャンセルの期限までなら、予約の画面から自分でキャンセルできます。期限を過ぎた後に電話でキャンセルの連絡を受けた場合は、予約の詳細で「キャンセル」を押してください。\n\n### 店舗の都合でキャンセルするとき\n\n予約の詳細で「キャンセル」を押し、理由で「店舗の都合」を選びます。お客様への連絡は自動では行わないので、電話などで連絡してください。\n\n## 来店しなかったとき\n\n予約の時刻を過ぎてもお客様が来なかった場合は、予約の詳細で「無断キャンセル」を押します。無断キャンセルは、月次レポートで別に数えます。\n\n同じお客様の無断キャンセルが続く場合は、お客様の詳細に「メモ」を残しておくと、次の予約のときにほかのスタッフも気づけます。\n\n## 臨時休業日の予約\n\n臨時休業日を登録した日にすでに予約がある場合は、一覧の上に「臨時休業日の予約」として出ます。一件ずつお客様に連絡し、日時を変更するかキャンセルしてください。すべて片付くと、表示は消えます。\n\n## 予約を印刷する\n\n「日」の表示で右上の「印刷」を押すと、その日の予約の一覧を印刷できます。受付に置いておく場合に使ってください。印刷には、お客様の名前と電話番号が入ります。取り扱いに注意してください。\n\n## よくあるつまずき\n\n| 困っていること | 確かめること |\n| --- | --- |\n| 予約が一覧に出ない | 担当店舗に、その予約の店舗が入っているか |\n| 予約を変更できない | 役割が「閲覧のみ」になっていないか |\n| お客様に変更の知らせが届かない | お客様のメールアドレスが入っているか |\n| 予約の画面で日が選べない | 臨時休業日や受付の締め切りに当たっていないか |\n","order":5,"thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%2 3D%22130%22%20width%3D%2228%22%20height%3D%2224%22%20rx%3D%224%22%20fill%3D%22hsl(20%2070%25%2055%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22224%22%20y%3D%22130%22%20width%3D%2228%22%20height%3D%2224%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22256%22%20y%3D%22130%22%20width%3D%2228%22%20height%3D%2224%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E"},{"id":"guide-report","parentId":"guide","title":"レポートの見方","description":"月ごとの集計の項目と、店舗ごとの比べ方","md":"# レポートの見方\n\nメニューの「レポート」では、予約を月ごとに集計した結果を見られます。毎月1日には、前の月の分が月次レポートとしてメールでも届きます。\n\n## 月次レポートとは\n\n月次レポートは、前の月の予約の件数やキャンセルの割合を、店舗ごとにまとめたものです。毎月1日の朝に、月次レポートを受け取る設定にしている人へメールで届きます。\n\nメールには主な数字だけが入っています。詳しい内訳は、メールのリンクからレポートの画面を開いて確かめてください。\n\n## レポートの項目\n\n| 項目 | 意味 |\n| --- | --- |\n| 予約の件数 | その月に予約の日が入っている予約の数（キャンセルを除く） |\n| 新しいお客様 | その月に初めて予約したお客様の数 |\n| キャンセル | キャンセルされた予約の数 |\n| キャンセルの割合 | キャンセルを、キャンセルを含む予約の全体で割った割合 |\n| 無断キャンセル | 来店しなかった予約の数 |\n| 予約の画面からの割合 | 予約の画面から入った予約の割合（電話などを除く） |\n| 埋まった枠の割合 | 受け付けた枠のうち、予約が入った枠の割合 |\n\n### 埋まった枠の割合\n\n営業時間と1枠の長さから、その月に受けられた枠の数を出し、そのうち予約が入った枠の割合を出します。臨時休業日と休憩の時間は、受けられた枠に数えません。\n\n## 店舗ごとに比べる\n\nレポートの画面で「店舗ごと」を選ぶと、店舗を横に並べた表になります。列の見出しを押すと、その項目で並べ替えられます。\n\n担当している店舗だけが並びます。オーナーは、すべての店舗を比べられます。\n\n## 期間を指定して作る\n\n「期間」で始まりと終わりの月を選ぶと、その期間の合計と月ごとの推移を表示します。最大で24か月分です。\n\n## レポートを書き出す\n\nレポートの画面の右上の「書き出し」から、PDF か CSV で書き出せます。PDF は会議の資料に、CSV は表計算ソフトでの集計に向いています。\n\n## 数字が合わないとき\n\n- 予約の一覧と件数が合わない場合は、キャンセルと無断キャンセルを含めているか確かめてください。レポートの「予約の件数」には含めません\n- 月の途中で営業時間を変えた場合、埋まった枠の割合は、日ごとのその時点の営業時間で計算します\n- 予約の日を別の月に変更した予約は、変更した後の月で数えます\n","order":7,"thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224 面に出ることがあったのを直しました\n\n## 2026年8月\n\n### 追加\n\n- 書き出しの文字コードを Shift_JIS にできるようにしました\n- ダッシュボードのエリアを並べ替えられるようにしました\n\n### 変更\n\n- パスワードの最低の文字数の初期値を、8文字から10文字にしました\n\n## 2026年7月\n\n### 追加\n\n- 2段階認証のバックアップコードを作り直せるようにしました\n- 操作の記録に「場所（IP アドレス）」を追加しました\n\n### 直したこと\n\n- 祝日の営業時間が、振替休日に使われなかったのを直しました\n\n## 2026年6月\n\n### 追加\n\n- 臨時休業日を期間で登録できるようにしました\n- レポートを PDF で書き出せるようにしました\n\n## 2026年5月\n\n### 追加\n\n- スタッフの利用を停止できるようにしました。停止したスタッフはスタッフの数に数えません\n\n### 変更\n\n- 招待メールの有効期限を、3日間から7日間にしました\n\n## 2026年4月\n\n### 追加\n\n- 勤務の予定を入れると、お客様が予約の画面で担当者を選べるようにしました\n- ログインを許可する IP アドレスを決められるようにしました\n\n## 2026年3月\n\n### 追加\n\n- 店舗を非表示にできるようにしました。非表示の店舗はプランの店舗の数に数えません\n- 予約の一覧を印刷できるようにしました\n\n### 直したこと\n\n- 書き出した CSV の日付が、まれに1日ずれていたのを直しました\n\n## 2026年2月\n\n### 追加\n\n- iPhone・Android 向けのアプリを公開しました。予約の確認と通知の受け取りができます\n\n## 2026年1月\n\n### 追加\n\n- サンプル店舗管理の提供を始めました\n","order":6,"thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(280%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3 viewer\n\nA library that shows hierarchical Markdown documents in the browser. Load it with one `\u003cscript>` line and it works with any server-side language. It is made for putting user manuals and help inside business apps and admin screens.\n\n> [!NOTE]\n> This manual is shown with md-pages-viewer too. The page list on the left, the search box at the top, the contents on the right and the previous and next pages at the end of the body are all made from the page data.\n\n## What it does\n\n- Makes the toolbar (where you are and a search box), the sidebar, the page contents and the links to the previous and next pages from your page data\n- Takes each body as a Markdown string or as the URL of an md file (on S3 or your server's storage)\n- Draws everything in a Shadow DOM, so its CSS and the host page's CSS do not affect each other\n- Sanitizes all the HTML it shows with DOMPurify\n\nStoring the data and the API that returns the page list are up to you. Return them in the shape of the [page data](?page=doc-data), and any database or table layout works.\n\n## When to use it\n\n- To build a user manual or help into a business app or an admin screen\n- To keep the manual in a database or on S3 and change it without deploying the app again\n- To open the help about a screen right from that screen (choose the page with `currentId`)\n\nStatic site generators such as VitePress and Docusaurus build a separate site for the manual from Markdown. md-pages-viewer goes inside the screens of the app you already have, and shows the page data it gets at run time.\n\n## How this manual is organized\n\n| Page | What it covers |\n| --- | --- |\n| [Usage](?page=doc-usage) | From loading the script to the page data, options, images and links |\n| [Changing the look](?page=doc-look) | CSS variables, `::part()` and `styles` |\n| [Features](?page=doc-features) | The screen, thumbnails, Japanese line breaking, callouts and the language of the screen |\n| [Security](?page=doc-security) | n\u003cscript src=\"https://cdn.jsdelivr.net/npm/md-pages-viewer@1/dist/md-pages-viewer.js\">\u003c/script>\n~~~\n\n> [!NOTE]\n> The CSS is inside this file, so no `\u003clink>` is needed. The file is about 151 KB (about 48 KB gzipped) and includes the Markdown converter (marked) and the sanitizer (DOMPurify).\n\nWhere the CDN cannot be reached, put `md-pages-viewer.js` on your own server and load it from there.\n\n## From npm\n\nIn a project with a build step, install it from npm.\n\n~~~bash\nnpm install md-pages-viewer\n~~~\n\n~~~js\nimport { MdPagesViewer } from 'md-pages-viewer';\n~~~\n\nImporting it also makes the `\u003cmd-pages-viewer>` tag available."},{"id":"doc-place","parentId":"doc-usage","order":2,"title":"Placing the viewer","description":"With the tag, or with new","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(260%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(260%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2256%22%20width%3D%22240%22%20height%3D%22106%22%20rx%3D%226%22%20fill%3D%22%23f3f4f6%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2264%22%20width%3D%22120%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(260%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2280%22%20width%3D%22170%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2296%22%20width%3D%22140%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(260%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2280%22%20y%3D%22112%22%20width%3D%22110%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%22128%22%20width%3D%2290%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(260%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22144%22%20width%3D%2260%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3C%2Fsvg%3E","md":"# Placing the viewer\n\n## With the tag\n\n~~~html\n\u003cmd-pages-viewer pages=\"/api/manual/pages\" current-id=\"intro\">\u003c/md-pages-viewer>\n~~~\n\nArrays, functions and objects (`texts`) are set as properties of the element in JS.\n\n~~~js\nconst viewer = document.querySelector('md-pages-viewer');\nviewer.imageResolver = (path) => `/api/manual/image?path=${encodeURIComponent(path)}`;\n~~~\n\n## With new\n\nYou can also create it with `new`. The contents of the element you give are replaced.\n\n~~~js\nconst viewer = new MdPagesViewer('#manual', {\n  pages: '/api/manual/pages',\n  currentId: 'intro',\n});\n\n// After it is shown, change options through the element's properties\nviewer.element.currentId = 'faq';\n~~~\n\n## Height and width\n\nIf you do not set the element's height, it grows with the body. When you scroll, the toolbar stays at the top of the window, with the sidebar and the contents under it. If you set a height, the sidebar, the body and the contents each scroll on their own under the toolbar.\n\nWhen the element is narrower than 768px, the sidebar opens over the body from a button in the toolbar, and the contents are folded above the body.\n\n> [!TIP]\n> Open \"Stores\" or another item in the left menu and press \"Help\" in the header: a 480px wide help panel opens on the right. You can see the layout for widths under 768px there."},{"id":"doc-data","parentId":"doc-usage","order":3,"title":"Page data","description":"The fields of the page array, and child page lists","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(160%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(160%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2262%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2094%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2269%22%20width%3D%2240%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2269%22%20width%3D%2270%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2286%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2293%22%20width%3D%2259%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2293%22%20width%3D%2293%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%22110%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22117%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22117%22%20width%3D%2276%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%22134%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22141%22%20width%3D%2267%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22141%22%20width%3D%2299%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E","md":"# Page data\n\nPass the pages as a flat array, with `parentId` for the hierarchy. If you give `pages` a URL, return this array itself as JSON.\n\n## Fields\n\n| Field | Type | Required | Description |\n| --- | --- | --- | --- |\n| `id` | string / number | Yes | A unique ID for the page |\n| `parentId` | string / number / null | Yes | The ID of the parent page. null at the top level |\n| `title` | string | Yes | The name shown in the breadcrumb and the sidebar |\n| `description` | string | No | A description shown in child page lists and search results |\n| `thumbnail` | string | No | The path or URL of an image shown at the top of the page's card, when a child page list is shown as cards |\n| `md` | string | No | The body in Markdown |\n| `src` | string | No | The URL of an md file |\n| `order` | number | No | The order among the pages at the same level (smallest first). Pages without it follow the others, in the order of the array |\n\n~~~json\n[\n  { \"id\": \"intro\", \"parentId\": null, \"title\": \"Introduction\", \"md\": \"# Introduction\", \"order\": 1 },\n  { \"id\": \"login\", \"parentId\": \"intro\", \"title\": \"Signing in\", \"src\": \"/storage/manual/login.md\", \"order\": 1 },\n  { \"id\": \"faq\", \"parentId\": null, \"title\": \"FAQ\", \"src\": \"https://xxx.s3.amazonaws.com/manual/faq.md\", \"order\": 2 },\n  { \"id\": \"guide\", \"parentId\": null, \"title\": \"User guide\", \"order\": 3 },\n  { \"id\": \"guide-start\", \"parentId\": \"guide\", \"title\": \"Getting started\", \"description\": \"The first things to set up\", \"md\": \"# Getting started\", \"order\": 1 }\n]\n~~~\n\nA page with `src` is fetched when it is first opened, and kept until the screen is reloaded.\n\n## Child page lists\n\nA page with neither `md` nor `src` lists its direct child pages as a table, in place of a body. Use it for a parent page that groups child pages, like a category. Each row shows the child page's name, its `description` (up to two lines), and the number of chapters (the h2 headings of its `md`) or of child pages. A button in the toolbar switches the list to cards. Pages with `src` are not fetched for the list.\n\n> [!TIP]\n> \"Usage\", \"Changing the look\" and \"Features\" in this manual are child page lists too. Open one and press \"Card view\" at the top right to see cards with thumbnails. See [Child page lists and thumbnails](?page=doc-thumbnail)."},{"id":"doc-options","parentId":"doc-usage","order":4,"title":"Options","description":"pages, currentId, baseUrl and six more","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(30%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(30%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2262%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22hsl(30%2070%25%2094%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2269%22%20width%3D%2240%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22hsl(30%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2269%22%20width%3D%2270%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2286%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2293%22%20width%3D%2259%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2293%22%20width%3D%2293%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%22110%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22117%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22117%22%20width%3D%2276%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%22134%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22141%22%20width%3D%2267%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22141%22%20width%3D%2299%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E","md":"# Options\n\n| Option | Attribute | Type | Description |\n| --- | --- | --- | --- |\n| `pages` | `pages` (URL only) | array / URL | The page data, or a URL that returns it |\n| `currentId` | `current-id` | string / number | The ID of the page to show. On the first show, `?page=` in the URL comes first. Setting it after the viewer is shown switches to that page |\n| `baseUrl` | `base-url` | string | What relative paths in `md` pages are based on. If not set, the URL of the host page |\n| `imageResolver` | None | function | A function that takes an image's path and the page data, and returns the URL to show |\n| `fetch` | None | function | The function used to get the page list and the bodies (the same arguments and return value as the browser's `fetch`). Use it to send cookies or an authorization header to an API on another origin |\n| `urlParam` | `url-param` | string / false | The name of the query in the URL (default `page`). `false` leaves the URL as it is |\n| `styles` | None | string | CSS added inside the viewer (see [Styling the body](?page=doc-styles)) |\n| `locale` | `locale` | string | The language of the viewer's own words (default `ja`; see [Language and wording](?page=doc-locale)) |\n| `texts` | None | object | Changes the viewer's own words one by one (see [Language and wording](?page=doc-locale)) |\n\n> [!IMPORTANT]\n> When you use `fetch` or `imageResolver`, set `pages` as a property, not as an attribute, and after them."},{"id":"doc-sto
