0y%3D%22130%22%20width%3D%2228%22%20height%3D%2224%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22160%22%20y%3D%22130%22%20width%3D%2228%22%20height%3D%2224%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22192%22%20y%3D%22130%22%20width%3D%2228%22%20height%3D%2224%22%20rx%3D%224%22%20fill%3D%22hsl(280%2070%25%2055%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22224%22%20y%3D%22130%22%20width%3D%2228%22%20height%3D%2224%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22256%22%20y%3D%22130%22%20width%3D%2228%22%20height%3D%2224%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E"}],"ko":[{"id":"doc-intro","parentId":null,"order":1,"title":"소개","md":"# md-pages-viewer\n\n계층 구조가 있는 Markdown 문서를 브라우저에 표시하는 라이브러리입니다. `\u003cscript>` 한 줄만 불러오면 되므로 서버 측 언어와 관계없이 넣을 수 있습니다. 업무용 앱이나 관리 화면 안에 사용 매뉴얼과 도움말을 두는 용도로 만들었습니다.\n\n> [!NOTE]\n> 이 매뉴얼도 md-pages-viewer로 표시하고 있습니다. 왼쪽의 페이지 목록, 위쪽의 검색창, 오른쪽의 목차, 본문 끝의 이전/다음 페이지는 모두 페이지 데이터에서 자동으로 만들어진 것입니다.\n\n## 할 수 있는 일\n\n- 페이지 데이터로 위쪽의 툴바(현재 위치, 검색창), 사이드바, 페이지 목차, 이전/다음 페이지 링크를 자동으로 만듭니다\n- 본문은 Markdown 문자열로도, md 파일의 URL(S3, 서버 스토리지)로도 전달할 수 있습니다\n- Shadow DOM 안에 화면을 만들기 때문에 호스트 페이지의 CSS와 서로 영향을 주지 않습니다\n- 표시하는 HTML은 모두 DOMPurify로 새니타이즈합니다\n\n데이터 저장과 페이지 목록을 반환하는 API는 사용하는 쪽에서 준비합니다. [페이지 데이터](?page=doc-data) 형식으로 반환하기만 하면 DB의 종류나 테이블 구조는 상관없습니다.\n\n## 이럴 때 사용합니다\n\n- 업무용 앱이나 관리 화면에 사용 매뉴얼과 도움말을 넣고 싶을 때\n- 매뉴얼 본문을 DB나 S3에 두고, 앱을 다시 배포하지 않고 수정하고 싶을 때\n- 열려 있는 화면의 설명을 그 화면에서 바로 열고 싶을 때(`currentId`로 열 페이지를 지정합니다)\n\nVitePress나 Docusaurus 같은 정적 사이트 생성기는 Markdown으로 매뉴얼용 사이트를 따로 만듭니다. md-pages-viewer는 지금 있는 앱의 화면 안에 들어가, 실행 시점에 페이지 데이터를 받아 표시합니다.\n\n## 이 매뉴얼의 구성\n\n| 페이지 | 내용 |\n| --- | --- |\n| [사용 방법](?page=doc-usage) | 불러오기부터 페이지 데이터, 옵션, 이미지와 링크까지 |\n| [스타일 변경](?page=doc-look) | CSS 변수, `::part()`, `styles` |\n| [기능](?page=doc-features) | 화면 구성과 썸네일, 일본어 줄바꿈, 주의·팁 상자, 화면 언어 |\n| [보안](?page=doc-security) | 새니타이즈와 CSP |\n| [사용 예: 매장 관리 매뉴얼](?page=example) | 가상의 매장 관리 앱 매뉴얼에 사용한 예 |\n\n## 라이선스\n\nMIT License. Copyright (c) 2026 Kota Kagatsume. 함께 포함된 marked와 DOMPurify의 라이선스는 `dist/THIRD_PARTY_LICENSES.txt`에 있습니다."},{"id":"doc-usage","parentId":null,"order":2,"title":"사용 방법","description":"불러오기부터 페이지 데이터, 옵션, 이미지와 링크까지"},{"id":"doc-load","parentId":"doc-usage","order":1,"title":"불러오기","description":"CDN 또는 npm에서 불러오기","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(220%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(220%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2256%22%20width%3D%22240%22%20height%3D%22106%22%20rx%3D%226%22%20fill%3D%22%23f3f4f6%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2264%22%20width%3D%22120%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(220%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2280%22%20width%3D%22170%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2296%22%20width%3D%22140%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(220%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2280%22%20y%3D%22112%22%20width%3D%22110%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%22128%22%20width%3D%2290%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(220%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22144%22%20width%3D%2260%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3C%2Fsvg%3E","md":"# 불러오기\n\n## CDN에서 불러오기\n\n~~~html\n\u003cscript src=\"https://cdn.jsdelivr.net/npm/md-pages-viewer@1/dist/md-pages-viewer.js\">\u003c/script>\n~~~\n\n> [!NOTE]\n> CSS가 이 파일에 포함되어 있으므로 \u003ccode>&lt;link&gt;\u003c/code>는 필요하지 않습니다. 파일 크기는 약 151KB(gzip으로 약 48KB)이며, Markdown 변환(marked)과 새니타이즈(DOMPurify)가 포함되어 있습니다.\n\n외부 CDN에 접속할 수 없는 환경에서는 `md-pages-viewer.js`를 자체 서버에 두고 불러옵니다.\n\n## npm으로 설치하기\n\n빌드 과정이 있는 프로젝트에서는 npm으로 설치합니다.\n\n~~~bash\nnpm install md-pages-viewer\n~~~\n\n~~~js\nimport { MdPagesViewer } from 'md-pages-viewer';\n~~~\n\n`import`만 해도 `\u003cmd-pages-viewer>` 태그를 사용할 수 있게 됩니다."},{"id":"doc-place","parentId":"doc-usage","order":2,"title":"배치 방법","description":"태그로 배치하기, new로 만들기","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(260%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(260%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2256%22%20width%3D%22240%22%20height%3D%22106%22%20rx%3D%226%22%20fill%3D%22%23f3f4f6%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2264%22%20width%3D%22120%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(260%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2280%22%20width%3D%22170%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2296%22%20width%3D%22140%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(260%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2280%22%20y%3D%22112%22%20width%3D%22110%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%22128%22%20width%3D%2290%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(260%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22144%22%20width%3D%2260%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3C%2Fsvg%3E","md":"# 배치 방법\n\n## 태그로 배치하기\n\n~~~html\n\u003cmd-pages-viewer pages=\"/api/manual/pages\" current-id=\"intro\">\u003c/md-pages-viewer>\n~~~\n\n배열, 함수, 객체(`texts`)는 JS에서 요소의 프로퍼티로 설정합니다.\n\n~~~js\nconst viewer = document.querySelector('md-pages-viewer');\nviewer.imageResolver = (path) => `/api/manual/image?path=${encodeURIComponent(path)}`;\n~~~\n\n## new로 만들기\n\n`new`로도 만들 수 있습니다. 지정한 요소의 내용이 교체됩니다.\n\n~~~js\nconst viewer = new MdPagesViewer('#manual', {\n  pages: '/api/manual/pages',\n  currentId: 'intro',\n});\n\n// 표시한 후에 옵션을 바꿀 때는 element의 프로퍼티로\nviewer.element.currentId = 'faq';\n~~~\n\n## 높이와 너비\n\n요소의 높이를 지정하지 않으면 본문에 맞춰 늘어나며, 스크롤해도 툴바는 화면 위쪽에, 사이드바와 목차는 그 아래에 남아 있습니다. 높이를 지정하면 툴바 아래에서 사이드바, 본문, 목차가 각각 따로 스크롤됩니다.\n\n요소의 너비가 768px 미만이 되면 사이드바는 툴바의 버튼을 눌러 본문 위에 여는 형태가 되고, 목차는 본문 위쪽에 접힌 상태로 표시됩니다.\n\n> [!TIP]\n> 왼쪽 메뉴의 ‘매장’ 등을 열고 헤더의 ‘도움말’을 누르면 화면 오른쪽에 너비 480px의 도움말이 열립니다. 768px 미만일 때의 형태는 그곳에서 확인할 수 있습니다."},{"id":"doc-data","parentId":"doc-usage","order":3,"title":"페이지 데이터","description":"페이지 배열의 항목과 하위 페이지 목록","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(160%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(160%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2262%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2094%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2269%22%20width%3D%2240%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2269%22%20width%3D%2270%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2286%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2293%22%20width%3D%2259%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2293%22%20width%3D%2293%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%22110%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22117%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22117%22%20width%3D%2276%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%22134%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22141%22%20width%3D%2267%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22141%22%20width%3D%2299%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E","md":"# 페이지 데이터\n\n페이지는 평면 배열로 전달하고, `parentId`로 계층을 나타냅니다. `pages`에 URL을 전달하는 경우에는 이 배열 자체를 JSON으로 반환합니다.\n\n## 항목\n\n| 항목 | 타입 | 필수 | 내용 |\n| --- | --- | --- | --- |\n| `id` | string / number | 필수 | 페이지의 고유한 ID |\n| `parentId` | string / number / null | 필수 | 상위 페이지의 ID. 최상위는 null |\n| `title` | string | 필수 | 이동 경로와 사이드바에 표시하는 이름 |\n| `description` | string | 선택 | 하위 페이지 목록과 검색 결과에 표시하는 설명 |\n| `thumbnail` | string | 선택 | 하위 페이지 목록을 카드 형태로 표시할 때 카드 위쪽에 표시하는 이미지의 경로 또는 URL |\n| `md` | string | 선택 | 본문 Markdown |\n| `src` | string | 선택 | md 파일의 URL |\n| `order` | number | 선택 | 같은 계층 안에서의 정렬 순서(작은 값부터). 지정하지 않은 페이지는 지정한 페이지 뒤에 배열 순서대로 정렬됩니다 |\n\n~~~json\n[\n  { \"id\": \"intro\", \"parentId\": null, \"title\": \"소개\", \"md\": \"# 소개\", \"order\": 1 },\n  { \"id\": \"login\", \"parentId\": \"intro\", \"title\": \"로그인 방법\", \"src\": \"/storage/manual/login.md\", \"order\": 1 },\n  { \"id\": \"faq\", \"parentId\": null, \"title\": \"FAQ\", \"src\": \"https://xxx.s3.amazonaws.com/manual/faq.md\", \"order\": 2 },\n  { \"id\": \"guide\", \"parentId\": null, \"title\": \"사용 가이드\", \"order\": 3 },\n  { \"id\": \"guide-start\", \"parentId\": \"guide\", \"title\": \"시작하기\", \"description\": \"처음에 할 설정의 흐름\", \"md\": \"# 시작하기\", \"order\": 1 }\n]\n~~~\n\n`src` 페이지는 처음 열 때 가져오고, 화면을 새로 고칠 때까지 보관합니다.\n\n## 하위 페이지 목록\n\n`md`도 `src`도 없는 페이지는 본문 대신 바로 아래 하위 페이지의 목록을 표 형태로 표시합니다. 카테고리처럼 하위 페이지를 묶는 상위 페이지에 사용할 수 있습니다. 각 행에는 하위 페이지의 이름, `description`(2줄까지), 장 수(`md`의 h2 개수) 또는 하위 페이지 수가 표시됩니다. 툴바의 버튼으로 카드 형태로도 전환할 수 있습니다. `src` 페이지는 목록을 만들기 위해 본문을 가져오지 않습니다.\n\n> [!TIP]\n> 이 매뉴얼의 ‘사용 방법’, ‘스타일 변경’, ‘기능’도 하위 페이지 목록 페이지입니다. 열어서 오른쪽 위의 ‘카드 보기’를 누르면 썸네일이 있는 카드로 바뀝니다. 자세한 내용은 \u003ca href=\"?page=doc-thumbnail\">하위 페이지 목록과 썸네일\u003c/a>을 참고하세요."},{"id":"doc-options","parentId":"doc-usage","order":4,"title":"옵션","description":"pages, currentId, baseUrl 등 9가지","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(30%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(30%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2262%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22hsl(30%2070%25%2094%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2269%22%20width%3D%2240%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22hsl(30%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2269%22%20width%3D%2270%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2286%22%20wid ) |\n\n> [!IMPORTANT]\n> \u003ccode>fetch\u003c/code>나 \u003ccode>imageResolver\u003c/code>를 사용하는 경우에는 \u003ccode>pages\u003c/code>를 속성이 아닌 프로퍼티로, 그것들보다 나중에 설정하세요."},{"id":"doc-storage","parentId":"doc-usage","order":5,"title":"md 파일 저장 위치","description":"S3나 서버 스토리지에 둘 때 필요한 설정","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(190%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(190%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2262%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22hsl(190%2070%25%2094%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2269%22%20width%3D%2240%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22hsl(190%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2269%22%20width%3D%2270%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2286%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2293%22%20width%3D%2259%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2293%22%20width%3D%2293%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%22110%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22117%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22117%22%20width%3D%2276%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3C e%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2293%22%20width%3D%2259%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2293%22%20width%3D%2293%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%22110%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22117%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22117%22%20width%3D%2276%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%22134%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22141%22%20width%3D%2267%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22141%22%20width%3D%2299%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E","md":"# 이미지와 링크\n\n## 이미지\n\n상대 경로로 지정한 이미지는 `src` 페이지에서는 md 파일의 위치를, `md` 페이지에서는 `baseUrl`을 기준으로 합니다.\n\n> [!WARNING]\n> 비공개 S3에서는 서명된 URL을 기준으로 하면 서명 부분이 빠져서 표시할 수 없습니다. \u003ccode>imageResolver\u003c/code>로 사용하는 쪽의 API를 거치게 하세요. \u003ccode>blob:\u003c/code> URL을 반환할 수도 있습니다.\n\n## 링크\n\n본문의 링크는 다음과 같이 동작합니다.\n\n| 작성 방법 | 동작 |\n| --- | --- |\n| `?page=ID`, `?page=ID#제목ID` | 이 라이브러리 안에서 페이지를 전환합니다 |\n| `#제목ID` | 이 페이지의 해당 제목으로 스크롤합니다 |\n| md 파일의 상대 경로(`login.md` 등) | `src`와 일치하면 그 페이지로 전환합니다 |\n| 그 밖의 상대 경로 | `src` 또는 `baseUrl`을 기준으로 해석한 URL로 이동합니다 |\n| 호스트 페이지와 출처가 다른 URL | 새 탭에서 엽니다 |"},{"id":"doc-url","parentId":"doc-usage","order":7,"title":"URL 반영","description":"페이지를 전환할 때의 URL과 방문 기록","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(120%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(120%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2264%22%20width%3D%22200%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(120%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2280%22%20width%3D%22230%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2296%22%20width%3D%22180%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(120%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22112%22%20width%3D%22220%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22128%22%20width%3D%22150%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(120%2070%25%2094%25)%22%2F%3E%3C%2Fsvg%3E","md":"# URL 반영\n\n페이지를 전환하면 호스트 페이지 URL의 쿼리 `page`가 전환한 페이지의 ID로 바뀌고, 방문 기록에 추가됩니다. 브라우저의 뒤로 가기·앞으로 가기와 링크 공유를 그대로 사용할 수 있습니다. 다른 쿼리는 그대로 남습니다.\n\n호스트 페이지가 `page`를 사용하고 있다면 `urlParam`으로 이름을 바꾸세요.\n\n> [!TIP]\n> 같은 화면에 두 개를 배치하는 경우나, 호스트 페이지가 URL의 해시(\u003ccode>#\u003c/code>)로 화면을 전환하는 경우에는 \u003ccode>urlParam\u003c/code>을 \u003ccode>false\u003c/code>로 설정하세요. 이 데모에서는 왼쪽 메뉴의 ‘도움말’ 화면은 URL에 반영하고(주소 표시줄의 \u003ccode>page=\u003c/code>가 바뀝니다), 다른 화면의 오른쪽에 열리는 도움말은 \u003ccode>url-param=\"false\"\u003c/code>로 배치했습니다."},{"id":"doc-look","parentId":null,"order":3,"title":"스타일 변경","description":"CSS 변수, ::part(), styles로 스타일 바꾸기"},{"id":"doc-vars","parentId":"doc-look","order":1,"title":"CSS 변수","description":"색, 글꼴, 너비 등 바꾸기","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(250%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(250%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2256%22%20width%3D%22240%22%20height%3D%22106%22%20rx%3D%226%22%20fill%3D%22%23f3f4f6%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2264%22%20width%3D%22120%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(250%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2280%22%20width%3D%22170%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2296%22%20width%3D%22140%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(250%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2280%22%20y%3D%22112%22%20width%3D%22110%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%22128%22%20width%3D%2290%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(250%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22144%22%20width%3D%2260%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3C%2Fsvg%3E","md":"# CSS 변수\n\n다음 CSS 변수로 덮어쓸 수 있습니다. 글자 색과 글꼴은 지정하지 않으면 호스트 페이지의 설정을 그대로 따릅니다.\n\n| CSS 변수 | 내용 |\n| --- | --- |\n| `--mpv-font-family` | 글꼴 |\n| `--mpv-font-size` | 본문 글자 크기(기본값 16px) |\n| `--mpv-color-text` | 글자 색 |\n| `--mpv-color-bg` | 배경색 |\n| `--mpv-color-accent` | 링크와 현재 페이지의 강조색 |\n| `--mpv-color-border` | 구분선 색 |\n| `--mpv-sidebar-width` | 사이드바 너비 |\n| `--mpv-spacing` | 여백의 기준 크기 |\n| `--mpv-color-note` 외 4개 | 주의·팁 상자의 색([주의·팁 상자](?page=doc-callout) 참고) |\n\n> [!IMPORTANT]\n> \u003ccode>--mpv-color-bg\u003c/code>를 지정하지 않으면 뷰어는 투명해지고, 위쪽에 남는 툴바와 겹쳐서 표시되는 파트는 브라우저의 기본 배경색(흰색 등)이 됩니다. 호스트 페이지의 배경이 흰색이 아니라면 지정하세요.\n\n~~~css\nmd-pages-viewer {\n  --mpv-color-accent: #8250df;\n  --mpv-sidebar-width: 300px;\n}\n~~~"},{"id":"doc-parts","parentId":"doc-look","order":2,"title":"파트별 스타일(::part())","description":"호스트 페이지의 CSS에서 파트를 골라 바꾸기","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(340%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(340%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2262%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22hsl(340%2070%25%2094%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2269%22%20width%3D%2240%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22hsl(340%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2269%22%20width%3D%2270%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2286%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2293%22%20width%3D%2259%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2293%22%20width%3D%2293%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%22110%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22117%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22117%22%20width%3D%2276%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%22134%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22141%22%20width%3D%2267%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22141%22%20width%3D%2299%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E","md":"# 파트별 스타일(::part())\n\n각 파트에는 다음 part 이름이 붙어 있어, 호스트 페이지의 CSS에서 `::part()`로 스타일을 바꿀 수 있습니다. 이 라이브러리의 CSS보다 우선 적용됩니다.\n\n| part 이름 | 파트 |\n| --- | --- |\n| `toolbar` | 위쪽의 툴바 |\n| `sidebar-toggle` | 툴바 왼쪽 끝에 있는, 사이드바를 열고 닫는 버튼 |\n| `breadcrumb` | 이동 경로(현재 위치) |\n| `breadcrumb-item` | 이동 경로의 각 페이지. 현재 페이지에는 `current`도 붙습니다 |\n| `search` | 검색창과 결과를 감싸는 영역 |\n| `search-input` | 검색창 |\n| `search-results` | 검색 결과 영역 |\n| `search-result` | 각 검색 결과의 링크 |\n| `search-mark` | 검색 결과에서 일치한 부분의 표시 |\n| `search-empty` | 일치하는 결과가 없을 때와 검색 중(‘검색 중…’)일 때의 표시 |\n| `toc-toggle` | 툴바 오른쪽 끝에 있는, 페이지 목차를 열고 닫는 버튼 |\n| `view-toggle` | 툴바 오른쪽 끝에 있는, 하위 페이지 목록을 표와 카드로 전환하는 버튼 |\n| `sidebar` | 사이드바 |\n| `page-link` | 사이드바의 각 페이지 링크. 현재 페이지에는 `current`도 붙습니다 |\n| `toggle` | 사이드바에서 하위 페이지를 펼치고 접는 버튼 |\n| `main` | 가운데 열(본문, 이전/다음 페이지) |\n| `content` | 본문 영역 |\n| `callout` | 본문의 각 주의·팁 상자. `note`·`tip`·`important`·`warning`·`caution`도 붙습니다 |\n| `callout-title` | 주의·팁 상자의 제목 |\n| `target-heading` | 목차에서 선택해 이동한 본문의 제목. 글자와 밑줄이 강조색으로 바뀌어 있는 동안에만 붙습니다 |\n| `toc` | 페이지 목차 |\n| `toc-mobile` | 좁은 화면에서 본문 위쪽에 표시하는 페이지 목차 |\n| `toc-link` | 페이지 목차의 각 제목 링크. `toc-h2` 또는 `toc-h3`가 붙고, 읽고 있는 제목에는 `current`도 붙습니다 |\n| `child-list-head` | 하위 페이지 목록 표의 머리글 행 |\n| `child-list` | 하위 페이지 목록 |\n| `child-link` | 하위 페이지 목록의 각 페이지(표의 행, 카드) |\n| `child-thumbnail` | 카드 위쪽의 하위 페이지 이미지(`thumbnail`) |\n| `child-title` | 하위 페이지의 이름 |\n| `child-description` | 하위 페이지의 설명 |\n| `child-meta` | 하위 페이지의 장 수 또는 하위 페이지 수 |\n| `pager` | 본문 끝의 이전/다음 페이지 |\n| `pager-link` | 이전/다음 페이지의 각 링크. 이전에는 `previous`, 다음에는 `next`도 붙습니다 |\n| `status` | 불러오는 중, 오류 표시 |\n| `retry-button` | 다시 불러오기 버튼 |\n\n~~~css\nmd-pages-viewer::part(sidebar) {\n  background: #f6f8fa;\n}\n\nmd-pages-viewer::part(page-link current) {\n  font-weight: 700;\n}\n~~~"},{"id":"doc-styles","parentId":"doc-look","order":3,"title":"본문 스타일(styles)","description":"본문의 제목과 표의 스타일 바꾸기","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(10%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(10%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2256%22%20width%3D%22240%22%20height%3D%22106%22%20rx%3D%226%22%20fill%3D%22%23f3f4f6%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2264%22%20width%3D%22120%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(10%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2280%22%20width%3D%22170%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2296%22%20width%3D%22140%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(10%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2280%22%20y%3D%22112%22%20width%3D%22110%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%22128%22%20width%3D%2290%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(10%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22144%22%20width%3D%2260%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3C%2Fsvg%3E","md":"# 본문 스타일(styles)\n\n`::part()`는 파트 자체에만 적용되며, 본문의 제목이나 표 등은 선택할 수 없습니다. 본문의 스타일은 `styles`에 CSS를 문자열로 전달해 바꿉니다. 전달한 CSS는 뷰어 안에서만 적용되며, 명시도와 관계없이 이 라이브러리의 CSS보다 우선합니다.\n\n> [!NOTE]\n> 요소는 part 이름으로 지정하세요(클래스 이름은 바뀔 수 있습니다).\n\n~~~js\nconst viewer = document.querySelector('md-pages-viewer');\nviewer.styles = `\n  [part~=\"content\"] h1 { font-size: 2.2em; }\n  [part~=\"content\"] th { background: #eef2ff; }\n`;\n~~~\n\n`new MdPagesViewer('#manual', { pages, styles })`처럼 `new`의 옵션으로도 전달할 수 있습니다. style-src에 `'unsafe-inline'`이 없는 CSP를 사용하는 페이지에서도 적용됩니다.\n\n> [!CAUTION]\n> \u003ccode>styles\u003c/code>의 CSS는 새니타이즈하지 않고 그대로 사용합니다. 사용자가 입력한 문자열이나 DB의 값 등, 직접 작성하지 않은 CSS는 전달하지 마세요(파트를 숨기거나, 다른 파트처럼 보이게 하거나, \u003ccode>url()\u003c/code>로 외부 이미지를 불러올 수 있기 때문입니다)."},{"id":"doc-features","parentId":null,"order":4,"title":"기능","description":"화면 구성과 추가된 기능"},{"id":"doc-screen","parentId":"doc-features","order":1,"title":"화면 구성","description":"툴바, 검색, 목차, 이전/다음 페이지, 열고 닫는 동작","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(210%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(210%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2264%22%20width%3D%22200%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(210%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2280%22%20width%3D%22230%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2296%22%20width%3D%22180%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(210%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22112%22%20width%3D%22220%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22128%22%20width%3D%22150%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(210%2070%25%2094%25)%22%2F%3E%3C%2Fsvg%3E","md":"# 화면 구성\n\n## 툴바\n\n위쪽 툴바에는 사이드바를 열고 닫는 버튼(왼쪽 끝), 현재 위치(상위 계층과 현재 페이지의 이름), 검색창, 페이지 목차를 열고 닫는 버튼(오른쪽 끝)이 있습니다. 하위 페이지 목록 페이지에서는 오른쪽 끝이 표와 카드를 전환하는 버튼이 됩니다.\n\n## 검색\n\n검색창에서는 페이지 이름, `description`, 제목, 본문을 찾을 수 있습니다. 전각과 반각, 대문자와 소문자는 구분하지 않으며, 공백으로 구분한 단어는 모두 포함하는 페이지가 표시됩니다. 결과는 검색창 아래에 표시되고, 누르면 그 페이지의 해당 제목 위치로 이동합니다.\n\n> [!TIP]\n> \u003ccode>/\u003c/code> 키를 누르면 검색창으로 이동하고, ↑↓ 키와 Enter 키로 결과를 선택할 수 있습니다.\n\n본문은 검색창에 들어갔을 때부터 조금씩 읽어 들이므로, 페이지가 많아도 화면이 멈추지 않습니다. 모두 읽기 전까지는 읽어 들인 페이지에서 결과를 표시하고 ‘검색 중…’이라고 표시합니다. `src` 페이지는 검색을 위해 본문을 가져오지 않으며, 페이지 이름과 `description`만 검색 대상입니다.\n\n## 페이지 목차\n\n페이지 목차는 읽고 있는 제목을 스크롤에 맞춰 강조하고, h3는 읽고 있는 장의 것만 표시합니다. 목차에서 선택한 제목으로는 부드럽게 스크롤해 이동합니다. 이동하는 동안에도 선택한 제목을 계속 강조합니다. 도착하면 그 제목의 글자와 밑줄이 강조색으로 바뀌었다가 1.5초쯤 뒤에 원래대로 돌아옵니다(도중에 직접 스크롤한 경우에는 바뀌지 않습니다). 목차에서 선택한 제목은 본문이 짧아 맨 위까지 올라오지 못할 때에도 강조됩니다.\n\n## 이전/다음 페이지\n\n본문 끝(하위 페이지 목록 페이지에서는 목록 아래)에 사이드바 순서대로 이전 페이지와 다음 페이지로 가는 링크가 표시됩니다.\n\n## 열고 닫는 동작\n\n사이드바와 목차를 열고 닫을 때, 사이드바의 하위 페이지를 펼치고 접을 때 짧은 애니메이션이 있습니다(넓은 화면에서는 열의 너비가 바뀌고, 좁은 화면에서는 사이드바가 요소의 왼쪽 끝에서 미끄러져 나옵니다. 하위 페이지 목록은 높이가 늘어나고 줄어듭니다. 페이지 이름을 눌러 하위 페이지가 펼쳐질 때도 같습니다).\n\n> [!NOTE]\n> OS나 브라우저에서 동작 줄이기를 설정한 사용자에게는 애니메이션을 적용하지 않습니다. 목차에서 선택한 제목으로도 바로 이동하며, 도착한 제목을 알려 주는 애니메이션도 표시하지 않습니다."},{"id":"doc-thumbnail","parentId":"doc-features","order":2,"title":"하위 페이지 목록과 썸네일","description":"카드 형태에서 페이지별 이미지 표시하기","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(160%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(160%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2264%22%20width%3D%22200%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2280%22%20width%3D%22230%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2296%22%20width%3D%22180%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22112%22%20width%3D%22220%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22128%22%20width%3D%22150%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2094%25)%22%2F%3E%3C%2Fsvg%3E","md":"# 하위 페이지 목록과 썸네일\n\n페이지 데이터에 `thumbnail`을 쓰면, 하위 페이지 목록을 카드 형태로 표시할 때 그 페이지의 카드 위쪽에 이미지가 표시됩니다.\n\n~~~json\n{ \"id\": \"guide-login\", \"parentId\": \"guide\", \"title\": \"로그인\", \"md\": \"# 로그인\", \"thumbnail\": \"images/login.png\" }\n~~~\n\n## 표시 방식\n\n- 카드 위쪽을 가득 채워 가로로 긴 비율(16:9)로 표시됩니다. 비율이 다른 이미지는 넘치는 부분을 잘라 카드의 정렬을 맞춥니다\n- 표 형태에서는 이미지를 표시하지 않으며, 불러오지도 않습니다\n- `thumbnail`이 없는 페이지나 이미지를 불러오지 못한 페이지는 이미지가 없는 카드가 됩니다\n\n> [!TIP]\n> ‘\u003ca href=\"?page=example\">사용 예: 매장 관리 매뉴얼\u003c/a>’의 ‘사용 가이드’를 열고 오른쪽 위의 ‘카드 보기’를 누르면 썸네일이 있는 카드를 볼 수 있습니다.\n\n## 이미지 위치\n\n`thumbnail`은 본문의 이미지와 같은 규칙으로 해석합니다. `imageResolver`를 지정했다면 그 함수를 거칩니다. 상대 경로의 기준은 `src` 페이지라면 md 파일의 위치, 그 밖의 페이지는 `baseUrl`입니다.\n\n> [!NOTE]\n> 이미지는 카드가 화면에 가까워졌을 때 불러옵니다. \u003ccode>javascript:\u003c/code>처럼 본문에서도 사용할 수 없는 URL은 사용하지 않습니다."},{"id":"doc-wrap","parentId":"doc-features","order":3,"title":"일본어 줄바꿈","description":"제목과 표를 문절 단위로 줄바꿈, 너비가 넓은 표","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(280%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(280%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2262%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22hsl(280%2070%25%2094%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2269%22%20width%3D%2240%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22hsl(280%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2269%22%20width%3D%2270%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2286%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2293%22%20width%3D%2259%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2293%22%20width%3D%2293%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%22110%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22117%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22117%22%20width%3D%2276%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%22134%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22141%22%20width%3D%2267%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22141%22%20width%3D%2299%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E","md":"# 일본어 줄바꿈\n\n호스트 페이지가 일본어(`\u003chtml lang=\"ja\">` 등)이면 제목, 표의 셀, 페이지 목록의 항목 등을 문절(의미 단위로 묶인 말의 덩어리)의 경계에서 줄바꿈하므로, 「必須」(필수)나 「店舗コード」(매장 코드) 같은 짧은 말이 중간에서 끊기지 않습니다. 본문의 단락은 평소처럼 줄바꿈됩니다.\n\n아래 표는 일본어(`lang=\"ja\"`)로 지정되어 있으므로, 이 한국어 페이지에서도 문절 단위로 줄바꿈됩니다.\n\n\u003ctable lang=\"ja\">\n\u003cthead>\u003ctr>\u003cth>項目\u003c/th>\u003cth>必須\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>店舗名\u003c/td>\u003ctd>必須\u003c/td>\u003ctd>画面や帳票に出る名前（40文字まで）\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>店舗コード\u003c/td>\u003ctd>必須\u003c/td>\u003ctd>書き出しや連携で店舗を見分ける番号（半角英数字8文字まで）\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>メールアドレス\u003c/td>\u003ctd>任意\u003c/td>\u003ctd>予約の控えを送るときの送り主になります\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\n> [!TIP]\n> 창의 너비를 좁혀 보면 이 표의 「必須」와 「店舗コード」가 중간에서 끊기지 않는 것을 확인할 수 있습니다. 매뉴얼 전체에서 확인하려면 화면 오른쪽 위의 언어 메뉴에서 ‘日本語’를 선택하고, 왼쪽 메뉴의 ‘매장’을 연 다음 헤더의 ‘도움말’을 누르세요.\n\n> [!NOTE]\n> 문절 단위 줄바꿈은 Chrome과 Edge에서만 동작합니다. Safari와 Firefox에서는 평소처럼 줄바꿈됩니다.\n\n## 너비가 넓은 표\n\n너비에 맞지 않는 표는 본문 전체가 아니라 표 안에서만 가로로 스크롤됩니다.\n\n| long_identifier_without_spaces_1 | long_identifier_without_spaces_2 | long_identifier_without_spaces_3 | long_identifier_without_spaces_4 |\n| --- | --- | --- | --- |\n| a | b | c | d |"},{"id":"doc-callout","parentId":"doc-features","order":4,"title":"주의·팁 상자","description":"인용의 첫 줄에 종류를 써서 색이 있는 상자로 만들기","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(40%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(40%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2264%22%20width%3D%22200%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(40%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2280%22%20width%3D%22230%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2296%22%20width%3D%22180%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(40%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22112%22%20width%3D%22220%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22128%22%20width%3D%22150%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(40%2070%25%2094%25)%22%2F%3E%3C%2Fsvg%3E","md":"# 주의·팁 상자\n\nMarkdown 인용(`>`)의 첫 줄에 종류를 쓰면 그 인용이 색이 있는 상자가 됩니다. 작성 방법은 GitHub의 Markdown과 같습니다.\n\n~~~markdown\n> [!WARNING]\n> 슬롯 길이를 바꿔도 이미 들어와 있는 예약은 그대로 남습니다.\n~~~\n\n> [!WARNING]\n> 슬롯 길이를 바꿔도 이미 들어와 있는 예약은 그대로 남습니다.\n\n## 종류\n\n| 작성 방법 | 제목 | 사용하는 경우 |\n| --- | --- | --- |\n| `[!NOTE]` | 참고 | 알아 두면 도움이 되는 내용 |\n| `[!TIP]` | 팁 | 더 쉽게 할 수 있는 방법 |\n| `[!IMPORTANT]` | 중요 | 반드시 알아 두어야 할 내용 |\n| `[!WARNING]` | 주의 | 주의하지 않으면 곤란해지는 내용 |\n| `[!CAUTION]` | 경고 | 되돌릴 수 없는 내용 |\n\n> [!NOTE]\n> 시각은 15분 단위로 입력합니다.\n\n> [!TIP]\n> 한동안 사용하지 않는 매장은 ‘숨기기’로 설정하면 데이터를 남긴 채 목록에서 뺄 수 있습니다.\n\n> [!IMPORTANT]\n> 매장 코드는 등록한 후에는 바꿀 수 없습니다.\n\n> [!WARNING]\n> 다음과 같은 경우에는 예약을 받을 수 없습니다.\n>\n> \u003cul>\u003cli>임시 휴업일에 해당하는 경우\u003c/li>\u003cli>접수 마감이 지난 경우\u003c/li>\u003c/ul>\n\n> [!CAUTION]\n> 삭제한 매장은 되돌릴 수 없습니다. 그 매장의 예약과 목표도 모두 삭제됩니다.\n\n## 상자가 되지 않는 경우\n\n알 수 없는 종류를 쓴 경우(`[!FOO]` 등)와 `[!NOTE]`를 첫 줄이 아닌 곳에 쓴 경우에는 일반 인용으로 표시합니다. 종류는 대문자와 소문자 중 어느 쪽으로 써도 같습니다.\n\n> 일반 인용은 이렇게 표시됩니다.\n\n## 색 바꾸기\n\n| CSS 변수 | 종류 | 기본값 |\n| --- | --- | --- |\n| `--mpv-color-note` | 참고 | `#2563eb`(파랑) |\n| `--mpv-color-tip` | 팁 | `#16a34a`(초록) |\n| `--mpv-color-important` | 중요 | `#7c3aed`(보라) |\n| `--mpv-color-warning` | 주의 | `#b45309`(황토) |\n| `--mpv-color-caution` | 경고 | `#dc2626`(빨강) |\n\n기본값은 흰 배경에서 읽기 쉬운 색입니다. 호스트 화면이 다크 테마일 때는 더 밝은 색을 지정하세요.\n\n~~~css\n[data-theme='dark'] md-pages-viewer {\n  --mpv-color-note: #60a5fa;\n  --mpv-color-tip: #4ade80;\n  --mpv-color-important: #a78bfa;\n  --mpv-color-warning: #fbbf24;\n  --mpv-color-caution: #f87171;\n}\n~~~\n\n> [!NOTE]\n> 이 매뉴얼의 ‘다크’도 이 설정으로 전환하고 있습니다."},{"id":"doc-locale","parentId":"doc-features","order":5,"title":"화면 언어와 문구","description":"버튼과 검색창 문구의 언어를 고르고 하나씩 바꾸기","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(100%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(100%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2256%22%20width%3D%22240%22%20height%3D%22106%22%20rx%3D%226%22%20fill%3D%22%23f3f4f6%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2264%22%20width%3D%22120%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(100%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2280%22%20width%3D%22170%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2296%22%20width%3D%22140%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(100%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2280%22%20y%3D%22112%22%20width%3D%22110%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%22128%22%20width%3D%2290%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(100%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22144%22%20width%3D%2260%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3C%2Fsvg%3E","md":"# 화면 언어와 문구\n\n버튼과 검색창 등에 표시되는 문구의 언어는 `locale`로 선택할 수 있습니다. 日本語(`ja`, 기본값), English(`en`), 简体中文(`zh-CN`), 繁體中文(`zh-TW`), 한국어(`ko`)가 내장되어 있습니다. `locale`만 지정하면 버튼 등의 문구가 모두 그 언어로 바뀝니다. `texts`는 바꾸고 싶은 문구가 있을 때만 사용합니다.\n\n~~~html\n\u003cmd-pages-viewer pages=\"/api/manual/pages\" locale=\"en\">\u003c/md-pages-viewer>\n~~~\n\n`en-US`나 `zh-Hant` 같은 형식으로도 선택할 수 있습니다. 내장되지 않은 언어를 지정하면 일본어로 표시하고 콘솔에 경고를 출력합니다.\n\n> [!TIP]\n> 화면 오른쪽 위의 언어 메뉴(지구 아이콘)에서 언어를 선택하면 이 데모의 화면과 매뉴얼이 그 언어로 바뀝니다. 버튼과 목차 등의 문구는 \u003ccode>locale\u003c/code>로 바꾸고, 페이지 이름과 본문은 그 언어의 페이지 데이터로 교체해 바꾸고 있습니다.\n\n## 문구 바꾸기\n\n문구는 `texts`로 하나씩 바꿀 수 있습니다. 작성한 문구만 바뀌고, 나머지는 `locale` 언어의 문구 그대로입니다. 숫자 등을 표시하는 문구는 그 값을 받는 함수로 작성합니다.\n\n~~~js\nviewer.texts = {\n  search: '페이지 찾기',\n  chapters: (n) => `총 ${n}장`,\n};\n~~~\n\n| 키 | 사용하는 곳 | 한국어 |\n| --- | --- | --- |\n| `loading`, `failed`, `retry` | 불러오는 중일 때와 불러오지 못했을 때의 표시, 다시 불러오기 버튼 | 불러오는 중… / 불러올 수 없습니다 / 다시 불러오기 |\n| `notFound`, `noPages` | 존재하지 않는 페이지를 열었을 때와 페이지가 하나도 없을 때의 표시 | 페이지를 찾을 수 없습니다 / 페이지가 없습니다 |\n| `pageList` | 사이드바의 스크린 리더용 이름 | 페이지 목록 |\n| `columnPages`, `columnContent` | 사이드바의 제목, 하위 페이지 목록 표의 머리글 행 | 페이지 / 내용 |\n| `toc` | 페이지 목차의 제목 | 목차 |\n| `breadcrumb` | 이동 경로의 스크린 리더용 이름 | 이동 경로 |\n| `toggle` | 사이드바의 펼치기/접기 버튼의 스크린 리더용 이름(페이지 이름을 받는 함수) | (페이지 이름) 펼치기/접기 |\n| `chapters`, `childPages` | 하위 페이지 목록의 장 수와 하위 페이지 수(숫자를 받는 함수) | N장 / N개 페이지 |\n| `search`, `searchLabel` | 검색창의 흐린 안내 문구와 스크린 리더용 이름 | 검색 / 페이지 검색 |\n| `searching` | 모두 읽기 전까지의 검색 결과 | 검색 중… |\n| `noResults` | 일치하는 결과가 없을 때의 검색 결과(입력한 검색어를 받는 함수) | “(검색어)”에 해당하는 페이지가 없습니다 |\n| `sidebarClose`, `sidebarOpen` | 사이드바를 닫는 버튼과 여는 버튼 | 페이지 목록 닫기 / 페이지 목록 열기 |\n| `tocClose`, `tocOpen` | 목차를 닫는 버튼과 여는 버튼 | 목차 닫기 / 목차 열기 |\n| `viewCard`, `viewList` | 하위 페이지 목록의 형태를 전환하는 버튼 | 카드 보기 / 목록 보기 |\n| `pager`, `previous`, `next` | 이전/다음 페이지(스크린 리더용 이름과 이전, 다음 링크의 글자) | 이전 페이지와 다음 페이지 / 이전 / 다음 |\n| `calloutNote`, `calloutTip`, `calloutImportant`, `calloutWarning`, `calloutCaution` | 주의·팁 상자의 제목 | 참고 / 팁 / 중요 / 주의 / 경고 |\n\n> [!NOTE]\n> 표에 없는 키나, 함수여야 하는 문구에 문자열을 쓴 것은 콘솔에 경고를 출력하고 사용하지 않습니다.\n\n## 언어 전환하기\n\n표시한 후에 `locale`이나 `texts`를 바꾸면 페이지와 스크롤 위치는 그대로인 채 문구가 바로 바뀝니다. `texts`를 바꿀 때는 새 객체를 설정하세요.\n\n> [!IMPORTANT]\n> 페이지 이름과 본문은 번역하지 않습니다. 언어를 전환할 때는 \u003ccode>locale\u003c/code>과 함께 그 언어의 페이지 데이터를 \u003ccode>pages\u003c/code>에 전달하세요. 언어를 전환하는 버튼은 호스트 화면에 둡니다.\n\n~~~js\nconst pages = { ja: pagesJa, en: pagesEn }; // 언어별 페이지 데이터\n\nfunction setLanguage(lang) {\n  document.documentElement.lang = lang;\n  viewer.locale = lang;\n  viewer.pages = pages[lang];\n}\n~~~\n\n같은 ID의 페이지가 새 데이터에도 있으면 그 페이지를 연 채로 전환됩니다. 이 데모도 이 방법으로 언어를 전환하고 있습니다."},{"id":"doc-security","parentId":null,"order":5,"title":"보안","md":"# 보안\n\n## 새니타이즈\n\nMarkdown을 변환한 HTML은 화면에 넣기 전에 DOMPurify로 새니타이즈합니다. 스크립트 실행으로 이어질 수 있는 것에 더해, 다음 항목도 제거합니다.\n\n- `\u003cstyle>`, `\u003cform>`, `\u003cdialog>`, `\u003cslot>`, `popover` 등의 속성(호스트 페이지의 화면에 영향을 주기 때문)\n- `imageResolver`를 거치지 않고 이미지를 불러오는 것(`poster`, `background` 속성, CSS의 `url()`을 포함한 `style` 속성 등)\n\n> [!CAUTION]\n> \u003ccode>styles\u003c/code>로 전달하는 CSS는 새니타이즈하지 않습니다(\u003ca href=\"?page=doc-styles\">본문 스타일\u003c/a> 참고).\n\n## Content Security Policy\n\nContent Security Policy를 사용하는 페이지에서도 동작합니다.\n\n- `style-src`에 `'unsafe-inline'`이 없어도 CSS가 적용됩니다\n- Trusted Types를 강제하는 페이지에서는 `md-pages-viewer`라는 이름의 정책을 하나 사용합니다. `trusted-types` 지시어로 허용할 이름을 제한하고 있다면 이 이름을 추가하세요\n\n~~~text\nContent-Security-Policy: require-trusted-types-for 'script'; trusted-types md-pages-viewer\n~~~"},{"id":"example","parentId":null,"order":6,"title":"사용 예: 매장 관리 매뉴얼","description":"가상의 매장 관리 앱 매뉴얼에 사용한 예"},{"id":"welcome","parentId":"example","title":"시작하기","order":1,"description":"샘플 매장 관리로 할 수 있는 일과 처음에 할 설정","md":"# 시작하기\n\n샘플 매장 관리는 여러 매장의 정보, 직원, 예약을 한곳에서 관리하는 서비스입니다. 이 매뉴얼에서는 화면 사용 방법과 관리자가 하는 설정을 설명합니다.\n\n## 할 수 있는 일\n\n- 매장별 영업시간, 주소, 연락처 관리\n- 직원 초대와 담당 매장 지정\n- 고객의 예약 접수와 변경, 취소 관리\n- 예약 알림과 월간 보고서 받기\n- 예약과 매장 정보를 CSV로 내보내기\n\n## 화면 구성\n\n로그인하면 왼쪽에 메뉴가, 오른쪽에 선택한 화면이 표시됩니다. 표시되는 메뉴 항목은 역할에 따라 다릅니다.\n\n| 메뉴 | 할 수 있는 일 | 설명 페이지 |\n| --- | --- | --- |\n| 대시보드 | 이번 달 건수와 예약 추이 보기 | [대시보드 보기](?page=guide-dashboard) |\n| 매장 | 매장 추가와 영업시간 등의 설정 | [매장 등록](?page=guide-store) |\n| 직원 | 직원 초대와 담당 매장 지정 | [직원 추가](?page=guide-staff) |\n| 예약 | 예약 목록 보기와 변경, 취소 | [예약 관리](?page=guide-booking) |\n| 보고서 | 월별 집계 보기 | [보고서 보기](?page=guide-report) |\n| 도움말 | 이 매뉴얼 | – |\n\n화면 오른쪽 위에는 계정 메뉴(내 이름의 첫 글자가 들어간 동그라미)가 있습니다. 알림 설정, 비밀번호 변경, 로그아웃은 여기에서 합니다.\n\n## 처음에 할 설정\n\n사용을 시작할 때는 다음 순서로 설정합니다. 소유자 또는 관리자 역할인 사용자가 진행하세요.\n\n1. [매장 등록](?page=guide-store): 매장을 추가하고 영업시간과 예약 접수 방식을 정합니다\n2. [직원 추가](?page=guide-staff): 직원을 초대하고 담당 매장을 지정합니다\n3. [알림 설정](?page=guide-notice): 받을 알림을 선택합니다. 알림 설정은 각자 직접 합니다\n\n보안을 강화하려면 이어서 [2단계 인증](?page=admin-2fa)을 필수로 설정하세요.\n\n## 지원 환경\n\n| 종류 | 지원 대상 |\n| --- | --- |\n| 컴퓨터 브라우저 | Chrome, Edge, Safari, Firefox 최신 버전 |\n| 스마트폰 | iPhone의 Safari, Android의 Chrome 최신 버전 |\n| 앱 | iPhone, Android용 ‘샘플 매장 관리’ 앱(알림 받기와 예약 확인) |\n\n오래된 브라우저에서는 화면이 깨지거나 버튼이 눌리지 않을 수 있습니다.\n\n## 문제가 있을 때\n\n먼저 [자주 묻는 질문](?page=faq)을 확인하세요. 설정값을 확인하고 싶을 때는 [설정 항목 목록](?page=reference)이 편리합니다.\n\n해결되지 않으면 화면 오른쪽 위의 계정 메뉴에서 ‘문의하기’로 문의를 보낼 수 있습니다. 평일 10시부터 18시까지 접수하며, 영업일 기준 2일 이내에 답변합니다.","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(232%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%2256%22%20r%3D%229%22%20fill%3D%22hsl(232%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2250%22%20width%3D%22110%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2261%22%20width%3D%2270%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%2284%22%20r%3D%229%22%20fill%3D%22hsl(232%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2278%22%20width%3D%22141%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124 84%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2244%22%20width%3D%22150%22%20height%3D%2210%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2264%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2290%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22116%22%20width%3D%22120%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%22226%22%20y%3D%22140%22%20width%3D%2260%22%20height%3D%2218%22%20rx%3D%225%22%20fill%3D%22hsl(200%2070%25%2055%25)%22%2F%3E%3C%2Fsvg%3E"},{"id":"guide-login","parentId":"guide","title":"로그인","order":1,"description":"이메일 주소와 비밀번호로 로그인하는 방법과 로그인할 수 없을 때의 해결 방법","md":"# 로그인\n\n샘플 매장 관리를 사용하려면 초대 이메일을 통해 설정한 이메일 주소와 비밀번호로 로그인합니다. 여기에서는 로그인 절차와 로그인할 수 없을 때의 해결 방법을 설명합니다.\n\n## 로그인하기\n\n1. 로그인 화면을 엽니다\n2. 이메일 주소와 비밀번호를 입력합니다\n3. ‘로그인’을 누릅니다\n\n조직에서 2단계 인증을 필수로 설정한 경우에는 이어서 인증 코드를 입력하는 화면이 표시됩니다.\n\n### 인증 코드 입력하기\n\n인증 앱이나 SMS로 받은 6자리 숫자를 입력합니다. 인증 앱의 코드는 30초마다 바뀌므로 표시되어 있는 동안 입력하세요.\n\n‘이 기기에서 30일 동안 다시 묻지 않기’를 선택하면 같은 기기와 브라우저에서는 30일 동안 인증 코드 입력을 건너뛸 수 있습니다. 설정 방법은 [2단계 인증](?page=admin-2fa)을 참고하세요.\n\n## 로그인 상태 유지하기\n\n> [!WARNING]\n> ‘로그인 상태 유지’를 선택하면 30일 동안 로그인을 생략할 수 있습니다. 공용 컴퓨터에서는 선택을 해제하세요.\n\n로그인 상태 유지는 기기와 브라우저별로 기록됩니다. 다른 컴퓨터나 스마트폰에서는 다시 로그인해야 합니다. 로그아웃하면 그 기기의 로그인 상태 유지가 해제됩니다.\n\n## 로그아웃하기\n\n화면 오른쪽 위의 계정 메뉴에서 ‘로그아웃’을 누릅니다.\n\n컴퓨터를 잃어버린 경우 등 다른 기기의 로그인도 한꺼번에 해제하고 싶을 때는 계정 메뉴의 ‘로그인한 기기’에서 ‘모든 기기에서 로그아웃’을 누릅니다. 그러면 어느 기기에서 사용하든 다시 로그인해야 합니다.\n\n## 비밀번호를 잊어버렸을 때\n\n1. 로그인 화면에서 ‘비밀번호를 잊으셨나요?’를 누릅니다\n2. 등록한 이메일 주소를 입력하고 ‘보내기’를 누릅니다\n3. 받은 이메일의 링크를 엽니다(링크의 유효 기간은 1시간입니다)\n4. 새 비밀번호를 두 번 입력하고 ‘저장’을 누릅니다\n\n새 비밀번호에는 조직에서 정한 규칙이 적용됩니다. 길이와 사용할 수 있는 문자는 [비밀번호 규칙](?page=admin-password)을 참고하세요.\n\n## 로그인할 수 없을 때\n\n| 메시지 | 해결 방법 |\n| --- | --- |\n| 비밀번호가 올바르지 않습니다 | 대문자와 소문자, 전각과 반각을 확인합니다 |\n| 계정이 잠겨 있습니다 | 30분 기다리거나 관리자에게 잠금 해제를 요청합니다 |\n| 이메일 주소를 찾을 수 없습니다 | 등록한 이메일 주소를 관리자에게 확인합니다 |\n| 인증 코드가 올바르지 않습니다 | 스마트폰의 시각이 정확한지 확인합니다 |\n| 이 위치에서는 로그인할 수 없습니다 | 회사 네트워크에 연결한 후 로그인합니다 |\n| 초대 유효 기간이 지났습니다 | 관리자에게 다시 초대해 달라고 요청합니다 |\n\n### 계정이 잠겼을 때\n\n비밀번호를 5회 연속으로 잘못 입력하면 그 계정을 30분 동안 잠급니다. 30분이 지나면 자동으로 해제됩니다. 급한 경우에는 관리자가 직원 상세 화면에서 잠금을 해제할 수 있습니다.\n\n### 이메일이 오지 않을 때\n\n비밀번호 재설정 이메일이나 초대 이메일이 오지 않으면 스팸 메일함을 확인하세요. 회사 메일로 받을 수 없는 경우에는 발신 주소의 메일을 받을 수 있도록 메일 관리자에게 설정을 요청하세요.","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(232%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2244%22%20width%3D%22150%22%20height%3D%2210%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2264%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2290%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22116%22%20width%3D%22120%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%22226%22%20y%3D%22140%22%20width%3D%2260%22%20height%3D%2218%22%20rx%3D%225%22%20fill%3D%22hsl(232%2070%25%2055%25)%22%2F%3E%3C%2Fsvg%3E"},{"id":"guide-dashboard","parentId":"guide","title":"대시보드 보기","order":2,"description":"로그인 후 처음 표시되는 화면의 각 영역 설명","md":"# 대시보드 보기\n\n로그인하면 처음에 대시보드가 표시됩니다. 담당 매장의 이번 달 현황을 한눈에 알 수 있습니다.\n\n## 화면 구성\n\n| 영역 | 위치 | 내용 |\n| --- | --- | --- |\n| 상단 숫자 | 맨 위 | 이번 달 건수, 지난달 대비, 목표까지 남은 건수 |\n| 그래프 | 가운데 | 최근 예약 건수의 추이 |\n| 오늘의 예약 | 오른쪽 | 오늘의 예약 목록 |\n| 공지 | 아래 | 운영팀의 공지 |\n\n## 상단 숫자\n\n이번 달 건수, 지난달 대비, 목표까지 남은 건수를 표시합니다. 숫자를 누르면 세부 내역 화면으로 이동합니다.\n\n| 숫자 | 의미 |\n| --- | --- |\n| 이번 달 건수 | 이번 달 1일부터 오늘까지의 예약 건수. 취소된 예약은 세지 않습니다 |\n| 지난달 대비 | 지난달 같은 날까지의 건수와의 차이. 늘었으면 초록색, 줄었으면 빨간색으로 표시됩니다 |\n| 목표까지 남은 건수 | 이번 달 목표에서 이번 달 건수를 뺀 수. 목표를 정하지 않았으면 표시되지 않습니다 |\n\n### 목표 정하기\n\n목표는 매장별, 월별로 정합니다. ‘매장’ 화면에서 매장을 선택하고 ‘목표’ 탭에서 월별 건수를 입력하세요. 목표는 소유자와 관리자 역할인 사용자만 정할 수 있습니다.\n\n## 그래프\n\n최근 12개월의 추이를 표시합니다. 그래프 위에 커서를 올리면 그 달의 값이 표시됩니다.\n\n### 기간 바꾸기\n\n그래프 오른쪽 위의 ‘기간’에서 3개월, 6개월, 12개월 중 하나를 선택할 수 있습니다.\n\n### 매장 필터링하기\n\n여러 매장을 담당하는 경우에는 그래프 왼쪽 위의 ‘매장’에서 표시할 매장을 선택할 수 있습니다. 아무것도 선택하지 않으면 담당하는 모든 매장의 합계를 표시합니다.\n\n## 오늘의 예약\n\n오늘의 예약을 시각이 빠른 순서로 표시합니다. 고객 이름을 누르면 그 예약의 상세 정보가 열립니다.\n\n- 방문한 예약에는 ‘방문’ 표시가 붙습니다\n- 취소된 예약은 회색 글자로 목록 아래쪽에 표시됩니다\n- 담당하는 매장의 예약만 표시됩니다\n\n## 공지\n\n운영팀의 공지를 최신순으로 5건 표시합니다. 읽지 않은 공지에는 표시가 붙습니다.\n\n점검 등 중요한 공지는 로그인한 직후 화면 위쪽에도 표시됩니다. ‘닫기’를 누르면 다음 공지가 나올 때까지 표시되지 않습니다.\n\n## 영역 배치 바꾸기\n\n각 영역 오른쪽 위의 ‘…’에서 영역의 순서를 바꾸거나 영역을 숨길 수 있습니다. 바꾼 배치는 나에게만 적용되며, 다른 사람의 대시보드는 바뀌지 않습니다. 원래대로 되돌리려면 ‘…’에서 ‘기본 보기로 되돌리기’를 누릅니다.","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(200%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2244%22%20width%3D%2258%22%20height%3D%2234%22%20rx%3D%225%22%20fill%3D%22hsl(200%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22162%22%20y%3D%2244%22%20width%3D%2258%22%20height%3D%2234%22%20rx%3D%225%22%20fill%3D%22hsl(200%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22228%22%20y%3D%2244%22%20width%3D%2258%22%20height%3D%2234%22%20rx%3D%225%22%20fill%3D%22hsl(200%2070%25%2094%25)%22%2F%3E%3Cpolyline%20points%3D%22100%2C150%20130%2C128%20160%2C136%20190%2C108%20220%2C116%20250%2C92%20282%2C98%22%20fill%3D%22none%22%20stroke%3D%22hsl(200%2070%25%2055%25)%22%20stroke-width%3D%224%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E"},{"id":"guide-store","parentId":"guide","title":"매장 등록","order":3,"description":"매장을 추가하고 영업시간과 주소 설정하기","md":"# 매장 등록\n\n매장을 추가하고 영업시간과 예약 접수를 설정합니다. 매장은 소유자와 관리자 역할인 사용자만 추가할 수 있습니다.\n\n## 매장 추가하기\n\n1. 메뉴의 ‘매장’을 엽니다\n2. 오른쪽 위의 ‘추가’를 누릅니다\n3. 아래 항목을 입력하고 ‘저장’을 누릅니다\n\n| 항목 | 필수 | 내용 |\n| --- | --- | --- |\n| 매장명 | 필수 | 화면과 출력물에 표시되는 이름(40자까지) |\n| 매장 코드 | 필수 | 내보내기와 연동에서 매장을 구별하는 번호(반각 영숫자 8자까지) |\n| 주소 | 필수 | 우편번호를 입력하면 자동으로 입력됩니다 |\n| 전화번호 | 선택 | 하이픈은 있어도 없어도 됩니다 |\n| 이메일 주소 | 선택 | 예약 확인 메일을 보낼 때의 발신 주소가 됩니다 |\n\n### 매장 코드에 대해\n\n> [!IMPORTANT]\n> 매장 코드는 등록한 후에는 바꿀 수 없습니다. 내보낸 CSV나 보고서에서는 매장명이 아니라 매장 코드로 매장을 구별합니다. 매장명을 바꿔도 과거 데이터와 연결되도록 매장마다 고정된 번호를 붙이세요.\n\n## 영업시간 설정하기\n\n요일별로 개점 시각과 폐점 시각을 입력합니다. 정기 휴무일에는 ‘휴무’를 선택합니다.\n\n> [!NOTE]\n> 시각은 15분 단위로 입력합니다. 점심 휴게 시간이 있는 경우에는 ‘휴게 시간 추가’를 누르고 휴게 시간의 시작과 끝을 입력합니다. 휴게 시간에는 예약을 받지 않습니다.\n\n### 공휴일 영업시간\n\n공휴일에만 다른 시간으로 영업하는 경우에는 ‘공휴일’ 행에 입력합니다. 비워 두면 해당 요일의 시간을 사용합니다.\n\n### 자정을 넘기는 영업\n\n밤늦게까지 영업하는 매장은 폐점 시각을 ‘24:00’ 이후로 입력합니다. 예를 들어 다음 날 오전 2시에 닫는다면 폐점 시각은 ‘26:00’입니다. 최대는 ‘29:00’입니다.\n\n## 임시 휴업일 등록하기\n\n연말연시나 리모델링 등으로 쉬는 날은 ‘임시 휴업일’ 탭에서 날짜를 지정해 등록합니다. 기간으로 등록할 수도 있습니다.\n\n등록한 날은 예약 화면에서 선택할 수 없게 됩니다. 이미 들어와 있는 예약은 예약 목록 위에 ‘임시 휴업일 예약’으로 표시됩니다. 고객에게 자동으로 연락하지 않으므로 한 명씩 연락하세요.\n\n## 예약 접수 설정하기\n\n‘예약 접수’ 탭에서 며칠 전부터 예약을 받을지, 몇 시까지 받을지, 슬롯 길이 등을 정합니다. 선택할 수 있는 값과 기본값은 [설정 항목 목록](?page=reference)을 참고하세요.\n\n슬롯 길이를 바꾸면 이미 들어와 있는 예약은 그대로 남고, 새로 받는 예약부터 새 길이가 적용됩니다.\n\n## 매장 숨기기\n\n한동안 사용하지 않는 매장은 ‘숨기기’로 설정합니다. 숨긴 매장은 예약 화면과 대시보드에 표시되지 않지만 데이터는 남아 있습니다. 다시 사용할 때는 매장 목록의 ‘숨긴 매장’에서 ‘표시’를 누릅니다.\n\n숨긴 매장은 플랜의 매장 수에 포함되지 않습니다.\n\n## 매장 삭제하기\n\n> [!CAUTION]\n> 삭제한 매장은 되돌릴 수 없습니다. 한동안 사용하지 않을 뿐이라면 ‘숨기기’로 설정하세요.\n\n매장을 삭제하면 그 매장의 예약과 목표도 모두 삭제됩니다. 남겨 두고 싶다면 먼저 [데이터 내보내기](?page=guide-export)에서 설명하는 방법으로 내보내세요.\n\n> 매장을 추가했다면 다음으로 [직원 추가](?page=guide-staff)를 진행합니다.","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2246%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2094%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%2251%22%20width%3D%2250%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2268%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%2273%22%20width%3D%2273%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2290%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%2295%22%20width%3D%2256%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22112%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%22117%22%20width%3D%2279%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22134%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%22139%22%20width%3D%2262%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3C%2Fsvg%3E"},{"id":"guide-staff","parentId":"guide","title":"직원 추가","order":4,"description":"직원을 초대하고 담당 매장 지정하기","md":"# 직원 추가\n\n직원을 초대하고 담당 매장과 역할을 정합니다. 직원은 소유자와 관리자 역할인 사용자만 초대할 수 있습니다.\n\n## 초대하기\n\n메뉴의 ‘직원’에서 ‘초대’를 누르고 이메일 주소를 입력합니다. 직원은 초대 이메일의 링크를 통해 직접 비밀번호를 설정합니다.\n\n초대 이메일의 유효 기간은 7일입니다. 기한이 지나면 다시 초대하세요.\n\n### 일괄 초대하기\n\n10명 이상을 초대하는 경우에는 ‘초대’ 옆의 ‘일괄 초대’에서 이메일 주소를 한 줄에 하나씩 붙여 넣습니다. 역할과 담당 매장은 모두에게 같은 것이 지정됩니다. 나중에 한 명씩 바꿀 수 있습니다.\n\n## 초대 상태\n\n직원 목록에는 초대 상태가 다음과 같이 표시됩니다.\n\n| 상태 | 의미 | 할 수 있는 일 |\n| --- | --- | --- |\n| 초대 중 | 이메일을 보냈지만 아직 참여하지 않음 | 초대 취소, 이메일 다시 보내기 |\n| 기한 만료 | 7일 안에 참여하지 않음 | 다시 초대 |\n| 참여 완료 | 비밀번호를 설정해 로그인할 수 있음 | 역할과 담당 매장 변경 |\n| 이용 정지 | 관리자가 이용을 정지함 | 이용 재개 |\n\n> [!TIP]\n> 초대 중이거나 기한이 만료된 직원은 플랜의 직원 수에 포함되지 않습니다.\n\n## 담당 매장 지정하기\n\n직원 상세 화면에서 ‘담당 매장’을 선택합니다. 여러 매장을 선택할 수 있습니다.\n\n담당 매장에 따라 그 직원이 볼 수 있는 예약과 받는 알림의 범위가 정해집니다. 담당하지 않는 매장의 예약은 목록에도 대시보드에도 표시되지 않습니다.\n\n## 권한\n\n- 보기 전용: 데이터를 볼 수만 있습니다\n- 편집자: 매장 정보를 변경할 수 있습니다\n- 관리자: 직원 추가와 삭제도 할 수 있습니다\n\n권한의 세부 설정은 [권한 설정](?page=admin-roles)을 참고하세요.\n\n## 근무 일정 입력하기\n\n직원 상세 화면의 ‘근무 일정’에서 근무하는 요일과 시간을 입력합니다. 입력해 두면 예약 화면에서 고객이 담당자를 선택할 수 있게 됩니다.\n\n- 근무 일정은 매장의 영업시간 안에서만 입력할 수 있습니다\n- 여러 매장을 담당하는 경우에는 매장별로 입력합니다\n- 쉬는 날은 날짜를 지정해 등록합니다\n\n## 이용 정지하기\n\n퇴사 등으로 더 이상 사용하지 않는 직원은 삭제하지 말고 ‘이용 정지’로 설정합니다. 정지된 직원은 로그인할 수 없게 되지만, 담당한 예약과 작업 기록에는 이름이 남습니다.\n\n정지된 직원은 직원 수에 포함되지 않습니다. 다시 사용할 때는 ‘이용 재개’를 누릅니다.\n\n## 직원 삭제하기\n\n삭제한 직원은 되돌릴 수 없습니다. 그 직원이 담당한 예약의 담당자 칸은 ‘삭제된 직원’으로 바뀝니다. 기록을 남기고 싶다면 삭제하지 말고 이용 정지를 사용하세요.","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(280%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%2256%22%20r%3D%229%22%20fill%3D%22hsl(280%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2250%22%20width%3D%22110%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2261%22%20width%3D%2270%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%2284%22%20r%3D%229%22%20fill%3D%22hsl(280%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2278%22%20width%3D%22141%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2289%22%20width%3D%2287%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%22112%22%20r%3D%229%22%20fill%3D%22hsl(280%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22106%22%20width%3D%22122%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22117%22%20width%3D%22104%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%22140%22%20r%3D%229%22%20fill%3D%22hsl(280%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22134%22%20width%3D%22153%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22145%22%20width%3D%2281%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E"},{"id":"guide-notice","parentId":"guide","title":"알림 설정","order":6,"description":"이메일이나 앱으로 받을 알림 선택하기","md":"# 알림 설정\n\n예약이 들어오거나 취소되었을 때 이메일이나 앱으로 알림을 받을 수 있습니다. 알림 설정은 직원마다 따로 있으며, 각자 직접 선택합니다.\n\n## 받을 알림 선택하기\n\n오른쪽 위의 계정 메뉴에서 ‘알림 설정’을 열고, 받고 싶은 알림을 선택합니다.\n\n| 알림 | 이메일 | 앱 |\n| --- | --- | --- |\n| 새 예약 | ○ | ○ |\n| 예약 취소 | ○ | ○ |\n| 임시 휴업일 예약 | ○ | ○ |\n| 월간 보고서 | ○ | – |\n| 초대 수락 | ○ | – |\n\n월간 보고서는 매월 1일에 지난달 분이 도착합니다. 내용은 [보고서 보기](?page=guide-report)를 참고하세요.\n\n## 알림 대상 매장\n\n알림 대상은 담당하는 매장의 예약뿐입니다. 소유자와 관리자 역할인 사용자는 ‘모든 매장’을 선택할 수 있습니다.\n\n담당 매장이 많은 경우에는 ‘매장 선택’에서 알림을 받을 매장을 좁힐 수 있습니다.\n\n## 방해 금지 시간대\n\n밤에 알림을 받고 싶지 않다면 ‘방해 금지 시간대’를 설정합니다. 그동안의 알림은 시간대가 끝났을 때 한꺼번에 도착합니다. 이메일과 앱을 따로 정할 수 있습니다.\n\n## 모아서 받기\n\n예약이 많은 매장에서는 알림을 한 건씩이 아니라 1시간마다 모아서 받을 수 있습니다. 모은 알림에는 그 1시간 동안의 예약과 취소 목록이 들어 있습니다.\n\n## 앱 알림 켜기\n\n1. 스마트폰에 ‘샘플 매장 관리’ 앱을 설치합니다\n2. 앱에서 로그인합니다\n3. 알림 허용을 요청하는 창이 나타나면 ‘허용’을 누릅니다\n4. 앱의 ‘설정’ → ‘알림’에서 받을 알림을 선택합니다\n\n허용을 요청하는 창이 나타나지 않았거나 ‘허용 안 함’을 누른 경우에는 스마트폰의 설정 앱에서 샘플 매장 관리의 알림을 켜세요.\n\n## 알림이 오지 않을 때\n\n스팸 메일함을 확인하세요. 앱 알림은 스마트폰 설정에서 허용되어 있어야 합니다.\n\n- 방해 금지 시간대에 해당하지 않는지 확인합니다\n- 알림 대상 매장에 그 예약의 매장이 포함되어 있는지 확인합니다\n- 이메일 주소가 올바른지 계정 메뉴의 ‘프로필’에서 확인합니다\n- 앱에서 로그아웃하지 않았는지 확인합니다(로그아웃하면 앱 알림이 오지 않습니다)","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(40%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2244%22%20width%3D%22190%22%20height%3D%2234%22%20rx%3D%226%22%20fill%3D%22hsl(40%2070%25%2094%25)%22%2F%3E%3Ccircle%20cx%3D%22114%22%20cy%3D%2261%22%20r%3D%228%22%20fill%3D%22hsl(40%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%22130%22%20y%3D%2256%22%20width%3D%22120%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2286%22%20width%3D%22190%22%20height%3D%2234%22%20rx%3D%226%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22114%22%20cy%3D%22103%22%20r%3D%228%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22130%22%20y%3D%2298%22%20width%3D%22100%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22128%22%20width%3D%22190%22%20height%3D%2230%22%20rx%3D%226%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E"},{"id":"guide-export","parentId":"guide","title":"데이터 내보내기","order":8,"description":"CSV로 데이터를 내보내 스프레드시트 프로그램에서 사용하기","md":"# 데이터 내보내기\n\n예약과 매장 정보를 CSV로 내보내 스프레드시트 프로그램에서 사용할 수 있습니다. 내보낼 수 있는 데이터는 역할과 담당 매장에 따라 다릅니다.\n\n## CSV로 내보내기\n\n목록 화면에서 오른쪽 위의 ‘내보내기’를 누르면 현재 표시 중인 조건으로 CSV를 다운로드합니다.\n\n1. 내보낼 목록 화면을 엽니다\n2. 기간이나 매장으로 필터링합니다\n3. 오른쪽 위의 ‘내보내기’를 누릅니다\n\n필터링한 조건이 그대로 내보내기 조건이 됩니다. 예를 들어 지난달 예약만 내보내려면 예약 목록에서 기간을 지난달로 설정한 후 내보냅니다.\n\n## 내보낼 수 있는 데이터\n\n| 데이터 | 내보내는 화면 | 내보낼 수 있는 역할 |\n| --- | --- | --- |\n| 예약 | 예약 목록 | 모든 역할(담당 매장의 예약만) |\n| 매장 | 매장 목록 | 편집자, 관리자, 소유자 |\n| 직원 | 직원 목록 | 관리자, 소유자 |\n| 작업 기록 | 작업 기록 | 관리자, 소유자 |\n\n## 글자가 깨질 때\n\nCSV는 UTF-8로 내보냅니다. Excel에서 글자가 깨지면 ‘데이터’ 탭의 ‘텍스트/CSV에서’로 불러오세요.\n\n항상 Excel로 여는 경우에는 소유자가 ‘조직 설정’ → ‘데이터’에서 문자 코드를 Shift_JIS로 바꿀 수 있습니다. 바꾸면 조직 전체의 내보내기가 Shift_JIS로 바뀝니다.\n\n## 내보낼 수 있는 건수\n\n한 번에 내보낼 수 있는 것은 10만 건까지입니다. 그보다 많은 경우에는 기간을 나누어 내보내세요.\n\n## 내보내기 기록\n\n내보내기를 하면 작업 기록에 ‘내보내기’로 남습니다. 누가 언제 무엇을 내보냈는지는 [작업 기록](?page=admin-audit)에서 확인할 수 있습니다.","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212 %22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%2295%22%20width%3D%2256%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22112%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%22117%22%20width%3D%2279%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22134%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%22139%22%20width%3D%2262%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3C%2Fsvg%3E"},{"id":"admin-roles","parentId":"admin","title":"권한 설정","order":1,"description":"역할별로 할 수 있는 작업 정하기","md":"# 권한 설정\n\n직원에게는 역할을 하나씩 지정합니다. 역할에 따라 볼 수 있는 데이터와 할 수 있는 작업이 정해집니다.\n\n## 역할 목록\n\n| 역할 | 매장 보기 | 매장 편집 | 직원 관리 | 청구 |\n| --- | --- | --- | --- | --- |\n| 보기 전용 | ○ | – | – | – |\n| 편집자 | ○ | ○ | – | – |\n| 관리자 | ○ | ○ | ○ | – |\n| 소유자 | ○ | ○ | ○ | ○ |\n\n## 역할별 설명\n\n### 보기 전용\n\n담당 매장의 예약과 매장 정보를 볼 수 있습니다. 예약 변경이나 취소는 할 수 없습니다. 아르바이트 직원이나 숫자만 확인하는 사람에게 적합합니다.\n\n### 편집자\n\n담당 매장의 예약 변경과 취소, 매장 정보 변경을 할 수 있습니다. 매장에서 날마다 예약 접수를 하는 사람에게 적합합니다.\n\n### 관리자\n\n편집자가 할 수 있는 일에 더해 직원 초대, 역할 변경, 이용 정지와 보안 설정을 할 수 있습니다. 점장이나 여러 매장을 총괄하는 사람에게 적합합니다.\n\n### 소유자\n\n모든 작업을 할 수 있습니다. 청구와 플랜 변경, 데이터 설정, 탈퇴는 소유자만 할 수 있습니다.\n\n## 역할 바꾸기\n\n직원 상세 화면에서 ‘역할’을 다시 선택합니다. 변경 사항은 바로 반영됩니다.\n\n역할을 낮추면 그 직원이 열어 둔 화면에서도 더 이상 할 수 없게 된 작업의 버튼은 누를 수 없게 됩니다. 자신의 역할은 바꿀 수 없습니다.\n\n## 소유자 이전하기\n\n소유자는 조직에 한 명뿐입니다. 다른 사람에게 이전하면 기존 소유자는 ‘관리자’가 됩니다.\n\n1. ‘조직 설정’ → ‘소유자’를 엽니다\n2. 새 소유자로 지정할 직원을 선택합니다\n3. 확인을 위해 내 비밀번호를 입력하고 ‘이전’을 누릅니다\n\n새 소유자에게는 이메일로 알림이 갑니다. 이전한 후 되돌리려면 새 소유자가 다시 이전해 주어야 합니다.\n\n## 담당 매장과의 관계\n\n역할은 담당 매장 안에서 적용됩니다. 예를 들어 ‘편집자’는 담당하는 매장의 정보만 바꿀 수 있습니다. 소유자는 담당 매장과 관계없이 모든 매장을 다룰 수 있습니다.\n\n## 변경 기록\n\n역할 변경과 소유자 이전은 [작업 기록](?page=admin-audit)에 남습니다.","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(232%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2246%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22hsl(232%2070%25%2094%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%2251%22%20width%3D%2250%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22hsl(232%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2268%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%2273%22%20width%3D%2273%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2290%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%2295%22%20width%3D%2256%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22112%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%22117%22%20width%3D%2279%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22134%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%22139%22%20width%3D%2262%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3C%2Fsvg%3E"},{"id":"admin-billing","parentId":"admin","title":"청구 및 결제","order":2,"description":"플랜 변경, 청구서 다운로드, 결제 수단 변경","md":"# 청구 및 결제\n\n플랜 변경, 청구서 다운로드, 결제 수단 변경을 합니다. 청구와 관련된 작업은 소유자만 할 수 있습니다.\n\n## 플랜 바꾸기\n\n‘조직 설정’ → ‘플랜’에서 선택합니다. 상위 플랜으로의 변경은 바로, 하위 플랜으로의 변경은 다음 청구일부터 반영됩니다.\n\n| 플랜 | 매장 수 | 적합한 사용 방식 |\n| --- | --- | --- |\n| 스탠다드 | 10개 매장까지 | 매장을 한 곳에서 몇 곳 정도 운영하는 경우 |\n| 비즈니스 | 제한 없음 | 많은 매장을 한꺼번에 관리하고 싶은 경우 |\n\n하위 플랜으로 바꿀 때 매장 수가 상한을 넘는 경우에는 먼저 매장을 ‘숨기기’로 설정하세요.\n\n## 청구일\n\n월간 플랜은 계약한 날을 매월 청구일로 합니다. 연간 플랜은 계약한 날을 매년 청구일로 합니다. 청구일이 월말이고 그달에 해당 날짜가 없는 경우에는 그달의 마지막 날을 청구일로 합니다.\n\n## 청구서 다운로드하기\n\n‘청구 내역’에서 월별 청구서를 PDF로 다운로드할 수 있습니다.\n\n청구서는 청구일 다음 날 발행됩니다. 발행되면 소유자에게 이메일로 알림이 갑니다.\n\n### 청구서 수신인\n\n청구서에 표시되는 회사명, 부서명, 담당자명은 ‘조직 설정’ → ‘청구’에서 바꿀 수 있습니다. 바꾼 수신인은 다음 청구서부터 사용됩니다.\n\n## 결제 수단 바꾸기\n\n신용카드와 청구서 결제 중에서 선택할 수 있습니다. 청구서 결제는 연간 플랜에서만 사용할 수 있습니다.\n\n- 신용카드: 청구일에 자동으로 결제됩니다\n- 청구서 결제: 청구서 발행일로부터 30일 이내에 계좌 이체하세요\n\n## 결제에 실패했을 때\n\n신용카드 유효 기간 만료 등으로 결제에 실패하면 소유자에게 이메일이 가고 화면 위쪽에 알림이 표시됩니다. 14일 이내에 결제 수단을 업데이트하세요. 업데이트하면 바로 다시 결제를 시도합니다.\n\n14일이 지나면 조직의 모든 사용자가 보기만 할 수 있게 됩니다. 결제가 완료되면 원래대로 돌아갑니다.\n\n## 해지하기\n\n‘조직 설정’ → ‘플랜’ 아래에 있는 ‘해지’에서 진행합니다. 해지하면 그 청구 기간이 끝날 때까지 사용할 수 있으며, 그 후에는 탈퇴와 같이 처리됩니다. 데이터가 어떻게 되는지는 [자주 묻는 질문](?page=faq)을 참고하세요.","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(140%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2244%22%20width%3D%22150%22%20height%3D%2210%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2264%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2290%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22116%22%20width%3D%22120%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%22226%22%20y%3D%22140%22%20width%3D%2260%22%20height%3D%2218%22%20rx%3D%225%22%20fill%3D%22hsl(140%2070%25%2055%25)%22%2F%3E%3C%2
