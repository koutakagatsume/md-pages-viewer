t%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%2256%22%20r%3D%229%22%20fill%3D%22hsl(0%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2250%22%20width%3D%22110%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2261%22%20width%3D%2270%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%2284%22%20r%3D%229%22%20fill%3D%22hsl(0%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2278%22%20width%3D%22141%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2289%22%20width%3D%2287%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%22112%22%20r%3D%229%22%20fill%3D%22hsl(0%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22106%22%20width%3D%22122%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22117%22%20width%3D%22104%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%22140%22%20r%3D%229%22%20fill%3D%22hsl(0%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22134%22%20width%3D%22153%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22145%22%20width%3D%2281%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E"},{"id":"admin-2fa","parentId":"admin-security","title":"Two-step verification","order":1,"description":"Ask for a code as well as the password when signing in","md":"# Two-step verification\n\nWith two-step verification, signing in asks for a verification code as well as the password. Even if a password leaks, no one can sign in without the code.\n\n## Turning it on\n\n1. Open \"Organization settings\" → \"Security\"\n2. Turn on \"Require two-step verification\"\n\nFrom the next time they sign in, everyone is asked for a verification code.\n\nOnly people with the Owner or Admin role can turn it on. Tell your staff before you turn it on, so that they are not confused when they sign in.\n\n## How to get the code\n\n- An authenticator app (recommended)\n- Text message (SMS)\n\nAn authenticator app shows the code even where there is no signal. SMS needs only a phone number, but the message may be late depending on the signal.\n\n## Setting up an authenticator app\n\n1. Install an authenticator app on your smartphone\n2. Sign in to Sample Store Admin; a QR code appears on the setup screen\n3. Scan the QR code with the authenticator app\n4. Enter the 6-digit number shown in the authenticator app, and press \"Verify\"\n\n## Setting up SMS\n\n1. Choose \"Get codes by SMS\" on the setup screen\n2. Enter your phone number and press \"Send\"\n3. Enter the 6-digit number you receive, and press \"Verify\"\n\n## Backup codes\n\nWhen setup is done, 10 backup codes are shown. When you cannot use your smartphone, each can be used once in place of a verification code. Print them, or keep them somewhere safe.\n\nYou can make new backup codes under \"Security\" in the account menu. The old codes then stop working.\n\n## If you lose your smartphone\n\nAsk an administrator to turn off two-step verification for you, then set it up again.\n\nIf you have backup codes, you can sign in yourself and set it up again on a new smartphone.\n\n## When you change smartphones\n\nWhile the old smartphone still works, press \"Change authenticator app\" under \"Security\" in the account menu, and scan the QR code with the new smartphone.\n","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(260%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2244%22%20width%3D%22150%22%20height%3D%2210%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2264%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2290%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22116%22%20width%3D%22120%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%22226%22%20y%3D%22140%22%20width%3D%2260%22%20height%3D%2218%22%20rx%3D%225%22%20fill%3D%22hsl(260%2070%25%2055%25)%22%2F%3E%3C%2Fsvg%3E"},{"id":"admin-password","parentId":"admin-security","title":"Password rules","order":2,"description":"Set the length, the characters allowed and how often to change it","md":"# Password rules\n\nSet the rules for the passwords of your organization's staff. Only people with the Owner or Admin role can set them.\n\n## What you can set\n\n| Item | Values | Default |\n| --- | --- | --- |\n| Minimum length | 8 to 32 characters | 10 characters |\n| Require a symbol | Yes / No | No |\n| Ask for a change every | Never / 90 days / 180 days | Never |\n\n## Characters allowed\n\nPasswords can use uppercase letters, lowercase letters, digits and symbols. Full-width characters and spaces cannot be used.\n\nWhen \"Require a symbol\" is on, a password must contain at least one of these symbols.\n\n~~~text\n! # $ % & ( ) * + - . / : ; = ? @ [ ] ^ _ { | } ~\n~~~\n\n## Asking for a change\n\nIf \"Ask for a change every\" is 90 or 180 days, people are asked to change their password after signing in, once that many days have passed since they last changed it. Until they change it, they cannot go to other screens.\n\nToday it is thought safer to use long passwords that are hard to guess than to ask for regular changes. Unless you have a reason, leave it at \"Never\".\n\n## When an account is locked\n\nAfter 5 wrong passwords in a row, the account is locked for 30 minutes.\n\n~~~text\nExample: A1b2C3d4e5 (10 characters: uppercase, lowercase and digits)\n~~~\n\n## When you change the rules\n\nEven if you make the rules stricter, the current passwords keep working. The new rules apply the next time a password is changed.\n\nTo have everyone change to a password that follows the new rules right away, press \"Ask everyone to change their password\" under \"Organization settings\" → \"Security\". They are asked to change it the next time they sign in.\n","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(100%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2244%22%20width%3D%22150%22%20height%3D%2210%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2264%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2290%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22116%22%20width%3D%22120%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%22226%22%20y%3D%22140%22%20width%3D%2260%22%20height%3D%2218%22%20rx%3D%225%22%20fill%3D%22hsl(100%2070%25%2055%25)%22%2F%3E%3C%2Fsvg%3E"},{"id":"admin-audit","parentId":"admin","title":"Activity log","order":4,"description":"See who changed what, and when","md":"# Activity log\n\nSee who changed what, and when. Only people with the Owner or Admin role can see the activity log.\n\n## Viewing the log\n\n\"Organization settings\" → \"Activity log\" shows the activity of the last 90 days, newest first.\n\n## What is recorded\n\n- Signing in and out\n- Adding, changing and deleting stores and staff\n- Changes to permissions and to the plan\n\nThese are recorded too.\n\n| Activity | Example |\n| --- | --- |\n| Exporting data | Exported bookings (2,340 rows) |\n| Security settings | Required two-step verification |\n| Failed sign-ins | Locked after wrong passwords |\n| Owner handovers | Handed over the Owner role |\n\nTaking and changing bookings are recorded in the \"History\" of each booking, not in the activity log.\n\n## What each entry shows\n\n| Field | Description |\n| --- | --- |\n| Date and time | When it was done (to the second) |\n| User | The staff member's name and email address |\n| Activity | The kind of activity |\n| Target | The store, staff member or other item it was done to |\n| Location | The IP address it was done from |\n\nPress an entry to see the values before and after the change.\n\n## Filtering\n\nFilter by staff member, kind of activity and period. You can make a CSV of the results the same way as in [Exporting data](?page=guide-export).\n\n## How long it is kept\n\nThe activity log is kept for 90 days; older entries are deleted on the 1st of each month. To keep them longer, export them once a month.\n","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(210%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%2256%22%20r%3D%229%22%20fill%3D%22hsl(210%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2250%22%20width%3D%22110%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2261%22%20width%3D%2270%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%2284%22%20r%3D%229%22%20fill%3D%22hsl(210%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2278%22%20width%3D%22141%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2289%22%20width%3D%2287%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%22112%22%20r%3D%229%22%20fill%3D%22hsl(210%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22106%22%20width%3D%22122%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22117%22%20width%3D%22104%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%22140%22%20r%3D%229%22%20fill%3D%22hsl(210%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22134%22%20width%3D%22153%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22145%22%20width%3D%2281%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E"},{"id":"reference","parentId":"example","title":"Settings reference","description":"The settings on each screen, with their values and defaults","md":"# Settings reference\n\nA list of the settings you can change in Sample Store Admin, screen by screen. The steps are explained in each page of the user guide; use this page to check what a setting means, the values you can choose and its default.\n\nWho can change a setting depends on their role. For what each role can do, see [Roles and permissions](?page=admin-roles).\n\n## Store settings\n\nChoose a store under \"Stores\" in the menu, and open the \"Settings\" tab. Each store has its own values.\n\n### Basic details\n\n| Item | Description | Rules |\n| --- | --- | --- |\n| Store name | The name shown on screens, in reports and on the booking screen | Up to 40 characters |\n| Store code | A code that identifies the store in exports and in integrations with other services | Up to 8 letters and digits. Cannot be changed after the store is added |\n| Address | Shown on the map and in the directions of the booking screen | Filled in automatically from the postal code |\n| Phone number | Shown on the booking screen | With or without hyphens |\n| Email address | The sender of booking confirmations | Only one |\n| Store introduction | The text shown under the store name on the booking screen | Up to 400 characters |\n\nRenaming a store does not change the store name in the CSV files and reports exported before. To compare with past reports, use the store code.\n\n### Hours\n\nFor each day of the week, enter the opening and closing times in steps of 15 minutes. If there is a lunch break, press \"Add a break\" and enter when it starts and ends. No bookings are taken during the break.\n\n- The closing time must be after the opening time. For a store open past midnight, enter a closing time of \"24:00\" or later (up to \"29:00\")\n- For the days the store is closed, check \"Closed\"\n- To use different hours on public holidays only, enter them on the \"Holidays\" row. If it is left empty, the hours for that day of the week are used\n\n### Temporary closing days\n\nAdd the days you close for the New Year holidays, a renovation and so on, by date. You can also add a range of dates. Those days can no longer be chosen on the booking screen, and the bookings already made for them appear above the list as \"Bookings on temporary closing days\". Customers are not contacted automatically, so contact each one from the list.\n\nTemporary closing days can be added up to a year ahead. Past days disappear from the list automatically.\n\n### Booking settings\n\n| Item | Values | Default |\n| --- | --- | --- |\n| Opens | 1 to 180 days before | 60 days before |\n| Closes | The same day to 7 days before (with a time) | 18:00 the day before |\n| Slot length | 15, 30 or 60 minutes | 30 minutes |\n| Bookings per slot | 1 to 20 | 1 |\n| Cancellation deadline | 0 to 72 hours before the booking | 24 hours before |\n\nWith 2 or more bookings per slot, several customers can book the same time. Set it to match the number of staff.\n\nAfter the cancellation deadline, customers can no longer cancel on the booking screen, and are asked to call instead.\n\n## Staff settings\n\nChoose a staff member under \"Staff\" in the menu, and change these on their details screen. Staff can also change some of their own details from the account menu.\n\n### Basic details\n\n| Item | Description | Can they change it themselves? |\n| --- | --- | --- |\n| Name | The name shown on screens and in the staff field of bookings | Yes |\n| Email address | Used for signing in and for notifications | Yes (a confirmation email is sent) |\n| Role | Viewer, Editor, Admin or Owner | No |\n| Assigned stores | The stores whose bookings and notifications they get | No |\n\n### Invitations\n\nAn invitation is valid for 7 days. An expired invitation shows as \"Expired\" in the list. Invite them again, and they get an email with a new link.\n\nStaff who have been invited but have not joined do not count toward the number of staff. When you are close to the limit of staff in your plan, cancel the invitations you do not need.\n\n### Work schedules\n\nFor each staff member, you can enter the days and hours they work. Then customers can choose them on the booking screen.\n\n- Work schedules can only be within the store's hours\n- For staff at several stores, enter one for each store\n- Days off are added by date, as with temporary closing days\n\n### Suspending\n\nStaff who no longer use the app, for example because they have left, can be suspended rather than deleted. Suspended staff can no longer sign in, but their names stay on the bookings they handled and in the activity log. Suspended staff do not count toward the number of staff.\n\n## Notification settings\n\nChoose the notifications you get under \"Notification settings\" in the account menu at the top right. Each staff member has their own settings; you cannot change other people's.\n\n### Notifications\n\n| Notification | Email | App | Default |\n| --- | --- | --- | --- |\n| New booking | ✓ | ✓ | On |\n| Booking canceled | ✓ | ✓ | On |\n| Booking on a temporary closing day | ✓ | ✓ | On |\n| Monthly report | ✓ | – | On |\n| Invitation accepted | ✓ | – | Off |\n\nYou are notified only about bookings at the stores you look after. People with the Owner or Admin role can choose \"All stores\".\n\n### Quiet hours\n\nIf you do not want notifications at night, set \"Quiet hours\". The notifications during that time arrive together when it ends. Email and the app can be set separately.\n\n### Getting them together\n\nAt stores with many bookings, you can get notifications together once an hour instead of one by one. A combined notification lists the bookings and cancellations of that hour.\n\n## Billing settings\n\nChange these under \"Organization settings\" → \"Billing\". Only the Owner can change them.\n\n### Plan\n\n| Plan | Stores | Billed |\n| --- | --- | --- |\n| Standard | Up to 10 | Monthly or yearly |\n| Business | No limit | Monthly or yearly |\n\nA change to a higher plan takes effect at once, and a change to a lower plan from the next billing date. When you change to a lower plan, if you have more stores than its limit, hide some stores first.\n\n### The addressee of invoices\n\nEnter the company name, department and contact name shown on invoices. The new addressee is used from the next invoice. Invoices already issued do not change.\n\n### Payment method\n\n- Credit card: for monthly and yearly plans\n- By invoice: for yearly plans only. Pay by bank transfer within 30 days of the invoice\n\n## Security settings\n\nChange these under \"Organization settings\" → \"Security\". Only people with the Owner or Admin role can change them.\n\n### Two-step verification\n\n| Item | Values | Default |\n| --- | --- | --- |\n| Require two-step verification | Yes / No | No |\n| How codes are received | Authenticator app / SMS | Each person chooses |\n\nWhen it is required, everyone is asked for a verification code from the next time they sign in. For the steps, see [Two-step verification](?page=admin-2fa).\n\n### Passwords\n\n| Item | Values | Default |\n| --- | --- | --- |\n| Minimum length | 8 to 32 characters | 10 characters |\n| Require a symbol | Yes / No | No |\n| Ask for a change every | Never / 90 days / 180 days | Never |\n\nEven if you make the rules stricter, the current passwords keep working. The new rules apply the next time a password is changed.\n\n### Sign-in limits\n\nAfter 5 wrong passwords in a row, the account is locked for 30 minutes. An administrator can also unlock it from the staff member's details screen.\n\nTo allow signing in only from your company's network, enter its addresses under \"IP addresses allowed to sign in\". If none are entered, people can sign in from anywhere.\n\n## Data settings\n\nChange these under \"Organization settings\" → \"Data\". Only the Owner can change them.\n\n### Export format\n\n| Item | Values | Default |\n| --- | --- | --- |\n| Encoding | UTF-8 / Shift_JIS | UTF-8 |\n| Date format | 2026/04/01 / 2026-04-01 | 2026/04/01 |\n| Header row | Include / Leave out | Include |\n\nUp to 100,000 rows can be exported at once. For the steps, see [Exporting data](?page=guide-export).\n\n### How long data is kept\n\n| Data | Kept for |\n| --- | --- |\n| Bookings | 3 years from the booking date |\n| Activity log | 90 days |\n| Monthly reports | 2 years |\n\nData older than that is deleted on the 1st of each month. Export the data you want to keep before then.\n\n### Closing the account\n\nAll the data of the organization is deleted 30 days after the account is closed. Within those 30 days, the Owner can restore it by signing in.\n\n## Terms\n\n### Slot\n\nThe unit of time in which bookings are taken. Its length is set with \"Slot length\".\n\n### Assigned stores\n\nThe stores whose bookings and notifications a staff member gets.\n\n### Organization\n\nThe unit that subscribes to Sample Store Admin. All stores and staff belong to one organization.\n","order":4,"thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2246%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2094%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%2251%22%20width%3D%2250%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2268%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%2273%22%20width%3D%2273%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2290%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%2295%22%20width%3D%2256%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22112%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%22117%22%20width%3D%2279%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22134%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%22139%22%20width%3D%2262%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3C%2Fsvg%3E"},{"id":"faq","parentId":"example","title":"FAQ","order":5,"description":"Common questions and their answers","md":"# FAQ\n\n## Signing in and your account\n\n### I forgot my password\n\nYou can reset it from \"Forgot your password?\" on the sign-in screen. See [Signing in](?page=guide-login) for the steps.\n\n### The two-step verification code does not arrive\n\nIf you get it by SMS, check that your phone number is right. An authenticator app shows the code even where there is no signal ([Two-step verification](?page=admin-2fa)).\n\n### I want to change my email address\n\nChange it under \"Profile\" in the account menu. A confirmation email goes to the new address, and the change is done when you open its link.\n\n## Stores\n\n### Is there a limit on the number of stores?\n\nIt depends on the plan. Standard allows up to 10 stores, and Business has no limit.\n\n### Can I move a store to another organization?\n\nNo. Add the store again in the other organization, and import what you exported with [Exporting data](?page=guide-export).\n\n### I added a store with the wrong store code\n\nThe store code cannot be changed after the store is added. If it has no bookings yet, delete the store and add it again.\n\n## Bookings\n\n### A customer booked by phone\n\nAdd the booking with \"Add\" on the booking list. See [Managing bookings](?page=guide-booking) for details.\n\n### I want to take two bookings at the same time\n\nSet \"Bookings per slot\" to 2 or more in the \"Booking settings\" of the store.\n\n### Temporary closing days do not appear on the booking screen\n\nCheck that the store where you added the temporary closing day is the store on the booking screen. They are added for each store.\n\n## Staff\n\n### A staff member does not receive the invitation email\n\nAsk them to check their spam folder. If it is not there, cancel the invitation and invite them again.\n\n### What should I do about staff who have left?\n\nSuspend them instead of deleting them, and their names stay on the records of the bookings they handled ([Adding staff](?page=guide-staff)).\n\n## Billing and subscription\n\n### Can I change plans in the middle of the year?\n\nYes. A higher plan takes effect at once, and a lower plan from the next billing date ([Billing and payment](?page=admin-billing)).\n\n### What happens to my data when I close the account?\n\nAll data is deleted 30 days after the account is closed. Within those 30 days, the Owner can restore it by signing in.\n\n## Data\n\n### The exported CSV is garbled\n\nIf you open it in Excel, import it with \"From Text/CSV\" on the \"Data\" tab. If you always use Excel, you can change the encoding to Shift_JIS.\n\n### How long can I see old bookings?\n\nFor 3 years from the booking date. Older ones are deleted ([Settings reference](?page=reference)).\n","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(40%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2244%22%20width%3D%22190%22%20height%3D%2234%22%20rx%3D%226%22%20fill%3D%22hsl(40%2070%25%2094%25)%22%2F%3E%3Ccircle%20cx%3D%22114%22%20cy%3D%2261%22%20r%3D%228%22%20fill%3D%22hsl(40%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%22130%22%20y%3D%2256%22%20width%3D%22120%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2286%22%20width%3D%22190%22%20height%3D%2234%22%20rx%3D%226%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22114%22%20cy%3D%22103%22%20r%3D%228%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22130%22%20y%3D%2298%22%20width%3D%22100%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22128%22%20width%3D%22190%22%20height%3D%2230%22%20rx%3D%226%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E"},{"id":"guide-booking","parentId":"guide","title":"Managing bookings","description":"Reading the booking list, and taking, changing and canceling bookings","md":"# Managing bookings\n\nCustomers' bookings are all handled under \"Bookings\" in the menu. Bookings made on the booking screen and bookings taken by phone are in the same list.\n\n## The booking list\n\nThe booking list shows the bookings at the stores you look after, in order of date and time.\n\n| Column | Description |\n| --- | --- |\n| Date and time | The date and start time of the booking |\n| Customer | The customer's name. Press it to open the details of the booking |\n| Store | The store the booking is for |\n| Staff | The staff member the customer chose. Empty if none was chosen |\n| Status | Booked, Arrived, Canceled or No-show |\n| Booked via | Booking screen, Phone or Other |\n\n### Changing the view\n\nAbove the list, choose \"Day\", \"Week\" or \"Month\". \"Day\" shows a table by the hour; \"Week\" and \"Month\" show a calendar.\n\nIf you look after several stores, choose which to show with \"Stores\".\n\n### Filtering\n\nFilter by status, staff member and how the booking was made. For example, filter by \"Status: Canceled\" to list only the canceled bookings.\n\n## Taking bookings\n\nWhen a customer books on the booking screen, the booking enters the list automatically. If you get notifications of new bookings, you are told by email or in the app ([Notifications](?page=guide-notice)).\n\n### Adding a booking taken by phone\n\n1. Press \"Add\" at the top right of the booking list\n2. Enter the store, the date and time, and the customer's name and phone number\n3. To choose a staff member, choose them under \"Staff\"\n4. Press \"Save\"\n\n\"Booked via\" becomes \"Phone\". If you enter the customer's email address, the customer gets a booking confirmation.\n\n### When bookings overlap\n\n> [!WARNING]\n> You cannot add more bookings than a slot can take. If you must take one, increase \"Bookings per slot\" in the \"Booking settings\" of the store, or suggest another time.\n\n## Changing a booking\n\nPress \"Change\" in the details of the booking, choose a new date and time or staff member, and press \"Save\". If the customer's email address is known, the customer is told about the change.\n\nThe details before and after the change are kept in the \"History\" of the booking.\n\n## Canceling a booking\n\n### When the customer cancels\n\nUntil the cancellation deadline, customers can cancel on the booking screen themselves. If a customer calls to cancel after the deadline, press \"Cancel\" in the details of the booking.\n\n### When the store cancels\n\nPress \"Cancel\" in the details of the booking, and choose \"Store's reasons\" as the reason. Customers are not contacted automatically, so contact them by phone or another way.\n\n## When a customer does not come\n\nIf the customer has not come by the time of the booking, press \"No-show\" in the details of the booking. No-shows are counted separately in the monthly report.\n\nIf the same customer keeps not showing up, leave a \"Note\" in the customer's details, so that other staff notice it at their next booking.\n\n## Bookings on temporary closing days\n\nIf there are already bookings on a day you add as a temporary closing day, they appear above the list as \"Bookings on temporary closing days\". Contact each customer, and change the date and time or cancel. When they are all done, the notice disappears.\n\n## Printing bookings\n\nIn the \"Day\" view, press \"Print\" at the top right to print that day's bookings. Use it to keep a list at the front desk. The printout includes customers' names and phone numbers, so handle it with care.\n\n## Common problems\n\n| Problem | What to check |\n| --- | --- |\n| A booking is not in the list | That the booking's store is among your assigned stores |\n| You cannot change a booking | That your role is not \"Viewer\" |\n| The customer is not told about a change | That the customer's email address is entered |\n| A day cannot be chosen on the booking screen | That it is not a temporary closing day, and not past the booking deadline |\n","order":5,"thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(20%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22% %22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22256%22%20y%3D%22130%22%20width%3D%2228%22%20height%3D%2224%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E"},{"id":"guide-report","parentId":"guide","title":"Reading reports","description":"The monthly figures, and comparing stores","md":"# Reading reports\n\n\"Reports\" in the menu shows bookings totaled by month. On the 1st of each month, the report for the previous month also arrives by email as the monthly report.\n\n## Monthly reports\n\nA monthly report sums up the bookings, the cancellation rate and more of the previous month, for each store. It arrives by email on the morning of the 1st of each month, for the people who get monthly reports.\n\nThe email has only the main numbers. For the full breakdown, open the report screen from the link in the email.\n\n## Report items\n\n| Item | Meaning |\n| --- | --- |\n| Bookings | The number of bookings dated in that month (not counting cancellations) |\n| New customers | The number of customers who booked for the first time that month |\n| Cancellations | The number of canceled bookings |\n| Cancellation rate | Cancellations divided by all bookings, cancellations included |\n| No-shows | The number of bookings where the customer did not come |\n| Booked on the booking screen | The share of bookings made on the booking screen (not by phone or other ways) |\n| Slots filled | The share of the available slots that were booked |\n\n### Slots filled\n\nThe number of slots available that month is worked out from the hours and the slot length, and the share of them that were booked is shown. Temporary closing days and breaks do not count as available slots.\n\n## Comparing stores\n\nChoose \"By store\" on the report screen to see a table with the stores side by side. Press a column heading to sort by that item.\n\nOnly the stores you look after are listed. The Owner can compare all stores.\n\n## Choosing a period\n\nChoose the first and last months under \"Period\" to see the total for that period and the trend month by month. Up to 24 months.\n\n## Exporting reports\n\nExport a report as PDF or CSV from \"Export\" at the top right of the report screen. PDF suits materials for meetings; CSV suits totaling in a spreadsheet.\n\n## If the numbers do not match\n\n- If the number differs from the booking list, check whether the list includes cancellations and no-shows. \"Bookings\" in the report does not include them\n- If the hours changed during the month, slots filled is worked out with the hours of each day at that time\n- A booking moved to a date in another month is counted in the month it was moved to\n","order":7,"thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(330%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22% d\n\n- Invitations are now valid for 7 days instead of 3\n\n## April 2026\n\n### Added\n\n- With work schedules entered, customers can choose a staff member on the booking screen\n- The IP addresses allowed to sign in can be set\n\n## March 2026\n\n### Added\n\n- Stores can be hidden. Hidden stores do not count toward the number of stores in the plan\n- The booking list can be printed\n\n### Fixed\n\n- The dates in exported CSV files were occasionally one day off\n\n## February 2026\n\n### Added\n\n- Apps for iPhone and Android. You can check bookings and get notifications in them\n\n## January 2026\n\n### Added\n\n- Sample Store Admin launched\n","order":6,"thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(280%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2246%22
