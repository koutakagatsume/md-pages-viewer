3Crect%20x%3D%2248%22%20y%3D%22141%22%20width%3D%2267%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22141%22%20width%3D%2299%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E","md":"# Where to keep md files\n\n| Where | What you need to set up |\n| --- | --- |\n| S3 (public bucket) | CORS (allow GET from the origin of the host page) |\n| S3 (private bucket) | CORS, and signed URLs issued on your server and given as `src`. They expire, so issue them each time you return the page list |\n| Your server's storage | A URL the browser can reach (in Laravel, `storage:link` or a route with authentication) |\n\n> [!NOTE]\n> If you give `pages` as a URL and a body fails to load, the viewer gets the page list again and tries the body once more. So it keeps working after signed URLs expire."},{"id":"doc-links","parentId":"doc-usage","order":6,"title":"Images and links","description":"What relative paths are based on, and how links in a body work","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(300%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(300%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2262%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22hsl(300%2070%25%2094%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2269%22%20width%3D%2240%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22hsl(300%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2269%22%20width%3D%2270%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2286%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2293%22%20width%3D%2259%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2293%22%20width%3D%2293%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%22110%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22117%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22117%22%20width%3D%2276%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%22134%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22141%22%20width%3D%2267%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22141%22%20width%3D%2299%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E","md":"# Images and links\n\n## Images\n\nRelative image paths are based on the location of the md file in `src` pages, and on `baseUrl` in `md` pages.\n\n> [!WARNING]\n> On a private S3 bucket, an image path based on a signed URL loses the signature and cannot be shown. Send the images through your own API with `imageResolver`. It can also return a `blob:` URL.\n\n## Links\n\nLinks in a body work like this.\n\n| Written as | What happens |\n| --- | --- |\n| `?page=ID`, `?page=ID#heading-id` | Switches to that page inside the viewer |\n| `#heading-id` | Scrolls to that heading on this page |\n| A relative path to an md file (such as `login.md`) | If it matches a page's `src`, switches to that page |\n| Other relative paths | Goes to the URL resolved against `src` or `baseUrl` |\n| A URL on another origin than the host page | Opens in a new tab |"},{"id":"doc-url","parentId":"doc-usage","order":7,"title":"The URL","description":"The URL and the history when the page changes","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(120%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(120%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2264%22%20width%3D%22200%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(120%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2280%22%20width%3D%22230%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2296%22%20width%3D%22180%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(120%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22112%22%20width%3D%22220%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22128%22%20width%3D%22150%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(120%2070%25%2094%25)%22%2F%3E%3C%2Fsvg%3E","md":"# The URL\n\nWhen the page changes, the `page` query in the URL of the host page becomes the ID of the new page, and an entry is added to the history. The browser's back and forward buttons and shared links work as they are. Other queries are kept as they are.\n\nIf the host page uses `page` itself, change the name with `urlParam`.\n\n> [!TIP]\n> Set `urlParam` to `false` when you put two viewers on one screen, or when the host page switches its screens with the `#` of the URL. In this demo, the \"Help\" screen of the left menu updates the URL (watch `page=` in the address bar), and the help that opens on the right of the other screens is placed with `url-param=\"false\"`."},{"id":"doc-look","parentId":null,"order":3,"title":"Changing the look","description":"Change the look with CSS variables, ::part() and styles"},{"id":"doc-vars","parentId":"doc-look","order":1,"title":"CSS variables","description":"Change colors, fonts, widths and more","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(250%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(250%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2256%22%20width%3D%22240%22%20height%3D%22106%22%20rx%3D%226%22%20fill%3D%22%23f3f4f6%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2264%22%20width%3D%22120%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(250%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2280%22%20width%3D%22170%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2296%22%20width%3D%22140%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(250%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2280%22%20y%3D%22112%22%20width%3D%22110%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%22128%22%20width%3D%2290%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(250%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22144%22%20width%3D%2260%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3C%2Fsvg%3E","md":"# CSS variables\n\nYou can override these CSS variables. If you do not set the text color and the font, they come from the host page.\n\n| CSS variable | What it sets |\n| --- | --- |\n| `--mpv-font-family` | The font |\n| `--mpv-font-size` | The size of the body text (default 16px) |\n| `--mpv-color-text` | The text color |\n| `--mpv-color-bg` | The background color |\n| `--mpv-color-accent` | The color of links and of the current page |\n| `--mpv-color-border` | The color of dividing lines |\n| `--mpv-sidebar-width` | The width of the sidebar |\n| `--mpv-spacing` | The base size of the spacing |\n| `--mpv-color-note` and four more | The colors of callouts (see [Callouts](?page=doc-callout)) |\n\n> [!IMPORTANT]\n> If you do not set `--mpv-color-bg`, the viewer is transparent, and the toolbar that stays at the top and the parts shown over the body get the browser's default background (such as white). Set it if the background of the host page is not white.\n\n~~~css\nmd-pages-viewer {\n  --mpv-color-accent: #8250df;\n  --mpv-sidebar-width: 300px;\n}\n~~~"},{"id":"doc-parts","parentId":"doc-look","order":2,"title":"Styling the parts (::part())","description":"Choose parts from the host page's CSS and restyle them","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(340%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(340%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2262%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22hsl(340%2070%25%2094%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2269%22%20width%3D%2240%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22hsl(340%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2269%22%20width%3D%2270%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2286%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2293%22%20width%3D%2259%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2293%22%20width%3D%2293%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%22110%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22117%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22117%22%20width%3D%2276%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%22134%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22141%22%20width%3D%2267%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22141%22%20width%3D%2299%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E","md":"# Styling the parts (::part())\n\nThe parts have these part names, so you can restyle them from the CSS of the host page with `::part()`. These rules win over the library's CSS.\n\n| Part name | Part |\n| --- | --- |\n| `toolbar` | The toolbar at the top |\n| `sidebar-toggle` | The button at the left end of the toolbar that hides and shows the sidebar |\n| `breadcrumb` | The breadcrumb (where you are) |\n| `breadcrumb-item` | Each page in the breadcrumb. The current page also has `current` |\n| `search` | The area around the search box and its results |\n| `search-input` | The search box |\n| `search-results` | The area of the search results |\n| `search-result` | Each link in the search results |\n| `search-mark` | The mark on the matching words in the search results |\n| `search-empty` | What is shown when nothing matches, or while searching (\"Searching…\") |\n| `toc-toggle` | The button at the right end of the toolbar that hides and shows the page contents |\n| `view-toggle` | The button at the right end of the toolbar that switches a child page list between a table and cards |\n| `sidebar` | The sidebar |\n| `page-link` | Each page link in the sidebar. The current page also has `current` |\n| `toggle` | The button that opens and closes child pages in the sidebar |\n| `main` | The middle column (the body, and the previous and next pages) |\n| `content` | The body |\n| `callout` | Each callout in the body. It also has `note`, `tip`, `important`, `warning` or `caution` |\n| `callout-title` | The title of a callout |\n| `target-heading` | The heading of the body moved to from the contents, while its words and underline are in the accent color |\n| `toc` | The page contents |\n| `toc-mobile` | The page contents shown above the body on narrow screens |\n| `toc-link` | Each heading link in the page contents. It also has `toc-h2` or `toc-h3`, and the heading being read has `current` |\n| `child-list-head` | The heading row of a child page table |\n| `child-list` | The child page list |\n| `child-link` | Each page in a child page list (a table row or a card) |\n| `child-thumbnail` | The image at the top of a child page's card (`thumbnail`) |\n| `child-title` | The name of a child page |\n| `child-description` | The description of a child page |\n| `child-meta` | The number of chapters or of child pages of a child page |\n| `pager` | The previous and next pages at the end of the body |\n| `pager-link` | Each link to the previous or next page. It also has `previous` or `next` |\n| `status` | What is shown while loading, or on an error |\n| `retry-button` | The button to try again |\n\n~~~css\nmd-pages-viewer::part(sidebar) {\n  background: #f6f8fa;\n}\n\nmd-pages-viewer::part(page-link current) {\n  font-weight: 700;\n}\n~~~"},{"id":"doc-styles","parentId":"doc-look","order":3,"title":"Styling the body (styles)","description":"Change the look of headings and tables in the body","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(10%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(10%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2256%22%20width%3D%22240%22%20height%3D%22106%22%20rx%3D%226%22%20fill%3D%22%23f3f4f6%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2264%22%20width%3D%22120%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(10%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2280%22%20width%3D%22170%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2296%22%20width%3D%22140%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(10%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2280%22%20y%3D%22112%22%20width%3D%22110%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%22128%22%20width%3D%2290%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(10%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22144%22%20width%3D%2260%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3C%2Fsvg%3E","md":"# Styling the body (styles)\n\n`::part()` reaches only the parts themselves, not the headings or tables in the body. To change the look of the body, give `styles` CSS as a string. That CSS applies only inside the viewer, and wins over the library's CSS whatever its specificity.\n\n> [!NOTE]\n> Choose elements by their part names (class names may change).\n\n~~~js\nconst viewer = document.querySelector('md-pages-viewer');\nviewer.styles = `\n  [part~=\"content\"] h1 { font-size: 2.2em; }\n  [part~=\"content\"] th { background: #eef2ff; }\n`;\n~~~\n\nYou can also pass it as an option of `new`, as in `new MdPagesViewer('#manual', { pages, styles })`. It works on pages whose CSP has no `'unsafe-inline'` in style-src, too.\n\n> [!CAUTION]\n> The CSS in `styles` is used as it is, without sanitizing. Do not pass CSS you did not write yourself, such as strings typed by users or values from a database: it could hide parts, make one part look like another, or load outside images with `url()`."},{"id":"doc-features","parentId":null,"order":4,"title":"Features","description":"The screen, and the features added to it"},{"id":"doc-screen","parentId":"doc-features","order":1,"title":"The screen","description":"Toolbar, search, contents, previous and next pages, and motion","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(210%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(210%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2264%22%20width%3D%22200%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(210%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2280%22%20width%3D%22230%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2296%22%20width%3D%22180%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(210%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22112%22%20width%3D%22220%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22128%22%20width%3D%22150%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(210%2070%25%2094%25)%22%2F%3E%3C%2Fsvg%3E","md":"# The screen\n\n## Toolbar\n\nThe toolbar at the top holds the button that hides and shows the sidebar (at the left end), where you are (the pages above and the name of the current page), the search box, and the button that hides and shows the page contents (at the right end). On a child page list, the button at the right end switches between a table and cards.\n\n## Search\n\nThe search box finds page names, `description`, headings and bodies. Full-width and half-width characters, and upper and lower case, are treated as the same, and words separated by spaces find the pages that contain all of them. The results appear under the search box, and choosing one goes to that heading of the page.\n\n> [!TIP]\n> Press `/` to go to the search box, and choose a result with ↑, ↓ and Enter.\n\nThe bodies are read little by little from when you enter the search box, so the screen does not freeze even with many pages. Until every page has been read, the results come from the pages read so far, with \"Searching…\". The bodies of `src` pages are not fetched for search; only their names and `description` are searched.\n\n## Page contents\n\nThe page contents highlight the heading you are reading as you scroll, and list h3 headings only for the chapter you are reading. Choosing a heading in the contents scrolls smoothly to it, and it stays highlighted on the way. On arrival, the heading's words and underline turn to the accent color and go back after about 1.5 seconds (not when you scroll yourself on the way). A heading chosen in the contents is highlighted even when the body is too short to scroll it to the top.\n\n## Previous and next pages\n\nAt the end of the body (under the list, on a child page list), links to the previous and next pages appear, in the order of the sidebar.\n\n## Motion\n\nHiding and showing the sidebar and the contents, and opening and closing child pages in the sidebar, have short animations (on wide screens the columns change width, and on narrow screens the sidebar slides in from the left edge of the element; a list of child pages grows and shrinks in height, also when it opens because you pressed a page name).\n\n> [!NOTE]\n> There is no motion for users who have set their OS or browser to reduce motion, and choosing a heading in the contents moves to it at once, without marking the heading."},{"id":"doc-thumbnail","parentId":"doc-features","order":2,"title":"Child page lists and thumbnails","description":"Show an image for each page in card view","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(160%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(160%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2264%22%20width%3D%22200%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2280%22%20width%3D%22230%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2296%22%20width%3D%22180%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22112%22%20width%3D%22220%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22128%22%20width%3D%22150%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2094%25)%22%2F%3E%3C%2Fsvg%3E","md":"# Child page lists and thumbnails\n\nWrite `thumbnail` in a page's data, and when a child page list is shown as cards, the image appears at the top of that page's card.\n\n~~~json\n{ \"id\": \"guide-login\", \"parentId\": \"guide\", \"title\": \"Signing in\", \"md\": \"# Signing in\", \"thumbnail\": \"images/login.png\" }\n~~~\n\n## How it looks\n\n- It fills the top of the card, in a wide 16:9 shape. Images of other shapes are cropped so that the cards line up\n- In the table, images are neither shown nor loaded\n- Pages without `thumbnail`, and pages whose image could not load, get a card without an image\n\n> [!TIP]\n> Open \"User guide\" in [Example: a store manual](?page=example) and press \"Card view\" at the top right to see cards with thumbnails.\n\n## Where the image is\n\n`thumbnail` is resolved by the same rules as the images in a body. If `imageResolver` is set, it goes through it. Relative paths are based on the location of the md file for `src` pages, and on `baseUrl` for the others.\n\n> [!NOTE]\n> The image is loaded when the card comes near the screen. URLs that cannot be used in a body either, such as `javascript:`, are not used."},{"id":"doc-wrap","parentId":"doc-features","order":3,"title":"Japanese line breaking","description":"Break headings and tables between phrases, and wide tables","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(280%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(280%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2262%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22hsl(280%2070%25%2094%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2269%22%20width%3D%2240%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22hsl(280%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2269%22%20width%3D%2270%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2286%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2293%22%20width%3D%2259%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2293%22%20width%3D%2293%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%22110%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22117%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22117%22%20width%3D%2276%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%22134%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22141%22%20width%3D%2267%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22141%22%20width%3D%2299%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E","md":"# Japanese line breaking\n\nIf the host page is in Japanese (such as `\u003chtml lang=\"ja\">`), headings, table cells, the items of the page lists and the like break between phrases, so short words such as 「必須」 (required) and 「店舗コード」 (store code) are not split in the middle. The paragraphs of the body break as usual.\n\nThe table below is marked as Japanese (`lang=\"ja\"`), so it breaks between phrases on this English page too.\n\n\u003ctable lang=\"ja\">\n\u003cthead>\u003ctr>\u003cth>項目\u003c/th>\u003cth>必須\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>店舗名\u003c/td>\u003ctd>必須\u003c/td>\u003ctd>画面や帳票に出る名前（40文字まで）\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>店舗コード\u003c/td>\u003ctd>必須\u003c/td>\u003ctd>書き出しや連携で店舗を見分ける番号（半角英数字8文字まで）\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>メールアドレス\u003c/td>\u003ctd>任意\u003c/td>\u003ctd>予約の控えを送るときの送り主になります\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\n> [!TIP]\n> Narrow the window to see that 「必須」 and 「店舗コード」 in this table stay whole. To see it in a whole manual, choose \"日本語\" from the language menu at the top right of the screen, open \"店舗\" (Stores) in the left menu, and press \"ヘルプ\" (Help) in the header.\n\n> [!NOTE]\n> Breaking between phrases works only in Chrome and Edge. Safari and Firefox break as usual.\n\n## Wide tables\n\nA table too wide for the body scrolls sideways inside itself, not the whole body.\n\n| long_identifier_without_spaces_1 | long_identifier_without_spaces_2 | long_identifier_without_spaces_3 | long_identifier_without_spaces_4 |\n| --- | --- | --- | --- |\n| a | b | c | d |"},{"id":"doc-callout","parentId":"doc-features","order":4,"title":"Callouts","description":"Write the kind on the first line of a quote to make a colored box","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(40%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(40%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2264%22%20width%3D%22200%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(40%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2280%22%20width%3D%22230%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2296%22%20width%3D%22180%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(40%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22112%22%20width%3D%22220%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22128%22%20width%3D%22150%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(40%2070%25%2094%25)%22%2F%3E%3C%2Fsvg%3E","md":"# Callouts\n\nWrite a kind on the first line of a Markdown quote (`>`), and the quote becomes a colored box. It is written the same way as in GitHub's Markdown.\n\n~~~markdown\n> [!WARNING]\n> If you change the length of a slot, the bookings already made stay as they are.\n~~~\n\n> [!WARNING]\n> If you change the length of a slot, the bookings already made stay as they are.\n\n## Kinds\n\n| Written as | Heading | When to use it |\n| --- | --- | --- |\n| `[!NOTE]` | Note | Something useful to know |\n| `[!TIP]` | Tip | An easier way to do something |\n| `[!IMPORTANT]` | Important | Something the reader must know |\n| `[!WARNING]` | Warning | Something that causes trouble if overlooked |\n| `[!CAUTION]` | Caution | Something that cannot be undone |\n\n> [!NOTE]\n> Times are entered in steps of 15 minutes.\n\n> [!TIP]\n> Hide a store you will not use for a while, and it leaves the list with its data kept.\n\n> [!IMPORTANT]\n> The store code cannot be changed after the store is added.\n\n> [!WARNING]\n> Bookings cannot be taken when:\n>\n> - The day is a temporary closing day\n> - The booking deadline has passed\n\n> [!CAUTION]\n> A deleted store cannot be restored. Its bookings and goals are all deleted too.\n\n## When it does not become a box\n\nAn unknown kind (such as `[!FOO]`), and `[!NOTE]` written on a line other than the first, are shown as an ordinary quote. The kind can be written in upper or lower case.\n\n> An ordinary quote looks like this.\n\n## Changing the colors\n\n| CSS variable | Kind | Default |\n| --- | --- | --- |\n| `--mpv-color-note` | Note | `#2563eb` (blue) |\n| `--mpv-color-tip` | Tip | `#16a34a` (green) |\n| `--mpv-color-important` | Important | `#7c3aed` (purple) |\n| `--mpv-color-warning` | Warning | `#b45309` (ochre) |\n| `--mpv-color-caution` | Caution | `#dc2626` (red) |\n\nThe defaults are easy to read on a white background. If the host screen is dark, set lighter colors.\n\n~~~css\n[data-theme='dark'] md-pages-viewer {\n  --mpv-color-note: #60a5fa;\n  --mpv-color-tip: #4ade80;\n  --mpv-color-important: #a78bfa;\n  --mpv-color-warning: #fbbf24;\n  --mpv-color-caution: #f87171;\n}\n~~~\n\n> [!NOTE]\n> The \"Dark\" theme of this demo switches with these settings too."},{"id":"doc-locale","parentId":"doc-features","order":5,"title":"Language and wording","description":"Choose the language of the viewer's own words, and change them one by one","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(100%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(100%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2256%22%20width%3D%22240%22%20height%3D%22106%22%20rx%3D%226%22%20fill%3D%22%23f3f4f6%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2264%22%20width%3D%22120%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(100%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2280%22%20width%3D%22170%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2296%22%20width%3D%22140%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(100%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2280%22%20y%3D%22112%22%20width%3D%22110%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%22128%22%20width%3D%2290%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(100%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22144%22%20width%3D%2260%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3C%2Fsvg%3E","md":"# Language and wording\n\nThe language of the buttons, the search box and the viewer's other words is chosen with `locale`. Japanese (`ja`, the default), English (`en`), Simplified Chinese (`zh-CN`), Traditional Chinese (`zh-TW`) and Korean (`ko`) are built in. Setting `locale` is all it takes to show the buttons and the other words in that language; use `texts` only when there are words you want to change.\n\n~~~html\n\u003cmd-pages-viewer pages=\"/api/manual/pages\" locale=\"en\">\u003c/md-pages-viewer>\n~~~\n\nTags such as `en-US` and `zh-Hant` work too. A language that is not built in shows Japanese, with a warning in the console.\n\n> [!TIP]\n> Choose a language from the language menu at the top right of the screen (the globe icon) to switch this demo and its manual to that language. The buttons, contents and other words of the viewer change with `locale`; the page names and bodies change because the demo gives it the page data in that language.\n\n## Changing the words\n\nWith `texts`, you can change the words one by one. Only the ones you write change; the rest stay in the language of `locale`. Words that show a number or the like are written as a function that takes it.\n\n~~~js\nviewer.texts = {\n  search: 'Find a page',\n  chapters: (n) => `${n} sections`,\n};\n~~~\n\n| Key | Where | English |\n| --- | --- | --- |\n| `loading`, `failed`, `retry` | While loading, when it could not load, and the button to try again | Loading… / Could not load / Try again |\n| `notFound`, `noPages` | When the page does not exist, and when there are no pages | Page not found / No pages |\n| `pageList` | The name of the sidebar for screen readers | Pages |\n| `columnPages`, `columnContent` | The heading of the sidebar, and the heading row of a child page table | Pages / Description |\n| `toc` | The heading of the page contents | Contents |\n| `breadcrumb` | The name of the breadcrumb for screen readers | Breadcrumb |\n| `toggle` | The name of a sidebar toggle for screen readers (a function that takes the page's name) | Toggle (name) |\n| `chapters`, `childPages` | The number of chapters and of child pages in a child page list (functions that take the number) | N chapters / N pages |\n| `search`, `searchLabel` | The hint in the search box, and its name for screen readers | Search / Search pages |\n| `searching` | The search results until every page has been read | Searching… |\n| `noResults` | The search results when nothing matches (a function that takes the words typed) | No pages match \"(words)\" |\n| `sidebarClose`, `sidebarOpen` | The buttons that hide and show the sidebar | Hide pages / Show pages |\n| `tocClose`, `tocOpen` | The buttons that hide and show the contents | Hide contents / Show contents |\n| `viewCard`, `viewList` | The button that switches a child page list between a table and cards | Card view / List view |\n| `pager`, `previous`, `next` | The previous and next pages (their name for screen readers, and the words on them) | Previous and next pages / Previous / Next |\n| `calloutNote`, `calloutTip`, `calloutImportant`, `calloutWarning`, `calloutCaution` | The headings of callouts | Note / Tip / Important / Warning / Caution |\n\n> [!NOTE]\n> A key that is not in the table, or a string where a function is expected, is not used, and a warning is shown in the console.\n\n## Switching the language\n\nIf you change `locale` or `texts` after the viewer is shown, the words change at once, and the page and the scroll position stay where they are. To change `texts`, set a new object.\n\n> [!IMPORTANT]\n> The names and bodies of the pages are not translated. To switch the language, give `pages` the page data in that language together with `locale`. Put the button that switches the language on your own screen.\n\n~~~js\nconst pages = { ja: pagesJa, en: pagesEn }; // the page data in each language\n\nfunction setLanguage(lang) {\n  document.documentElement.lang = lang;\n  viewer.locale = lang;\n  viewer.pages = pages[lang];\n}\n~~~\n\nIf the new data has a page with the same ID, that page stays open. This demo switches its language the same way."},{"id":"doc-security","parentId":null,"order":5,"title":"Security","md":"# Security\n\n## Sanitizing\n\nThe HTML converted from Markdown is sanitized with DOMPurify before it goes on the screen. Besides anything that could run a script, these are removed too:\n\n- `\u003cstyle>`, `\u003cform>`, `\u003cdialog>`, `\u003cslot>`, and attributes such as `popover` (they would affect the screen of the host page)\n- Anything that loads an image without going through `imageResolver` (the `poster` and `background` attributes, `style` attributes with CSS `url()`, and so on)\n\n> [!CAUTION]\n> The CSS passed in `styles` is not sanitized (see [Styling the body](?page=doc-styles)).\n\n## Content Security Policy\n\nIt works on pages that use a Content Security Policy.\n\n- The CSS works without `'unsafe-inline'` in `style-src`\n- On pages that enforce Trusted Types, it uses one policy, named `md-pages-viewer`. If the `trusted-types` directive limits the names allowed, add this name\n\n~~~text\nContent-Security-Policy: require-trusted-types-for 'script'; trusted-types md-pages-viewer\n~~~"},{"id":"example","parentId":null,"order":6,"title":"Example: a store manual","description":"The manual of a made-up store management app"},{"id":"welcome","parentId":"example","title":"Welcome","order":1,"description":"What Sample Store Admin does, and what to set up first","md":"# Welcome\n\nSample Store Admin is a service for managing the details, staff and bookings of several stores in one place. This manual explains how to use its screens and the settings that administrators make.\n\n## What you can do\n\n- Manage the hours, address and contact details of each store\n- Invite staff and assign them to the stores they work at\n- Take bookings from customers, and manage changes and cancellations\n- Get notified of bookings, and receive monthly reports\n- Export bookings and store details as CSV\n\n## The screens\n\nAfter you sign in, the menu is on the left and the screen you chose is on the right. Which menu items you see depends on your role.\n\n| Menu | What you can do | Help page |\n| --- | --- | --- |\n| Dashboard | See this month's numbers and how bookings are going | [The dashboard](?page=guide-dashboard) |\n| Stores | Add stores, and set their hours and more | [Adding a store](?page=guide-store) |\n| Staff | Invite staff, and assign them to stores | [Adding staff](?page=guide-staff) |\n| Bookings | See the list of bookings, and change or cancel them | [Managing bookings](?page=guide-booking) |\n| Reports | See the monthly figures | [Reading reports](?page=guide-report) |\n| Help | This manual | – |\n\nAt the top right of the screen is the account menu (the circle with your initial). Notifications, changing your password and signing out are there.\n\n## What to set up first\n\nWhen you start, set things up in this order. Someone with the Owner or Admin role should do it.\n\n1. [Adding a store](?page=guide-store): add your stores, and decide their hours and how they take bookings\n2. [Adding staff](?page=guide-staff): invite your staff, and assign them to stores\n3. [Notifications](?page=guide-notice): choose the notifications to get. Everyone sets their own\n\nTo make signing in safer, go on to require [two-step verification](?page=admin-2fa).\n\n## Supported environments\n\n| Kind | Supported |\n| --- | --- |\n| Browsers on a computer | The latest Chrome, Edge, Safari and Firefox |\n| Smartphones | The latest Safari on iPhone and Chrome on Android |\n| App | The \"Sample Store Admin\" app for iPhone and Android (for notifications and checking bookings) |\n\nOn older browsers, screens may look broken or buttons may not work.\n\n## When you need help\n\nStart with the [FAQ](?page=faq). To check the value of a setting, the [settings reference](?page=reference) is handy.\n\nIf that does not solve it, send a message from \"Contact us\" in the account menu at the top right. We answer on weekdays from 10:00 to 18:00, within two business days.\n","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A 22hsl(232%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22106%22%20width%3D%22122%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22117%22%20width%3D%22104%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%22140%22%20r%3D%229%22%20fill%3D%22hsl(232%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22134%22%20width%3D%22153%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22145%22%20width%3D%2281%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E"},{"id":"guide","parentId":"example","title":"User guide","order":2,"description":"The basics of the sample app","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(200%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2244%22%20width%3D%22150%22%20height%3D%2210%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2264%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2290%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22116%22%20width%3D%22120%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%22226%22%20y%3D%22140%22%20width%3D%2260%22%20height%3D%2218%22%20rx%3D%225%22%20fill%3D%22hsl(200%2070%25%2055%25)%22%2F%3E%3C%2Fsvg%3E"},{"id":"guide-login","parentId":"guide","title":"Signing in","order":1,"description":"How to sign in with your email address and password, and what to do when you cannot","md":"# Signing in\n\nTo use Sample Store Admin, sign in with the email address and the password you set from your invitation email. This page explains how to sign in, and what to do when you cannot.\n\n## Signing in\n\n1. Open the sign-in screen\n2. Enter your email address and password\n3. Press \"Sign in\"\n\nIf your organization requires two-step verification, a screen for the verification code comes next.\n\n### Entering the verification code\n\nEnter the 6-digit number from your authenticator app or from a text message. The code in an authenticator app changes every 30 seconds, so enter it while it is shown.\n\nCheck \"Don't ask again on this device for 30 days\", and you can skip the code for 30 days on the same device and browser. See [Two-step verification](?page=admin-2fa) for how to set it up.\n\n## Staying signed in\n\n> [!WARNING]\n> Check \"Keep me signed in\", and you will not need to sign in for 30 days. Uncheck it on a shared computer.\n\nStaying signed in is recorded for each device and browser. On another computer or smartphone, you need to sign in again. Signing out ends it on that device.\n\n## Signing out\n\nPress \"Sign out\" in the account menu at the top right of the screen.\n\nTo sign out on your other devices too, for example when you lose a computer, press \"Sign out of all devices\" under \"Signed-in devices\" in the account menu. You will then need to sign in again on every device.\n\n## If you forget your password\n\n1. Press \"Forgot your password?\" on the sign-in screen\n2. Enter the email address you registered, and press \"Send\"\n3. Open the link in the email you receive (the link works for 1 hour)\n4. Enter a new password twice, and press \"Save\"\n\nYour organization has rules for new passwords. For the length and the characters allowed, see [Password rules](?page=admin-password).\n\n## If you cannot sign in\n\n| Message | What to do |\n| --- | --- |\n| The password is incorrect | Check upper and lower case, and the input mode of your keyboard |\n| This account is locked | Wait 30 minutes, or ask an administrator to unlock it |\n| The email address was not found | Ask an administrator which email address was registered |\n| The verification code is incorrect | Check that the clock of your smartphone is right |\n| You cannot sign in from this location | Connect to your company's network, then sign in |\n| The invitation has expired | Ask an administrator to invite you again |\n\n### If your account is locked\n\nAfter 5 wrong passwords in a row, the account is locked for 30 minutes. It is unlocked automatically after 30 minutes. If it is urgent, an administrator can unlock it from the staff member's details screen.\n\n### If an email does not arrive\n\nIf a password reset email or an invitation email does not arrive, check your spam folder. If your company email does not receive it, ask your email administrator to allow the sender's address.\n","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(232%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2244%22%20width%3D%22150%22%20height%3D%2210%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2264%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2290%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22116%22%20width%3D%22120%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%22226%22%20y%3D%22140%22%20width%3D%2260%22%20height%3D%2218%22%20rx%3D%225%22%20fill%3D%22hsl(232%2070%25%2055%25)%22%2F%3E%3C%2Fsvg%3E"},{"id":"guide-dashboard","parentId":"guide","title":"The dashboard","order":2,"description":"What each area of the first screen after signing in shows","md":"# The dashboard\n\nAfter you sign in, the dashboard is shown first. It shows this month at the stores you look after at a glance.\n\n## The layout\n\n| Area | Where | What it shows |\n| --- | --- | --- |\n| Numbers at the top | At the very top | Bookings this month, the change since last month, and what is left to the goal |\n| Chart | In the middle | How bookings have gone recently |\n| Today's bookings | On the right | The list of today's bookings |\n| News | At the bottom | News from the Sample Store Admin team |\n\n## Numbers at the top\n\nShows bookings this month, the change since last month, and what is left to the goal. Press a number to see its breakdown.\n\n| Number | Meaning |\n| --- | --- |\n| Bookings this month | Bookings from the 1st of this month to today. Canceled bookings are not counted |\n| Since last month | The difference from the bookings up to the same day last month. Green if it went up, red if it went down |\n| Left to the goal | This month's goal minus the bookings this month. Not shown if no goal is set |\n\n### Setting goals\n\nGoals are set for each store and each month. Choose a store on the \"Stores\" screen, and enter the number for each month on the \"Goals\" tab. Only people with the Owner or Admin role can set goals.\n\n## Chart\n\nShows the last 12 months. Hover over the chart to see the value for a month.\n\n### Changing the period\n\nChoose 3, 6 or 12 months from \"Period\" at the top right of the chart.\n\n### Choosing stores\n\nIf you look after several stores, choose which to show with \"Stores\" at the top left of the chart. With none chosen, it shows the total of all the stores you look after.\n\n## Today's bookings\n\nShows today's bookings, earliest first. Press a customer's name to open the details of that booking.\n\n- Bookings where the customer has arrived are marked \"Arrived\"\n- Canceled bookings appear in gray at the bottom of the list\n- Only the bookings at the stores you look after are shown\n\n## News\n\nShows the 5 latest news items from the Sample Store Admin team. Unread ones are marked.\n\nImportant news, such as maintenance, is also shown at the top of the screen right after you sign in. Press \"Close\", and it is not shown again until the next news item.\n\n## Arranging the areas\n\nFrom \"…\" at the top right of each area, you can reorder and hide the areas. The arrangement is yours alone; other people's dashboards do not change. To undo it, press \"Reset to default\" under \"…\".\n","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(200%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2244%22%20width%3D%2258%22%20height%3D%2234%22%20rx%3D%225%22%20fill%3D%22hsl(200%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22162%22%20y%3D%2244%22%20width%3D%2258%22%20height%3D%2234%22%20rx%3D%225%22%20fill%3D%22hsl(200%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22228%22%20y%3D%2244%22%20width%3D%2258%22%20height%3D%2234%22%20rx%3D%225%22%20fill%3D%22hsl(200%2070%25%2094%25)%22%2F%3E%3Cpolyline%20points%3D%22100%2C150%20130%2C128%20160%2C136%20190%2C108%20220%2C116%20250%2C92%20282%2C98%22%20fill%3D%22none%22%20stroke%3D%22hsl(200%2070%25%2055%25)%22%20stroke-width%3D%224%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E"},{"id":"guide-store","parentId":"guide","title":"Adding a store","order":3,"description":"Add a store, and set its hours and address","md":"# Adding a store\n\nAdd a store, and set its hours and how it takes bookings. Only people with the Owner or Admin role can add stores.\n\n## Adding a store\n\n1. Open \"Stores\" in the menu\n2. Press \"Add\" at the top right\n3. Fill in the items below and press \"Save\"\n\n| Item | Required | Description |\n| --- | --- | --- |\n| Store name | Required | The name shown on screens and in reports (up to 40 characters) |\n| Store code | Required | A code that identifies the store in exports and integrations (up to 8 letters and digits) |\n| Address | Required | Filled in automatically when you enter the postal code |\n| Phone number | Optional | With or without hyphens |\n| Email address | Optional | The sender of booking confirmations |\n\n### About the store code\n\n> [!IMPORTANT]\n> The store code cannot be changed after the store is added. Exported CSV files and reports identify stores by their store code, not by their name. Give each store a fixed code, so that past data stays linked even if you rename the store.\n\n## Setting the hours\n\nEnter the opening and closing times for each day of the week. For the days the store is closed, check \"Closed\".\n\n> [!NOTE]\n> Times are entered in steps of 15 minutes. If there is a lunch break, press \"Add a break\" and enter when it starts and ends. No bookings are taken during the break.\n\n### Hours on public holidays\n\nTo use different hours on public holidays only, enter them on the \"Holidays\" row. If it is left empty, the hours for that day of the week are used.\n\n### Open past midnight\n\nFor a store open late at night, enter a closing time of \"24:00\" or later. For example, to close at 2 a.m. the next day, enter \"26:00\". The latest is \"29:00\".\n\n## Adding temporary closing days\n\nFor the days you close for the New Year holidays, a renovation and so on, add the dates on the \"Temporary closing days\" tab. You can also add a range of dates.\n\nThose days can no longer be chosen on the booking screen. Bookings already made for them appear above the booking list as \"Bookings on temporary closing days\". Customers are not contacted automatically, so contact each one yourself.\n\n## Setting how bookings are taken\n\nOn the \"Booking settings\" tab, decide how many days ahead bookings are taken, until when, the length of a slot and so on. For the values you can choose and the defaults, see the [settings reference](?page=reference).\n\nIf you change the length of a slot, the bookings already made stay as they are, and new bookings use the new length.\n\n## Hiding a store\n\nHide a store you will not use for a while. A hidden store no longer appears on the booking screen or the dashboard, but its data is kept. To use it again, press \"Show\" under \"Hidden stores\" in the store list.\n\nHidden stores do not count toward the number of stores in your plan.\n\n## Deleting a store\n\n> [!CAUTION]\n> A deleted store cannot be restored. If you will just not use it for a while, hide it instead.\n\nDeleting a store also deletes all its bookings and goals. To keep them, export them first with [Exporting data](?page=guide-export).\n\n> After adding your stores, go on to [Adding staff](?page=guide-staff).\n","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2246%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2094%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%2251%22%20width%3D%2250%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2268%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%2273%22%20width%3D%2273%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2290%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%2295%22%20width%3D%2256%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22112%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%22117%22%20width%3D%2279%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22134%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%22139%22%20width%3D%2262%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3C%2Fsvg%3E"},{"id":"guide-staff","parentId":"guide","title":"Adding staff","order":4,"description":"Invite staff, and assign them to the stores they work at","md":"# Adding staff\n\nInvite staff, and decide their roles and the stores they work at. Only people with the Owner or Admin role can invite staff.\n\n## Inviting\n\nPress \"Invite\" on the \"Staff\" screen of the menu, and enter an email address. The staff member sets their own password from the link in the invitation email.\n\nAn invitation is valid for 7 days. If it expires, invite them again.\n\n### Inviting many at once\n\nTo invite 10 people or more, use \"Invite many\" next to \"Invite\", and paste one email address per line. Everyone gets the same role and stores. You can change them one by one later.\n\n## Invitation status\n\nThe staff list shows the status of each invitation like this.\n\n| Status | Meaning | What you can do |\n| --- | --- | --- |\n| Invited | The email was sent, and they have not joined yet | Cancel the invitation, or send the email again |\n| Expired | They did not join within 7 days | Invite them again |\n| Joined | They have set a password and can sign in | Change their role and stores |\n| Suspended | An administrator has suspended them | Reactivate them |\n\n> [!TIP]\n> Invited and expired staff do not count toward the number of staff in your plan.\n\n## Assigning stores\n\nChoose \"Assigned stores\" on the staff member's details screen. You can choose several stores.\n\nThe assigned stores decide which bookings the staff member can see, and which notifications they get. Bookings at other stores appear neither in their list nor on their dashboard.\n\n## Permissions\n\n- Viewer: can only view data\n- Editor: can change store details\n- Admin: can also add and remove staff\n\nFor the details of permissions, see [Roles and permissions](?page=admin-roles).\n\n## Entering work schedules\n\nEnter the days and hours a staff member works under \"Work schedule\" on their details screen. Then customers can choose them on the booking screen.\n\n- Work schedules can only be within the store's hours\n- For staff at several stores, enter one for each store\n- Days off are added by date\n\n## Suspending staff\n\nStaff who no longer use the app, for example because they have left, are suspended rather than deleted. Suspended staff can no longer sign in, but their names stay on the bookings they handled and in the activity log.\n\nSuspended staff do not count toward the number of staff. To use them again, press \"Reactivate\".\n\n## Deleting staff\n\nDeleted staff cannot be restored. The staff field of the bookings they handled becomes \"Deleted staff member\". To keep the records, suspend them instead of deleting them.\n","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2 3C%2Fsvg%3E"},{"id":"guide-notice","parentId":"guide","title":"Notifications","order":6,"description":"Choose the notifications you get by email or in the app","md":"# Notifications\n\nYou can get notified by email or in the app when a booking is made or canceled. Each staff member has their own notification settings, and chooses them for themselves.\n\n## Choosing notifications\n\nOpen \"Notification settings\" in the account menu at the top right, and check the notifications you want.\n\n| Notification | Email | App |\n| --- | --- | --- |\n| New booking | ✓ | ✓ |\n| Booking canceled | ✓ | ✓ |\n| Booking on a temporary closing day | ✓ | ✓ |\n| Monthly report | ✓ | – |\n| Invitation accepted | ✓ | – |\n\nThe monthly report arrives on the 1st of each month, for the previous month. For what it contains, see [Reading reports](?page=guide-report).\n\n## Stores to be notified about\n\nYou are notified only about bookings at the stores you look after. People with the Owner or Admin role can choose \"All stores\".\n\nIf you look after many stores, narrow down the stores to be notified about with \"Choose stores\".\n\n## Quiet hours\n\nIf you do not want notifications at night, set \"Quiet hours\". The notifications during that time arrive together when it ends. Email and the app can be set separately.\n\n## Getting them together\n\nAt stores with many bookings, you can get notifications together once an hour instead of one by one. A combined notification lists the bookings and cancellations of that hour.\n\n## Turning on app notifications\n\n1. Install the \"Sample Store Admin\" app on your smartphone\n2. Sign in to the app\n3. When asked to allow notifications, press \"Allow\"\n4. Choose the notifications to get under \"Settings\" → \"Notifications\" in the app\n\nIf you were not asked, or pressed \"Don't Allow\", turn on the notifications for Sample Store Admin in the Settings app of your smartphone.\n\n## If notifications do not arrive\n\nCheck your spam folder. App notifications must be allowed in the settings of your smartphone.\n\n- Check that it is not during your quiet hours\n- Check that the booking's store is among the stores you are notified about\n- Check that your email address is right, under \"Profile\" in the account menu\n- Check that you have not signed out of the app (after you sign out, app notifications do not arrive)\n","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(40%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2244%22%20width%3D%22190%22%20height%3D%2234%22%20rx%3D%226%22%20fill%3D%22hsl(40%2070%25%2094%25)%22%2F%3E%3Ccircle%20cx%3D%22114%22%20cy%3D%2261%22%20r%3D%228%22%20fill%3D%22hsl(40%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%22130%22%20y%3D%2256%22%20width%3D%22120%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2286%22%20width%3D%22190%22%20height%3D%2234%22%20rx%3D%226%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22114%22%20cy%3D%22103%22%20r%3D%228%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22130%22%20y%3D%2298%22%20width%3D%22100%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22128%22%20width%3D%22190%22%20height%3D%2230%22%20rx%3D%226%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E"},{"id":"guide-export","parentId":"guide","title":"Exporting data","order":8,"description":"Export data as CSV to use it in a spreadsheet","md":"# Exporting data\n\nExport bookings and store details as CSV to use them in a spreadsheet. What you can export depends on your role and your assigned stores.\n\n## Exporting as CSV\n\nPress \"Export\" at the top right of a list screen to download a CSV of the list with its current filters.\n\n1. Open the list screen you want to export\n2. Filter it by period or store\n3. Press \"Export\" at the top right\n\nThe filters are used as they are for the export. For example, to export only last month's bookings, set the period of the booking list to last month, then export.\n\n## What you can export\n\n| Data | Exported from | Roles that can export it |\n| --- | --- | --- |\n| Bookings | The booking list | All roles (for their assigned stores only) |\n| Stores | The store list | Editor, Admin and Owner |\n| Staff | The staff list | Admin and Owner |\n| Activity log | The activity log | Admin and Owner |\n\n## If the text is garbled\n\nCSV files are exported in UTF-8. If the text is garbled in Excel, import the file with \"From Text/CSV\" on the \"Data\" tab.\n\nIf you always open them in Excel, the Owner can change the encoding to Shift_JIS under \"Organization settings\" → \"Data\". This changes the exports of everyone in the organization to Shift_JIS.\n\n## How many rows\n\nUp to 100,000 rows can be exported at once. For more, export the periods separately.\n\n## Export records\n\nEach export is recorded as \"Export\" in the activity log. You can check who exported what and when in the [activity log](?page=admin-audit).\n","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(190%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2246%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22hsl(190%2070%25%2094%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%2251%22%20width%3D%2250%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22hsl(190%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2268%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x% o.\n\n## The roles\n\n| Role | View stores | Edit stores | Manage staff | Billing |\n| --- | --- | --- | --- | --- |\n| Viewer | ✓ | – | – | – |\n| Editor | ✓ | ✓ | – | – |\n| Admin | ✓ | ✓ | ✓ | – |\n| Owner | ✓ | ✓ | ✓ | ✓ |\n\n## Each role\n\n### Viewer\n\nCan see the bookings and store details of their assigned stores. Cannot change or cancel bookings. Suited to part-time staff, and to people who only check the numbers.\n\n### Editor\n\nCan change and cancel bookings at their assigned stores, and change store details. Suited to people who take bookings at a store day to day.\n\n### Admin\n\nCan do what Editors can, and also invite staff, change their roles, suspend them, and change the security settings. Suited to store managers and to people who look after several stores.\n\n### Owner\n\nCan do everything. Only the Owner can handle billing and plan changes, the data settings, and closing the account.\n\n## Changing a role\n\nChoose a different \"Role\" on the staff member's details screen. The change takes effect at once.\n\nWhen a role is lowered, the buttons for what the staff member can no longer do stop working, even on screens they have open. You cannot change your own role.\n\n## Handing over the Owner role\n\nAn organization has only one Owner. When the Owner role is handed to someone else, the previous Owner becomes an Admin.\n\n1. Open \"Organization settings\" → \"Owner\"\n2. Choose the staff member to become the new Owner\n3. To confirm, enter your password and press \"Hand over\"\n\nThe new Owner is told by email. To undo it, the new Owner must hand it back.\n\n## Roles and assigned stores\n\nA role applies within the person's assigned stores. For example, an Editor can change the details of only the stores they look after. The Owner can handle all stores, whatever their assigned stores.\n\n## Records of changes\n\nRole changes and Owner handovers are recorded in the [activity log](?page=admin-audit).\n","thumbnail":"data:image/svg+xml,%3Csvg%20xmln %2295%22%20width%3D%2256%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22112%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%22117%22%20width%3D%2279%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22134%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%22139%22%20width%3D%2262%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3C%2Fsvg%3E"},{"id":"admin-billing","parentId":"admin","title":"Billing and payment","order":2,"description":"Change your plan, download invoices and change how you pay","md":"# Billing and payment\n\nChange your plan, download invoices, and change how you pay. Only the Owner can do anything about billing.\n\n## Changing the plan\n\nChoose under \"Organization settings\" → \"Plan\". A change to a higher plan takes effect at once, and a change to a lower plan from the next billing date.\n\n| Plan | Stores | Suited to |\n| --- | --- | --- |\n| Standard | Up to 10 | Running one to a few stores |\n| Business | No limit | Managing many stores together |\n\nWhen you change to a lower plan, if you have more stores than its limit, hide some stores first.\n\n## Billing date\n\nFor a monthly plan, the day you subscribed is the billing date each month. For a yearly plan, it is the billing date each year. If the billing date is at the end of a month and a month has no such day, the last day of that month is the billing date.\n\n## Downloading invoices\n\nDownload each month's invoice as a PDF from \"Billing history\".\n\nInvoices are issued the day after the billing date. The Owner is told by email when one is issued.\n\n### The addressee of invoices\n\nChange the company name, department and contact name on invoices under \"Organization settings\" → \"Billing\". The new addressee is used from the next invoice.\n\n## Changing how you pay\n\nChoose a credit card or paying by invoice. Paying by invoice is only for yearly plans.\n\n- Credit card: paid automatically on the billing date\n- By invoice: pay by bank transfer within 30 days of the invoice\n\n## If a payment fails\n\nIf a payment fails, for example because the credit card has expired, the Owner gets an email and a notice appears at the top of the screen. Update the payment method within 14 days. When you update it, the payment is tried again at once.\n\nAfter 14 days, everyone in the organization can only view. Once the payment is made, everything goes back to normal.\n\n## Canceling the subscription\n\nCancel from \"Cancel subscription\" under \"Organization settings\" → \"Plan\". After you cancel, you can use the app until the end of that billing period; after that, it is treated as closing the account. For what happens to your data, see the [FAQ](?page=faq).\n","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(140%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx
