%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%2256%22%20r%3D%229%22%20fill%3D%22hsl(0%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2250%22%20width%3D%22110%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2261%22%20width%3D%2270%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%2284%22%20r%3D%229%22%20fill%3D%22hsl(0%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2278%22%20width%3D%22141%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2289%22%20width%3D%2287%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%22112%22%20r%3D%229%22%20fill%3D%22hsl(0%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22106%22%20width%3D%22122%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22117%22%20width%3D%22104%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%22140%22%20r%3D%229%22%20fill%3D%22hsl(0%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22134%22%20width%3D%22153%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22145%22%20width%3D%2281%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E"},{"id":"admin-2fa","parentId":"admin-security","title":"两步验证","order":1,"description":"登录时除密码外，还要求输入验证码","md":"# 两步验证\n\n使用两步验证后，登录时除了密码之外，还要求输入验证码。即使密码泄露，没有验证码也无法登录。\n\n## 启用\n\n1. 打开“组织设置”→“安全”\n2. 开启“强制启用两步验证”\n\n从下次登录起，所有人都需要输入验证码。\n\n只有拥有所有者或管理员角色的人员才能开启此设置。开启之前先通知员工，可以避免他们登录时感到困惑。\n\n## 接收验证码的方式\n\n- 身份验证器应用（推荐）\n- 短信（SMS）\n\n身份验证器应用在没有信号的地方也能查看验证码。短信只需登记电话号码即可使用，但可能因信号状况而延迟送达。\n\n## 设置身份验证器应用\n\n1. 在智能手机上安装身份验证器应用\n2. 登录示例门店管理后，设置界面中会显示二维码\n3. 用身份验证器应用扫描二维码\n4. 输入身份验证器应用中显示的 6 位数字，点击“验证”\n\n## 设置短信\n\n1. 在设置界面中选择“通过短信接收”\n2. 输入电话号码，点击“发送”\n3. 输入收到的 6 位数字，点击“验证”\n\n## 备用验证码\n\n设置完成后，会显示 10 个备用验证码。在无法使用智能手机时，可以用它们代替验证码，每个只能使用一次。请打印出来，或保存在安全的地方。\n\n可以在账户菜单的“安全”中重新生成备用验证码。重新生成后，之前的验证码将无法使用。\n\n## 手机丢失时\n\n请管理员暂时解除该员工的两步验证，然后重新设置。\n\n如果有备用验证码，可以自己登录，在新的智能手机上重新设置。\n\n## 更换手机时\n\n在旧手机还能使用时，在账户菜单的“安全”中点击“更换身份验证器应用”，然后用新手机扫描二维码。","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(260%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2244%22%20width%3D%22150%22%20height%3D%2210%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2264%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2290%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22116%22%20width%3D%22120%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%22226%22%20y%3D%22140%22%20width%3D%2260%22%20height%3D%2218%22%20rx%3D%225%22%20fill%3D%22hsl(260%2070%25%2055%25)%22%2F%3E%3C%2Fsvg%3E"},{"id":"admin-password","parentId":"admin-security","title":"密码规则","order":2,"description":"设置字符数、可用字符和更改间隔","md":"# 密码规则\n\n设置组织中员工所用密码的规则。只有拥有所有者或管理员角色的人员才能设置规则。\n\n## 可以设置的项目\n\n| 项目 | 可选值 | 默认值 |\n| --- | --- | --- |\n| 最少字符数 | 8～32 个字符 | 10 个字符 |\n| 必须包含符号 | 是 / 否 | 否 |\n| 要求更改的间隔 | 无 / 90 天 / 180 天 | 无 |\n\n## 可用字符\n\n密码中可以使用大写英文字母、小写英文字母、数字和符号。不能使用全角字符和空格。\n\n开启“必须包含符号”后，密码中必须至少包含以下符号中的一个。\n\n~~~text\n! # $ % & ( ) * + - . / : ; = ? @ [ ] ^ _ { | } ~\n~~~\n\n## 要求更改的间隔\n\n将“要求更改的间隔”设为 90 天或 180 天后，从上次更改密码之日起经过该天数时，会在登录后要求更改密码。在更改之前，无法进入其他界面。\n\n如今普遍认为，与要求定期更改相比，使用较长且难以猜测的密码更安全。如无特殊理由，请保持“无”。\n\n## 锁定条件\n\n连续输错 5 次后，账户将被锁定 30 分钟。\n\n~~~text\n示例：A1b2C3d4e5（10 个字符：大写字母、小写字母和数字）\n~~~\n\n## 更改规则后\n\n即使将规则改得更严格，现有密码仍可继续使用。新规则从下次更改密码时开始适用。\n\n如果希望所有人立即改用符合新规则的密码，请在“组织设置”→“安全”中点击“要求所有人更改密码”。所有人在下次登录时会被要求更改密码。","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(100%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2244%22%20width%3D%22150%22%20height%3D%2210%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2264%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2290%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22116%22%20width%3D%22120%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23d6dbe3%22%2F%3E%3Crect%20x%3D%22226%22%20y%3D%22140%22%20width%3D%2260%22%20height%3D%2218%22%20rx%3D%225%22%20fill%3D%22hsl(100%2070%25%2055%25)%22%2F%3E%3C%2Fsvg%3E"},{"id":"admin-audit","parentId":"admin","title":"操作记录","order":4,"description":"查看谁在何时更改了什么","md":"# 操作记录\n\n可以查看谁在何时更改了什么。只有拥有所有者或管理员角色的人员才能查看操作记录。\n\n## 查看记录\n\n在“组织设置”→“操作记录”中，按从新到旧的顺序显示最近 90 天的操作。\n\n## 记录的操作\n\n- 登录和退出登录\n- 门店和员工的添加、更改与删除\n- 权限和套餐的更改\n\n此外，以下操作也会被记录。\n\n| 操作 | 记录示例 |\n| --- | --- |\n| 导出数据 | 导出了预约（2,340 条） |\n| 安全设置 | 设为强制启用两步验证 |\n| 登录失败 | 因密码错误而锁定 |\n| 转让所有者 | 转让了所有者 |\n\n预约的接受和更改不会记录在操作记录中，而是保留在各预约的“历史记录”中。\n\n## 记录的字段\n\n| 项目 | 内容 |\n| --- | --- |\n| 日期时间 | 进行操作的日期和时间（精确到秒） |\n| 操作人 | 员工的姓名和电子邮件地址 |\n| 操作 | 操作的类型 |\n| 对象 | 被操作的门店、员工等 |\n| 位置 | 进行操作时的 IP 地址 |\n\n点击记录行，会显示更改前后的值。\n\n## 筛选\n\n可以按员工、操作类型和时间范围进行筛选。筛选结果可以按与[导出数据](?page=guide-export)相同的步骤导出为 CSV。\n\n## 保存期限\n\n操作记录保存 90 天，更早的记录会在每月 1 日删除。如果需要长期保留，请每月导出一次。","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(210%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%2256%22%20r%3D%229%22%20fill%3D%22hsl(210%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2250%22%20width%3D%22110%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2261%22%20width%3D%2270%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%2284%22%20r%3D%229%22%20fill%3D%22hsl(210%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2278%22%20width%3D%22141%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%2289%22%20width%3D%2287%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%22112%22%20r%3D%229%22%20fill%3D%22hsl(210%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22106%22%20width%3D%22122%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22117%22%20width%3D%22104%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22108%22%20cy%3D%22140%22%20r%3D%229%22%20fill%3D%22hsl(210%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22134%22%20width%3D%22153%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22124%22%20y%3D%22145%22%20width%3D%2281%22%20height%3D%225%22%20rx%3D%222%22%20fill%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E"},{"id":"reference","parentId":"example","title":"设置项一览","description":"各界面的设置项，以及可选值和默认值","md":"# 设置项一览\n\n本页按界面汇总了示例门店管理中可以更改的设置。操作步骤在操作指南的各个页面中说明，本页用于确认各项设置的含义、可选值和默认值。\n\n可以更改设置的人员因角色而异。各角色可以进行的操作请参见[权限设置](?page=admin-roles)。\n\n## 门店设置\n\n在菜单的“门店”中选择门店，打开“设置”选项卡即可更改。每家门店分别拥有各自的值。\n\n### 基本信息\n\n| 项目 | 内容 | 输入规则 |\n| --- | --- | --- |\n| 门店名称 | 在界面、单据和预约页面中显示的名称 | 最多 40 个字符 |\n| 门店代码 | 在导出和与外部系统对接中用于识别门店的编号 | 最多 8 个半角字母或数字。添加后无法更改 |\n| 地址 | 显示在预约页面的地图和到店指引中 | 输入邮政编码后会自动填写 |\n| 电话号码 | 显示在预约页面中 | 带不带连字符均可 |\n| 电子邮件地址 | 发送预约确认邮件时的发件人 | 仅限 1 个 |\n| 门店简介 | 在预约页面中显示在门店名称下方的文字 | 最多 400 个字符 |\n\n即使更改了门店名称，之前导出的 CSV 和单据中的门店名称也不会改变。与过去的单据对照时，请使用门店代码。\n\n### 营业时间\n\n按星期以 15 分钟为单位输入开店和闭店时间。如果有午休，请点击“添加休息时间”，输入休息的开始和结束时间。休息期间不接受预约。\n\n- 闭店时间必须晚于开店时间。跨日营业时，请将闭店时间输入为“24:00”或更晚（最晚“29:00”）\n- 固定休息日请勾选“休息”\n- 如果只有节假日使用不同的营业时间，请在“节假日”一行中输入。留空则使用当天所在星期的营业时间\n\n### 临时停业日\n\n对于新年假期、装修等原因停业的日子，请指定日期进行添加。也可以按时间段添加。已添加的日期在预约页面中将无法选择，已有的预约会以“临时停业日的预约”显示在列表上方。系统不会自动联系顾客，请从列表中逐一联系。\n\n临时停业日最多可以提前 1 年添加。已过去的日期会自动从列表中消失。\n\n### 预约受理\n\n| 项目 | 可选值 | 默认值 |\n| --- | --- | --- |\n| 开始受理 | 提前 1～180 天 | 提前 60 天 |\n| 受理截止 | 当天～提前 7 天（可指定时间） | 前一天 18:00 |\n| 时段长度 | 15 分钟 / 30 分钟 / 60 分钟 | 30 分钟 |\n| 每时段可约数 | 1～20 个 | 1 个 |\n| 取消期限 | 预约前 0～72 小时 | 预约前 24 小时 |\n\n将每时段可约数设为 2 个以上后，同一时间可以接受多位顾客的预约。请根据员工人数进行设置。\n\n超过取消期限后，顾客将无法在预约页面中取消，页面上会提示顾客通过电话联系。\n\n## 员工设置\n\n在菜单的“员工”中选择员工，即可在详情界面中更改。部分个人信息也可以由本人在账户菜单中更改。\n\n### 基本信息\n\n| 项目 | 内容 | 本人能否更改 |\n| --- | --- | --- |\n| 姓名 | 在界面和预约的负责员工一栏中显示的名称 | 可以更改 |\n| 电子邮件地址 | 用于登录和通知 | 可以更改（会收到确认邮件） |\n| 角色 | 查看者 / 编辑者 / 管理员 / 所有者 | 不能更改 |\n| 负责门店 | 作为预约和通知对象的门店 | 不能更改 |\n\n### 邀请\n\n邀请邮件的有效期为 7 天。过期的邀请在列表中显示为“已过期”。重新邀请后，对方会收到带有新链接的邮件。\n\n已邀请但尚未加入的员工不计入员工数。接近套餐的员工数上限时，请撤销不需要的邀请。\n\n### 排班\n\n可以为每位员工录入上班的星期和时间。录入后，顾客就可以在预约页面中选择负责员工。\n\n- 排班只能录入在门店营业时间之内\n- 负责多家门店时，需要按门店分别录入\n- 休息日与临时停业日一样，按日期添加\n\n### 停用\n\n对于因离职等原因不再使用的员工，可以不删除，而是设为“停用”。停用的员工将无法登录，但其负责过的预约和操作记录中仍会保留其姓名。停用的员工不计入员工数。\n\n## 通知设置\n\n在右上角账户菜单的“通知设置”中，选择自己要接收的通知。通知设置按员工分别保存，不能更改其他人的设置。\n\n### 接收的通知\n\n| 通知 | 电子邮件 | 应用 | 默认值 |\n| --- | --- | --- | --- |\n| 新预约 | ✓ | ✓ | 接收 |\n| 预约取消 | ✓ | ✓ | 接收 |\n| 临时停业日的预约 | ✓ | ✓ | 接收 |\n| 月度报表 | ✓ | — | 接收 |\n| 邀请被接受 | ✓ | — | 不接收 |\n\n通知的对象仅限您负责的门店的预约。拥有所有者或管理员角色的人员可以选择“所有门店”。\n\n### 免打扰时段\n\n如果不想在夜间接收通知，请设置“免打扰时段”。这段时间内的通知会在时段结束时一并送达。电子邮件和应用可以分别设置。\n\n### 合并接收\n\n对于预约较多的门店，可以不逐条接收通知，而是每小时合并接收一次。合并后的通知中包含这一小时内的预约和取消列表。\n\n## 账单设置\n\n可以在“组织设置”→“账单”中更改。只有所有者才能更改。\n\n### 套餐\n\n| 套餐 | 门店数 | 付费周期 |\n| --- | --- | --- |\n| 标准版 | 最多 10 家门店 | 按月 / 按年 |\n| 商业版 | 无上限 | 按月 / 按年 |\n\n升级到更高级的套餐会立即生效，降级到较低级的套餐则从下一个账单日起生效。降级到较低级的套餐时，如果门店数超过上限，请先将部分门店设为“隐藏”。\n\n### 账单抬头\n\n输入账单上显示的公司名称、部门名称和联系人姓名。更改后的抬头从下一张账单开始使用。已开具的账单的抬头不会改变。\n\n### 付款方式\n\n- 信用卡：按月和按年付费的套餐均可使用\n- 账单付款：仅适用于按年付费的套餐。请在账单开具后 30 天内转账\n\n## 安全设置\n\n可以在“组织设置”→“安全”中更改。只有拥有所有者或管理员角色的人员才能更改。\n\n### 两步验证\n\n| 项目 | 可选值 | 默认值 |\n| --- | --- | --- |\n| 强制启用两步验证 | 是 / 否 | 否 |\n| 接收验证码的方式 | 身份验证器应用 / 短信 | 由本人选择 |\n\n设为强制启用后，从下次登录起，所有人都需要输入验证码。操作步骤请参见[两步验证](?page=admin-2fa)。\n\n### 密码\n\n| 项目 | 可选值 | 默认值 |\n| --- | --- | --- |\n| 最少字符数 | 8～32 个字符 | 10 个字符 |\n| 必须包含符号 | 是 / 否 | 否 |\n| 要求更改的间隔 | 无 / 90 天 / 180 天 | 无 |\n\n即使将规则改得更严格，现有密码仍可继续使用。新规则从下次更改密码时开始适用。\n\n### 登录限制\n\n连续 5 次输错密码后，该账户将被锁定 30 分钟。管理员也可以在员工详情界面中解除锁定。\n\n如果只想允许从公司网络登录，请在“允许登录的 IP 地址”中输入地址。未输入时，可以从任何地方登录。\n\n## 数据设置\n\n可以在“组织设置”→“数据”中更改。只有所有者才能更改。\n\n### 导出格式\n\n| 项目 | 可选值 | 默认值 |\n| --- | --- | --- |\n| 字符编码 | UTF-8 / Shift_JIS | UTF-8 |\n| 日期格式 | 2026/04/01 / 2026-04-01 | 2026/04/01 |\n| 标题行 | 包含 / 不包含 | 包含 |\n\n一次最多可以导出 10 万条。操作步骤请参见[导出数据](?page=guide-export)。\n\n### 保存期限\n\n| 数据 | 保存期限 |\n| --- | --- |\n| 预约 | 自预约日期起 3 年 |\n| 操作记录 | 90 天 |\n| 月度报表 | 2 年 |\n\n超过保存期限的数据会在每月 1 日删除。需要保留的数据，请在此之前导出。\n\n### 注销账户\n\n注销账户 30 天后，将删除组织的所有数据。在 30 天内，所有者登录即可恢复。\n\n## 术语\n\n### 时段\n\n接受预约的时间单位。长度由“时段长度”决定。\n\n### 负责门店\n\n员工作为预约和通知对象的门店。\n\n### 组织\n\n签约使用示例门店管理的单位。所有门店和员工都属于一个组织。","order":4,"thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2246%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2094%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%2251%22%20width%3D%2250%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2268%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%2273%22%20width%3D%2273%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2290%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%2295%22%20width%3D%2256%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22112%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%22117%22%20width%3D%2279%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22134%22%20width%3D%22190%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22102%22%20y%3D%22139%22%20width%3D%2262%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3C%2Fsvg%3E"},{"id":"faq","parentId":"example","title":"常见问题","order":5,"description":"常见的问题与解答","md":"# 常见问题\n\n## 登录与账户\n\n### 忘记了密码\n\n可以在登录界面的“忘记密码？”中重新设置。操作步骤请参见[登录](?page=guide-login)。\n\n### 收不到两步验证的验证码\n\n通过短信接收时，请确认电话号码是否正确。使用身份验证器应用，在没有信号的地方也能查看验证码（[两步验证](?page=admin-2fa)）。\n\n### 想更改电子邮件地址\n\n可以在账户菜单的“个人资料”中更改。新地址会收到确认邮件，打开其中的链接后即完成更改。\n\n## 门店\n\n### 门店数有上限吗\n\n因套餐而异。标准版最多 10 家门店，商业版无上限。\n\n### 可以把门店转移到其他组织吗\n\n不可以。请在目标组织中重新添加门店，然后导入通过[导出数据](?page=guide-export)导出的内容。\n\n### 添加门店时填错了门店代码\n\n门店代码在添加后无法更改。如果还没有预约，请删除该门店后重新添加。\n\n## 预约\n\n### 顾客通过电话预约了\n\n可以在预约列表的“添加”中录入。详情请参见[管理预约](?page=guide-booking)。\n\n### 想在同一时间接受 2 个预约\n\n在门店的“预约受理”中，将“每时段可约数”设为 2 个以上。\n\n### 预约页面中没有显示临时停业日\n\n请确认添加了临时停业日的门店与预约页面中的门店是否相同。临时停业日按门店分别添加。\n\n## 员工\n\n### 员工收不到邀请邮件\n\n请检查垃圾邮件文件夹。如果找不到，请先撤销邀请，然后重新邀请。\n\n### 离职的员工应该如何处理\n\n不要删除，而是设为“停用”，这样其负责过的预约记录中仍会保留其姓名（[添加员工](?page=guide-staff)）。\n\n## 账单与合同\n\n### 可以在年中更改套餐吗\n\n可以。升级到更高级的套餐会立即生效，降级到较低级的套餐则从下一个账单日起生效（[账单与付款](?page=admin-billing)）。\n\n### 注销账户后数据会怎样\n\n注销账户 30 天后，将删除所有数据。在 30 天内，所有者登录即可恢复。\n\n## 数据\n\n### 导出的 CSV 出现乱码\n\n用 Excel 打开时，请通过“数据”选项卡中的“从文本/CSV”导入。如果总是在 Excel 中使用，可以将字符编码改为 Shift_JIS。\n\n### 旧的预约可以查看多久\n\n自预约日期起 3 年。更早的预约会被删除（[设置项一览](?page=reference)）。","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(40%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2244%22%20width%3D%22190%22%20height%3D%2234%22%20rx%3D%226%22%20fill%3D%22hsl(40%2070%25%2094%25)%22%2F%3E%3Ccircle%20cx%3D%22114%22%20cy%3D%2261%22%20r%3D%228%22%20fill%3D%22hsl(40%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%22130%22%20y%3D%2256%22%20width%3D%22120%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2286%22%20width%3D%22190%22%20height%3D%2234%22%20rx%3D%226%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Ccircle%20cx%3D%22114%22%20cy%3D%22103%22%20r%3D%228%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22130%22%20y%3D%2298%22%20width%3D%22100%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%22128%22%20width%3D%22190%22%20height%3D%2230%22%20rx%3D%226%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E"},{"id":"guide-booking","parentId":"guide","title":"管理预约","description":"预约列表的查看方法，以及接受、更改和取消预约","md":"# 管理预约\n\n顾客的预约统一在菜单的“预约”中处理。无论是通过预约页面提交的预约，还是通过电话接受后录入的预约，都显示在同一个列表中。\n\n## 预约列表\n\n预约列表按日期和时间顺序显示您负责的门店的预约。\n\n| 列 | 内容 |\n| --- | --- |\n| 日期时间 | 预约的日期和开始时间 |\n| 顾客 | 顾客姓名。点击后打开预约详情 |\n| 门店 | 接受预约的门店 |\n| 负责员工 | 顾客选择的员工。未选择时为空 |\n| 状态 | 已预约、已到店、已取消、爽约 |\n| 预约渠道 | 预约页面、电话、其他 |\n\n### 切换显示方式\n\n在列表上方可以选择“日”“周”“月”。“日”以按小时划分的表格显示，“周”和“月”以日历形式显示。\n\n如果负责多家门店，可以在“门店”中选择要显示的门店。\n\n### 筛选\n\n可以按状态、负责员工和预约渠道进行筛选。例如，按“状态：已取消”筛选后，只会列出已取消的预约。\n\n## 接受预约\n\n顾客在预约页面中预约后，预约会自动进入列表。如果设置了接收新预约的通知，会通过电子邮件或应用收到通知（[通知设置](?page=guide-notice)）。\n\n### 录入电话预约\n\n1. 点击预约列表右上角的“添加”\n2. 输入门店、日期时间、顾客姓名和电话号码\n3. 如需指定负责员工，在“负责员工”中选择\n4. 点击“保存”\n\n预约渠道为“电话”。输入顾客的电子邮件地址后，顾客会收到预约确认邮件。\n\n### 同一时间预约重叠时\n\n> [!WARNING]\n> 无法录入超过一个时段可接受数量的预约。如果一定要接受，请在门店的“预约受理”中增加“每时段可约数”，或者向顾客推荐其他时间。\n\n## 更改预约\n\n在预约详情中点击“更改”，重新选择日期时间或负责员工，然后点击“保存”。如果有顾客的电子邮件地址，顾客会收到更改通知。\n\n更改前后的内容会保留在预约详情的“历史记录”中。\n\n## 取消预约\n\n### 顾客取消时\n\n在取消期限之前，顾客可以在预约页面中自行取消。如果过了期限后接到顾客电话取消，请在预约详情中点击“取消”。\n\n### 因门店原因取消时\n\n在预约详情中点击“取消”，在原因中选择“门店原因”。系统不会自动联系顾客，请通过电话等方式联系。\n\n## 顾客未到店时\n\n如果过了预约时间顾客仍未到店，请在预约详情中点击“爽约”。爽约会在月度报表中单独统计。\n\n如果同一位顾客多次爽约，可以在顾客详情中留下“备注”，这样下次预约时其他员工也能注意到。\n\n## 临时停业日的预约\n\n如果在添加为临时停业日的日期已有预约，这些预约会以“临时停业日的预约”显示在列表上方。请逐一联系顾客，更改日期时间或取消预约。全部处理完后，该提示就会消失。\n\n## 打印预约\n\n在“日”视图中点击右上角的“打印”，可以打印当天的预约列表，可供放在前台使用。打印内容中包含顾客的姓名和电话号码，请妥善保管。\n\n## 常见疑难\n\n| 遇到的问题 | 需要确认的内容 |\n| --- | --- |\n| 预约没有出现在列表中 | 该预约所在的门店是否在负责门店中 |\n| 无法更改预约 | 角色是否为“查看者” |\n| 顾客收不到更改通知 | 是否填写了顾客的电子邮件地址 |\n| 在预约页面中无法选择日期 | 是否赶上临时停业日，或已过受理截止时间 |","order":5,"thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(20%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2246%22%20width%3D%2228%22%20height%3D%2224%22%20rx%3D%224%22%20fill%3D%22hsl(20%2070%25%2094%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22128%22%20y%3D%2246%22%20width%3D%2228%22%20height%3D%2224%22%20rx%3D%224%22%20fill%3D%22hsl(20%2070%25%2055%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22160%22%20y%3D%2246%22%20width%3D%2228%22%20height%3D%2224%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb 束月份，会显示该时间范围内的合计以及每月的变化趋势。最多 24 个月。\n\n## 导出报表\n\n可以通过报表界面右上角的“导出”，将报表导出为 PDF 或 CSV。PDF 适合用作会议资料，CSV 适合在电子表格软件中进行统计。\n\n## 数字对不上时\n\n- 如果与预约列表中的数量不一致，请确认列表中是否包含已取消和爽约的预约。报表中的“预约数”不包含这些预约\n- 如果在月中更改了营业时间，时段占用率会按每天当时的营业时间计算\n- 预约日期被改到其他月份的预约，按更改后的月份统计","order":7,"thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22%23eef1f5%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%22320%22%20height%3D%2224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23f87171%22%2F%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2212%22%20r%3D%224%22%20fill%3D%22%2334d399%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2224%22%20width%3D%2280%22%20height%3D%22156%22%20fill%3D%22%231f2937%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%228%22%20rx%3D%223%22%20fill%3D%22hsl(330%2070%25%2055%25)%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2256%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2270%22%20width%3D%2252%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2284%22%20width%3D%2244%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%234b5563%22%2F%3E%3Crect%20x%3D%2288%22%20y%3D%2234%22%20width%3D%22224%22%20height%3D%22138%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2296%22%20y%3D%2244%22%20width%3D%2258%22%20height%3D%2234%22%20rx%3D%225%22%20fill%3D%22hsl(330%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22162%22%20y%3D%2244%22%20width%3D%2258%22%20height%3D%2234%22%20rx%3D%225%22%20fill%3D%22hsl(330%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%22228%22%20y%3D%2244%22%20width%3D%2258%22%20height%3D%2234%22%20rx%3D%225%22%20fill%3D%22hsl(330%2070%25%2094%25)%22%2F%3E%3Cpolyline%20points%3D%22100 %22%20y%3D%22130%22%20width%3D%2228%22%20height%3D%2224%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%22256%22%20y%3D%22130%22%20width%3D%2228%22%20height%3D%2224%22%20rx%3D%224%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E"}],"zh-TW":[{"id":"doc-intro","parentId":null,"order":1,"title":"簡介","md":"# md-pages-viewer\n\n這是一個在瀏覽器中顯示具有層級結構的 Markdown 文件的函式庫。只要載入一行 `\u003cscript>`，不論伺服器端使用哪種語言都能嵌入。設計上是用來在業務系統或管理後台中放置操作手冊與說明。\n\n> [!NOTE]\n> 本手冊本身也是用 md-pages-viewer 顯示的。左側的頁面清單、上方的搜尋框、右側的目錄，以及內文最後的上一頁與下一頁，全都是根據頁面資料自動產生的。\n\n## 功能\n\n- 根據頁面資料，自動產生上方的工具列（目前位置、搜尋框）、側邊欄、頁內目錄，以及前往上一頁與下一頁的連結\n- 內文可以傳入 Markdown 字串，也可以傳入 md 檔案的 URL（S3、伺服器的儲存空間）\n- 畫面建立在 Shadow DOM 中，因此與宿主頁面的 CSS 互不影響\n- 顯示的所有 HTML 都會經過 DOMPurify 清理（sanitize）\n\n資料的儲存，以及傳回頁面清單的 API，由使用端自行準備。只要以[頁面資料](?page=doc-data)的格式傳回，不限資料庫的種類或資料表的結構。\n\n## 適用情境\n\n- 想在業務系統或管理後台中嵌入操作手冊或說明時\n- 想把手冊的內文放在資料庫或 S3，不必重新部署應用程式就能修改時\n- 想從目前開啟的畫面，直接開啟該畫面的說明時（以 `currentId` 指定要開啟的頁面）\n\nVitePress、Docusaurus 等靜態網站產生器，會從 Markdown 另外建置一個手冊專用的網站。md-pages-viewer 則是放在現有應用程式的畫面中，在執行階段接收頁面資料並顯示。\n\n## 本手冊的閱讀方式\n\n| 頁面 | 內容 |\n| --- | --- |\n| [使用方式](?page=doc-usage) | 從載入到頁面資料、選項、圖片與連結 |\n| [變更外觀](?page=doc-look) | CSS 變數、`::part()`、`styles` |\n| [功能](?page=doc-features) | 畫面構成，以及縮圖、日文的換行、注意與提示框、畫面的語言 |\n| [安全性](?page=doc-security) | 清理與 CSP |\n| [使用範例：店鋪管理手冊](?page=example) | 用於虛構店鋪管理應用程式手冊的範例 |\n\n## 授權\n\nMIT License。Copyright (c) 2026 Kota Kagatsume。內含的 marked 與 DOMPurify 的授權條款位於 `dist/THIRD_PARTY_LICENSES.txt`。"},{"id":"doc-usage","parentId":null,"order":2,"title":"使用方式","description":"從載入到頁面資料、選項、圖片與連結"},{"id":"doc-load","parentId":"doc-usage","order":1,"title":"載入","description":"從 CDN 或 npm 載入","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(220%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(220%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2256%22%20width%3D%22240%22%20height%3D%22106%22%20rx%3D%226%22%20fill%3D%22%23f3f4f6%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2264%22%20width%3D%22120%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(220%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2280%22%20width%3D%22170%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2296%22%20width%3D%22140%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(220%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2280%22%20y%3D%22112%22%20width%3D%22110%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%22128%22%20width%3D%2290%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(220%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22144%22%20width%3D%2260%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3C%2Fsvg%3E","md":"# 載入\n\n## 從 CDN 載入\n\n~~~html\n\u003cscript src=\"https://cdn.jsdelivr.net/npm/md-pages-viewer@1/dist/md-pages-viewer.js\">\u003c/script>\n~~~\n\n> [!NOTE]\n> CSS 已包含在這個檔案中，因此不需要 \u003ccode>&lt;link&gt;\u003c/code>。檔案大小約 151KB（gzip 壓縮後約 48KB），包含 Markdown 的轉換（marked）與清理（DOMPurify）。\n\n在無法連線到外部 CDN 的環境中，請把 `md-pages-viewer.js` 放到自己的伺服器上再載入。\n\n## 從 npm 安裝\n\n在有建置流程的專案中，請從 npm 安裝。\n\n~~~bash\nnpm install md-pages-viewer\n~~~\n\n~~~js\nimport { MdPagesViewer } from 'md-pages-viewer';\n~~~\n\n只要 `import`，就能使用 `\u003cmd-pages-viewer>` 標籤。"},{"id":"doc-place","parentId":"doc-usage","order":2,"title":"放置方式","description":"用標籤放置，或用 new 建立","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(260%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(260%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2256%22%20width%3D%22240%22%20height%3D%22106%22%20rx%3D%226%22%20fill%3D%22%23f3f4f6%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2264%22%20width%3D%22120%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(260%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2280%22%20width%3D%22170%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%2296%22%20width%3D%22140%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(260%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2280%22%20y%3D%22112%22%20width%3D%22110%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%2264%22%20y%3D%22128%22%20width%3D%2290%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22hsl(260%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22144%22%20width%3D%2260%22%20height%3D%227%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3C%2Fsvg%3E","md":"# 放置方式\n\n## 用標籤放置\n\n~~~html\n\u003cmd-pages-viewer pages=\"/api/manual/pages\" current-id=\"intro\">\u003c/md-pages-viewer>\n~~~\n\n陣列、函式與物件（`texts`）要在 JS 中設定為元素的屬性。\n\n~~~js\nconst viewer = document.querySelector('md-pages-viewer');\nviewer.imageResolver = (path) => `/api/manual/image?path=${encodeURIComponent(path)}`;\n~~~\n\n## 用 new 建立\n\n也可以用 `new` 建立。指定元素的內容會被取代。\n\n~~~js\nconst viewer = new MdPagesViewer('#manual', {\n  pages: '/api/manual/pages',\n  currentId: 'intro',\n});\n\n// 顯示後要變更選項，請透過 element 的屬性\nviewer.element.currentId = 'faq';\n~~~\n\n## 高度與寬度\n\n若不指定元素的高度，元素會隨內文伸長；捲動時，工具列會留在畫面頂端，側邊欄與目錄則留在工具列下方。若指定高度，側邊欄、內文與目錄會在工具列下方各自捲動。\n\n元素的寬度小於 768px 時，側邊欄會改為按下工具列的按鈕後疊在內文上方開啟，目錄則會收合在內文上方。\n\n> [!TIP]\n> 開啟左側選單的「店鋪」等項目，再按下頁首的「說明」，畫面右側就會開啟寬度 480px 的說明。可以在那裡確認寬度小於 768px 時的樣子。"},{"id":"doc-data","parentId":"doc-usage","order":3,"title":"頁面資料","description":"頁面陣列的欄位，以及子頁面清單","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(160%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(160%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2262%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2094%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2269%22%20width%3D%2240%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22hsl(160%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2269%22%20width%3D%2270%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2286%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2293%22%20width%3D%2259%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2293%22%20width%3D%2293%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%22110%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22117%22%20width%3D%2248%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22117%22%20width%3D%2276%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%22134%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%22141%22%20width%3D%2267%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23cbd2dc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22141%22%20width%3D%2299%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3C%2Fsvg%3E","md":"# 頁面資料\n\n頁面以扁平的陣列傳入，並以 `parentId` 表示層級。若在 `pages` 傳入 URL，請以 JSON 傳回這個陣列本身。\n\n## 欄位\n\n| 欄位 | 型別 | 必填 | 內容 |\n| --- | --- | --- | --- |\n| `id` | string / number | 必填 | 頁面的唯一 ID |\n| `parentId` | string / number / null | 必填 | 父頁面的 ID。最上層為 null |\n| `title` | string | 必填 | 顯示在導覽路徑與側邊欄的名稱 |\n| `description` | string | 選填 | 顯示在子頁面清單與搜尋結果中的說明文字 |\n| `thumbnail` | string | 選填 | 子頁面清單以卡片顯示時，顯示在卡片上方的圖片路徑或 URL |\n| `md` | string | 選填 | 內文的 Markdown |\n| `src` | string | 選填 | md 檔案的 URL |\n| `order` | number | 選填 | 在同一層級中的排列順序（由小到大）。未指定的頁面，會依陣列的順序排在已指定的頁面之後 |\n\n~~~json\n[\n  { \"id\": \"intro\", \"parentId\": null, \"title\": \"簡介\", \"md\": \"# 簡介\", \"order\": 1 },\n  { \"id\": \"login\", \"parentId\": \"intro\", \"title\": \"登入方式\", \"src\": \"/storage/manual/login.md\", \"order\": 1 },\n  { \"id\": \"faq\", \"parentId\": null, \"title\": \"FAQ\", \"src\": \"https://xxx.s3.amazonaws.com/manual/faq.md\", \"order\": 2 },\n  { \"id\": \"guide\", \"parentId\": null, \"title\": \"操作指南\", \"order\": 3 },\n  { \"id\": \"guide-start\", \"parentId\": \"guide\", \"title\": \"開始使用\", \"description\": \"一開始要做的設定流程\", \"md\": \"# 開始使用\", \"order\": 1 }\n]\n~~~\n\n`src` 的頁面會在第一次開啟時才取得，並保留到重新載入畫面為止。\n\n## 子頁面清單\n\n既沒有 `md` 也沒有 `src` 的頁面，會以表格列出直屬的子頁面，取代內文。可以用在像分類一樣彙整子頁面的父頁面。每一列會顯示子頁面的名稱、`description`（最多 2 行），以及章數（`md` 中 h2 的數量）或子頁面數。也可以用工具列的按鈕切換成卡片。`src` 的頁面不會為了清單而取得內文。\n\n> [!TIP]\n> 本手冊的「使用方式」、「變更外觀」、「功能」也是子頁面清單的頁面。開啟後按下右上角的「卡片檢視」，就會變成附有縮圖的卡片。詳情請參閱\u003ca href=\"?page=doc-thumbnail\">子頁面清單與縮圖\u003c/a>。"},{"id":"doc-options","parentId":"doc-usage","order":4,"title":"選項","description":"pages、currentId、baseUrl 等 9 個選項","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Cr  選項 | 標籤屬性 | 型別 | 內容 |\n| --- | --- | --- | --- |\n| `pages` | `pages`（僅限 URL） | 陣列 / URL | 頁面資料，或傳回頁面資料的 URL |\n| `currentId` | `current-id` | string / number | 要顯示的頁面 ID。第一次顯示時，以 URL 中的 `?page=` 優先。顯示後再設定，就會切換到該頁面 |\n| `baseUrl` | `base-url` | string | `md` 頁面中相對路徑的基準。未指定時為宿主頁面的 URL |\n| `imageResolver` | 無 | 函式 | 接收圖片路徑與頁面資料，並傳回顯示用 URL 的函式 |\n| `fetch` | 無 | 函式 | 用來取得清單與內文的函式（引數與傳回值和瀏覽器的 `fetch` 相同）。要對不同來源（origin）的 API 附加 Cookie 或驗證標頭時使用 |\n| `urlParam` | `url-param` | string / false | 反映到 URL 的查詢參數名稱（預設值 `page`）。設為 `false` 則不反映 |\n| `styles` | 無 | string | 加入檢視器內部的 CSS（請參閱[內文的外觀](?page=doc-styles)） |\n| `locale` | `locale` | string | 畫面文字的語言（預設值 `ja`。請參閱[畫面的語言與文字](?page=doc-locale)） |\n| `texts` | 無 | 物件 | 逐一取代畫面上的文字（請參閱[畫面的語言與文字](?page=doc-locale)） |\n\n> [!IMPORTANT]\n> 使用 \u003ccode>fetch\u003c/code> 或 \u003ccode>imageResolver\u003c/code> 時，請不要以標籤屬性設定 \u003ccode>pages\u003c/code>，而要在 JS 中設定為元素的屬性，並放在它們之後設定。"},{"id":"doc-storage","parentId":"doc-usage","order":5,"title":"md 檔案的存放位置","description":"存放在 S3 或伺服器的儲存空間時需要的設定","thumbnail":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20180%22%3E%3Crect%20width%3D%22320%22%20height%3D%22180%22%20fill%3D%22hsl(190%2070%25%2094%25)%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2222%22%20width%3D%22272%22%20height%3D%22150%22%20rx%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2236%22%20width%3D%2290%22%20height%3D%2210%22%20rx%3D%224%22%20fill%3D%22hsl(190%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2262%22%20width%3D%22240%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22hsl(190%2070%25%2094%25)%22%20stroke%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2269%22%20width%3D%2240%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22hsl(190%2070%25%2052%25)%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%2269%22%20width%3D%2270%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23e1e5eb%22%2F%3E%3Crect%20x%3D%2240%22%2
