  </head>
  <body>
    <md-pages-viewer></md-pages-viewer>
    <script>
      // 本文中の画像（images/layout.svg）は、このファイルに埋め込んだ SVG を出す
      const layoutSvg = "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"480\" height=\"240\" viewBox=\"0 0 480 240\" font-family=\"sans-serif\" font-size=\"13\">\n  \u003crect x=\"0.5\" y=\"0.5\" width=\"479\" height=\"239\" rx=\"8\" fill=\"#fff\" stroke=\"#d0d7de\"/>\n  \u003crect x=\"12\" y=\"12\" width=\"456\" height=\"28\" rx=\"6\" fill=\"#f6f8fa\" stroke=\"#d0d7de\"/>\n  \u003ctext x=\"240\" y=\"31\" text-anchor=\"middle\" fill=\"#57606a\">ツールバー（今の場所・検索欄）\u003c/text>\n  \u003crect x=\"12\" y=\"48\" width=\"110\" height=\"180\" rx=\"6\" fill=\"#eef2ff\" stroke=\"#c7d2fe\"/>\n  \u003ctext x=\"67\" y=\"142\" text-anchor=\"middle\" fill=\"#3730a3\">サイドバー\u003c/text>\n  \u003crect x=\"134\" y=\"48\" width=\"230\" height=\"146\" rx=\"6\" fill=\"#fff\" stroke=\"#d0d7de\"/>\n  \u003ctext x=\"249\" y=\"125\" text-anchor=\"middle\" fill=\"#1f2328\">本文\u003c/text>\n  \u003crect x=\"134\" y=\"202\" width=\"230\" height=\"26\" rx=\"6\" fill=\"#fff\" stroke=\"#d0d7de\"/>\n  \u003ctext x=\"249\" y=\"220\" text-anchor=\"middle\" fill=\"#57606a\">前後のページ\u003c/text>\n  \u003crect x=\"376\" y=\"48\" width=\"92\" height=\"180\" rx=\"6\" fill=\"#ecfdf5\" stroke=\"#a7f3d0\"/>\n  \u003ctext x=\"422\" y=\"142\" text-anchor=\"middle\" fill=\"#065f46\">目次\u003c/text>\n\u003c/svg>";

      const viewer = document.querySelector('md-pages-viewer');
      viewer.imageResolver = (path) =>
        path.endsWith('layout.svg') ? 'data:image/svg+xml,' + encodeURIComponent(layoutSvg) : path;
      viewer.pages = [
        {"id":"intro","parentId":null,"title":"はじめに","order":1,"md":"# はじめに\n\n`md-pages-viewer` は、階層のあるMarkdown文書を表示するライブラリです。`\u003cscript>` を1行読み込むだけで、どのプロジェクトにも組み込めます。\n\n![画面の構成](docs/images/layout.svg)\n\n## 表示されるもの\n\n- 上：ツールバー（今の場所と検索欄。サイドバーと目次の開閉ボタン）\n- 左：ページ階層のサイドバー\n- 中央：本文と、前後のページへのリンク\n- 右：ページ内目次（本文の h2・h3 から作ります）\n\n## 次に読むページ\n\n- [組み込み方](?page=install)\n- [データの形式](?page=data)\n- [オプション](?page=options#オプション一覧)\n"},
        {"id":"install","parentId":"intro","title":"組み込み方","order":1,"md":"# 組み込み方\n\n## スクリプトを読み込む\n\nCDNから読み込む場合は、`\u003chead>` などに次の1行を書きます。\n\n```html\n\u003cscript src=\"https://cdn.jsdelivr.net/npm/md-pages-viewer@1/dist/md-pages-viewer.js\">\u003c/script>\n```\n\n外部のCDNに接続できない環境では、`md-pages-viewer.js` を自分のサーバーに置いて読み込みます。\n\n## タグで置く\n\n```html\n\u003cmd-pages-viewer pages=\"/api/manual/pages\" current-id=\"intro\">\u003c/md-pages-viewer>\n```\n\n関数や配列はJSで要素のプロパティに設定します。\n\n```js\nconst viewer = document.querySelector('md-pages-viewer');\nviewer.imageResolver = (path) => `/api/manual/image?path=${encodeURIComponent(path)}`;\n```\n\n## new で作る\n\n```js\nconst viewer = new MdPagesViewer('#manual', {\n  pages: '/api/manual/pages',\n  currentId: 'intro',\n});\nviewer.element.currentId = 'faq'; // 表示後の変更は element のプロパティで\n```\n\n## npm でインストールする\n\n```js\nimport { MdPagesViewer } from 'md-pages-viewer';\n```\n\n`import` するだけで `\u003cmd-pages-viewer>` タグも使えるようになります。\n"},
        {"id":"data","parentId":"intro","title":"データの形式","order":2,"md":"# データの形式\n\nページはフラットな配列で渡し、`parentId` で階層を表します。URLで渡す場合は、この配列そのものをJSONで返します。\n\n| 項目 | 型 | 必須 | 内容 |\n| --- | --- | --- | --- |\n| id | string / number | 必須 | ページの一意なID |\n| parentId | string / number / null | 必須 | 親ページのID。最上位は null |\n| title | string | 必須 | パンくず・サイドバーに表示する名前 |\n| md | string | md か src | 本文のMarkdown |\n| src | string | md か src | mdファイルのURL |\n| order | number | 任意 | 同じ階層内の並び順 |\n\n## 例\n\n```json\n[\n  { \"id\": \"intro\", \"parentId\": null, \"title\": \"はじめに\", \"md\": \"# はじめに\", \"order\": 1 },\n  { \"id\": \"login\", \"parentId\": \"intro\", \"title\": \"ログイン方法\", \"src\": \"/storage/manual/login.md\" }\n]\n```\n\n## 本文の取得\n\n`src` のページは、開いたときに初めて取得します。取得した本文は画面を再読み込みするまで保持します。\n\n- [x] 開いたページの分だけ取得する\n- [x] 失敗したら「再読み込み」ボタンを出す\n- [ ] 最初に全ページを読み込む\n"},
        {"id":"options","parentId":null,"title":"オプション","order":2,"md":"# オプション\n\n## オプション一覧\n\n| オプション | タグの属性 | 内容 |\n| --- | --- | --- |\n| pages | pages | ページの配列、またはそれを返すURL |\n| currentId | current-id | 表示するページのID |\n| baseUrl | base-url | `md` のページの相対パスの基準 |\n| imageResolver | （プロパティのみ） | 画像パスを表示用URLに変える関数 |\n| fetch | （プロパティのみ） | 一覧と本文の取得に使う関数 |\n| urlParam | url-param | URLに反映するクエリ名。`false` で反映しない |\n\n## URLへの反映\n\nページを切り替えると、URLのクエリ `page` が切り替え先のIDになります。ブラウザの戻る・進む、リンクの共有がそのまま使えます。\n\n組み込み先が `page` を使っている場合は、`urlParam` で名前を変えます。\n\n## 別ページへのリンク\n\n本文の中から別のページへは、次のどちらかで書けます。\n\n1. `[組み込み方](?page=install)`\n2. mdファイルの相対パス：`[データの形式](../docs/data.md)`\n\n続きは [画像とリンク](?page=links) を読んでください。\n"},
        {"id":"links","parentId":"options","title":"画像とリンク","order":1,"md":"# 画像とリンク\n\n## 画像\n\n相対パスの画像は、mdファイルの場所を基準に表示します。\n\n![画面の構成](images/layout.svg)\n\n非公開のストレージに置いた画像は、`imageResolver` で利用側のAPIを経由させます。\n\n## リンク\n\n| 書き方 | 動き |\n| --- | --- |\n| `?page=ID` | このライブラリの中でページを切り替える |\n| `#見出し` | このページの見出しへ移動する（[例：外部リンク](#外部リンク)） |\n| mdファイルの相対パス | そのページに切り替える（[オプション](?page=options#URLへの反映)） |\n| 別のサイトのURL | 新しいタブで開く |\n\n## 外部リンク\n\n[marked](https://github.com/markedjs/marked) と [DOMPurify](https://github.com/cure53/DOMPurify) を使っています。\n"},
        {"id":"style","parentId":"options","title":"見た目の変更","order":2,"md":"# 見た目の変更\n\n表示は Shadow DOM の中に作るため、組み込み先のCSSの影響を受けません。見た目は次のCSS変数で変えます。\n\n| CSS変数 | 内容 |\n| --- | --- |\n| `--mpv-font-family` | フォント |\n| `--mpv-font-size` | 本文の文字の大きさ（初期値 16px） |\n| `--mpv-color-text` | 文字色 |\n| `--mpv-color-bg` | 背景色 |\n| `--mpv-color-accent` | リンクと現在のページの強調色 |\n| `--mpv-color-border` | 区切り線の色 |\n| `--mpv-sidebar-width` | サイドバーの幅 |\n| `--mpv-spacing` | 余白の基準の大きさ |\n\n## 例\n\n```css\nmd-pages-viewer {\n  --mpv-color-accent: #8250df;\n  --mpv-sidebar-width: 300px;\n}\n```\n\n文字色とフォントは、指定しなければ組み込み先の設定を引き継ぎます。\n"},
        {"id":"faq","parentId":null,"title":"よくある質問","order":5,"md":"# よくある質問\n\n## 非公開のS3に置いたmdファイルを表示できますか\n\nできます。サーバー側で署名付きURLを発行して `src` に渡します。期限が切れて取得に失敗した場合は、ページ一覧を取得し直して1回だけ取得し直します。バケットにはCORS設定が必要です。\n\n## 同じ画面に2つ置けますか\n\n置けます。どちらかに `url-param=\"false\"` を指定し、URLの書き換えを止めてください。\n\n## 狭い画面ではどう表示されますか\n\n表示幅が768px未満になると、サイドバーはボタンで開く形になり、目次は本文の上に折りたたまれます。\n\n## 外部リンク\n\n- [GitHub Flavored Markdown](https://github.github.com/gfm/)\n- ~~古いリンク~~\n"},
        {"id":"guide","parentId":null,"title":"操作ガイド","order":3,"description":"サンプルアプリの基本的な使い方"},
        {"id":"guide-login","parentId":"guide","title":"ログイン","order":1,"description":"メールアドレスとパスワードでログインする方法と、ログインできないときの対処","md":"# ログイン\n\n## ログインする\n\n1. ログイン画面を開く\n2. メールアドレスとパスワードを入力する\n3. 「ログイン」を押す\n\n## ログインを保持する\n\n「ログインしたままにする」にチェックを入れると、30日間はログインを省略できます。共用のパソコンではチェックを外してください。\n\n## ログインできないとき\n\n| 表示 | 対処 |\n| --- | --- |\n| パスワードが違います | 大文字・小文字と、全角・半角を確かめる |\n| アカウントがロックされています | 30分待つか、管理者に解除を頼む |\n| メールアドレスが見つかりません | 登録したメールアドレスを管理者に確かめる |\n\nパスワードを忘れた場合は、ログイン画面の「パスワードを忘れた方」から再設定できます。"},
        {"id":"guide-dashboard","parentId":"guide","title":"ダッシュボードの見方","order":2,"description":"ログイン後に最初に出る画面の各エリアの意味","md":"# ダッシュボードの見方\n\nログインすると、最初にダッシュボードが表示されます。\n\n## 上部の数字\n\n今月の件数・先月との差・目標までの残りを表示します。数字を押すと、内訳の画面に移ります。\n\n## グラフ\n\n直近12か月の推移を表示します。グラフの上にカーソルを置くと、その月の値が出ます。\n\n### 期間を変える\n\nグラフ右上の「期間」から、3か月・6か月・12か月を選べます。\n\n## お知らせ\n\n運営からのお知らせを新しい順に5件表示します。未読のものには印が付きます。"},
        {"id":"guide-store","parentId":"guide","title":"店舗の登録","order":3,"description":"店舗を追加し、営業時間や住所を設定する","md":"# 店舗の登録\n\n## 店舗を追加する\n\n1. メニューの「店舗」を開く\n2. 右上の「追加」を押す\n3. 下の項目を入力して「保存」を押す\n\n| 項目 | 必須 | 内容 |\n| --- | --- | --- |\n| 店舗名 | 必須 | 画面や帳票に出る名前 |\n| 住所 | 必須 | 郵便番号を入れると自動で入ります |\n| 電話番号 | 任意 | ハイフンあり・なしのどちらでも可 |\n\n## 営業時間を設定する\n\n曜日ごとに開店・閉店の時刻を入れます。定休日は「休み」にチェックを入れます。\n\n## 店舗を削除する\n\n削除した店舗は元に戻せません。しばらく使わないだけなら「非表示」にしてください。\n\n> 店舗を追加したら、次は [スタッフの追加](?page=guide-staff) を行います。"},
        {"id":"guide-staff","parentId":"guide","title":"スタッフの追加","order":4,"description":"スタッフを招待し、担当する店舗を割り当てる","md":"# スタッフの追加\n\n## 招待する\n\nメニューの「スタッフ」で「招待」を押し、メールアドレスを入力します。招待メールのリンクから、スタッフ自身がパスワードを設定します。\n\n招待メールの有効期限は7日間です。期限が切れたら、もう一度招待してください。\n\n## 担当店舗を割り当てる\n\nスタッフの詳細画面で「担当店舗」を選びます。複数の店舗を選べます。\n\n## 権限\n\n- 閲覧のみ：データを見るだけ\n- 編集：店舗の情報を変更できる\n- 管理：スタッフの追加・削除もできる\n\n権限の細かい設定は [権限の設定](?page=admin-roles) を見てください。"},
        {"id":"guide-notice","parentId":"guide","title":"通知の設定","order":5,"description":"メールやアプリで受け取る通知を選ぶ","md":"# 通知の設定\n\n## 受け取る通知を選ぶ\n\n右上のアカウントメニューから「通知の設定」を開き、受け取りたい通知にチェックを入れます。\n\n| 通知 | メール | アプリ |\n| --- | --- | --- |\n| 新しい予約 | ○ | ○ |\n| 予約のキャンセル | ○ | ○ |\n| 月次レポート | ○ | － |\n\n## 通知が届かないとき\n\n迷惑メールのフォルダを確かめてください。アプリの通知は、スマホの設定で許可されている必要があります。"},
        {"id":"guide-export","parentId":"guide","title":"データの書き出し","order":6,"description":"CSV でデータを書き出して、表計算ソフトで使う","md":"# データの書き出し\n\n## CSV で書き出す\n\n一覧の画面で右上の「書き出し」を押すと、表示中の条件で CSV をダウンロードします。\n\n## 文字化けするとき\n\nCSV は UTF-8 で書き出します。Excel で文字化けする場合は、「データ」タブの「テキストまたは CSV から」で読み込んでください。\n\n## 書き出せる件数\n\n一度に書き出せるのは10万件までです。それより多い場合は、期間を分けて書き出してください。"},
        {"id":"admin","parentId":null,"title":"管理者向け","order":4,"description":"組織の設定とセキュリティ"},
        {"id":"admin-roles","parentId":"admin","title":"権限の設定","order":1,"description":"役割ごとにできる操作を決める","md":"# 権限の設定\n\n## 役割の一覧\n\n| 役割 | 店舗の閲覧 | 店舗の編集 | スタッフの管理 | 請求 |\n| --- | --- | --- | --- | --- |\n| 閲覧のみ | ○ | － | － | － |\n| 編集 | ○ | ○ | － | － |\n| 管理 | ○ | ○ | ○ | － |\n| オーナー | ○ | ○ | ○ | ○ |\n\n## 役割を変える\n\nスタッフの詳細画面で「役割」を選び直します。変更はすぐに反映されます。\n\n## オーナーを移す\n\nオーナーは組織に1人だけです。別の人に移すと、元のオーナーは「管理」になります。"},
        {"id":"admin-billing","parentId":"admin","title":"請求とお支払い","order":2,"description":"プランの変更、請求書のダウンロード、支払い方法の変更","md":"# 請求とお支払い\n\n## プランを変える\n\n「組織の設定」→「プラン」で選びます。上位のプランへの変更はすぐに、下位のプランへの変更は次の請求日から反映されます。\n\n## 請求書をダウンロードする\n\n「請求履歴」から、月ごとの請求書を PDF でダウンロードできます。\n\n## 支払い方法を変える\n\nクレジットカードと請求書払いから選べます。請求書払いは年額プランだけで使えます。"},
        {"id":"admin-security","parentId":"admin","title":"セキュリティ","order":3,"description":"ログインの安全性を高める設定"},
        {"id":"admin-2fa","parentId":"admin-security","title":"2段階認証","order":1,"description":"ログインのときに、パスワードに加えて確認コードを求める","md":"# 2段階認証\n\n## 有効にする\n\n1. 「組織の設定」→「セキュリティ」を開く\n2. 「2段階認証を必須にする」をオンにする\n\n次にログインしたときから、全員に確認コードの入力を求めます。\n\n## 確認コードを受け取る方法\n\n- 認証アプリ（おすすめ）\n- SMS\n\n## スマホをなくしたとき\n\n管理者がそのスタッフの2段階認証をいったん解除し、設定し直してもらいます。"},
        {"id":"admin-password","parentId":"admin-security","title":"パスワードのルール","order":2,"description":"文字数や使える文字、変更の間隔を決める","md":"# パスワードのルール\n\n## 決められること\n\n| 項目 | 選べる値 | 初期値 |\n| --- | --- | --- |\n| 最低の文字数 | 8〜32文字 | 10文字 |\n| 記号を必須にする | する・しない | しない |\n| 変更を求める間隔 | なし・90日・180日 | なし |\n\n## ロックの条件\n\n5回続けて間違えると、30分ロックします。\n\n```text\n例：A1b2C3d4e5（10文字・英大文字・英小文字・数字）\n```"},
        {"id":"admin-audit","parentId":"admin","title":"操作の記録","order":4,"description":"誰がいつ何を変更したかを確かめる","md":"# 操作の記録\n\n## 記録を見る\n\n「組織の設定」→「操作の記録」で、直近90日の操作を新しい順に表示します。\n\n## 記録される操作\n\n- ログイン・ログアウト\n- 店舗とスタッフの追加・変更・削除\n- 権限とプランの変更\n\n## 絞り込む\n\nスタッフ・操作の種類・期間で絞り込めます。結果は [データの書き出し](?page=guide-export) と同じ手順で CSV にできます。"}
      ];
    </script>
  </body>
</html>
